    spring:`<g ${S}><circle cx="12" cy="7" r="3.1"/><circle cx="16.8" cy="10.5" r="3.1"/><circle cx="15" cy="16" r="3.1"/><circle cx="9" cy="16" r="3.1"/><circle cx="7.2" cy="10.5" r="3.1"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor"/>`,
    summer:`<circle cx="12" cy="12" r="4" ${S}/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" ${S}/>`,
    autumn:`<path d="M12 2.8l1.5 3.9 3-1.5-.7 3.5 3.6.4-2.6 2.7 2 2.1-3.6.6.3 3-2.8-1.7L12 21l-.7-5.2-2.8 1.7.3-3-3.6-.6 2-2.1-2.6-2.7 3.6-.4-.7-3.5 3 1.5Z" ${S}/><path d="M12 21v-9" ${S}/>`,
    winter:`<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.6 4.2 12 6.5l2.4-2.3M9.6 19.8 12 17.5l2.4 2.3M4.4 10.6l3.2.6-1 3.1M19.6 13.4l-3.2-.6 1-3.1M4.4 13.4l3.2-.6-1-3.1M19.6 10.6l-3.2.6 1 3.1" ${S} stroke-width="1.2"/>`
  };
  const styles = [
    {id:'cinema', name:'银幕', en:'CINEMA', desc:'电影蒙太奇：宽银幕、分屏拼接、光缝与百叶转场'},
    {id:'constellation', name:'星图', en:'CONSTELLATION', desc:'星河拼贴：烫金相框在星空里接力浮现，金线连成星座'},
    {id:'journal', name:'手札', en:'JOURNAL', desc:'魔法手札：相片逐张落在烛光书桌上，墨迹写下旁白'}
  ];
  const seasons = [
    {id:'auto', name:'按月份', en:'AUTO'}, {id:'none', name:'无', en:'NONE'},
    {id:'spring', name:'春', en:'SPRING', desc:'粉樱飘落，柔和的晨光'}, {id:'summer', name:'夏', en:'SUMMER', desc:'阳光光束与萤火，明亮温暖'},
    {id:'autumn', name:'秋', en:'AUTUMN', desc:'枫叶翻飞，琥珀色暖调'}, {id:'winter', name:'冬', en:'WINTER', desc:'雪花飘落，清冷的银蓝'}
  ];
  const styleOf = m => styles.some(s => s.id === m?.style) ? m.style : 'cinema';

  function resolveSeason(pref, date){
    if(pref !== 'auto') return pref;

    if(!mo) return 'none';
    return mo >= 3 && mo <= 5 ? 'spring' : mo >= 6 && mo <= 8 ? 'summer' : mo >= 9 && mo <= 11 ? 'autumn' : 'winter';
  }
  SB.cinema = { styles, seasons, styleOf, seasonPref, resolveSeason, icon:(id, cls) => svg(ICONS[id] || ICONS.none, cls) };
})(window.SB);

/* ── 「光影放映」 ── */
(function(SB){
  const $ = id => document.getElementById(id);
  const scene = document.querySelector('.sb-scene[data-scene="player"]');
  const clamp = SB.clamp, lerp = SB.lerp;
  const ease = x => .5 - .5*Math.cos(Math.PI*clamp(x, 0, 1));           // 正弦缓动
  const EO = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);                   // ease-out cubic
  const EO4 = x => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
  const EIC = x => { x = clamp(x, 0, 1); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
  const backOut = x => { x = clamp(x, 0, 1); const c1 = 1.2, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
  const ICON_PAUSE = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const ICON_PLAY = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg>';
  const CPS = 7, CUE_MIN = 2000, CUE_GAP = 250, END_EST = 4000, PRE = 1500;
  const BASE = {cinema:3400, constellation:3200, journal:3600};

  $('pl-prev').innerHTML = SB.icon('chevron'); $('pl-prev').querySelector('svg').style.transform = 'scaleX(-1)';
  $('pl-next').innerHTML = SB.icon('chevron'); $('pl-music').innerHTML = SB.icon('note');
  $('pl-e-star').innerHTML = SB.icon('spark');
  $('pl-buffer').appendChild(SB.ui.spinner('正在冲洗胶片…'));

  const P = { m:null, style:'cinema', seasonPref:'auto', season:'none', TL:null, T:0, playing:false, showing:false, raf:0, last:0, renderAt:0,
              W:0, H:0, bar:0, fw:0, fh:0, idleT:0, endShown:false, cur:0, liveKey:'', nodes:new Map(),
              mode:'auto', held:false, rush:null, amb:0 };
  try{ if(localStorage.getItem('sb-play-mode') === 'manual') P.mode = 'manual'; }catch(e){}   // v1.9.1 观看偏好：自动 / 手动放映
  const lite = () => SB.perf.level !== 'high';
  const reduced = () => SB.perf.level === 'reduced';
  const hash = (n, k = 1) => { const x = Math.sin(n*127.1 + k*311.7)*43758.5453; return x - Math.floor(x); };   // 固定伪随机：同一张照片每次都一样

  /* ── 质感资源（v1.8.2：延迟到第一次进入放映时生成，不占用首页启动时间） ── */
  let GRAIN = null, INK = null;
  function textures(){
    if(GRAIN) return;
    const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'); const d = g.createImageData(160, 160);
    for(let i = 0; i < d.data.length; i += 4){ const v = Math.random()*255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
    g.putImageData(d, 0, 0); GRAIN = c.toDataURL('image/png');
    $('pl-grain').style.backgroundImage = `url(${GRAIN})`;
    const s = 256, k = document.createElement('canvas'); k.width = k.height = s; const x = k.getContext('2d');
    const gr = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s*.34); gr.addColorStop(0, '#fff'); gr.addColorStop(.8, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 0, s, s); x.filter = 'blur(3px)'; x.fillStyle = '#fff';
    for(let i = 0; i < 38; i++){ const a = Math.random()*Math.PI*2, r = s*(.22 + Math.random()*.14), rr = s*(.03 + Math.random()*.06);
      x.beginPath(); x.arc(s/2 + Math.cos(a)*r, s/2 + Math.sin(a)*r, rr, 0, Math.PI*2); x.fill(); }
    INK = `url(${k.toDataURL('image/png')})`;
  }

  /* ── 文字工具 ── */
  const len = t => [...String(t || '')].length;
  const PUN = '，、；：,; ';
  /* 按标点切成若干条，每条不超过 max 字 */
  function splitCues(text, max){
    text = String(text || '').replace(/\s+/g, ' ').trim(); if(!text) return [];
    const clauses = text.match(/[^，。！？；、,.!?;…]+[，。！？；、,.!?;…]*/g) || [text];
    const out = []; let buf = '';
    for(let c of clauses){
      c = c.trim(); if(!c) continue;
      while(len(c) > max){ const a = [...c]; if(buf){ out.push(buf); buf = ''; } out.push(a.slice(0, max).join('')); c = a.slice(max).join(''); }
      if(len(buf + c) <= max) buf += c; else { if(buf) out.push(buf); buf = c; }
    }
    if(buf) out.push(buf);
    return out.map(s => s.replace(/[，。、；,.;]+$/, '')).filter(Boolean);
  }
  /* 断行：每行不超过 per 字；两行时上短下长，优先在标点处断 */
  function wrap(text, per){
    const a = [...text]; if(a.length <= per) return [text];
    const n = Math.ceil(a.length/per);
    if(n === 2){
      const lo = Math.max(1, a.length - per), hi = Math.min(per, a.length - 1), mid = a.length/2;
      let cut = -1, best = 1e9;
      for(let k = lo; k <= hi; k++) if(PUN.includes(a[k-1]) && Math.abs(k - mid) < best){ best = Math.abs(k - mid); cut = k; }
      if(cut < 0) cut = clamp(Math.floor(mid), lo, hi);
      return [a.slice(0, cut).join('').replace(/[，、；,;\s]+$/, ''), a.slice(cut).join('').trim()];
    }
    const out = []; let i = 0; const even = Math.ceil(a.length/n);
    while(i < a.length){ let j = Math.min(a.length, i + even);
      for(let k = j; k > i + even - 4 && k < a.length; k--) if(PUN.includes(a[k-1])){ j = k; break; }
      out.push(a.slice(i, j).join('').trim()); i = j; }
    return out.filter(Boolean);
  }
  const cueDur = t => Math.max(CUE_MIN, len(t)/CPS*1000 + 700);
  function placeOf(m){
    const c = SB.store.city?.(m.cityId);
    return c ? [c.countryName, c.regionName, c.name].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(' · ') : '';
  }
  const fmtDur = ms => { const s = Math.round(ms/1000); return s < 60 ? `约 ${s} 秒` : `约 ${Math.floor(s/60)} 分${s%60 ? ' ' + (s%60) + ' 秒' : ''}`; };
  function dateLine(m){ const d = SB.fmtDate(m.date) || '', sq = x => String(x || '').replace(/\s/g, '');
    return d && sq(m.title).includes(sq(d)) ? '' : d; }

  /* ── 舞台尺寸 ── */

  let sx = 0, sy = 0, st = 0;
  $('pl-screen').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  $('pl-screen').addEventListener('pointerup', e => {
    if(!P.showing || e.target.closest('button')) return;
    if($('pl-seasons').classList.contains('open')){ $('pl-seasons').classList.remove('open'); return; }
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ advance(dx < 0 ? 1 : -1); wake(); }
    else if(P.mode === 'manual' && performance.now() - st < 400 && P.T < P.TL.endT){
      // 手动放映：轻触右侧 2/3 下一张、左侧 1/3 上一张；电脑点击 = 下一张
      const r = $('pl-screen').getBoundingClientRect(), left = e.pointerType !== 'mouse' && e.clientX < r.left + r.width/3;
      advance(left ? -1 : 1); if(e.pointerType !== 'mouse') wake();
    }
    else if(performance.now() - st < 300){
      if(e.pointerType === 'mouse') { setPlaying(!P.playing); wake(); }
      else scene.classList.contains('awake') ? scene.classList.remove('awake') : wake();
    }
  });
  document.addEventListener('keydown', e => {
    if(SB.scenes.current !== 'player' || document.querySelector('.sb-modal')) return;
    if(!P.showing){ if((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body){ e.preventDefault(); start(); } return; }
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === 'Enter' && P.mode === 'manual' && !e.target.closest?.('button,input,textarea'))){ e.preventDefault(); advance(1); wake(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ advance(-1); wake(); }
    else if(e.key === ' '){ e.preventDefault(); setPlaying(!P.playing); wake(); }
    else if(e.key === 'Escape' && !document.getElementById('sb-nav').classList.contains('open')) SB.scenes.back();
  });

  function topBar(m){
    const top = $('pl-top'); top.innerHTML = '';
    if(SB.store.canEdit) top.appendChild(SB.ui.button('编辑', 'small', () => { setPlaying(false); SB.editor.open({cityId:m.cityId, memory:m}); }));
    top.appendChild(SB.ui.button('退出放映', 'small', () => SB.scenes.back()));
  }
  document.addEventListener('sb:data', () => {
    if(SB.scenes.current !== 'player' || !P.m) return;
    const m = SB.store.memory(P.m.id);
    if(m && m.updatedAt !== P.m.updatedAt){ stopShow(); topBar(m); lobby(m); }
  });

  SB.scenes.register('player', {
    world:'night', hash:false,
    title:p => SB.store.memory(p.id)?.title || '回忆',
    // v1.8.1：从「时光长卷」进入的放映，返回时回到时光长卷
    parent:p => { if(p.from === 'overview') return {id:'overview', params:{}}; const m = SB.store.memory(p.id); return m ? {id:'city', params:{id:m.cityId}} : {id:'globe', params:{}}; },
    prepare(p){ textures(); const m = SB.store.memory(p.id); return m ? prime(m) : Promise.resolve(); },
    async enter(p){
      SB.fx.palette('warm'); SB.fx.calm();
      const m = SB.store.memory(p.id);
      if(!m){ SB.toast('这段回忆找不到了'); setTimeout(() => SB.scenes.back(), 50); return; }
      topBar(m); $('pl-music').classList.toggle('off', !SB.audio.on);
      await lobby(m);
      if(p.autoplay && SB.scenes.current === 'player' && P.m === m) play(false);
    },
    leave(){ stopShow(); clearTimeout(P.idleT); SB.audio.clear(); P.m = null; P.TL = null; }
  });

  /* 调试 / 自动化验收：在暂停状态下定位到时间线上的某一刻 */

    setSeason(id){ P.seasonPref = id; setSeason(SB.cinema.resolveSeason(id, P.m?.date), true); },
    stepSeason(ms){ for(let k = 0; k < ms/50; k++) stepSeason(50); render(); },
    estimate:(m, style) => estimate(buildTL(m, style || SB.cinema.styleOf(m))),
    get state(){ const TL = P.TL; return {T:P.T, playing:P.playing, mode:P.mode, held:P.held, holds:(TL?.holds || []).map(Math.round), showing:P.showing, style:P.style, season:P.season, C0:TL?.C0, endT:TL?.endT,
      marks:TL?.marks.map(m => ({t:Math.round(m.t), i:m.i})) || [], items:TL ? TL.items.filter(x => x.kind === 'photo').map(x => ({i:x.i, t0:Math.round(x.t0), t1:Math.round(x.t1), enter:x.enter.type, exit:x.exit.type, frame:x.frame})) : [],
      texts:TL ? TL.items.filter(x => x.kind === 'text').map(x => ({t0:Math.round(x.t0), t1:Math.round(x.t1 ?? -1), look:x.look, text:x.lines.join(''), idx:x.idx})) : [], groups:TL?.ng || 0}; }
  };

.ed-gtext-w{position:relative;}
.ed-gtext{display:block;box-sizing:border-box;width:100%;min-height:68px;resize:none;overflow:hidden;padding:10px 12px 20px;border-radius:10px;border:1px solid rgba(244,184,96,.3);background:rgba(8,6,16,.55);

.pv-cinema i:nth-child(2){right:0;width:49.4%;background:linear-gradient(160deg,#2c5b6a,#cfe0a8);animation:pvWipeR 4.8s var(--ease-soft) infinite;}

.pv-constellation i{position:absolute;border-radius:2px;box-shadow:0 0 0 1px rgba(255,226,168,.85),0 0 10px rgba(244,184,96,.4);opacity:0;animation:pvCard 6s ease-in-out infinite;}

  const newGid = () => 'g' + Math.random().toString(36).slice(2, 8);

  const runsOf = slides => { const out = []; for(const x of slides){ const last = out[out.length - 1]; if(x.g && last && last.g === x.g) last.items.push(x); else out.push({g:x.g || null, items:[x]}); } return out; };

  /* v1.9.0 批量操作注册表：以后增加「旋转」「移动到其他回忆」等，只需在这里追加一项（{id, label, icon, danger?, when(sel, st), run(sel, ctx)}） */

        const rest = st.slides.filter(x => !mem.includes(x)); rest.splice(at, 0, ...mem); mem.forEach(x => x.g = id); st.slides = rest;
        normalizeGroups(st); st.sel.clear(); st.selecting = false; st.focusGroup = id;

    // 年份数字视差（0.45 倍速）
    const par = reduced() ? 1 : .45;
    S.years.forEach(o => { const sx = (o.x + S.pad - x)*par + S.W*(1 - par)*.5 - S.cw*.4; o.el.style.transform = `translate3d(${sx.toFixed(1)}px,-50%,0)`; });
    // 景深：离中心越远越小、越暗，并略微转向中心
    let best = -1, bd = 1e9;
    for(const o of S.items){
      const cx = S.xs[o.i] + S.pad - x - S.W/2, d = cx/(S.W*.6), ad = Math.min(1, Math.abs(d));
      if(Math.abs(cx) > S.W*1.2){ continue; }
      const sc = 1 - .14*ad, op = 1 - .45*ad, ry = SB.clamp(-d*8, -8, 8);
      o.card.style.transform = `perspective(900px) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      o.card.style.opacity = op.toFixed(3);
      if(Math.abs(cx) < bd){ bd = Math.abs(cx); best = o.i; }
    }
    if(best !== S.near){ S.items[S.near]?.el.classList.remove('near'); S.items[best]?.el.classList.add('near'); S.near = best; }
    // 刻度条窗口
    if(S.win && S.list.length){
      const vis = S.items.filter(o => { const cx = S.xs[o.i] + S.pad - x; return cx > 0 && cx < S.W; }).map(o => tval(S.list[o.i].date)).filter(v => v != null);
      if(vis.length){ const a = (Math.min(...vis) - S.t0)/(S.t1 - S.t0)*100, b = (Math.max(...vis) - S.t0)/(S.t1 - S.t0)*100;
        S.win.style.left = `calc(${a.toFixed(2)}% - 6px)`; S.win.style.width = `calc(${(b - a).toFixed(2)}% + 12px)`; }
    }
  }
  /* 运动：拖动 / 惯性 / 缓动跳转，只在运动时运行 RAF */
  function loop(now){
    S.raf = 0;
    const dt = Math.min(.05, (now - (S.last || now))/1000) || 1/60; S.last = now;
    if(!S.drag){
      if(Math.abs(S.v) > .05){ S.target += S.v*dt*60; S.v *= Math.pow(.92, dt*60); } else S.v = 0;
      // 两端回弹
      if(S.target < S.min){ S.target = SB.lerp(S.target, S.min, Math.min(1, dt*10)); S.v *= .5; }
      if(S.target > S.max){ S.target = SB.lerp(S.target, S.max, Math.min(1, dt*10)); S.v *= .5; }
    }
    S.x = reduced() || S.drag ? S.target : SB.lerp(S.x, S.target, Math.min(1, dt*9));
    render();
    if(S.drag || Math.abs(S.v) > .05 || Math.abs(S.x - S.target) > .4 || S.target < S.min - .5 || S.target > S.max + .5){ S.raf = requestAnimationFrame(loop); }
    else { S.x = S.target = SB.clamp(S.target, S.min, S.max); render(); S.last = 0; }
  }
  const kick = () => { if(!S.raf){ S.last = 0; S.raf = requestAnimationFrame(loop); } };
  function center(i){ if(i < 0 || i >= S.list.length) return; S.v = 0; S.target = S.xs[i] + S.pad - S.W/2; if(reduced()) S.x = S.target; kick(); }
  const rubber = t => t < S.min ? S.min - Math.min(80, (S.min - t)*.35) : t > S.max ? S.max + Math.min(80, (t - S.max)*.35) : t;

  view.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    S.drag = {id:e.pointerId, px:e.clientX, x0:S.target, lastX:e.clientX, lastT:performance.now(), v:0}; S.moved = 0; S.v = 0;
    kick();
  });
  view.addEventListener('pointermove', e => {
    const d = S.drag; if(!d || d.id !== e.pointerId) return;
    const dx = e.clientX - d.px; S.moved = Math.max(S.moved, Math.abs(dx));
    if(S.moved > 6 && !view.classList.contains('drag')){ view.classList.add('drag'); try{ view.setPointerCapture(e.pointerId); }catch(_){} }
    const now = performance.now(), ddt = Math.max(1, now - d.lastT);
    d.v = SB.lerp(d.v, -(e.clientX - d.lastX)/ddt*16.7, .5); d.lastX = e.clientX; d.lastT = now;
    S.target = rubber(d.x0 - dx);
  });
  const up = e => {
    const d = S.drag; if(!d || d.id !== e.pointerId) return;
    S.drag = null; view.classList.remove('drag');
    if(performance.now() - d.lastT < 90) S.v = SB.clamp(d.v, -60, 60);
    kick(); setTimeout(() => { S.moved = 0; }, 0);
  };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
  view.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!d) return; e.preventDefault();
    S.v = 0; S.target = SB.clamp(S.target + d*(e.deltaMode === 1 ? 30 : 1), S.min - 40, S.max + 40); kick();
  }, {passive:false});
  view.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); center(SB.clamp((S.near < 0 ? 0 : S.near) + (e.key === 'ArrowRight' ? 1 : -1), 0, S.list.length - 1)); }
    else if(e.key === 'Home'){ e.preventDefault(); center(0); } else if(e.key === 'End'){ e.preventDefault(); center(S.list.length - 1); }
  });
  // 刻度条：点击 / 拖动跳到最接近该时间的回忆
  function scrubTo(clientX){
    const r = scrub.getBoundingClientRect(), t = S.t0 + SB.clamp((clientX - r.left)/r.width, 0, 1)*(S.t1 - S.t0);
    let bi = 0, bd = 1e9; S.list.forEach((m, i) => { const v = tval(m.date); if(v != null && Math.abs(v - t) < bd){ bd = Math.abs(v - t); bi = i; } });
    center(bi);
  }
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); scrub._d = true; scrubTo(e.clientX); });
  scrub.addEventListener('pointermove', e => { if(scrub._d) scrubTo(e.clientX); });
  scrub.addEventListener('pointerup', () => { scrub._d = false; }); scrub.addEventListener('pointercancel', () => { scrub._d = false; });
  addEventListener('resize', () => { if(SB.scenes.current === 'overview'){ const keep = S.near; build(false); if(keep >= 0) { center(keep); S.x = S.target; render(); } } });
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'overview') build(false); });

  SB.scenes.register('overview', {
    world:'night', deepLink:true,
    title:() => '时光长卷',
    parent:() => ({id:'globe', params:{}}),
    async prepare(){
      // 先签名离「最新」最近的若干封面，进入时首屏不出现空白相框
      const ids = sorted().slice(-14).map(coverOf).filter(Boolean);
      if(ids.length) await SB.store.prefetchUrls?.(ids);
    },
    enter(p, opts){ SB.fx.palette('night'); build(!opts?.back); },
    leave(){ cancelAnimationFrame(S.raf); S.raf = 0; S.drag = null; }
  });
  SB.menu.add({id:'overview', order:40, icon:'scroll', label:'时光长卷',
    desc:() => { const l = sorted().filter(m => m.date); const n = SB.store.memories.length;
      return n ? `${n} 段回忆${l.length ? ' · 从 ' + ym(l[0].date).y + ' 到 ' + ym(l[l.length - 1].date).y : ''}` : '我们的故事从这里开始'; },
    scene:'overview', sceneOpts:{transition:'quill'}});
})(window.SB);
</script>

<script>
/* ── 块 99 · v1.7.3 启动事务：认证 → Store → 首场景首帧 → 揭开 Gate ── */
(function(SB){
  (async()=>{
    try{
      await SB.store.ready;
      SB.fx.start();   // v1.9.0：登录门遮住画面时不运行背景粒子，登录完成后再启动
      SB.runtime?.showLoading?.('正在翻开书页…');   // v1.9.0 启动门状态行
      await SB.nextPaint();
      await SB.scenes.boot('book');
      document.dispatchEvent(new CustomEvent('sb:data'));
      await SB.nextPaint();
      SB.runtime?.reveal?.();
      // 只在浏览器空闲时预热 Three.js 脚本；不在魔法书首屏期间同步创建 WebGL/纹理。
      const warm = () => SB.globe?.warmEngine?.();
      if('requestIdleCallback' in window) requestIdleCallback(warm,{timeout:2200}); else setTimeout(warm,900);
    }catch(e){
      console.error('[Starbook start]',e);
      SB.runtime?.showFatal?.('暂时没能翻开这本书。','请检查 Supabase 初始化与网络连接后重新尝试。');
    }
  })();
})(window.SB);
</script>
