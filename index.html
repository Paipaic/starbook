    plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    minus:'<path d="M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    up:'<path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    down:'<path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    chevron:'<path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    note:'<path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="7" cy="17.5" r="2.3" fill="currentColor"/><circle cx="17" cy="15.5" r="2.3" fill="currentColor"/>'
  };
  SB.icon = (name, cls='') => `<svg class="sb-ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICON_PATHS[name] || ICON_PATHS.spark}</svg>`;
  SB.icon.names = Object.keys(ICON_PATHS);

  /* ── 字体就绪（只做预热与诊断，不隐藏文字） ── */
  SB.type = { ready: Promise.resolve() };
  if(document.fonts?.load){
    const warm = [
      "600 20px 'Noto Serif SC'", "400 16px 'Noto Serif SC'", "900 40px 'Noto Serif SC'",
      "500 12px 'Cinzel'", "500 16px 'Cormorant Garamond'"
    ];
    SB.type.ready = Promise.race([
      Promise.all(warm.map(f => document.fonts.load(f, '星屿之书回忆总览 ORBIS 2026').catch(() => null))),
      new Promise(r => setTimeout(r, 4000))
    ]).then(() => document.documentElement.classList.add('sb-fonts-ready'));
  }

  /* 标题排版：分隔点「·」与前文不断开，换行时只会出现在行尾，不会落在行首 */
  SB.fmtTitle = t => String(t ?? '').replace(/\s*·\s*/g, '\u00a0· ');

  SB.el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
  SB.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ── 按顺序尝试加载脚本 ── */
  const loaded = {};
  SB.loadScript = (urls, options={}) => {
    const key = urls.join('|');
    if(loaded[key]) return loaded[key];
    const timeoutMs = Math.max(2500, Number(options.timeoutMs) || 9000);
    return loaded[key] = new Promise((resolve, reject) => {
      let i = 0;
      const next = () => {
        if(i >= urls.length){ delete loaded[key]; reject(new Error('load_failed')); return; }
        const s = document.createElement('script'); s.src = urls[i++]; s.async = true;
        let settled = false;
        const timer = setTimeout(() => {
          if(settled) return; settled = true; s.remove(); next();
        }, timeoutMs);
        s.onload = () => { if(settled) return; settled = true; clearTimeout(timer); resolve(); };
        s.onerror = () => { if(settled) return; settled = true; clearTimeout(timer); s.remove(); next(); };
        document.head.appendChild(s);
      };
      next();
    });
  };

  /* ── 通用组件 ── */
  const CORNER = '<path d="M1 19 V6 Q1 1 6 1 H19 M4.5 19 V8 Q4.5 4.5 8 4.5 H19" fill="none" stroke="currentColor" stroke-width=".9"/><circle cx="4.5" cy="4.5" r="1.5" fill="currentColor"/>';
  const corners = () => ['tl','tr','bl','br'].map(c=>`<svg class="sb-corner ${c}" viewBox="0 0 20 20" aria-hidden="true">${CORNER}</svg>`).join('');
  let toastTimer;
  const ui = SB.ui = {
    corners,
    toast(text, ms=2600){
      const el = document.getElementById('sb-toast');
      el.textContent = text; el.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), ms);
    },
    button(text, kind='', onClick, icon){
      const b = SB.el('button', 'sb-btn ' + kind); b.type = 'button';
      if(icon){ b.innerHTML = SB.icon(icon); const t = SB.el('span'); t.textContent = text; b.appendChild(t); }
      else b.textContent = text;
      if(onClick) b.addEventListener('click', onClick); return b;
    },
    field(label, input){
      const f = SB.el('label','sb-field'); const s = SB.el('span'); s.textContent = label; f.append(s, input); return f;
    },
    input(attrs={}){
      const i = SB.el(attrs.multiline ? 'textarea' : 'input', 'sb-input');
      for(const [k,v] of Object.entries(attrs)) if(k!=='multiline') i.setAttribute(k, v);
      return i;
    },
    spinner(text){
      const d = SB.el('div','sb-spin', `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#f4b860" stroke-width="1.2">
        <circle cx="32" cy="32" r="29"/><circle cx="32" cy="32" r="25" stroke-dasharray="2 4"/>
        <path d="M32 3 L39 32 L32 61 L25 32Z M3 32 L32 25 L61 32 L32 39Z" stroke-width=".9"/></g>
        <g class="r2" fill="none" stroke="#ffe2a8" stroke-width="1"><circle cx="32" cy="32" r="14"/><path d="M32 18 L36 32 L32 46 L28 32Z"/></g></svg><span></span>`);
      d.querySelector('span').textContent = text || ''; return d;
    },
    /* 卷轴弹窗：返回 {el, body, close} */
    dialog({title, sub, wide, build, actions=[], onClose}={}){
      const m = SB.el('div','sb-modal'); m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
      const box = SB.el('div','sb-scroll' + (wide ? ' wide' : ''), corners());
      const hd = SB.el('header'); const h = SB.el('h3'); h.textContent = title || ''; hd.appendChild(h);
      if(sub){ const p = SB.el('p'); p.textContent = sub; hd.appendChild(p); }
      const body = SB.el('div','body'); const ft = SB.el('footer');
      box.append(hd, body, ft); m.appendChild(box);
      let closed = false;
      const close = (v) => { if(closed) return; closed = true; m.classList.remove('show'); setTimeout(()=>m.remove(), 380); document.removeEventListener('keydown', onKey); onClose?.(v); };
      const onKey = e => { if(e.key === 'Escape') close(); };
      m.addEventListener('pointerdown', e => { if(e.target === m) m._down = true; });
      m.addEventListener('click', e => { if(e.target === m && m._down) close(); m._down = false; });
      document.addEventListener('keydown', onKey);
      for(const a of actions){
        if(a === 'spacer'){ ft.appendChild(SB.el('span','spacer')); continue; }
        const b = ui.button(a.text, a.kind||'', async () => { const r = await a.onClick?.(close, b); if(r !== false && a.close !== false) close(r); });
        if(a.id) b.dataset.act = a.id;
        ft.appendChild(b);
      }
      if(!actions.length) ft.remove();
      build?.(body, close);
      document.body.appendChild(m);
      requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('show')));
      setTimeout(()=>{ const f = body.querySelector('input,textarea'); if(f && !SB.perf.touch) f.focus(); }, 300);
      return {el:m, body, footer:ft, close};
    },
    confirm(text, okText='确定', kind='danger'){
      return new Promise(res => {
        ui.dialog({ title:'请确认', build(b){ const p = SB.el('p'); p.style.cssText='margin:0;line-height:1.8;color:var(--text)'; p.textContent = text; b.appendChild(p); },
          actions:[{text:'取消', onClick:()=>{ res(false); }}, {text:okText, kind, onClick:()=>{ res(true); }}],
          onClose:()=>res(false) });
      });
    }
  };
  SB.toast = ui.toast;

  /* ── 场景管理器 ── */
  const scenes = SB.scenes = { map:{}, current:null, params:{}, _pendingHistory:null };
  scenes.register = (id, hooks={}) => { scenes.map[id] = hooks; };
  scenes.el = id => document.querySelector(`.sb-scene[data-scene="${id}"]`);
  /* 魔法路径：沿着每个场景的 parent() 一路向上 */
  scenes.path = () => {
    const out = []; let id = scenes.current, p = scenes.params, guard = 0;
    while(id && guard++ < 10){
      const h = scenes.map[id]; if(!h) break;
      out.unshift({id, params:p, label: h.title ? h.title(p) : id});
      const up = h.parent ? h.parent(p) : null;
      if(!up) break; id = up.id; p = up.params || {};
    }
    return out;
  };
  scenes.back = () => {
    const h = scenes.map[scenes.current]; const up = h?.parent?.(scenes.params);
    if(!up) return;
    const hs = history.state;
    // 如果当前浏览器历史正是从父场景进入的，直接交给浏览器返回，避免制造“返回后又能回到子页”的假历史。
    if(hs?.starbook && hs.from?.id === up.id && JSON.stringify(hs.from?.params||{}) === JSON.stringify(up.params||{})){
      history.back(); return;
    }
    scenes.go(up.id, up.params||{}, {transition: up.transition || 'veil', back:true, replaceHistory:true});
  };
  function syncHistory(id, params, opts, prev){
    if(opts?.fromHistory) return;
    try{
      const url = scenes.map[id].hash === false ? location.pathname + location.search : '#'+id;
      const state = {starbook:true, scene:id, params:params||{}, from:prev ? {id:prev.id, params:prev.params||{}} : null};
      if(opts?.boot || opts?.replaceHistory) history.replaceState(state,'',url);
      else history.pushState(state,'',url);
    }catch(e){}
  }
  const preparing = new Map();
  const prepKey = (id, params) => id + '|' + JSON.stringify(params || {});
  async function prepareTarget(id, params={}, opts={}){
    const h = scenes.map[id]; if(!h?.prepare) return;
    const key = prepKey(id, params);
    if(preparing.has(key)) return preparing.get(key);
    const job = Promise.resolve().then(() => h.prepare(params || {}, opts)).finally(() => preparing.delete(key));
    preparing.set(key, job); return job;
  }
  scenes.prefetch = (id, params={}) => prepareTarget(id, params, {prefetch:true}).catch(e => console.warn('[Starbook prefetch]', id, e));

  function scrubScenes(except){
    // v1.7.3：每次真正 swap 时强制清除所有非目标 scene 的 active/transition 状态。
    // 即使旧异步逻辑曾遗留 class，也不会在下一次转场中“闪出一堆页面”。
    document.querySelectorAll('.sb-scene').forEach(el => {
      if(el === except) return;
      el.classList.remove('is-active','is-entering'); el.style.clipPath = ''; el.style.zIndex = '';
      el.setAttribute('aria-hidden','true');
    });
  }
  async function swap(id, params, opts){
    const prev = scenes.current ? {id:scenes.current, params:scenes.params} : null;
    const prevEl = prev ? scenes.el(prev.id) : null, nextEl = scenes.el(id), nextHook = scenes.map[id];
    if(!nextEl) return;
    scrubScenes(nextEl);
    if(prev && prev.id !== id){
      prevEl?.classList.remove('is-active'); prevEl?.setAttribute('aria-hidden','true');
      await Promise.resolve(scenes.map[prev.id]?.leave?.(opts));
    }else if(prev && opts?.force){
      await Promise.resolve(scenes.map[prev.id]?.leave?.(opts));
      prevEl?.classList.remove('is-active');
    }
    scenes.current = id; scenes.params = params || {};
    document.body.dataset.scene = id;
    document.body.dataset.world = nextHook.world || 'night';
    nextEl.classList.add('is-active'); nextEl.setAttribute('aria-hidden','false');
    // v1.7.3：enter 可以异步；遮罩不会在目标场景首帧真正准备好之前退场。
    await Promise.resolve(nextHook.enter?.(scenes.params, opts));
    await SB.nextPaint();
    syncHistory(id,scenes.params,opts||{},prev);
    document.dispatchEvent(new CustomEvent('sb:scene', {detail:{id, params:scenes.params}}));
  }
  scenes.go = async (id, params={}, opts={}) => {
    if(!scenes.map[id]) return;
    if(document.body.classList.contains('is-busy')){
      if(opts?.fromHistory) scenes._pendingHistory = {id, params:params||{}, opts:{...opts}};
      return;
    }
    if(id === scenes.current && JSON.stringify(params) === JSON.stringify(scenes.params) && !opts.force) return;
    const tr = opts.transition || 'veil';
    const low = SB.perf.level !== 'high';
    document.body.classList.add('is-busy');
    SB.menu?.close?.();
    const veil = document.getElementById('sb-veil'), flash = document.getElementById('sb-flash');
    const gate = SB.gate || null;
    const gateKind = gate ? (tr === 'flash' ? 'portkey' : tr === 'veil' ? 'nox' : gate.has?.(tr) ? tr : null) : null;
    try{
      if(SB.perf.level === 'reduced' || tr === 'none'){
        await prepareTarget(id, params, opts);
        await swap(id, params, opts);
      }else if(gateKind){
        // v1.8.1 秘境之门：按路线选择门（flash=门钥匙、veil=熄灯器、quill=墨金书页、pensieve=冥想盆）；
        // 门只负责 cover / reveal 视觉，事务顺序不变：cover → prepare → swap(await enter → nextPaint) → reveal
        const at = {x:opts.x, y:opts.y};
        if(gateKind === 'nox') SB.fx?.gather?.(innerWidth/2, innerHeight/2);
        await gate.cover(gateKind, at);
        await prepareTarget(id, params, opts);
        await swap(id, params, opts);
        if(gateKind === 'nox'){ SB.fx?.calm?.(); SB.fx?.burst?.(low ? 320 : 500); }
        await gate.reveal(gateKind, at);
      }else if(tr === 'flash'){
        const tin = low ? 260 : 380, tout = low ? 360 : 520;
        flash.style.animationDuration = tin + 'ms';
        flash.className = 'flash-in'; await SB.wait(tin);
        // 目标场景的网络/Three.js/首屏内容全部在遮罩完全盖住时准备。
        await prepareTarget(id, params, opts);
        await swap(id, params, opts);
        flash.style.animationDuration = tout + 'ms';
        flash.className = 'flash-out'; await SB.wait(tout); flash.className = ''; flash.style.animationDuration = '';
      }else if(tr === 'portal'){
        const x = opts.x ?? innerWidth/2, y = opts.y ?? innerHeight/2;
        // 点击后立刻给出同一 portal 光环反馈；准备阶段旧页保持完整，不出现空背景或半页残留。
        // v1.8.0 幻影显形：有 SB.gate 时用旋转符文环代替纯光圈；否则保留旧光圈。
        const ring = gate ? null : SB.el('div','sb-portal-ring preparing');
        if(ring){ ring.style.left = x+'px'; ring.style.top = y+'px'; document.body.appendChild(ring); }
        gate?.portalStart(x, y);
        await prepareTarget(id, params, opts);
        if(ring){ ring.classList.remove('preparing'); ring.style.width = ring.style.height = '0px'; }
        const stage = document.getElementById('sb-stage');
        const back = SB.el('div','sb-portal-backdrop'); stage.appendChild(back);
        requestAnimationFrame(() => back.classList.add('show')); await SB.wait(low ? 90 : 120);
        const R = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y)) + 40;
        const el = scenes.el(id); el.classList.add('is-entering'); el.style.clipPath = `circle(0px at ${x}px ${y}px)`;
        await swap(id, params, opts);
        SB.fx?.burst?.(low ? 260 : 380);
        const t0 = performance.now(), D = gate?.portalDuration?.() || (low ? 390 : 560);
        await new Promise(res => { const step = now => { const k = Math.min(1,(now-t0)/D), e = 1-Math.pow(1-k,3), r = e*R;
          el.style.clipPath = `circle(${r}px at ${x}px ${y}px)`; gate?.portalFrame(x, y, r, k);
          if(ring){ ring.style.width = ring.style.height = (r*2)+'px'; ring.style.opacity = String(1-k*.9); }
          k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
        el.style.clipPath = ''; el.classList.remove('is-entering'); ring?.remove(); back.remove(); gate?.portalEnd();
      }else{
        const tin = low ? 260 : 400, tout = low ? 320 : 480;
        SB.fx?.gather?.(innerWidth/2, innerHeight/2);
        veil.style.animationDuration = tin + 'ms'; veil.className = 'veil-in'; await SB.wait(tin);
        await prepareTarget(id, params, opts);
        await swap(id, params, opts); SB.fx?.calm?.(); SB.fx?.burst?.(low ? 320 : 500);
        veil.style.animationDuration = tout + 'ms'; veil.className = 'veil-out'; await SB.wait(tout); veil.className = ''; veil.style.animationDuration = '';
      }
    }catch(e){
      console.error('[Starbook scene transition]', id, e);
      veil && (veil.className = ''); flash && (flash.className = '');
      document.querySelectorAll('.sb-portal-backdrop,.sb-portal-ring').forEach(x => x.remove());
      SB.gate?.abort?.();
      SB.toast?.('场景暂时没有准备好，请再试一次');
    }finally{
      document.body.classList.remove('is-busy');
      const pending = scenes._pendingHistory; scenes._pendingHistory = null;
      if(pending && (pending.id !== scenes.current || JSON.stringify(pending.params||{}) !== JSON.stringify(scenes.params||{}))){
        setTimeout(() => scenes.go(pending.id, pending.params||{}, {...pending.opts, force:true}), 0);
      }
    }
  };
  scenes.boot = async (fallback) => {
    const stage = document.getElementById('sb-stage');
    document.querySelectorAll('.sb-scene').forEach(s => { s.classList.remove('is-active','is-entering'); s.style.clipPath=''; s.setAttribute('aria-hidden','true'); stage.appendChild(s); });
    const hs = history.state;
    const want = hs?.starbook ? hs.scene : (location.hash||'').slice(1);
    const h = scenes.map[want];
    const params = hs?.starbook && h ? (hs.params||{}) : {};
    const target = h && h.deepLink ? want : fallback;
    await prepareTarget(target, params, {boot:true});
    await swap(target, params, {boot:true});
  };
  window.addEventListener('popstate', e => {
    const st = e.state;
    if(!st?.starbook || !scenes.map[st.scene]) return;
    scenes.go(st.scene, st.params||{}, {fromHistory:true, transition:'veil', force:true});
  });
  // 从系统返回 / bfcache 恢复时，清掉可能被冻结在动画中间的阻塞状态。
  window.addEventListener('pageshow', e => {
    if(!e.persisted) return;
    document.body.classList.remove('is-busy');
    const veil = document.getElementById('sb-veil'), flash = document.getElementById('sb-flash');
    if(veil) veil.className = '';
    if(flash) flash.className = '';
    SB.gate?.abort?.();
  });
})(window.SB);
</script>

  background:conic-gradient(from 0deg,transparent 0 70%,rgba(240,200,120,.08) 80%,rgba(255,232,180,.85) 99%,transparent 100%);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px),#000 calc(100% - 2px),transparent 100%);mask:radial-gradient(closest-side,transparent calc(100% - 7px),#000 calc(100% - 6px),#000 calc(100% - 2px),transparent 100%);
  inset:8%;width:auto;height:auto;}
.sb-gate-orb .sweep.b{inset:24%;animation-duration:3.8s;animation-direction:reverse;opacity:.7;}
.sb-gate-orb .gem{inset:38%;width:auto;height:auto;will-change:transform;animation:sbGateGem 3.2s ease-in-out infinite;}
@keyframes sbGateGem{0%,100%{transform:scale(.94) rotate(0deg)}50%{transform:scale(1.06) rotate(8deg)}}
#sb-gate.state-login .sb-gate-orb,#sb-gate.state-error .sb-gate-orb{transform:scale(.62);margin:-46px 0 -50px;}
#sb-gate.state-login .sb-gate-orb .sweep,#sb-gate.state-error .sb-gate-orb .sweep{opacity:0;transition:opacity .5s;}
/* 文字与卡片 */
.sb-gate-card{position:relative;width:min(400px,100%);text-align:center;border-radius:18px;padding:0;transition:padding .6s var(--ease-soft);}
.sb-gate-rune{font-family:var(--gate-rune);font-weight:500;font-size:10.5px;letter-spacing:.42em;padding-left:.42em;color:var(--gold-dim);margin:0 0 10px;}
.sb-gate-card h1{font-family:var(--gate-serif);font-weight:900;letter-spacing:.24em;padding-left:.24em;color:var(--gold-hi);font-size:clamp(28px,7vw,38px);margin:0;text-shadow:0 0 22px rgba(244,184,96,.42);}
.sb-gate-card .intro{font-size:13.5px;line-height:1.9;color:var(--text-dim);margin:10px auto 0;max-width:330px;letter-spacing:.12em;min-height:1.9em;}
.sb-gate-status{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;letter-spacing:.24em;padding-left:.24em;color:var(--gold-hi);min-height:20px;}
.sb-gate-status span{transition:opacity .35s;}
.sb-gate-status.swap span{opacity:0;}
.sb-gate-status i{width:5px;height:5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px rgba(244,184,96,.9);animation:sbGateHalo 1.4s ease-in-out infinite;}
#sb-gate.state-login .sb-gate-status,#sb-gate.state-error .sb-gate-status{display:none;}
#sb-gate.state-login .sb-gate-card,#sb-gate.state-error .sb-gate-card{padding:26px 28px 24px;border:1px solid rgba(244,184,96,.34);
  background:linear-gradient(180deg,rgba(28,24,52,.92),rgba(10,9,24,.95));box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 50px rgba(244,184,96,.10),inset 0 0 40px rgba(255,226,168,.03);}
.sb-gate-card .corner{position:absolute;width:18px;height:18px;border-color:rgba(244,184,96,.6);border-style:solid;opacity:0;transition:opacity .6s;}
.sb-gate-card .corner.tl{left:8px;top:8px;border-width:1px 0 0 1px;}.sb-gate-card .corner.tr{right:8px;top:8px;border-width:1px 1px 0 0;}
.sb-gate-card .corner.bl{left:8px;bottom:8px;border-width:0 0 1px 1px;}.sb-gate-card .corner.br{right:8px;bottom:8px;border-width:0 1px 1px 0;}
#sb-gate.state-login .corner,#sb-gate.state-error .corner{opacity:1;}
#sb-gate-body{margin-top:18px;}
#sb-gate-body:empty{display:none;}
#sb-gate.state-login #sb-gate-body{animation:sbGateIn .6s var(--ease-soft) both;}
@keyframes sbGateIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sb-gate-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
.sb-gate-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-dim);letter-spacing:.12em;}
.sb-gate-form input{width:100%;border:1px solid rgba(244,184,96,.28);border-radius:10px;background:rgba(3,4,14,.6);padding:11px 12px;color:var(--text);outline:none;font-size:15px;}
.sb-gate-form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,184,96,.1);}
.sb-gate-submit{margin-top:4px;width:100%;justify-content:center;min-height:46px;letter-spacing:.24em;}
.sb-gate-error{min-height:20px;margin:10px 0 0;color:#e7a493;font-size:12.5px;line-height:1.7;}
.sb-gate-note{margin:10px 0 0;color:rgba(191,165,130,.7);font-size:11px;line-height:1.6;letter-spacing:.06em;}

.sb-gate-actions .sb-btn{min-width:132px;}
html[data-sb-perf="high"] .sb-gate-sky{will-change:transform;animation:sbGateSpin 240s linear infinite;}
html:not([data-sb-perf="high"]) .sb-gate-tw,html:not([data-sb-perf="high"]) .sb-gate-orb .sweep.b{display:none;}
@media (prefers-reduced-motion:reduce){ #sb-gate *{animation:none!important;} }
@media(max-width:480px){
  #sb-gate{padding:max(14px,var(--safe-t)) max(14px,var(--safe-r)) max(14px,var(--safe-b)) max(14px,var(--safe-l));gap:14px;}
  .sb-gate-orb{--orb:216px;}
  #sb-gate.state-login .sb-gate-orb,#sb-gate.state-error .sb-gate-orb{transform:scale(.56);margin:-48px 0 -52px;}
  #sb-gate.state-login .sb-gate-card,#sb-gate.state-error .sb-gate-card{padding:22px 18px 20px;border-radius:16px;}
}

<script>
/* ── v1.5 · Runtime Context：User / Book / Theme / Experience ── */
(function(SB){
  const cfg = window.STARBOOK_CONFIG || {};
  const gate = document.getElementById('sb-gate');
  const gateBody = document.getElementById('sb-gate-body');
  const gateIntro = document.getElementById('sb-gate-intro');
  const SUPABASE_CDNS = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2'
  ];

  /* v1.9.0 字体只决策一次：2.2 秒内网络字体到齐就用网络字体，否则整个启动过程固定用本地宋体，不再中途替换 */
  (function(){
    const root = document.documentElement, decide = v => { if(!root.dataset.gateType) root.dataset.gateType = v; };
    const f = document.fonts;
    if(!f?.load){ decide('local'); return; }
    const want = ["900 38px 'Noto Serif SC'", "400 14px 'Noto Serif SC'", "500 11px 'Cinzel'"], t0 = performance.now();
    // 字体样式表可能还没注册 @font-face（load 返回空列表）：每 150ms 重试，直到 2.2 秒
    const tryLoad = () => Promise.all(want.map(x => f.load(x, '星屿之书有些故事值得被写进星辰 LIBER').catch(() => []))).then(list => {
      if(list.every(l => l && l.length)) return decide('web');
      if(performance.now() - t0 < 2050) setTimeout(tryLoad, 150);
    });
    tryLoad();
    setTimeout(() => decide('local'), 2200);
  })();
  const gateStatus = document.getElementById('sb-gate-status');
  function setState(name){ gate.classList.remove('state-loading', 'state-login', 'state-error'); gate.classList.add('state-' + name); }
  function showLoading(text='正在连接星海…'){
    gate.hidden = false; gate.classList.remove('leaving'); setState('loading');
    gateIntro.textContent = '有些故事，值得被写进星辰。';
    gateBody.innerHTML = '';
    const span = gateStatus.querySelector('span');
    if(span.textContent === text) return;
    gateStatus.classList.add('swap'); clearTimeout(showLoading.t);
    showLoading.t = setTimeout(() => { span.textContent = text; gateStatus.classList.remove('swap'); }, 220);
  }
  function showFatal(text, detail, options={}){
    gate.hidden = false; gate.classList.remove('leaving'); gateBody.innerHTML = ''; setState('error');
    gateIntro.textContent = text || '星海暂时失去了连接。';
    const p = SB.el('p','sb-gate-error'); p.textContent = detail || '请检查网络后重新尝试。';
    const actions = SB.el('div','sb-gate-actions');

    if(options.retry !== false){
      const retryLabel = options.retryLabel || '重新连接';
      const retryAction = typeof options.retry === 'function' ? options.retry : ()=>location.reload();
      const retry = SB.ui.button(retryLabel,'primary sb-gate-retry',async()=>{
        retry.disabled = true;
        try{ await retryAction(); }
        catch(e){ console.error('[Starbook retry]',e); retry.disabled = false; }
      });
      actions.appendChild(retry);
    }

    if(options.backToLogin){
      const back = SB.ui.button(options.backLabel || '返回登录','',async()=>{
        back.disabled = true;
        try{ await returnToLogin(options.loginMessage || '请重新登录后再开启星屿。'); }
        catch(e){ console.error('[Starbook back-to-login]',e); back.disabled = false; }
      });
      actions.appendChild(back);
    }

    gateBody.append(p,actions);
  }
  function hideGate(){
    const ms = SB.perf.level === 'high' ? 520 : 320;
    gate.style.transitionDuration = ms + 'ms'; gate.classList.add('leaving');
    setTimeout(()=>{ gate.hidden = true; gate.classList.remove('leaving'); gate.style.transitionDuration = ''; },ms + 30);
  }

  const user = SB.user = {
    current:null, session:null, ready:null,
    async signIn(email,password){
      const {data,error} = await SB.supabase.auth.signInWithPassword({email,password});
      if(error) throw error;
      user.session = data.session || null; user.current = data.user || data.session?.user || null;
      return user.current;
    },
    async signOut(options={}){
      const reload = options.reload !== false;
      try{ await SB.supabase?.auth?.signOut(); }catch(e){ console.error(e); }
      user.session = null; user.current = null;
      if(SB.book){ SB.book.current = null; SB.book.memberships = []; SB.book.books = []; }
      if(reload) location.reload();
    }
  };

  async function returnToLogin(message=''){
    try{ await user.signOut({reload:false}); }
    catch(e){ console.error('[Starbook signout]',e); }
    try{ localStorage.removeItem('sb-current-book'); }catch(e){}
    showLogin(message);
  }

  const book = SB.book = {
    current:null, memberships:[], books:[], ready:null,
    async load(){
      if(!user.current) throw new Error('not_authenticated');
      const {data:memberships,error:mErr} = await SB.supabase.from('book_members')
        .select('book_id,role,status,created_at').eq('user_id',user.current.id).eq('status','active');
      if(mErr) throw mErr;
      book.memberships = memberships || [];
      const ids = book.memberships.map(x=>x.book_id);
      if(!ids.length){ book.books = []; book.current = null; return null; }
      const {data:books,error:bErr} = await SB.supabase.from('books')
        .select('id,name,relationship_type,theme_id,experience_id,created_by,created_at,updated_at').in('id',ids);
      if(bErr) throw bErr;
      book.books = books || [];
      let preferred = null; try{ preferred = localStorage.getItem('sb-current-book'); }catch(e){}
      const chosen = book.books.find(x=>x.id===preferred) || book.books[0] || null;
      return book.open(chosen?.id);
    },
    open(id){
      const row = book.books.find(x=>x.id===id); if(!row){ book.current = null; return null; }
      const member = book.memberships.find(x=>x.book_id===id);
      book.current = {
        id:row.id, name:row.name, role:member?.role || 'viewer', createdBy:row.created_by,
        relationshipType:row.relationship_type || cfg.defaults?.relationshipType || 'romantic',
        themeId:row.theme_id || cfg.defaults?.themeId || 'magic-celestial',
        experienceId:row.experience_id || cfg.defaults?.experienceId || 'world-map'
      };
      try{ localStorage.setItem('sb-current-book',row.id); }catch(e){}
      SB.theme.current = book.current.themeId;
      SB.experience.current = book.current.experienceId;
      document.documentElement.dataset.sbTheme = SB.theme.current;
      document.documentElement.dataset.sbExperience = SB.experience.current;
      document.dispatchEvent(new CustomEvent('sb:book',{detail:{book:book.current}}));
      return book.current;
    },
    close(){ book.current = null; }
  };

  SB.theme = { current: cfg.defaults?.themeId || 'magic-celestial' };
  SB.experience = { current: cfg.defaults?.experienceId || 'world-map' };
  const runtime = SB.runtime = { ready:null, config:cfg, showLoading, showFatal, reveal:hideGate };

  let resolveReady, rejectReady;
  runtime.ready = new Promise((res,rej)=>{ resolveReady=res; rejectReady=rej; });
  user.ready = runtime.ready; book.ready = runtime.ready;

  async function finishAuthenticated(){
    showLoading('正在读取我们的世界…');
    try{
      const current = await book.load();
      if(!current){
        showFatal(
          '这枚星钥还没有连接到一本书。',
          '当前账号还没有《星屿之书》的访问权限。可以重新检查权限，或返回登录并使用其他账号。',
          {
            retryLabel:'重新检查权限',
            retry:()=>finishAuthenticated(),
            backToLogin:true,
            loginMessage:'已退出当前账号，请使用拥有访问权限的账号登录。'
          }
        );
        return;
      }
      // v1.7.3：这里只宣布认证/Book 就绪；登录 Gate 由 99-boot 在 Store + 首个场景首帧完成后再揭开。
      resolveReady({user:user.current,book:current});
    }catch(e){
      console.error('[Starbook runtime]',e);
      const msg=String(e?.message||'');
      const permissionLike = /permission|row-level|rls|not authorized|unauthorized|forbidden|42501/i.test(msg);
      showFatal(
        permissionLike ? '这枚星钥暂时没有权限。' : '暂时没能翻开这本书。',
        permissionLike
          ? '当前账号没有读取这本书的权限。你可以重新检查权限，或返回登录并使用其他账号。'
          : '数据库连接或权限配置暂时异常。你可以重新尝试，或返回登录。',
        {
          retryLabel:'重新尝试',
          retry:()=>finishAuthenticated(),
          backToLogin:true,
          loginMessage:'已返回登录界面。'
        }
      );
    }
  }

  function showLogin(message=''){
    gate.hidden = false; gate.classList.remove('leaving'); gateBody.innerHTML=''; setState('login');
    gateIntro.textContent = '这本书只向被邀请的人开启。';
    const form = SB.el('form','sb-gate-form');
    const email = SB.el('input'); email.type='email'; email.autocomplete='email'; email.placeholder='your@email.com'; email.required=true;
    const password = SB.el('input'); password.type='password'; password.autocomplete='current-password'; password.placeholder='••••••••'; password.required=true;
    const l1=SB.el('label'); l1.textContent='邮箱'; l1.appendChild(email);
    const l2=SB.el('label'); l2.textContent='密码'; l2.appendChild(password);
    const submit = SB.ui.button('开启星屿','primary sb-gate-submit'); submit.type='submit';
    const err=SB.el('p','sb-gate-error'); err.textContent=message;

        err.textContent = /invalid login|invalid credentials/i.test(msg) ? '邮箱或密码不正确。' : '暂时无法登录，请检查网络后再试。';

  }

  async function bootRuntime(){
    showLoading('正在连接星海…');
    try{
      if(!cfg.supabaseUrl || !cfg.supabasePublishableKey) throw new Error('missing_supabase_config');
      if(!window.supabase?.createClient) await SB.loadScript(SUPABASE_CDNS);
      if(!window.supabase?.createClient) throw new Error('supabase_client_unavailable');

        auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},
        global:{headers:{'x-client-info':'starbook-v'+(cfg.version||'')}}

        user.session=session||null; user.current=session?.user||null;
        if(event==='SIGNED_OUT' && !gate.hidden) return;
        if(event==='SIGNED_OUT'){ showLogin('登录状态已结束，请重新开启星屿。'); }
      });
      const {data,error}=await SB.supabase.auth.getSession(); if(error) throw error;
      user.session=data.session||null; user.current=data.session?.user||null;
      if(user.current) await finishAuthenticated(); else showLogin();
    }catch(e){
      console.error('[Starbook boot]',e); rejectReady?.(e);
      showFatal('星海暂时失去了连接。','Supabase 客户端未能加载。请检查网络后重新连接。');
    }
  }
  bootRuntime();
})(window.SB);

<script>
/* ── 块 01 · 高级粒子特效：多层景深、拖尾火星、星芒、环绕光带、鼠标魔法轨迹、汇聚/爆散/穿越 ── */
(function(SB){
  const fx = SB.fx = {};
  const back = document.getElementById('fx-back'), front = document.getElementById('fx-front');
  const bctx = back.getContext('2d'), fctx = front.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const S = {}; // 精灵图
  const parts = [], glints = [], wand = [];
  let orbitPts = [];
  const mode = { gather:0, burst:0, warp:0, tg:{gather:0, burst:0, warp:0}, gx:.5, gy:.5 };
  const mouse = { x:0, y:0, tx:0, ty:0, px:-1, py:-1 };
  const orbit = { on:false, k:0, cx:0, cy:0, rx:0, ry:0, tilt:-.18, speed:.12, boost:1 };
  let palette = 'warm';

  function glow(r, stops){
    const c = document.createElement('canvas'); c.width = c.height = r*2;
    const g = c.getContext('2d'), gr = g.createRadialGradient(r,r,0,r,r,r);
    stops.forEach(([o,col]) => gr.addColorStop(o,col)); g.fillStyle = gr; g.fillRect(0,0,r*2,r*2); return c;
  }
  function star(r, core, halo){
    const c = document.createElement('canvas'); c.width = c.height = r*2; const g = c.getContext('2d');
    g.drawImage(glow(r, [[0,core],[.12,halo],[1,'rgba(0,0,0,0)']]), 0, 0);
    g.globalCompositeOperation = 'lighter';
    for(const [w,h] of [[r*2,r*.09],[r*.09,r*2]]){
      const gr = g.createLinearGradient(r-w/2, r-h/2, r+w/2, r+h/2);
      gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.5,core); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(r-w/2, r-h/2, w, h);
    }
    return c;
  }
  function makeSprites(){
    S.warm = {
      bokeh: glow(64, [[0,'rgba(255,200,120,.55)'],[.3,'rgba(255,160,70,.2)'],[1,'rgba(0,0,0,0)']]),
      dust:  glow(20, [[0,'rgba(255,244,214,1)'],[.25,'rgba(255,196,100,.6)'],[1,'rgba(0,0,0,0)']]),
      ember: glow(14, [[0,'rgba(255,252,236,1)'],[.3,'rgba(255,160,60,.75)'],[1,'rgba(0,0,0,0)']]),
      glint: star(40, 'rgba(255,248,226,1)', 'rgba(255,196,110,.5)'),
      trail: 'rgba(255,170,80,'
    };
    S.night = {
      bokeh: glow(64, [[0,'rgba(150,170,255,.35)'],[.3,'rgba(110,120,230,.14)'],[1,'rgba(0,0,0,0)']]),
      dust:  glow(20, [[0,'rgba(236,240,255,1)'],[.25,'rgba(170,186,255,.55)'],[1,'rgba(0,0,0,0)']]),
      ember: glow(14, [[0,'rgba(255,252,236,1)'],[.3,'rgba(255,196,110,.75)'],[1,'rgba(0,0,0,0)']]),
      glint: star(40, 'rgba(255,255,255,1)', 'rgba(190,200,255,.45)'),
      trail: 'rgba(255,206,130,'
    };
  }
  const count = () => SB.perf.level === 'high' ? (SB.perf.touch ? 150 : 190) : SB.perf.level === 'low' ? 72 : 18;
  function spawn(p, initial){
    const r = Math.random();
    p.kind = r < .14 ? 'bokeh' : r < .62 ? 'dust' : 'ember';
    p.d = p.kind === 'bokeh' ? .2 + Math.random()*.3 : p.kind === 'dust' ? .4 + Math.random()*.4 : .8 + Math.random()*.4;
    p.x = Math.random()*W; p.y = initial ? Math.random()*H : H + 30;
    p.size = p.kind === 'bokeh' ? 20 + Math.random()*40 : p.kind === 'dust' ? 2.4 + Math.random()*4 : 1.8 + Math.random()*2.4;
    p.vy = p.kind === 'bokeh' ? 2 + Math.random()*4 : p.kind === 'dust' ? 5 + Math.random()*10 : 10 + Math.random()*14;
    p.sway = 6 + Math.random()*20; p.ph = Math.random()*6.28; p.fq = .12 + Math.random()*.3;
    p.a = p.kind === 'bokeh' ? .1 + Math.random()*.18 : .4 + Math.random()*.55;
    p.tw = .5 + Math.random()*1.6; p.ox = 0; p.oy = 0; p.front = p.kind === 'ember' && Math.random() < .45;
    return p;
  }
  function buildOrbit(){
    const n = SB.perf.level === 'high' ? (SB.perf.touch ? 110 : 150) : SB.perf.level === 'low' ? 56 : 0;
    orbitPts = Array.from({length:n}, () => ({ a:Math.random()*6.28, r:.86 + Math.random()*.28, h:(Math.random()-.5)*.16,
      s:.6 + Math.random()*.8, size:1.2 + Math.random()*2.6, tw:Math.random()*6.28, big:Math.random() < .08 }));
  }
  function resize(){
    DPR = Math.min(devicePixelRatio || 1, SB.perf.level === 'high' ? (SB.perf.touch ? 1.5 : 1.75) : SB.perf.level === 'low' ? 1.25 : 1);
    W = innerWidth; H = innerHeight;
    for(const [c,x] of [[back,bctx],[front,fctx]]){ c.width = W*DPR; c.height = H*DPR; x.setTransform(DPR,0,0,DPR,0,0); }
    const n = count();
    while(parts.length < n) parts.push(spawn({}, true));
    parts.length = n;
    buildOrbit();
  }

  /* ── 对外接口 ── */
  fx.calm   = () => { mode.tg.gather = 0; mode.tg.burst = 0; mode.tg.warp = 0; };
  fx.gather = (x, y) => { mode.gx = x/W; mode.gy = y/H; mode.tg.gather = 1; mode.tg.warp = 0; };
  fx.burst  = (ms=900) => { mode.tg.burst = 1; setTimeout(() => { mode.tg.burst = 0; }, ms); };
  fx.warp   = (on=true) => { mode.tg.warp = on ? 1 : 0; if(on) mode.tg.gather = 0; };
  fx.orbit  = (o) => { if(!o){ orbit.on = false; return; } Object.assign(orbit, o); orbit.on = true; };
  fx.orbitBoost = (v) => { orbit.boost = v; };
  fx.palette = (p) => { palette = p; };
  fx.refresh = resize;

  addEventListener('pointermove', e => {
    mouse.tx = (e.clientX/W - .5)*2; mouse.ty = (e.clientY/H - .5)*2;
    if(SB.perf.level === 'reduced') return;
    const dx = e.clientX - mouse.px, dy = e.clientY - mouse.py;
    if(mouse.px < 0 || dx*dx + dy*dy > 120){
      mouse.px = e.clientX; mouse.py = e.clientY;
      if(wand.length < 70) for(let i = 0; i < 2; i++) wand.push({ x:e.clientX + (Math.random()-.5)*8, y:e.clientY + (Math.random()-.5)*8,
        vx:(Math.random()-.5)*24, vy:10 + Math.random()*30, life:0, max:.7 + Math.random()*.5, s:1.4 + Math.random()*2.2 });
    }
  }, {passive:true});

  let last = performance.now(), running = true, cinemaMode = false, lastDraw = 0;
  fx.playback = on => { cinemaMode = !!on; };
  function targetFps(){
    if(SB.perf.level === 'reduced') return 18;
    if(cinemaMode) return SB.perf.level === 'high' ? 40 : 24;
    return SB.perf.level === 'high' ? 60 : 30;
  }
  function frame(now){
    if(!running) return;
    const minFrame = 1000/targetFps();
    if(now - lastDraw < minFrame){ requestAnimationFrame(frame); return; }
    lastDraw = now;
    const dt = SB.clamp((now - last)/1000, 0, .06); last = now;
    const t = now/1000, sp = S[palette];
    for(const k of ['gather','burst','warp']) mode[k] = SB.lerp(mode[k], mode.tg[k], Math.min(1, dt*(k === 'burst' ? 3 : 1.7)));
    mouse.x = SB.lerp(mouse.x, mouse.tx, Math.min(1, dt*1.5)); mouse.y = SB.lerp(mouse.y, mouse.ty, Math.min(1, dt*1.5));
    bctx.clearRect(0,0,W,H); fctx.clearRect(0,0,W,H);
    bctx.globalCompositeOperation = fctx.globalCompositeOperation = 'lighter';
    const gx = mode.gx*W, gy = mode.gy*H, cx = W/2, cy = H/2;

    /* 漂浮粒子 */
    for(const p of parts){
      p.y -= p.vy*dt*(1 + mode.burst*3);
      p.ph += p.fq*dt;
      let x = p.x + Math.sin(p.ph)*p.sway, y = p.y;
      if(mode.gather > .01){
        const dx = gx - x - p.ox, dy = gy - y - p.oy, d = Math.hypot(dx,dy) + 1;
        p.ox += (dx/d*70 - dy/d*95)*dt*mode.gather*p.d;
        p.oy += (dy/d*70 + dx/d*95)*dt*mode.gather*p.d;
      }else{ p.ox *= 1 - dt*.35; p.oy *= 1 - dt*.35; }
      if(mode.burst > .01 || mode.warp > .01){
        const dx = x + p.ox - cx, dy = y + p.oy - cy, d = Math.hypot(dx,dy) + 1;
        const f = (mode.burst*150 + mode.warp*(80 + d*2.2))*dt*p.d;
        p.ox += dx/d*f; p.oy += dy/d*f;
      }
      x += p.ox - mouse.x*18*p.d; y += p.oy - mouse.y*12*p.d;
      if(!(Math.abs(x) < 1e5 && Math.abs(y) < 1e5)){ spawn(p, false); p.ox = p.oy = 0; continue; }
      if(y < -80 || x < -100 || x > W + 100 || y > H + 100){ spawn(p, false); continue; }
      const ctx = p.front ? fctx : bctx;
      let a = p.a*(p.kind === 'bokeh' ? 1 : .55 + .45*Math.sin(t*p.tw + p.ph*3));
      // v1.8.1 柔光：汇聚时粒子越靠近汇聚点越透明（被吸收），整体亮度设上限，避免叠加成白斑
      if(mode.gather > .01){ const dg = Math.hypot(x - gx, y - gy), f = SB.clamp((dg - 40)/120, 0, 1);
        a *= 1 - mode.gather*(1 - f*f*(3 - 2*f)); a *= 1 - .4*mode.gather; }
      if(mode.warp > .01 || mode.burst > .01){ const dc = Math.hypot(x - cx, y - cy); a *= SB.clamp((dc - 60)/140, 0, 1)*.7 + .3*(1 - Math.max(mode.warp, mode.burst)); }
      ctx.globalAlpha = SB.clamp(a, 0, 1);
      if(mode.warp > .05 && p.kind !== 'bokeh'){
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx,dy) + 1, L = 8 + d*.14*mode.warp;
        if(d > 120){ ctx.strokeStyle = sp.trail + (.3*mode.warp*SB.clamp((d - 120)/160, 0, 1)).toFixed(3) + ')'; ctx.lineWidth = p.size*.45;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dx/d*L, y - dy/d*L); ctx.stroke(); }
      }else if(p.kind === 'ember'){
        const L = 6 + p.vy*.5;
        const gr = ctx.createLinearGradient(x, y, x - Math.cos(p.ph)*p.sway*.15, y + L);
        gr.addColorStop(0, sp.trail + '.55)'); gr.addColorStop(1, sp.trail + '0)');
        ctx.strokeStyle = gr; ctx.lineWidth = p.size*.55;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(p.ph)*p.sway*.15, y + L); ctx.stroke();
      }
      const s = p.size*2;
      ctx.drawImage(sp[p.kind], x - s/2, y - s/2, s, s);
    }

    /* 星芒：偶尔闪现 */
    if(SB.perf.level !== 'reduced' && glints.length < (SB.perf.level === 'high' ? 9 : 5) && Math.random() < dt*2.2){
      glints.push({ x:Math.random()*W, y:Math.random()*H*.9, life:0, max:1.6 + Math.random()*1.8, s:14 + Math.random()*26, rot:Math.random()*.8, vr:(Math.random()-.5)*.6, front:Math.random() < .4 });
    }
    for(let i = glints.length - 1; i >= 0; i--){
      const g = glints[i]; g.life += dt; g.rot += g.vr*dt;
      if(g.life > g.max){ glints.splice(i,1); continue; }
      const k = g.life/g.max, a = Math.sin(k*Math.PI), ctx = g.front ? fctx : bctx;
      ctx.globalAlpha = a*.9;
      ctx.save(); ctx.translate(g.x - mouse.x*10, g.y - mouse.y*8); ctx.rotate(g.rot);
      const s = g.s*(.6 + .4*a); ctx.drawImage(sp.glint, -s, -s, s*2, s*2); ctx.restore();
    }

    /* 环绕光带 */
    orbit.k = SB.lerp(orbit.k, orbit.on ? 1 : 0, Math.min(1, dt*1.4));
    if(orbit.k > .01 && orbitPts.length){
      const ct = Math.cos(orbit.tilt), st = Math.sin(orbit.tilt);
      for(const o of orbitPts){
        o.a += orbit.speed*o.s*orbit.boost*dt;
        const ex = Math.cos(o.a)*orbit.rx*o.r, ey = Math.sin(o.a)*orbit.ry*o.r + o.h*orbit.ry;
        const x = orbit.cx + ex*ct - ey*st, y = orbit.cy + ex*st + ey*ct;
        const depth = Math.sin(o.a), isFront = depth > 0;
        const ctx = isFront ? fctx : bctx;
        const a = orbit.k*(isFront ? .55 + .45*depth : .25 + .25*(1+depth))*(.6 + .4*Math.sin(t*2 + o.tw))*(1 - .75*mode.gather);
        const s = o.size*(isFront ? 1 + depth*.7 : .7)*(o.big ? 2.4 : 1)*2;
        ctx.globalAlpha = SB.clamp(a, 0, 1);
        ctx.drawImage(o.big ? sp.glint : sp.dust, x - s/2, y - s/2, s, s);
      }
    }

    /* 鼠标魔法轨迹 */
    for(let i = wand.length - 1; i >= 0; i--){
      const w = wand[i]; w.life += dt;
      if(w.life > w.max){ wand.splice(i,1); continue; }
      w.x += w.vx*dt; w.y += w.vy*dt; w.vx *= .97;
      const a = 1 - w.life/w.max;
      fctx.globalAlpha = a; const s = w.s*2*(.5 + a*.5);
      fctx.drawImage(sp.ember, w.x - s/2, w.y - s/2, s, s);
    }

    bctx.globalAlpha = fctx.globalAlpha = 1;
    bctx.globalCompositeOperation = fctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  fx.start = () => { makeSprites(); resize(); addEventListener('resize', resize); last = performance.now(); requestAnimationFrame(frame); };
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ running = false; }
    else if(!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
})(window.SB);
</script>

<style>

<script>
/* 依据 prompts/00-gate.md（v1.8.1）：只替换 Scene Runtime 的 cover / reveal 视觉，不改变 prepare → swap(await enter → nextPaint) → reveal 事务。
   曝光规则：全屏遮罩只用深色；亮色只是局部光源；叠加层 alpha ≤ .55；汇聚粒子随距离淡出。 */
(function(SB){
  const cv = document.getElementById('sb-magic-gate'), g = cv.getContext('2d');
  const TAU = Math.PI*2;
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const sine = k => -(Math.cos(Math.PI*k) - 1)/2;              // easeInOutSine：柔和起止
  const eOut3 = k => 1 - Math.pow(1 - k, 3), eOut5 = k => 1 - Math.pow(1 - k, 5), eIn2 = k => k*k;
  const rnd = (a, b) => a + Math.random()*(b - a);
  const NIGHT = '7,9,28';
  function sprite(r, stops){ const c = document.createElement('canvas'); c.width = c.height = r*2; const x = c.getContext('2d'), gr = x.createRadialGradient(r,r,0,r,r,r);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); x.fillStyle = gr; x.fillRect(0, 0, r*2, r*2); return c; }
  // 柔光精灵：中心不纯白（峰值暖象牙色 .7），避免过曝
  const GLOW = sprite(64, [[0,'rgba(255,232,196,.72)'],[.22,'rgba(244,196,120,.42)'],[.55,'rgba(214,150,70,.14)'],[1,'rgba(214,150,70,0)']]);
  const COOL = sprite(64, [[0,'rgba(220,234,255,.6)'],[.25,'rgba(150,180,240,.3)'],[.6,'rgba(90,120,200,.08)'],[1,'rgba(90,120,200,0)']]);
  const SPARK = sprite(12, [[0,'rgba(255,240,210,.95)'],[.3,'rgba(240,190,110,.6)'],[1,'rgba(0,0,0,0)']]);
  const SILVER = sprite(12, [[0,'rgba(236,244,255,.9)'],[.35,'rgba(170,196,240,.5)'],[1,'rgba(0,0,0,0)']]);
  const VAPOR = (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d');
    for(let i = 0; i < 11; i++){ const px = 80 + rnd(-34, 34), py = 80 + rnd(-34, 34), r = rnd(26, 52), gr = x.createRadialGradient(px,py,0,px,py,r);
      gr.addColorStop(0,'rgba(232,180,110,.24)'); gr.addColorStop(.55,'rgba(200,140,80,.08)'); gr.addColorStop(1,'rgba(200,140,80,0)'); x.fillStyle = gr; x.fillRect(0,0,160,160); }
    return c; })();

  const G = { on:false, raf:0, mode:'', kind:'', t0:0, D:0, last:0, W:0, H:0, dpr:1, cx:0, cy:0, R:0, m:0,
    done:null, safety:0, bg:null, strands:[], comets:[], vapor:[], blobs:[], wisps:[], dust:[], sparks:[], P:null, holdT:0 };
  const lowTier = () => SB.perf.level !== 'high';

  function size(){
    G.dpr = Math.min(devicePixelRatio || 1, lowTier() ? 1 : 1.5);
    G.W = innerWidth; G.H = innerHeight; G.m = Math.min(G.W, G.H);
    cv.width = Math.round(G.W*G.dpr); cv.height = Math.round(G.H*G.dpr);
  }
  function origin(at){
    G.cx = at?.x ?? G.W/2; G.cy = at?.y ?? G.H/2;
    G.R = Math.hypot(Math.max(G.cx, G.W - G.cx), Math.max(G.cy, G.H - G.cy));
  }
  function show(){ if(!G.on){ size(); cv.classList.add('on'); G.on = true; G.last = performance.now(); } if(!G.raf) G.raf = requestAnimationFrame(frame); }
  function hide(){
    G.on = false; G.mode = ''; G.P = null; G.sparks.length = 0; G.dust.length = 0;
    if(G.raf) cancelAnimationFrame(G.raf); G.raf = 0; clearTimeout(G.safety);
    g.setTransform(1,0,0,1,0,0); g.clearRect(0, 0, cv.width, cv.height); cv.classList.remove('on');
  }
  function settle(){ const d = G.done; G.done = null; d?.(); }

  /* 每种门的底色：一次绘制到半分辨率离屏画布 */
  function buildBg(kind){
    const s = .5, c = G.bg || document.createElement('canvas');
    c.width = Math.max(2, Math.round(G.W*s)); c.height = Math.max(2, Math.round(G.H*s));
    const x = c.getContext('2d'), X = G.cx*s, Y = G.cy*s, R = G.R*s*1.05;
    let gr;
    if(kind === 'portkey'){ gr = x.createRadialGradient(X, Y, 0, X, Y, R);
      gr.addColorStop(0,'#3a2a3e'); gr.addColorStop(.28,'#241d3c'); gr.addColorStop(.62,'#141530'); gr.addColorStop(1,'#08091c'); }
    else if(kind === 'pensieve'){ gr = x.createRadialGradient(X, Y, 0, X, Y, R);
      gr.addColorStop(0,'#16284f'); gr.addColorStop(.45,'#0c1834'); gr.addColorStop(1,'#050914'); }
    else if(kind === 'quill'){ gr = x.createLinearGradient(0, 0, c.width, c.height);
      gr.addColorStop(0,'#14163a'); gr.addColorStop(.55,'#0d0f2a'); gr.addColorStop(1,'#08091c'); }
    else { gr = `rgb(${NIGHT})`; }
    x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
    if(kind === 'quill' || kind === 'pensieve'){
      // 极淡的纸纹 / 水纹：低频噪点
      const n = kind === 'quill' ? 900 : 500;
      for(let i = 0; i < n; i++){ x.fillStyle = kind === 'quill' ? `rgba(255,230,190,${rnd(.008,.03)})` : `rgba(170,200,255,${rnd(.01,.035)})`;
        const r = rnd(1, kind === 'quill' ? 6 : 14); x.beginPath(); x.arc(rnd(0, c.width), rnd(0, c.height), r, 0, TAU); x.fill(); }
    }
    G.bg = c;
  }
  function seed(kind){
    const lo = lowTier();
    G.strands = kind === 'portkey' ? Array.from({length: lo ? 12 : 24}, () => ({ a:rnd(0, TAU), r0:G.R*rnd(.65, 1.1), d:rnd(0, .3), w:rnd(.8, 1.5), sp:rnd(.85, 1.15), f:rnd(.55, 1) })) : [];
    G.comets = kind === 'nox' ? Array.from({length: lo ? 12 : 26}, () => ({ a:rnd(0, TAU), r0:G.R*rnd(.55, 1.05), d:rnd(0, .3), curl:rnd(.5, 1.1)*(Math.random() < .5 ? -1 : 1), s:rnd(.7, 1.2), f:rnd(.6, 1) })) : [];
    G.vapor = kind === 'portkey' ? Array.from({length: lo ? 4 : 6}, (_, i) => ({ a:i/(lo ? 4 : 6)*TAU + rnd(-.3, .3), s:rnd(.3, .52), rot:rnd(0, TAU), vr:rnd(-.4, .4) })) : [];
    G.blobs = Array.from({length: lo ? 5 : 7}, (_, i) => ({ a:i/(lo ? 5 : 7)*TAU + rnd(-.35, .35), o:rnd(.7, .86), s:rnd(.2, .3) }));
    G.wisps = kind === 'pensieve' ? Array.from({length: lo ? 4 : 6}, (_, i) => ({ a:i/(lo ? 4 : 6)*TAU + rnd(-.4, .4), r:G.m*rnd(.14, .36), span:rnd(1.1, 2.1), w:rnd(.8, 1.4), sp:rnd(.7, 1.2)*(i % 2 ? 1 : -1), ph:rnd(0, TAU) })) : [];
    G.dust.length = 0;
  }

  /* 旋转的符文刻度环 */
  function runeRing(x, y, r, rot, alpha, color, lw){
    if(alpha <= .01 || r < 2) return;
    g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.fillStyle = color; g.lineWidth = lw;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
    g.beginPath(); g.arc(x, y, r + Math.max(4, r*.06), 0, TAU); g.lineWidth = lw*.55; g.stroke();
    const n = r < 40 ? 24 : r < 160 ? 48 : 72, inner = Math.max(3, r*.04);
    g.lineWidth = lw*.65; g.beginPath();
    for(let i = 0; i < n; i++){ const a = rot + i/n*TAU, l = i % 6 === 0 ? inner*1.9 : inner;
      g.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r); g.lineTo(x + Math.cos(a)*(r - l), y + Math.sin(a)*(r - l)); }
    g.stroke();
    const dd = Math.max(2.5, r*.04);
    for(let i = 0; i < 4; i++){ const a = -rot*1.3 + i*TAU/4 + Math.PI/4, px = x + Math.cos(a)*(r + dd*.6), py = y + Math.sin(a)*(r + dd*.6);
      g.beginPath(); g.moveTo(px + Math.cos(a)*dd, py + Math.sin(a)*dd); g.lineTo(px + Math.cos(a + 1.57)*dd*.55, py + Math.sin(a + 1.57)*dd*.55);
      g.lineTo(px - Math.cos(a)*dd, py - Math.sin(a)*dd); g.lineTo(px - Math.cos(a + 1.57)*dd*.55, py - Math.sin(a + 1.57)*dd*.55); g.closePath(); g.fill(); }
    g.restore();
  }
  function glowAt(img, x, y, r, a){ if(a <= .01 || r < 1) return; g.globalAlpha = Math.min(a, .85); g.drawImage(img, x - r, y - r, r*2, r*2); g.globalAlpha = 1; }
  /* 在底色上挖一个羽化的圆洞（可带不规则小圆） */
  function hole(r, irregular, feather = .55){
    if(r < 1) return;
    g.globalCompositeOperation = 'destination-out';
    const cut = (x, y, rr) => { const m = g.createRadialGradient(x, y, rr*feather, x, y, rr); m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = m; g.fillRect(x - rr, y - rr, rr*2, rr*2); };
    cut(G.cx, G.cy, r);
    if(irregular) for(const b of G.blobs) cut(G.cx + Math.cos(b.a)*r*b.o, G.cy + Math.sin(b.a)*r*b.o, r*b.s + 2);
    g.globalCompositeOperation = 'source-over';
  }
  /* 只在一个羽化圆内显示底色（用于从点向外扩张的遮罩） */
  function bgDisc(r, feather = .6){
    if(r < 1) return;
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    g.globalCompositeOperation = 'destination-in';
    const m = g.createRadialGradient(G.cx, G.cy, r*feather, G.cx, G.cy, r); m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = m; g.fillRect(0, 0, G.W, G.H);
    g.globalCompositeOperation = 'source-over';
  }

  /* ── 门钥匙 · 暮色漩涡 ── */
  function drawStrands(k, outward, t){
    const lo = lowTier(), core = G.m*.12;
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(const s of G.strands){
      const p = outward ? clamp(k*1.05 - s.d*.2) : clamp((k - s.d)/(1 - s.d));
      if(p <= 0) continue;
      const pts = [];
      for(let j = 0; j < 14; j++){
        const q = p - j*.045; if(q < 0) break;
        const e = sine(q);
        const r = outward ? core*.6 + e*s.r0*1.1 : s.r0*(1 - e*.9) + core*.25;
        const th = s.a + (outward ? -1 : 1)*s.sp*(outward ? 1.6*e : 2.4*e) + t*.00008;
        pts.push([G.cx + Math.cos(th)*r, G.cy + Math.sin(th)*r, r]);
      }
      if(pts.length < 2) continue;
      // 越靠近中心越淡：被光门吸收，而不是堆成白斑
      const near = clamp((pts[0][2] - core*.4)/(core*1.4));
      const a = (outward ? (1 - p)*.45 : (.18 + .32*p))*s.f*(outward ? 1 : near);
      if(a < .01) continue;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(let j = 1; j < pts.length; j++) g.lineTo(pts[j][0], pts[j][1]);
      if(!lo){ g.strokeStyle = `rgba(214,150,80,${(a*.22).toFixed(3)})`; g.lineWidth = 4*s.w; g.stroke(); }
      g.strokeStyle = `rgba(246,214,160,${a.toFixed(3)})`; g.lineWidth = 1*s.w; g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }
  function drawVapor(k, t, outward){
    g.globalCompositeOperation = 'lighter';
    for(const v of G.vapor){
      const rr = outward ? G.R*(.1 + .8*sine(k)) : G.R*(.12 + .5*Math.pow(1 - sine(k), 1.2));
      const a = v.a + t*.00035 + (outward ? -.6*k : 1.1*k);
      const s = G.R*v.s;
      g.save(); g.globalAlpha = outward ? .28*(1 - k) : .1 + .18*sine(k);
      g.translate(G.cx + Math.cos(a)*rr, G.cy + Math.sin(a)*rr); g.rotate(v.rot + t*.0002*v.vr); g.drawImage(VAPOR, -s, -s, s*2, s*2); g.restore();
    }
    g.globalCompositeOperation = 'source-over';
  }
  function gateLight(scale, a, t){
    // 中心柔和琥珀光门（峰值亮度约 60%）
    const r = G.m*.2*scale*(1 + .03*Math.sin(t*.003));
    g.globalCompositeOperation = 'lighter'; glowAt(GLOW, G.cx, G.cy, r, .55*a); glowAt(GLOW, G.cx, G.cy, r*.45, .35*a); g.globalCompositeOperation = 'source-over';
  }
  function portkeyCover(k, t){
    const e = sine(k);
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    hole(G.R*1.25*(1 - e), false, .45);
    drawVapor(k, t, false);
    drawStrands(k, false, t);
    gateLight(.4 + .6*e, .35 + .65*e, t);
  }
  function portkeyHold(t){
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    drawVapor(1, t, false);
    const h = clamp(G.holdT/500);
    runeRing(G.cx, G.cy, G.m*.17, t*.00025, .32*h, 'rgba(232,196,130,1)', 1.1);
    runeRing(G.cx, G.cy, G.m*.11, -t*.0004, .22*h, 'rgba(232,196,130,1)', .8);
    gateLight(1, 1, t);
  }
  function portkeyReveal(k, t){
    const e = sine(k);
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    hole(G.R*1.2*e + G.m*.12*(1 - e)*clamp(k*6), true, .5);
    drawVapor(k, t, true);
    drawStrands(k, true, t);
    gateLight(1 + 1.5*e, 1 - e, t);
  }

  /* ── 熄灯器 / 荧光闪烁 ── */
  function nightClose(a){
    if(a <= 0){ g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H); return; }
    const m = g.createRadialGradient(G.cx, G.cy, a*.55, G.cx, G.cy, a + G.R*.22);
    m.addColorStop(0, `rgba(${NIGHT},0)`); m.addColorStop(1, `rgba(${NIGHT},1)`);
    g.fillStyle = m; g.fillRect(0, 0, G.W, G.H);
  }
  function drawComets(k, outward){
    const core = G.m*.1;
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(const c of G.comets){
      const u = outward ? clamp(k*1.05 - c.d*.3) : clamp((k - c.d)/(.88 - c.d));
      if(u <= 0 || (!outward && u >= 1)) continue;
      const pos = q => { const e = sine(q); const r = outward ? core*.5 + e*c.r0*1.1 : c.r0*Math.pow(1 - e, 1.3);
        const th = c.a + c.curl*(outward ? -e : e); return [G.cx + Math.cos(th)*r, G.cy + Math.sin(th)*r, r]; };
      const head = pos(u);
      const near = outward ? 1 : clamp((head[2] - core*.3)/core);
      const a = (outward ? (1 - u)*.5 : (.25 + .3*u))*c.f*near;
      if(a < .01) continue;
      g.beginPath(); g.moveTo(head[0], head[1]);
      for(let j = 1; j < 9; j++){ const q = u - j*.03; if(q < 0) break; const p = pos(q); g.lineTo(p[0], p[1]); }
      g.strokeStyle = `rgba(246,214,160,${(a*.8).toFixed(3)})`; g.lineWidth = 1.3*c.s; g.stroke();
      const sz = 10*c.s; g.globalAlpha = clamp(a*1.4, 0, .7); g.drawImage(SPARK, head[0] - sz/2, head[1] - sz/2, sz, sz); g.globalAlpha = 1;
    }
    g.globalCompositeOperation = 'source-over';
  }
  function noxCover(k){
    const e = sine(k);
    nightClose(G.R*1.15*(1 - e) - G.R*.04*k);
    if(k > .86){ g.fillStyle = `rgba(${NIGHT},${clamp((k - .86)/.14).toFixed(3)})`; g.fillRect(0, 0, G.W, G.H); }
    drawComets(k, false);
    const out = clamp((k - .72)/.28);
    g.globalCompositeOperation = 'lighter'; glowAt(GLOW, G.cx, G.cy, G.m*(.05 + .02*e)*(1 - out*.6), .45*(1 - out)); g.globalCompositeOperation = 'source-over';
  }
  function noxHold(t){
    g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H);
    g.globalCompositeOperation = 'lighter'; glowAt(GLOW, G.cx, G.cy, 12 + 3*Math.sin(t*.004), .14 + .08*Math.sin(t*.004)); g.globalCompositeOperation = 'source-over';
  }
  function noxReveal(k){
    const lum = clamp(k/.28), push = clamp((k - .14)/.86), h = G.R*1.2*sine(push);
    g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H);
    hole(h, false, .45);
    drawComets(push, true);
    const fl = sine(lum)*(1 - clamp((k - .4)/.5));
    g.globalCompositeOperation = 'lighter'; glowAt(GLOW, G.cx, G.cy, G.m*(.04 + .06*sine(lum)), .7*fl); g.globalCompositeOperation = 'source-over';
  }

  /* ── 墨金书页（从右向左翻过） ── */
  function pageEdge(front, t){
    // 返回前缘曲线上的点（书页轻微弯曲）
    const pts = [], n = 18, bulge = G.W*.05;
    for(let i = 0; i <= n; i++){ const y = i/n*G.H; pts.push([front + Math.sin(i/n*Math.PI)*bulge + Math.sin(t*.002 + i*.5)*1.2, y]); }
    return pts;
  }
  function quillPage(front, coverRight, t){
    // coverRight = true：书页覆盖前缘右侧（翻入）；false：覆盖左侧（翻出）
    const pts = pageEdge(front, t);
    // 投在场景上的阴影（前缘外侧 40px）
    g.save();
    const dir = coverRight ? -1 : 1;
    const sh = g.createLinearGradient(front, 0, front + dir*48, 0);
    sh.addColorStop(0,'rgba(0,0,0,.38)'); sh.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = sh; g.beginPath(); g.moveTo(pts[0][0], 0);
    for(const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(pts[pts.length - 1][0] + dir*60, G.H); g.lineTo(pts[0][0] + dir*60, 0); g.closePath(); g.fill();
    // 书页本体
    g.beginPath(); g.moveTo(pts[0][0], 0); for(const p of pts) g.lineTo(p[0], p[1]);
    if(coverRight){ g.lineTo(G.W + 4, G.H); g.lineTo(G.W + 4, 0); } else { g.lineTo(-4, G.H); g.lineTo(-4, 0); }
    g.closePath(); g.clip(); g.drawImage(G.bg, 0, 0, G.W, G.H);
    // 前缘内侧一道纸页卷曲的高光
    const hl = g.createLinearGradient(front, 0, front - dir*70, 0);
    hl.addColorStop(0,'rgba(255,226,170,.10)'); hl.addColorStop(1,'rgba(255,226,170,0)');
    g.fillStyle = hl; g.fillRect(0, 0, G.W, G.H);
    g.restore();
    // 香槟金书边光
    g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(const p of pts) g.lineTo(p[0], p[1]);
    if(!lowTier()){ g.strokeStyle = 'rgba(214,170,100,.12)'; g.lineWidth = 18; g.stroke(); }
    g.strokeStyle = 'rgba(214,170,100,.22)'; g.lineWidth = 6; g.stroke();
    g.strokeStyle = 'rgba(246,222,170,.6)'; g.lineWidth = 1.6; g.stroke();
    g.globalCompositeOperation = 'source-over';
    return pts;
  }
  function quillDust(pts, dt, rate){
    if(pts && rate){ G.dacc = (G.dacc || 0) + dt*rate; while(G.dacc > 1){ G.dacc--; const p = pts[(Math.random()*pts.length)|0];
      G.dust.push({x:p[0] + rnd(-6, 6), y:p[1], vx:rnd(-14, -2), vy:rnd(6, 26), life:rnd(1, 1.8), age:0, s:rnd(3, 6)}); } }
    g.globalCompositeOperation = 'lighter';
    for(let i = G.dust.length - 1; i >= 0; i--){ const d = G.dust[i]; d.age += dt; if(d.age > d.life){ G.dust.splice(i, 1); continue; }
      d.x += d.vx*dt; d.y += d.vy*dt; g.globalAlpha = .55*Math.sin(Math.PI*d.age/d.life); g.drawImage(SPARK, d.x - d.s/2, d.y - d.s/2, d.s, d.s); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  function quillCover(k, t, dt){ const front = G.W*(1.04 - 1.16*sine(k)); quillDust(quillPage(front, true, t), dt, lowTier() ? 14 : 30); }
  function quillHold(t, dt){ g.drawImage(G.bg, 0, 0, G.W, G.H); quillDust(null, dt, 0);
    const h = clamp(G.holdT/500); runeRing(G.W/2, G.H/2, G.m*.12, t*.0002, .16*h, 'rgba(214,184,130,1)', .9); }
  function quillReveal(k, t, dt){ const front = G.W*(1.04 - 1.16*sine(k)); quillDust(quillPage(front, false, t), dt, lowTier() ? 10 : 22); }

  /* ── 冥想盆（银蓝涟漪 + 记忆丝缕） ── */
  function ripples(t0k, k, maxR, alpha){
    g.globalCompositeOperation = 'lighter';
    for(let i = 0; i < 5; i++){
      const p = clamp((k - t0k - i*.13)/.62); if(p <= 0 || p >= 1) continue;
      const r = 6 + maxR*eOut3(p), a = alpha*(1 - p);
      g.beginPath(); g.arc(G.cx, G.cy, r, 0, TAU);
      if(!lowTier()){ g.strokeStyle = `rgba(150,180,240,${(a*.18).toFixed(3)})`; g.lineWidth = 7; g.stroke(); }
      g.strokeStyle = `rgba(214,228,255,${a.toFixed(3)})`; g.lineWidth = 1.2; g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }
  function wisps(a, t, spread){
    if(a <= .01) return;
    g.save(); g.translate(G.cx, G.cy); g.rotate(Math.sin(t/2400*TAU)*.026);   // 记忆「透过水看」：缓慢左右倾斜
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(const w of G.wisps){
      const r = w.r*(1 + spread*1.6), a0 = w.a + t*.00022*w.sp;
      g.beginPath();
      for(let j = 0; j <= 20; j++){ const q = j/20, th = a0 + w.span*q, rr = r*(1 + .18*Math.sin(q*Math.PI*2 + w.ph + t*.0007));
        const x = Math.cos(th)*rr, y = Math.sin(th)*rr*.82; j ? g.lineTo(x, y) : g.moveTo(x, y); }
      if(!lowTier()){ g.strokeStyle = `rgba(150,180,240,${(a*.12).toFixed(3)})`; g.lineWidth = 6*w.w; g.stroke(); }
      g.strokeStyle = `rgba(220,232,255,${(a*.4).toFixed(3)})`; g.lineWidth = w.w; g.stroke();
    }
    g.restore();
  }
  function pensieveCover(k, t){
    const e = sine(k);
    bgDisc(G.R*1.3*e + 2, .5);
    if(k > .84){ g.globalAlpha = clamp((k - .84)/.16); g.drawImage(G.bg, 0, 0, G.W, G.H); g.globalAlpha = 1; }
    ripples(0, k, G.R*.9, .45);
    wisps(.9*e, t, 0);
    g.globalCompositeOperation = 'lighter'; glowAt(COOL, G.cx, G.cy, G.m*.14, .35*e); g.globalCompositeOperation = 'source-over';
  }
  function pensieveHold(t){
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    const k = (G.holdT % 2600)/2600; ripples(0, k*1.1, G.m*.5, .25);
    wisps(.9, t, 0);
    g.globalCompositeOperation = 'lighter'; glowAt(COOL, G.cx, G.cy, G.m*.14, .35); g.globalCompositeOperation = 'source-over';
  }
  function pensieveReveal(k, t){
    const e = sine(k);
    g.drawImage(G.bg, 0, 0, G.W, G.H);
    hole(G.R*1.2*e, true, .5);
    ripples(-.05, k, G.R*1.1, .4*(1 - e));
    wisps(.9*(1 - e), t, e);
    g.globalCompositeOperation = 'lighter'; glowAt(COOL, G.cx, G.cy, G.m*(.14 + .2*e), .35*(1 - e)); g.globalCompositeOperation = 'source-over';
  }

  /* ── 幻影显形（装饰 Scene Runtime 的圆形揭示） ── */
  function portalDraw(t, dt){
    const P = G.P; if(!P) return;
    const lo = lowTier();
    if(P.phase === 'prep'){
      const b = .5 + .5*Math.sin(t*.005);
      g.globalCompositeOperation = 'lighter'; glowAt(GLOW, P.x, P.y, 40 + 8*b, .22 + .14*b); g.globalCompositeOperation = 'source-over';
      runeRing(P.x, P.y, 18 + 2*b, t*.0015, .75, 'rgba(240,214,160,1)', 1.1);
      return;
    }
    const r = Math.max(20, P.r), k = P.k, a = Math.pow(1 - k, .9);
    g.globalCompositeOperation = 'lighter';
    const m = g.createRadialGradient(P.x, P.y, Math.max(0, r - 6), P.x, P.y, r + 70);
    m.addColorStop(0,'rgba(232,186,120,0)'); m.addColorStop(.1, `rgba(232,186,120,${(.26*a).toFixed(3)})`); m.addColorStop(1,'rgba(214,150,80,0)');
    g.fillStyle = m; g.beginPath(); g.arc(P.x, P.y, r + 70, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
    runeRing(P.x, P.y, r, k*.7 + t*.00025, .7*a, 'rgba(240,218,170,1)', 1.2);
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(let i = 0; i < 3; i++){
      const a0 = i/3*TAU + t*.0016 + k*1.1, span = 1.1, rr = r + 5 + 7*Math.sin(t*.003 + i);
      g.beginPath();
      for(let j = 0; j <= 16; j++){ const q = j/16, th = a0 + span*q, rq = rr + 8*Math.sin(q*Math.PI); const px = P.x + Math.cos(th)*rq, py = P.y + Math.sin(th)*rq; j ? g.lineTo(px, py) : g.moveTo(px, py); }
      if(!lo){ g.strokeStyle = `rgba(214,160,90,${(.16*a).toFixed(3)})`; g.lineWidth = 4; g.stroke(); }
      g.strokeStyle = `rgba(246,224,180,${(.6*a).toFixed(3)})`; g.lineWidth = 1.1; g.stroke();

    if(k < .85){ P.acc += dt*(lo ? 18 : 40); while(P.acc > 1){ P.acc--; const th = rnd(0, TAU), sp = rnd(30, 80);
      G.sparks.push({x:P.x + Math.cos(th)*r, y:P.y + Math.sin(th)*r, vx:Math.cos(th)*sp, vy:Math.sin(th)*sp, life:rnd(.6, 1.1), age:0, s:rnd(3.5, 7)}); } }
  }
  function sparksStep(dt){
    if(!G.sparks.length) return;
    g.globalCompositeOperation = 'lighter';
    for(let i = G.sparks.length - 1; i >= 0; i--){ const s = G.sparks[i]; s.age += dt; if(s.age > s.life){ G.sparks.splice(i, 1); continue; }
      s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= .97; s.vy *= .97;
      g.globalAlpha = .7*(1 - s.age/s.life); g.drawImage(SPARK, s.x - s.s/2, s.y - s.s/2, s.s, s.s); }

    portkey:{ cover:portkeyCover, hold:portkeyHold, reveal:portkeyReveal },
    nox:{ cover:(k) => noxCover(k), hold:noxHold, reveal:(k) => noxReveal(k) },
    quill:{ cover:quillCover, hold:quillHold, reveal:quillReveal },
    pensieve:{ cover:pensieveCover, hold:pensieveHold, reveal:pensieveReveal }
  };

    else if(G.mode === 'hold'){ G.holdT += dt*1000; D.hold(now, dt); }

      G.done = res;

  const DUR = { portkey:{cover:[950, 700], reveal:[1050, 750]}, nox:{cover:[720, 520], reveal:[820, 600]},
    quill:{cover:[700, 520], reveal:[800, 580]}, pensieve:{cover:[850, 600], reveal:[950, 680]} };
  const KINDS = Object.keys(DUR);
  const norm = kind => KINDS.includes(kind) ? kind : 'nox';
  const dur = (kind, ph) => DUR[kind][ph][lowTier() ? 1 : 0];

  SB.gate = {
    kinds:KINDS,
    has:kind => KINDS.includes(kind),
    portalDuration:() => lowTier() ? 620 : 860,
    cover(kind = 'portkey', at){
      kind = norm(kind);
      size(); origin(at); seed(kind); buildBg(kind);
      G.P = null; G.sparks.length = 0;
      return run('cover', kind, dur(kind, 'cover'));
    },
    reveal(kind = 'portkey', at){
      kind = norm(kind);
      if(G.kind !== kind || !G.on){ size(); origin(at); buildBg(kind); }
      seed(kind);
      return run('reveal', kind, dur(kind, 'reveal'));
    },
    portalStart(x, y){ settle(); size(); G.mode = 'portal'; G.kind = 'portal'; G.D = 0; G.P = {x, y, r:0, k:0, phase:'prep', acc:0}; G.sparks.length = 0; show(); },

    portalEnd(){ if(G.mode !== 'portal') return; G.P = null; G.mode = 'portal-end'; if(!G.sparks.length) hide(); },
    abort(){ settle(); hide(); },
    get active(){ return G.on; }
  };

<script>
(function(SB){
  const ICONS = {
    book:'<svg viewBox="0 0 24 24"><path d="M4 4.5h7a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H4z M20 4.5h-7 M20 4.5V18h-7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="10" r="1.6" fill="currentColor"/></svg>',

    compass:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 5l2.2 7L12 19l-2.2-7z" fill="currentColor"/></svg>',
    scroll:'<svg viewBox="0 0 24 24"><path d="M7 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1z M7 16V4 M10 9h5M10 12h5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    note:'<svg viewBox="0 0 24 24"><path d="M9 17V6l10-2v11" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="17" r="2.2" fill="currentColor"/><circle cx="17" cy="15" r="2.2" fill="currentColor"/></svg>',
    spark:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 6.2L20 12l-6.2 1.8L12 20l-1.8-6.2L4 12l6.2-2.8z" fill="currentColor"/></svg>'
  };
  const items = [];
  const nav = document.getElementById('sb-nav'), btn = document.getElementById('sb-nav-btn'), list = document.getElementById('sb-menu-list');
  const backBtn = document.getElementById('sb-back'), crumbs = document.getElementById('sb-crumbs');
  document.getElementById('sb-menu-corners').innerHTML = SB.ui.corners();

  const menu = SB.menu = {
    icons: ICONS,
    add(item){ items.push(item); items.sort((a,b)=>(a.order||0)-(b.order||0)); if(menu._ready) render(); },
    update(id, patch){ const it = items.find(i=>i.id===id); if(it){ Object.assign(it, patch); if(menu._ready) render(); } },
    open(){ SB.dock?.close?.(); render(); nav.classList.add('open'); btn.setAttribute('aria-expanded','true'); },
    close(){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); },
    toggle(){ nav.classList.contains('open') ? menu.close() : menu.open(); },
    status(text){ document.getElementById('sb-status').textContent = text || ''; },
    refresh(){ if(nav.classList.contains('open')) render(); },
    _ready:false
  };

  function renderCrumbs(){
    const path = SB.scenes.path();
    crumbs.innerHTML = '';
    crumbs.hidden = path.length < 2;
    path.forEach((p, i) => {
      if(i) { const s = SB.el('i', '', SB.icon('chevron')); crumbs.appendChild(s); }
      const b = SB.el('button', i === path.length-1 ? 'cur' : ''); b.type = 'button'; b.textContent = p.label;
      b.addEventListener('click', () => { if(i < path.length-1) SB.scenes.go(p.id, p.params, {transition:'veil'}); else menu.close(); });
      crumbs.appendChild(b);
    });
  }
  function render(){
    renderCrumbs();
    list.innerHTML = '';
    for(const it of items){
      if(it.hidden?.()) continue;
      if(it.divider){ const li = SB.el('li','sb-divider'); li.setAttribute('aria-hidden','true'); list.appendChild(li); continue; }
      const li = SB.el('li');
      const b = SB.el('button'); b.type = 'button'; b.setAttribute('role','menuitem');
      const cur = typeof it.current === 'function' ? it.current() : (it.scene && it.scene === SB.scenes.current);
      b.className = 'sb-mi' + (cur ? ' is-current' : '') + (it.off?.() ? ' off' : '');
      b.innerHTML = `<span class="ic">${ICONS[it.icon]||ICONS.spark}</span><span class="tx"><span class="nm"></span><span class="ds"></span></span><span class="tag"></span>`;
      b.querySelector('.nm').textContent = typeof it.label === 'function' ? it.label() : it.label;
      b.querySelector('.ds').textContent = typeof it.desc === 'function' ? it.desc() : (it.desc || '');
      b.querySelector('.tag').innerHTML = typeof it.tag === 'function' ? it.tag() : (it.tag || '');
      li.appendChild(b);
      let sub;
      if(it.children){
        sub = SB.el('div','sb-sub'); sub.hidden = !it._expanded;
        for(const c of (typeof it.children === 'function' ? it.children() : it.children)){
          const cb = SB.el('button'); cb.type = 'button';
          cb.innerHTML = `<span></span>${c.badge ? `<b>${SB.icon('star')}${SB.esc(c.badge)}</b>` : ''}`;
          cb.querySelector('span').textContent = c.label;
          cb.addEventListener('click', () => activate(c)); sub.appendChild(cb);
        }
        li.appendChild(sub);
      }
      b.addEventListener('click', () => {
        if(it.children){ it._expanded = !it._expanded; sub.hidden = !it._expanded; return; }
        activate(it);
      });
      list.appendChild(li);
    }
  }
  function activate(it){
    if(it.keepOpen){ it.action?.(); render(); return; }
    menu.close();
    if(it.scene) SB.scenes.go(it.scene, it.params || {}, it.sceneOpts || {});
    it.action?.();
  }

  btn.addEventListener('click', e => { e.stopPropagation(); menu.toggle(); });
  backBtn.addEventListener('click', () => SB.scenes.back());
  document.addEventListener('click', e => { if(!nav.contains(e.target)) menu.close(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') menu.close(); });
  document.addEventListener('sb:scene', e => {
    const h = SB.scenes.map[e.detail.id];
    backBtn.hidden = !h?.parent?.(e.detail.params);
    menu.refresh();
  });

  // v1.8.1：菜单只保留「世界星图」与「时光长卷」；音乐 / 动效 / 账户移到右上角 SB.dock 标识
  menu._ready = true; render();
})(window.SB);
</script>

.sb-dkp{position:absolute;top:calc(100% + 10px);right:0;width:min(320px, calc(100vw - 24px - var(--safe-l) - var(--safe-r)));
  padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);color:var(--text);
  background:radial-gradient(120% 60% at 50% 0%, rgba(244,184,96,.10), transparent 70%), var(--glass);
  box-shadow:0 0 0 4px rgba(20,11,6,.55), 0 0 0 5px rgba(244,184,96,.2), 0 18px 46px rgba(0,0,0,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform-origin:calc(100% - 18px) -8px;opacity:0;transform:scale(.9) translateY(-4px);visibility:hidden;pointer-events:none;
  transition:opacity .35s var(--ease-soft), transform .35s var(--ease-soft), visibility 0s .35s;}

html:not([data-sb-perf="high"]) .sb-dkp,html:not([data-sb-perf="high"]) .sb-dk,html:not([data-sb-perf="high"]) #sb-nav-btn,html:not([data-sb-perf="high"]) #sb-back,html:not([data-sb-perf="high"]) #sb-menu{backdrop-filter:none;-webkit-backdrop-filter:none;}
#sb-dock.open .sb-dkp{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity .35s var(--ease-soft), transform .35s var(--ease-soft), visibility 0s;}
.sb-dkp h4{margin:0 0 4px;font-size:16px;letter-spacing:.14em;color:var(--gold-hi);display:flex;align-items:center;gap:8px;}

.sb-dkp .row:first-of-type{border-top:0;}

/* 开关 */
.sb-switch{position:relative;width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;flex:none;padding:0;transition:background .3s;}
.sb-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#bfae86;transition:transform .3s var(--ease-soft), background .3s;}
.sb-switch[aria-checked="true"]{background:rgba(244,184,96,.35);}
.sb-switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--gold-hi);box-shadow:0 0 10px rgba(244,184,96,.8);}
/* 动效三档 */
.sb-tiers{display:flex;flex-direction:column;gap:6px;}
.sb-tier{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(244,184,96,.18);background:rgba(244,184,96,.03);transition:border-color .25s, background .25s;}
.sb-tier:hover{border-color:rgba(244,184,96,.45);}
.sb-tier[aria-checked="true"]{border-color:var(--gold);background:rgba(244,184,96,.12);box-shadow:0 0 14px rgba(244,184,96,.18) inset;}
.sb-tier .dot{grid-row:span 2;width:14px;height:14px;border-radius:50%;border:1px solid var(--gold-dim);justify-self:center;}

/* 放映进行中：跟随放映控件醒来 / 隐藏，并下移到「编辑 / 退出放映」下方 */
body:has(.sb-scene[data-scene="player"].showing) #sb-dock{top:calc(64px + var(--safe-t));}
body:has(.sb-scene[data-scene="player"].showing:not(.awake)) #sb-dock:not(.open){opacity:0;pointer-events:none;}
@media (max-width:480px){ #sb-dock{top:calc(14px + var(--safe-t));right:calc(10px + var(--safe-r));gap:4px;}
  .sb-dk{width:32px;height:32px;} .sb-dk::after{inset:-6px;} .sb-dk svg{width:16px;height:16px;} .sb-dk.is-home{margin-right:4px;} }
@media (max-width:360px){ .sb-dk{width:30px;height:30px;} #sb-dock{gap:3px;} }
@media (prefers-reduced-motion:reduce){ .sb-dk .eq i{animation:none;} }

<div id="sb-dock" aria-label="设置" hidden>
  <div class="sb-dkp" id="sb-dkp" role="dialog" aria-modal="false"></div>
</div>

<script>
/* ── SB.dock：右上角工具标识。各块通过 SB.dock.add({id, order, icon, label, render(panel)}) 注册；一次只展开一个面板 ── */
(function(SB){
  const dock = document.getElementById('sb-dock'), panel = document.getElementById('sb-dkp');
  const items = []; let openId = null;
  function btnOf(id){ return dock.querySelector(`.sb-dk[data-id="${id}"]`); }
  function layout(){
    dock.querySelectorAll('.sb-dk').forEach(b => b.remove());
    items.sort((a, b) => a.order - b.order).forEach(it => {
      const b = SB.el('button', 'sb-dk', it.icon + (it.eq ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' : ''));
      b.type = 'button'; b.dataset.id = it.id; b.classList.add('is-' + it.id); b.setAttribute('aria-label', it.label); b.title = it.label;
      b.setAttribute('aria-haspopup', 'dialog'); b.setAttribute('aria-expanded', 'false');
      if(it.action){ b.removeAttribute('aria-haspopup'); b.removeAttribute('aria-expanded'); b.addEventListener('click', e => { e.stopPropagation(); api.close(); it.action(); }); }
      else b.addEventListener('click', e => { e.stopPropagation(); openId === it.id ? api.close() : api.open(it.id); });
      dock.insertBefore(b, panel);
    });
    api.sync();
  }
  function render(){
    const it = items.find(x => x.id === openId); if(!it) return;
    panel.innerHTML = ''; panel.setAttribute('aria-label', it.label);
    it.render(panel);
  }
  const api = SB.dock = {
    add(it){ items.push({order:50, ...it}); layout(); },
    open(id){
      SB.menu?.close?.();
      openId = id; render(); dock.classList.add('open');
      dock.querySelectorAll('.sb-dk[aria-haspopup]').forEach(b => b.setAttribute('aria-expanded', String(b.dataset.id === id)));
      // 面板箭头对齐：面板右缘与被点的标识右缘对齐
      const b = btnOf(id), r = dock.getBoundingClientRect(), br = b.getBoundingClientRect();
      const pw = panel.offsetWidth || 320, maxRight = Math.max(0, r.right - 12 - pw);   // 不超出屏幕左缘
      panel.style.right = Math.min(Math.max(0, r.right - br.right), maxRight) + 'px';
    },
    close(){ openId = null; dock.classList.remove('open'); dock.querySelectorAll('.sb-dk[aria-haspopup]').forEach(b => b.setAttribute('aria-expanded', 'false')); },
    refresh(id){ if(openId && (!id || id === openId)) render(); api.sync(); },
    sync(){ items.forEach(it => { const b = btnOf(it.id); if(b && it.state) it.state(b); }); },
    get openId(){ return openId; }
  };
  document.addEventListener('click', e => { if(openId && !dock.contains(e.target)) api.close(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && openId){ api.close(); e.stopPropagation(); } }, true);
  document.addEventListener('sb:scene', () => { api.close(); api.sync(); });
  // 菜单打开时收起面板
  document.getElementById('sb-nav-btn')?.addEventListener('click', () => api.close());
  // 登录后才显示
  const vis = () => { dock.hidden = !SB.user?.current; };
  document.addEventListener('sb:book', vis); document.addEventListener('sb:scene', vis);
  vis();

  /* ── v1.8.2 回到魔法书：直接返回封面（熄灯器转场），在魔法书页面上自动隐藏 ── */
  api.add({id:'home', order:0, label:'回到魔法书',
    icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 17.5a2 2 0 0 1 2-2h10.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M11.2 7.6l1.2 2.4 2.4 1.2-2.4 1.2-1.2 2.4-1.2-2.4-2.4-1.2 2.4-1.2z" fill="currentColor"/></svg>',
    state(b){ b.hidden = SB.scenes.current === 'book'; },
    action(){ if(SB.scenes.current !== 'book') SB.scenes.go('book', {}, {transition:'veil'}); }});

  /* ── 动效强度 ── */
  const TIERS = [
    {lv:'high', name:'华丽', desc:'完整粒子、光效与转场'},
    {lv:'low', name:'柔和', desc:'手机与旧电脑推荐，更省电'},
    {lv:'reduced', name:'静止', desc:'几乎没有动画，直接切换页面'}
  ];
  api.add({id:'motion', order:20, label:'动效强度',
    icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 15.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M17 3.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="currentColor"/><circle cx="20" cy="12.5" r=".9" fill="currentColor"/><circle cx="11.5" cy="4.5" r=".9" fill="currentColor"/></svg>',
    render(p){
      p.innerHTML = '<h4>动效强度</h4><p class="rn">MOTUS · ARCANUM</p>';
      if(SB.perf.reduced){ const d = SB.el('p', 'sm'); d.textContent = '设备已开启「减少动态效果」，星屿之书会保持静止。可在系统设置中关闭后再选择。'; p.appendChild(d); return; }
      const box = SB.el('div', 'sb-tiers'); box.setAttribute('role', 'radiogroup'); box.setAttribute('aria-label', '动效强度');
      TIERS.forEach(t => {
        const b = SB.el('button', 'sb-tier', `<i class="dot"></i><b></b><span></span>`); b.type = 'button'; b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', String(SB.perf.level === t.lv)); b.querySelector('b').textContent = t.name; b.querySelector('span').textContent = t.desc;
        b.addEventListener('click', () => {
          if(SB.perf.level === t.lv) return;
          SB.perf.level = t.lv; document.documentElement.dataset.sbPerf = t.lv;
          try{ localStorage.setItem('sb-motion', t.lv); }catch(e){}
          SB.fx.refresh(); document.dispatchEvent(new Event('sb:perf'));
          SB.toast(`已切换为「${t.name}」动效`); api.refresh('motion');
        });
        box.appendChild(b);
      });
      p.appendChild(box);
    }});
})(window.SB);
</script>
