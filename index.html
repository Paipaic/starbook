<script>
/* ── v1.5 账户 → v1.8.1 改为右上角「账户」标识（SB.dock）；当前仅显示账号与退出，未来可升级为 Library / Profile ── */
(function(SB){
  const ROLE = {owner:'主人', editor:'可编辑', viewer:'只读'};
  SB.dock.add({id:'account', order:30, label:'账户',
    icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 19.5c.8-4 3-6 6.5-6s5.7 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    render(p){
      p.innerHTML = '<h4>账户</h4><p class="rn">VIATOR · LIBRI</p>';
      const u = SB.user?.current, b = SB.book?.current;
      const row = (lb, val) => { const r = SB.el('div', 'row'); const a = SB.el('span', 'lb'); a.textContent = lb; r.appendChild(a); if(typeof val === 'string'){ const v = SB.el('span', 'sm'); v.textContent = val; r.appendChild(v); } else r.appendChild(val); p.appendChild(r); };
      row('账号', u?.email || '未登录');
      if(b){ row('当前的书', b.name || '星屿之书'); const badge = SB.el('span', 'sb-badge'); badge.textContent = ROLE[b.role] || b.role || '成员'; row('身份', badge); }
      if(u){ const acts = SB.el('div', 'acts');
        acts.appendChild(SB.ui.button('退出登录', 'small danger', async () => { SB.dock.close(); if(await SB.ui.confirm('退出当前账号？', '退出', 'danger')) await SB.user.signOut(); }));
        p.appendChild(acts); }
    }});
  document.addEventListener('sb:book', () => SB.dock.refresh('account'));
})(window.SB);
</script>

<style>

<script>

  const scene = document.querySelector('.sb-scene[data-scene="book"]');

  /* ── 程序生成纹理 ── */
  function noise2(size, octaves){
    // 多层值噪声 → 高度图
    const h = new Float32Array(size*size);
    for(let o = 0; o < octaves; o++){
      const cell = Math.max(2, size >> (o + 2)), n = Math.ceil(size/cell) + 1, amp = 1/(o+1.2);
      const grid = new Float32Array(n*n).map(()=>Math.random());
      for(let y = 0; y < size; y++){ const gy = y/cell, y0 = gy|0, fy = gy - y0, sy = fy*fy*(3-2*fy);
        for(let x = 0; x < size; x++){ const gx = x/cell, x0 = gx|0, fx = gx - x0, sx = fx*fx*(3-2*fx);
          const a = grid[(y0%(n-1))*n + x0%(n-1)], b = grid[(y0%(n-1))*n + (x0+1)%(n-1)], c = grid[((y0+1)%(n-1))*n + x0%(n-1)], d = grid[((y0+1)%(n-1))*n + (x0+1)%(n-1)];
          h[y*size+x] += (a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy)*amp; } }
    }
    return h;
  }
  function leather(){
    const s = 512, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
    const h = noise2(s, 6);
    // 荔枝纹：用细胞距离制造颗粒凸起
    const cells = Array.from({length:5200}, () => [Math.random()*s, Math.random()*s]);
    const bump = new Float32Array(s*s);
    const bucket = new Map(), B = 32;
    cells.forEach(p => { const k = ((p[0]/B)|0) + ',' + ((p[1]/B)|0); (bucket.get(k) || bucket.set(k, []).get(k)).push(p); });
    for(let y = 0; y < s; y++) for(let x = 0; x < s; x++){
      let m = 1e9; const bx = (x/B)|0, by = (y/B)|0;
      for(let j = -1; j <= 1; j++) for(let i = -1; i <= 1; i++){
        const arr = bucket.get(((bx+i+s/B)%(s/B)) + ',' + ((by+j+s/B)%(s/B))); if(!arr) continue;
        for(const p of arr){ let dx = Math.abs(p[0]-x), dy = Math.abs(p[1]-y); dx = Math.min(dx, s-dx); dy = Math.min(dy, s-dy); const d = dx*dx+dy*dy; if(d < m) m = d; }
      }
      bump[y*s+x] = Math.min(1, Math.sqrt(m)/6.5);
    }
    const img = g.createImageData(s, s), D = img.data;
    const H = (x,y) => { x = (x+s)%s; y = (y+s)%s; return h[y*s+x]*.35 + (1 - bump[y*s+x]*bump[y*s+x])*.32; };
    for(let y = 0; y < s; y++) for(let x = 0; x < s; x++){
      const nx = H(x-1,y) - H(x+1,y), ny = H(x,y-1) - H(x,y+1);
      const light = SB.clamp(.9 + (nx*1.2 + ny*1.5)*1.05, .72, 1.1);   // 左上光源
      const tone = .82 + h[y*s+x]*.22 + (Math.random()-.5)*.05;
      const i = (y*s+x)*4;
      // v1.8.1 午夜靛蓝摩洛哥山羊皮：低频斑驳（旧化）+ 冷色高光
      const mot = .9 + h[((y>>3)*8%s)*s + ((x>>3)*8%s)]*.18;

    }
    g.putImageData(img, 0, 0);
    // 细划痕与磨损
    g.globalCompositeOperation = 'multiply'; g.strokeStyle = 'rgba(8,10,30,.4)'; g.lineWidth = .7;

      for(let k = 0; k < 5; k++){ x += (Math.random()-.5)*26; y += (Math.random()-.5)*12; g.lineTo(x,y); } g.stroke(); }

  const smallGear = k => `<g id="mk-sg${k}"><path d="${gear(30,24,11)}" fill="#2c2f5c" stroke="url(#m3g)" stroke-width="1.1"/>

  $('mk-r3').innerHTML = FOIL('m3', 1) + `<g filter="url(#m3f)">

  function start(){ if(state.running) return; state.running = true; last = 0; requestAnimationFrame(loop); }
  function stop(){ state.running = false; FX.smoke.length = FX.sparks.length = FX.motes.length = FX.gsp.length = 0; fg.clearRect(0, 0, fxc.width, fxc.height); }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(SB.scenes.current === 'book') start(); });
  addEventListener('resize', () => { if(SB.scenes.current === 'book' && !SB.magicBook.busy) placeOrbit(); });

  const gemBtn = $('bk-gembtn');
  SB.magicBook = {
    busy:false, state, scene, cover, tilt, gemBtn, page:$('bk-page'),
    stage:$('bk-stage'), shocks:[$('bk-shock'), $('bk-shock2')], leaves:[$('bk-leaf1'),$('bk-leaf2'),$('bk-leaf3')],
    setSpin(v){ state.spinTarget = v; },
    // v1.8.0：开书时把烟雾、火星、符文环吸向宝石（与门钥匙转场衔接）
    // v1.8.2：开书时星尘从书页向上飘散（替代 v1.8.0/1.8.1 的「汇聚」）
    fxOpen(on){ FX.open = on ? 1 : 0; if(!on) FX.motes.length = 0; },
    // v1.8.3 机关启封：启动 / 停止机关（逐级啮合、棘轮、宝石旋转、描线、星辰依次点亮、火花、符文环加速）
    awaken(on){
      if(on){ state.mech = performance.now(); FX.awake = 1; cover.classList.add('is-awake'); }
      else { state.mech = null; FX.awake = 0; }
    },
    // 解锁：包角弹开 + 书身轻震 + 书页切口透光
    unlock(){
      cover.classList.add('is-unlock'); scene.classList.add('is-seam');
      const body = scene.querySelector('.bk-body'); body.classList.remove('thunk'); void body.offsetWidth; body.classList.add('thunk');
    },
    gemCenter(){ const r = gemBtn.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; },
    reset(){
      this.busy = false; state.spinTarget = 1; state.spin = 1; FX.open = 0; FX.ringK = 1; FX.motes.length = 0;
      scene.classList.remove('is-opening'); this.page.classList.remove('lit');
      cover.classList.remove('is-open','is-lit','is-charging','is-hover','is-awake','is-unlock'); scene.classList.remove('is-seam');
      state.mech = null; FX.awake = 0; FX.aw = 0; FX.gsp.length = 0; scene.querySelector('.bk-body').classList.remove('thunk');
      this.stage.style.transition = 'none'; this.stage.style.transform = ''; this.stage.style.opacity = '';
      this.leaves.forEach(l => { l.style.transition = 'none'; l.style.opacity = '0'; l.style.transform = ''; });
      void this.stage.offsetWidth; this.stage.style.transition = '';
    }
  };
  SB.scenes.register('book', {
    world:'book', deepLink:true,
    title:()=>'魔法书',
    enter(){ SB.magicBook.reset(); SB.fx.palette('warm'); SB.fx.calm(); SB.fx.orbitBoost(1); start(); requestAnimationFrame(placeOrbit); },
    leave(){ stop(); SB.fx.orbit(null); }
  });
})(window.SB);
</script>

<script>
/* ── 块 04 · 开书动画 v1.8.3「机关启封 · 星尘启封」：机关启动 → 启封 → 入页 → 门钥匙（约 4.7 秒） ──
   依据 prompts/04-book-opening.md：不再使用粒子汇聚、穿越光线与闪白（Owner 反馈过曝）；
   开书期间不创建 3D 地球（WebGL / 着色器编译会卡住动画），地球在门钥匙盖满画面后才准备。 */
(function(SB){
  SB.magicBook.open = async function(){
    const B = SB.magicBook;
    if(B.busy || document.body.classList.contains('is-busy')) return;
    B.busy = true; SB.menu.close(); SB.dock?.close?.();
    B.scene.classList.add('is-opening');
    B.cover.classList.remove('is-hover');
    SB.audio?.unlock?.();
    if(SB.perf.level === 'reduced'){ await SB.scenes.go('globe', {}, {transition:'flash'}); return; }
    const low = SB.perf.level !== 'high';

    // 1 机关启封（0–1.9s，v1.8.3）：机匣逐级啮合（棘轮步进）、宝石旋转、能量沿烫金描亮与光珠奔跑、
    //   星辰依次点亮、宝石外圈迸出火花、符文环加速；1.2s 双重共鸣；1.5s 解锁（包角弹开 + 书身轻震 + 书页透光）
    B.awaken?.(true);
    B.setSpin(low ? 6 : 8);
    B.cover.classList.add('is-charging', 'is-lit');
    SB.fx.orbitBoost(2.6);
    await SB.wait(1200);
    B.shocks.forEach((s, i) => setTimeout(() => { s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }, i*180));
    await SB.wait(300);
    B.unlock?.();
    await SB.wait(400);
    B.awaken?.(false);

    // 2 启封（1.9–4.0s）：封面打开，书页柔光亮起，纸页轻轻翻动；星尘从书页向上缓缓飘散（只向外，不汇聚）
    B.fxOpen?.(true);
    B.cover.classList.add('is-open');
    B.setSpin(2); B.page.classList.add('lit');
    const z = 'translateZ(calc(var(--bt) / 2 - 2px))';
    B.leaves.slice(0, low ? 2 : 3).forEach((l, i) => setTimeout(() => {
      l.style.transition = 'transform 1.1s cubic-bezier(.4,0,.3,1), opacity .4s';
      l.style.opacity = '1'; l.style.transform = `${z} rotateY(${-28 - i*14}deg)`;
      setTimeout(() => { l.style.transition = 'transform 1s cubic-bezier(.4,0,.3,1), opacity .9s .2s'; l.style.transform = `${z} rotateY(0deg)`; l.style.opacity = '0'; }, 900);
    }, 500 + i*180));
    SB.fx.orbit(null);
    await SB.wait(low ? 1750 : 2100);   // 等扉页星图描完

    // 3 入页（4.0–4.7s）：镜头推进书页中心并淡出，随后门钥匙光门从书页中心打开
    const r = document.getElementById('bk-float').getBoundingClientRect();
    B.stage.style.transition = `transform ${low ? 1 : 1.2}s cubic-bezier(.6,0,.35,1), opacity ${low ? .9 : 1.1}s ease-in`;
    B.stage.style.transform = `scale(${low ? 1.5 : 1.9})`; B.stage.style.opacity = '0';
    await SB.wait(low ? 520 : 680);
    await SB.scenes.go('globe', {fromBook:true}, {transition:'flash', x:r.left + r.width/2, y:r.top + r.height*.48});
  };
})(window.SB);
</script>

<!-- ████ BLOCK 05-store START ████ -->
<script>
/* ── 块 05 · v1.5 周年桥接存储：Supabase book_data(JSONB) + Private Storage ──
   对外继续暴露 V1 的 cities / memories / settings API，让地图、编辑器、播放器无需大改。
   book_data 是周年桥接层；V2 再正规化 memories / locations / assets 等表。 */
(function(SB){
  const cfg = window.STARBOOK_CONFIG || {};
  const BUCKET = cfg.storageBucket || 'starbook-media';
  const SIGN_TTL = Math.max(900, Number(cfg.signedUrlTtlSeconds) || 21600);
  const MAX_FILE = 25 * 1024 * 1024;
  const st = SB.store = { mode:'connecting', role:'viewer', canEdit:false, canUpload:false, cities:[], memories:[], settings:{}, revision:0, ready:null };
  const emit = () => document.dispatchEvent(new CustomEvent('sb:data'));
  const now = () => new Date().toISOString();
  const empty = () => ({cities:{}, memories:{}, settings:{}});
  const clone = o => JSON.parse(JSON.stringify(o));
  let data = empty(), dataSig = '';
  const preview = Object.create(null);   // 本次浏览器会话刚上传的文件 path → object URL
  const signed = Object.create(null);    // Private Storage path → {url, expiresAt}
  const signing = new Set();             // 正在补签的 path，避免同一图片并发重复请求

  function normalize(d){ return {cities:d?.cities || {}, memories:d?.memories || {}, settings:d?.settings || {}}; }
  function setData(d){
    d = normalize(d); const sig = JSON.stringify(d); data = d;
    st.cities = Object.entries(d.cities).map(([id,v]) => ({id, ...v}));
    st.memories = Object.entries(d.memories).map(([id,v]) => ({id, ...v}));
    st.settings = d.settings;
    if(sig !== dataSig){ dataSig = sig; emit(); }
  }
  function refs(d){
    const s = new Set();
    for(const m of Object.values(d?.memories || {})){
      m.cover?.id && s.add(m.cover.id);
      (m.slides || []).forEach(x => x.id && s.add(x.id));
      m.bgm?.id && s.add(m.bgm.id);
    }
    d?.settings?.bgm?.id && s.add(d.settings.bgm.id);
    return s;
  }
  function errText(e){
    const c = e?.code || e?.statusCode || e?.status;
    const raw = String(e?.message || e?.error || '');
    if(e?.msg) return e.msg;
    if(c === 'conflict') return '另一台设备刚刚更新了这本书，请稍后再保存一次';
    if(c === 401 || /jwt|not authenticated/i.test(raw)) return '登录状态已失效，请重新登录';
    if(c === 403 || /row-level security|permission|policy/i.test(raw)) return '你目前没有执行这个操作的权限';
    if(c === 404) return '没有找到要读取的星屿数据';
    if(c === 'too_large' || /maximum allowed size|too large/i.test(raw)) return '文件太大（单个文件最多 25MB）';
    if(c === 'unsupported_type') return '暂不支持这种文件格式';
    if(c === 'decode') return '这张照片暂时无法读取，请换成 JPG / PNG 后再试';
    if(c === 429 || /rate limit|too many/i.test(raw)) return '操作有点频繁，请稍等一会儿再试';
    return '网络有点问题，没有保存成功，请再试一次';
  }
  st.errText = errText;

  function bookId(){ return SB.book?.current?.id || ''; }
  function bucket(){ return SB.supabase.storage.from(BUCKET); }
  function mayEdit(role){ return role === 'owner' || role === 'editor'; }

  async function readRow(){
    const id = bookId(); if(!id) throw new Error('book_not_ready');
    const {data:row,error} = await SB.supabase.from('book_data').select('payload,revision,updated_at').eq('book_id',id).maybeSingle();
    if(error) throw error;
    if(row) return {payload:normalize(row.payload), revision:Number(row.revision)||0, updated_at:row.updated_at};
    if(!st.canEdit) throw {code:403,msg:'这本书还没有初始化数据'};
    const seed = {book_id:id,schema_version:1,payload:empty(),revision:0};
    const {data:created,error:createErr} = await SB.supabase.from('book_data').insert(seed).select('payload,revision,updated_at').single();
    if(createErr) throw createErr;
    return {payload:normalize(created.payload),revision:Number(created.revision)||0,updated_at:created.updated_at};
  }

  async function signPaths(paths,{notify=false}={}){
    const soon = Date.now() + 5*60*1000;
    const need = [...new Set((paths || []).filter(path => path && !preview[path] && !signing.has(path) && (!signed[path] || signed[path].expiresAt < soon)))];
    if(!need.length) return true;
    need.forEach(path => signing.add(path));
    const expiresAt = Date.now() + SIGN_TTL*1000;
    let changed = false;
    try{
      const b = bucket();
      if(typeof b.createSignedUrls === 'function'){
        const {data:rows,error} = await b.createSignedUrls(need,SIGN_TTL); if(error) throw error;
        (rows || []).forEach((row,i) => {
          const path = row?.path || need[i], url = row?.signedUrl || row?.signedURL;
          if(path && url){ signed[path] = {url,expiresAt}; changed = true; }
        });
      }else{
        for(const path of need){
          const {data:row,error} = await b.createSignedUrl(path,SIGN_TTL); if(error) throw error;
          const url = row?.signedUrl || row?.signedURL;
          if(url){ signed[path] = {url,expiresAt}; changed = true; }
        }
      }
      return true;
    }catch(e){
      console.error('[Starbook signed urls]',e);
      return false;
    }finally{
      need.forEach(path => signing.delete(path));
      if(changed && notify) emit();
    }
  }
  async function warmUrls(d){ return signPaths([...refs(d)]); }
  // v1.7.2：播放器 / 相册可提前批量补齐签名地址，避免逐张轮询造成首屏等待。
  st.prefetchUrls = paths => signPaths(paths || []);

  async function applyRemote(row){
    st.revision = Number(row?.revision)||0;
    // v1.7.3：启动阶段只读取 JSONB，不再为整本书所有照片/音频批量签名。
    // 媒体 URL 由城市首屏 / 播放器 prepare 按需批量预取，避免登录后长时间只有背景。
    setData(row?.payload || empty());
  }

  async function refreshRemote({silent=false}={}){
    try{ await applyRemote(await readRow()); }
    catch(e){ if(!silent) throw e; console.error('[Starbook refresh]',e); }
  }
  st.refresh = refreshRemote;

  async function init(){
    await SB.runtime.ready;
    st.mode = 'supabase';
    st.role = SB.book.current?.role || 'viewer';
    st.canEdit = mayEdit(st.role); st.canUpload = st.canEdit;
    SB.menu?.status(`${SB.book.current?.name || '星屿之书'} · ${st.canEdit ? '可以编辑' : '只读浏览'}`);
    SB.menu?.refresh();
    await refreshRemote();
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden && st.mode==='supabase' && !document.querySelector('.sb-modal')) refreshRemote({silent:true});
    });
  }
  st.ready = init();
  st.isConnected = () => st.mode === 'supabase' && !!SB.user?.current && !!SB.book?.current;

  async function removeObjects(paths){
    paths = [...new Set(paths.filter(Boolean))]; if(!paths.length || !st.canUpload) return;
    try{
      const {error} = await bucket().remove(paths); if(error) throw error;
      for(const id of paths){ if(preview[id]){ URL.revokeObjectURL(preview[id]); delete preview[id]; } delete signed[id]; }
    }catch(e){ console.error('[Starbook storage cleanup]',e); }
  }

  /* 基于 revision 的轻量冲突检测：保留 JSONB 桥接结构，同时避免两台设备静默覆盖。 */
  async function mutate(fn){
    if(!st.canEdit) throw {code:403};
    for(let attempt=0; attempt<3; attempt++){
      const cur = await readRow();
      const next = clone(normalize(cur.payload)); fn(next);
      const nextRevision = (Number(cur.revision)||0) + 1;
      const {data:updated,error} = await SB.supabase.from('book_data')
        .update({payload:next,revision:nextRevision,updated_at:now()})
        .eq('book_id',bookId()).eq('revision',Number(cur.revision)||0)
        .select('payload,revision,updated_at').maybeSingle();
      if(error) throw error;
      if(updated){
        const removed = [...refs(cur.payload)].filter(id => !refs(next).has(id));
        await applyRemote(updated);
        if(removed.length) removeObjects(removed);
        return;
      }
      await SB.wait(220 + Math.random()*360);
    }
    throw {code:'conflict'};
  }

  const strip = o => { const c = {...o}; delete c.id; return JSON.parse(JSON.stringify(c)); };
  st.addCity = async (c) => {
    const name = String(c.name || '').trim();
    if(!name) throw {code:'empty',msg:'请输入城市名'};
    if(st.cities.some(x => x.region === c.region && x.name === name)) throw {code:'dup',msg:'这座城市已经点亮过了'};
    const id = SB.uid();
    await mutate(d => { d.cities[id] = strip({...c,name,createdAt:now()}); });
    return id;
  };
  st.updateCity = (id,patch) => mutate(d => { if(d.cities[id]) d.cities[id] = {...d.cities[id],...patch,updatedAt:now()}; });
  st.removeCity = id => mutate(d => {
    delete d.cities[id];
    for(const [mid,m] of Object.entries(d.memories)) if(m.cityId === id) delete d.memories[mid];
  });
  st.saveMemory = async m => {
    const id = m.id || SB.uid();
    await mutate(d => { const prev=d.memories[id]; d.memories[id]=strip({...m,createdAt:prev?.createdAt||now(),updatedAt:now()}); });
    return id;
  };
  st.removeMemory = id => mutate(d => { delete d.memories[id]; });
  st.saveSettings = patch => mutate(d => { d.settings = strip({...d.settings,...patch}); });

  /* ── Private Storage ── */
  st.url = id => {
    if(!id) return '';
    if(preview[id]) return preview[id];
    const hit = signed[id];
    if(hit?.url){
      if(hit.expiresAt < Date.now()+5*60*1000) signPaths([id],{notify:true});
      return hit.url;
    }
    // 初次签名若曾因弱网失败，组件再次询问 URL 时自动补签；成功后 sb:data 会触发重绘。
    signPaths([id],{notify:true});
    return '';
  };

  st.health = async () => {
    const result = {
      connected: st.isConnected(),
      userId: SB.user?.current?.id || null,
      bookId: bookId() || null,
      role: st.role,
      canEdit: st.canEdit,
      revision: st.revision,
      database: false,
      storage: false
    };
    try{ await readRow(); result.database = true; }catch(e){ result.databaseError = errText(e); }
    try{
      const probe = `${bookId()}/.healthcheck-never-created`;
      const {error} = await bucket().createSignedUrl(probe,60);
      // 对不存在对象，Storage 可能返回错误；只要不是权限/RLS 类错误，就说明 Bucket API 已可访问。
      if(!error) result.storage = true;
      else{
        const raw=String(error?.message||'');
        result.storage = !/row-level security|permission|unauthorized|jwt/i.test(raw);
        if(!result.storage) result.storageError = errText(error);
      }
    }catch(e){ result.storageError = errText(e); }
    return result;
  };

  async function putFile(blob,ext,type,folder){
    if(!st.canUpload) throw {code:403};
    if(!blob || blob.size > MAX_FILE) throw {code:'too_large'};
    const path = `${bookId()}/${folder}/${SB.uid()}.${ext}`;
    const {error} = await bucket().upload(path,blob,{contentType:type||undefined,cacheControl:'31536000',upsert:false});
    if(error) throw error;
    preview[path] = URL.createObjectURL(blob);
    return path;
  }

  st.deleteFile = async id => {
    if(!id || refs(data).has(id)) return;
    await removeObjects([id]);
  };

  async function decodeImage(file){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){
      return await new Promise((res,rej)=>{
        const img=new Image(),u=URL.createObjectURL(file);
        img.onload=()=>{ URL.revokeObjectURL(u); res(img); };
        img.onerror=()=>{ URL.revokeObjectURL(u); rej({code:'decode'}); };
        img.src=u;
      });
    }
  }
  st.uploadImage = async (file,onStep) => {
    if(!file) throw {code:'unsupported_type'};
    onStep?.('读取中');
    let img; try{ img=await decodeImage(file); }
    catch(e){ throw {code:'decode',msg:`「${file.name}」无法读取。HEIC 如上传失败，请先在手机相册中导出为 JPG`}; }
    const w0=img.width,h0=img.height,k=Math.min(1,2400/Math.max(w0,h0));
    const w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    canvas.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h); img.close?.();
    onStep?.('压缩中');
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.86));
    if(!blob) throw {code:'decode',msg:'照片压缩失败，请换一张照片后再试'};
    onStep?.('上传中');
    return {id:await putFile(blob,'jpg','image/jpeg','images'),w,h};
  };

  st.uploadAudio = async (file,onStep) => {
    if(!file) throw {code:'unsupported_type'};
    let ext=(file.name.split('.').pop()||'').toLowerCase();
    const types={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',mp4:'audio/mp4',wav:'audio/wav'};
    if(!types[ext]) throw {code:'unsupported_type',msg:'周年版本建议上传 mp3 或 m4a 音乐'};
    if(file.size > 20*1024*1024) throw {code:'too_large',msg:'音乐文件请控制在 20MB 以内'};
    onStep?.('上传中');
    const name=file.name.replace(/\.[^.]+$/,'');
    return {id:await putFile(file,ext,file.type||types[ext],'audio'),name};
  };

  /* ── 派生查询 ── */
  st.citiesIn = country => st.cities.filter(c => c.country === country);
  st.citiesInRegion = region => st.cities.filter(c => c.region === region).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  st.city = id => st.cities.find(c => c.id === id);
  st.memory = id => st.memories.find(m => m.id === id);
  st.memoriesOf = cityId => st.memories.filter(m => m.cityId === cityId).sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
  st.visitedCountries = () => new Set(st.cities.map(c => c.country));
  st.visitedRegions = country => new Set(st.cities.filter(c => c.country === country).map(c => c.region));
  st.stats = () => ({
    countries:new Set(st.cities.map(c=>c.country)).size,
    regions:new Set(st.cities.map(c=>c.region)).size,
    cities:st.cities.length,
    memories:st.memories.length,
    photos:st.memories.reduce((n,m)=>n+(m.slides||[]).length,0)
  });
})(window.SB);
</script>

<script>

<script>
/* ── 块 06b · 地理工具：大洲、国家、中文名、点在国家内判断、省级地图加载 ── */
(function(SB){
  const RAW = SB.WORLD_RAW, Q = RAW.q || 20;
  const MAP_CDN = v => k => `https://cdn.jsdelivr.net/npm/@highcharts/map-collection@${v}/countries/${k}/${k}-all.js`;
  const MAP_URLS = k => [MAP_CDN('2.3.3')(k), MAP_CDN('2.3.2')(k), `https://unpkg.com/@highcharts/map-collection@2.3.3/countries/${k}/${k}-all.js`];

  const CONTINENTS = [
    {code:'as', name:'亚洲',   en:'ASIA',          center:[95, 38]},
    {code:'eu', name:'欧洲',   en:'EUROPA',        center:[18, 52]},
    {code:'na', name:'北美洲', en:'AMERICA BOREALIS', center:[-100, 46]},
    {code:'sa', name:'南美洲', en:'AMERICA AUSTRALIS', center:[-60, -16]},
    {code:'af', name:'非洲',   en:'AFRICA',        center:[20, 6]},
    {code:'oc', name:'大洋洲', en:'OCEANIA',       center:[140, -24]},
    {code:'an', name:'南极洲', en:'ANTARCTICA',    center:[30, -80]}
  ];
  let zhName;
  try{ const dn = new Intl.DisplayNames(['zh-Hans-CN','zh-CN','zh'], {type:'region'}); zhName = a2 => { try{ return dn.of(a2); }catch(e){ return null; } }; }
  catch(e){ zhName = () => null; }
  const NAME_FIX = { kv:'科索沃', 'nc':'北塞浦路斯', cnm:'塞浦路斯缓冲区', so:'索马里', sx:'荷属圣马丁', tw:'中国台湾' };

  /* 解码国家轮廓 */
  const countries = RAW.countries.map(c => {
    const rings = c.p.map(enc => { const pts = new Float32Array(enc.length); let x = 0, y = 0;
      for(let i = 0; i < enc.length; i += 2){ x += enc[i]; y += enc[i+1]; if(i === 0){ x = enc[0]; y = enc[1]; } pts[i] = x/Q; pts[i+1] = y/Q; }
      return pts; });
    // 修正第一个点（编码首点为绝对值）
    let b = [180, 90, -180, -90];
    for(const r of rings) for(let i = 0; i < r.length; i += 2){ b[0] = Math.min(b[0], r[i]); b[1] = Math.min(b[1], r[i+1]); b[2] = Math.max(b[2], r[i]); b[3] = Math.max(b[3], r[i+1]); }
    const zh = NAME_FIX[c.k] || (c.a2 && zhName(c.a2)) || c.n;
    return { key:c.k, a2:c.a2, en:c.n, zh: zh && zh !== c.a2 ? zh : c.n, cont:c.c, mid:c.m, rings, bbox:b, hasMap: RAW.maps.includes(c.k) };
  });
  const byKey = Object.fromEntries(countries.map(c => [c.key, c]));

  /* 南极大陆（手绘近似轮廓） */
  const ant = []; for(let lon = -180; lon <= 180; lon += 4){
    let lat = -70 + 3.2*Math.sin(lon*Math.PI/45) + 1.8*Math.cos(lon*Math.PI/23);
    if(lon > -75 && lon < -55) lat = SB.lerp(lat, -63.5, Math.sin((lon+75)/20*Math.PI));   // 南极半岛
    if(lon > 160 || lon < -150) lat = Math.min(lat, -76);                                  // 罗斯海
    if(lon > -60 && lon < -25) lat = Math.min(lat, -76.5);                                 // 威德尔海
    ant.push(lon, lat); }
  ant.push(180, -90, -180, -90);
  const antarctica = { key:'aq', a2:'AQ', en:'Antarctica', zh:'南极洲', cont:'an', mid:[30,-80], rings:[new Float32Array(ant)], bbox:[-180,-90,180,-60], hasMap:false };
  countries.push(antarctica); byKey.aq = antarctica;

  function inRing(r, x, y){
    let ins = false;
    for(let i = 0, j = r.length - 2; i < r.length; j = i, i += 2){
      const xi = r[i], yi = r[i+1], xj = r[j], yj = r[j+1];
      if(((yi > y) !== (yj > y)) && (x < (xj - xi)*(y - yi)/(yj - yi) + xi)) ins = !ins;
    }
    return ins;
  }

  /* 省级中文名 */
  const CN = {bj:'北京',tj:'天津',he:'河北',sx:'山西',nm:'内蒙古',ln:'辽宁',jl:'吉林',hl:'黑龙江',sh:'上海',js:'江苏',zj:'浙江',ah:'安徽',fj:'福建',jx:'江西',sd:'山东',ha:'河南',hb:'湖北',hn:'湖南',gd:'广东',gx:'广西',hi:'海南',cq:'重庆',sc:'四川',gz:'贵州',yn:'云南',xz:'西藏',sn:'陕西',gs:'甘肃',qh:'青海',nx:'宁夏',xj:'新疆',tw:'台湾',hk:'香港',mo:'澳门'};
  const US = {al:'亚拉巴马',ak:'阿拉斯加',az:'亚利桑那',ar:'阿肯色',ca:'加利福尼亚',co:'科罗拉多',ct:'康涅狄格',de:'特拉华',dc:'华盛顿特区',fl:'佛罗里达',ga:'佐治亚',hi:'夏威夷',id:'爱达荷',il:'伊利诺伊',in:'印第安纳',ia:'艾奥瓦',ks:'堪萨斯',ky:'肯塔基',la:'路易斯安那',me:'缅因',md:'马里兰',ma:'马萨诸塞',mi:'密歇根',mn:'明尼苏达',ms:'密西西比',mo:'密苏里',mt:'蒙大拿',ne:'内布拉斯加',nv:'内华达',nh:'新罕布什尔',nj:'新泽西',nm:'新墨西哥',ny:'纽约',nc:'北卡罗来纳',nd:'北达科他',oh:'俄亥俄',ok:'俄克拉何马',or:'俄勒冈',pa:'宾夕法尼亚',ri:'罗得岛',sc:'南卡罗来纳',sd:'南达科他',tn:'田纳西',tx:'得克萨斯',ut:'犹他',vt:'佛蒙特',va:'弗吉尼亚',wa:'华盛顿',wv:'西弗吉尼亚',wi:'威斯康星',wy:'怀俄明'};
  const JP = {Hokkaido:'北海道',Aomori:'青森',Iwate:'岩手',Miyagi:'宫城',Akita:'秋田',Yamagata:'山形',Fukushima:'福岛',Ibaraki:'茨城',Tochigi:'栃木',Gunma:'群马',Saitama:'埼玉',Chiba:'千叶',Tokyo:'东京',Kanagawa:'神奈川',Niigata:'新潟',Toyama:'富山',Ishikawa:'石川',Fukui:'福井',Yamanashi:'山梨',Nagano:'长野',Gifu:'岐阜',Shizuoka:'静冈',Aichi:'爱知',Mie:'三重',Shiga:'滋贺',Kyoto:'京都',Osaka:'大阪',Hyogo:'兵库',Nara:'奈良',Wakayama:'和歌山',Tottori:'鸟取',Shimane:'岛根',Okayama:'冈山',Hiroshima:'广岛',Yamaguchi:'山口',Tokushima:'德岛',Kagawa:'香川',Ehime:'爱媛',Kochi:'高知',Fukuoka:'福冈',Saga:'佐贺',Nagasaki:'长崎',Kumamoto:'熊本',Oita:'大分',Miyazaki:'宫崎',Kagoshima:'鹿儿岛',Okinawa:'冲绳'};
  function regionZh(country, key, en){
    const short = (key||'').split('-').slice(1).join('-');
    if(country === 'cn' && CN[short]) return CN[short];
    if(country === 'us' && US[short]) return US[short];
    if(country === 'jp' && JP[en]) return JP[en];
    return en || key;
  }

  /* 省级地图：加载 → 统一成 {regions:[{key, name, polys:[[x,y,...]], mid:[x,y]}], lines:[], planar} */
  const mapCache = {};
  async function loadCountryMap(k){
    if(mapCache[k]) return mapCache[k];
    window.Highcharts = window.Highcharts || {}; window.Highcharts.maps = window.Highcharts.maps || {};
    await SB.loadScript(MAP_URLS(k));
    const raw = window.Highcharts.maps[`countries/${k}/${k}-all`];
    if(!raw) throw new Error('no_map');
    const planar = !!(raw['hc-transform'] || raw.crs);
    const regions = [], lines = [];
    // 跨越 180° 经线的国家（俄罗斯、斐济等）把西经部分平移 360°
    let shift = false;
    if(!planar){ let mn = 999, mx = -999; for(const f of raw.features){ const g = f.geometry; if(!g) continue;
        const walk = a => typeof a[0] === 'number' ? (mn = Math.min(mn, a[0]), mx = Math.max(mx, a[0])) : a.forEach(walk); walk(g.coordinates); }
      shift = mx - mn > 180; }
    const R = Math.PI/180;
    const proj = planar ? (x, y) => [x, -y] : (lon, lat) => { if(shift && lon < 0) lon += 360; lat = SB.clamp(lat, -85, 85); return [lon, -Math.log(Math.tan(Math.PI/4 + lat*R/2))/R]; };
    for(const f of raw.features){
      const p = f.properties || {}, g = f.geometry; if(!g) continue;
      if(p['hc-group'] === '__separator_lines__'){ const ls = g.type === 'MultiLineString' ? g.coordinates : [g.coordinates];
        ls.forEach(l => lines.push(l.flatMap(([x,y]) => proj(x,y)))); continue; }
      const polys = (g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates]).map(poly => poly.map(r => r.flatMap(([x,y]) => proj(x,y))));
      let b = [Infinity, Infinity, -Infinity, -Infinity];
      polys.forEach(pl => pl.forEach(r => { for(let i = 0; i < r.length; i += 2){ b[0] = Math.min(b[0], r[i]); b[1] = Math.min(b[1], r[i+1]); b[2] = Math.max(b[2], r[i]); b[3] = Math.max(b[3], r[i+1]); } }));
      let mid;
      if(p['hc-middle-lon'] != null && !planar) mid = proj(p['hc-middle-lon'], p['hc-middle-lat']);
      else if(p['hc-middle-x'] != null) mid = [b[0] + (b[2]-b[0])*p['hc-middle-x'], b[1] + (b[3]-b[1])*p['hc-middle-y']];
      else mid = [(b[0]+b[2])/2, (b[1]+b[3])/2];
      const key = p['hc-key'] || ('r' + regions.length);
      const lonlat = (p['hc-middle-lon'] != null) ? [p['hc-middle-lon'], p['hc-middle-lat']] : (p.longitude ? [+p.longitude, +p.latitude] : null);
      regions.push({ key, en:p.name || '', name: regionZh(k, key, p.name) || '未命名地区', polys, bbox:b, mid, lonlat });
    }
    return mapCache[k] = { regions, lines, planar };
  }

  SB.geo = {
    CONTINENTS, countries, antarctica,
    continent: code => CONTINENTS.find(c => c.code === code),
    country: k => byKey[k],
    // 争议地带和无人区的小块不作为单独国家列出（地球上仍然绘制）
    inContinent: code => countries.filter(c => c.cont === code && !['sp','sw','jk','cnm','nc'].includes(c.key)),
    hasMap: k => !!byKey[k]?.hasMap,
    countryAt(lon, lat){

        const b = c.bbox; if(lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
        for(const r of c.rings) if(inRing(r, lon, lat)) return c;
      }
      return null;
    },
    loadCountryMap, regionZh
  };
})(window.SB);

      <div class="gl-qbox">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.4 15.4 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.5 6.8l.9 2.8 2.8.9-2.8.9-.9 2.8-.9-2.8-2.8-.9 2.8-.9z" fill="currentColor"/></svg>
        <input id="gl-q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
          placeholder="搜索城市或国家 · 例如 京都、冰岛、Paris" aria-label="搜索城市或国家" role="combobox" aria-autocomplete="list" aria-controls="gl-res" aria-expanded="false">

</section>

<script>
(function(SB){
  const THREE_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js'];
  const $ = id => document.getElementById(id);
  const cv = $('gl-canvas'), labelsEl = $('gl-labels'), tip = $('gl-tip');
  let T, renderer, scene, camera, globe, earth, earthMat, texCanvas, tex, idCanvas, idTex, starMat, dustMats = [], cityGroup, starTexture;
  let cloud, cloudMat, halo, astro, arcGroup, arcMats = [], arcRunners = [], constGroup, focusGroup, focusRings = [], focusStar;
  let ready = false, running = false, last = 0, time = 0;
  const view = { rotX:.35, rotY:-1.9, vx:0, vy:0, dist:3.2, distT:3.2, base:3.2, zoom:1, zoomT:1, idle:0, intro:0, shift:.06 };
  const contIndex = Object.fromEntries(SB.geo.CONTINENTS.map((c,i) => [c.code, i+1]));
  const hover = { country:-1, cont:-1 };
  const fly = { on:false };                  // 飞转动画
  const focus = { on:false, kind:'', key:'', t0:0, card:null };
  const reduced = () => SB.perf.level === 'reduced';
  const hi = () => SB.perf.level === 'high';

  /* ── 七大洲徽章：v1.8.0 起点击让地球转向该大洲（大洲国家目录页已删除） ── */
  const RUNE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/><path d="M12 3 L14 12 L12 21 L10 12Z M3 12 L12 10 L21 12 L12 14Z" fill="currentColor" opacity=".8"/></svg>';
  const toCont = c => focusTo({kind:'cont', key:c.code, lon:c.center[0], lat:c.center[1], name:c.name});
  const contBtns = SB.geo.CONTINENTS.map(c => {
    const b = SB.el('button','gl-cont'); b.type = 'button'; b.setAttribute('aria-label', '让地球转向' + c.name);
    b.innerHTML = `<span class="orb">${RUNE}<span>${c.name}</span><b></b></span><span class="stem"></span><span class="dot"></span>`;
    b.addEventListener('click', e => { e.stopPropagation(); toCont(c); });
    labelsEl.appendChild(b); return {c, b, badge:b.querySelector('b')};
  });
  SB.geo.CONTINENTS.forEach(c => { const b = SB.el('button'); b.type = 'button'; b.textContent = c.name; b.setAttribute('aria-label', '让地球转向' + c.name); b.addEventListener('click', () => toCont(c)); $('gl-dock').appendChild(b); });

  /* ── 纹理：星光地图 + 国家编号图（用于悬停高亮） ── */
  function unwrap(r){
    const out = new Float32Array(r.length); let off = 0;
    for(let i = 0; i < r.length; i += 2){ if(i){ const d = r[i] - r[i-2]; if(d > 180) off -= 360; else if(d < -180) off += 360; } out[i] = r[i] + off; out[i+1] = r[i+1]; }
    return out;
  }
  function trace(g, r, W, H, shift){
    g.moveTo((r[0]+180+shift)/360*W, (90-r[1])/180*H);
    for(let i = 2; i < r.length; i += 2) g.lineTo((r[i]+180+shift)/360*W, (90-r[i+1])/180*H);
    g.closePath();
  }
  function eachShift(r, fn){ let mn = 999, mx = -999; for(let i = 0; i < r.length; i += 2){ mn = Math.min(mn, r[i]); mx = Math.max(mx, r[i]); }
    fn(0); if(mn < -180) fn(360); if(mx > 180) fn(-360); }
  const rings = SB.geo.countries.map(c => c.rings.map(unwrap));

  function drawTexture(){
    const W = texCanvas.width, H = texCanvas.height, g = texCanvas.getContext('2d'), u = W/4096;
    const sea = g.createLinearGradient(0, 0, 0, H);
    sea.addColorStop(0, '#0d1440'); sea.addColorStop(.5, '#121a52'); sea.addColorStop(1, '#0b1136');
    g.fillStyle = sea; g.fillRect(0, 0, W, H);
    for(let i = 0; i < 2600*u; i++){ g.fillStyle = `rgba(${Math.random()<.3?'255,214,150':'170,186,255'},${Math.random()*.35})`; const s = Math.random()*2.2*u + .4; g.fillRect(Math.random()*W, Math.random()*H, s, s); }
    g.strokeStyle = 'rgba(244,184,96,.13)'; g.lineWidth = 1.2*u;
    for(let lon = -180; lon <= 180; lon += 15){ const x = (lon+180)/360*W; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for(let lat = -75; lat <= 75; lat += 15){ const y = (90-lat)/180*H; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    const visited = SB.store.visitedCountries();
    const land = g.createLinearGradient(0, 0, 0, H);
    land.addColorStop(0, '#4a3826'); land.addColorStop(.5, '#3c2c20'); land.addColorStop(1, '#4a3a2c');
    SB.geo.countries.forEach((c, i) => {
      const lit = visited.has(c.key);
      rings[i].forEach(r => eachShift(r, sh => {
        g.beginPath(); trace(g, r, W, H, sh);
        if(lit){
          g.fillStyle = '#e9a64e'; g.fill();
          g.strokeStyle = 'rgba(255,214,140,.35)'; g.lineWidth = 9*u; g.stroke();
        }else{ g.fillStyle = c.key === 'aq' ? '#5a5670' : land; g.fill(); }
        g.strokeStyle = 'rgba(255,200,120,.28)'; g.lineWidth = 4.5*u; g.stroke();
        g.strokeStyle = lit ? '#fff2cc' : 'rgba(255,214,150,.85)'; g.lineWidth = 1.4*u; g.stroke();
      }));
    });
    tex.needsUpdate = true;
  }
  function drawIds(){
    const W = idCanvas.width, H = idCanvas.height, g = idCanvas.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    SB.geo.countries.forEach((c, i) => {
      g.fillStyle = `rgb(${i+1},${contIndex[c.cont]||0},255)`;
      rings[i].forEach(r => eachShift(r, sh => { g.beginPath(); trace(g, r, W, H, sh); g.fill(); }));
    });
    idTex.needsUpdate = true;
  }

  /* ── 着色器 ── */
  const earthVS = `varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  // v1.8.0：fk = 搜索 / 返回时聚焦的国家（更亮的脉动金光），fc = 聚焦的大洲；海面加星辉高光
  const earthFS = `uniform sampler2D map; uniform sampler2D idMap; uniform float hc; uniform float hk; uniform float fk; uniform float fc; uniform float fa; uniform float t; uniform vec3 L;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      vec3 n = normalize(vN);
      vec3 col = texture2D(map, vUv).rgb;
      float diff = clamp(dot(n, normalize(L))*.55 + .62, .38, 1.18);
      col *= diff;
      vec4 id = texture2D(idMap, vUv);
      if(id.b > .99){
        float cid = floor(id.r*255.0 + .5), cn = floor(id.g*255.0 + .5);
        if(cid == fk) col += vec3(.52,.36,.12)*fa*(.75 + .25*sin(t*5.0));
        else if(cn == fc) col += vec3(.16,.12,.05)*fa;
        if(cid == hk) col += vec3(.34,.24,.08)*(.85 + .15*sin(t*4.0));
        else if(cn == hc) col += vec3(.12,.09,.04);
      }else{
        vec3 h = normalize(normalize(L) + vec3(0.,0.,1.));
        float sp = pow(max(dot(n, h), 0.0), 46.0);
        col += vec3(1.0,.86,.6)*sp*.42 + vec3(.35,.45,1.0)*pow(max(dot(n,h),0.0), 8.0)*.06;
      }
      float fr = pow(1.0 - max(dot(n, vec3(0.,0.,1.)), 0.0), 2.6);
      col += mix(vec3(.45,.55,1.0), vec3(1.0,.74,.38), .5)*fr*.45;
      gl_FragColor = vec4(col, 1.0);
    }`;
  const atmoVS = `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const atmoFS = `varying vec3 vN; void main(){ float i = pow(max(0., .66 - dot(vN, vec3(0.,0.,1.))), 2.6); vec3 c = mix(vec3(.36,.46,1.0), vec3(1.0,.66,.26), .6);
    gl_FragColor = vec4(c*i*.62, i*.6); }`;
  // 云雾层：程序生成的云丝，受光面更亮，边缘淡出
  const cloudVS = `varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const cloudFS = `uniform sampler2D map; uniform vec3 L; uniform float a; varying vec2 vUv; varying vec3 vN;
    void main(){ vec3 n = normalize(vN); float c = texture2D(map, vUv).r; float lit = clamp(dot(n, normalize(L))*.6 + .55, .25, 1.0);
      float rim = smoothstep(.0, .35, dot(n, vec3(0.,0.,1.)));
      gl_FragColor = vec4(mix(vec3(1.0,.82,.55), vec3(1.0,.96,.88), c)*lit, c*a*rim); }`;
  const ptsVS = `attribute float size; attribute float seed; uniform float t; uniform float px; varying float vA; varying float vS;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vS = seed;
      vA = .45 + .55*sin(t*(1.0 + seed*2.0) + seed*40.0);
      gl_PointSize = size*px*(3.0/-mv.z); gl_Position = projectionMatrix*mv; }`;
  const ptsFS = `uniform vec3 c1; uniform vec3 c2; varying float vA; varying float vS;
    void main(){ vec2 p = gl_PointCoord - .5; float d = length(p); if(d > .5) discard;
      float core = smoothstep(.5, .0, d); float cross = max(0., 1. - abs(p.x)*14.) * smoothstep(.5,.0,abs(p.y)) + max(0., 1. - abs(p.y)*14.) * smoothstep(.5,.0,abs(p.x));
      vec3 c = mix(c1, c2, step(.7, vS));
      gl_FragColor = vec4(c, (core*core + cross*.35*step(.85, vS))*vA); }`;
  // 足迹光弧：沿弧线流动的光脉冲
  const arcVS = `attribute float u; varying float vU; void main(){ vU = u; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const arcFS = `uniform float t; uniform float ph; varying float vU;
    void main(){ float p = fract(t*.22 + ph); float d = abs(vU - p); float pulse = smoothstep(.16, .0, d);
      float base = .22*smoothstep(0., .08, vU)*smoothstep(1., .92, vU);
      gl_FragColor = vec4(mix(vec3(1.0,.72,.32), vec3(1.0,.97,.86), pulse), base + pulse*.95); }`;

  function pointsMat(c1, c2){

  function pointsGeo(n, place){

  /* ── v1.8.0 星辉层次：程序生成纹理 ── */
  function cloudTexture(W, H){

    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    const img = g.createImageData(W, H), D = img.data, acc = new Float32Array(W*H);
    let amp = 1, tot = 0;
    for(let o = 0; o < 5; o++){
      const gx = 6 << o, gy = Math.max(2, (3 << o)), grid = new Float32Array((gx)*(gy+1)).map(() => Math.random());
      const at = (i, j) => grid[(j)*gx + ((i % gx) + gx) % gx];
      for(let y = 0; y < H; y++){ const fy = y/H*gy, j = fy|0, ty = fy - j, sy = ty*ty*(3-2*ty);
        for(let x = 0; x < W; x++){ const fx = x/W*gx, i = fx|0, tx = fx - i, sx = tx*tx*(3-2*tx);
          const a = at(i,j), b = at(i+1,j), c2 = at(i,j+1), d = at(i+1,j+1);

      for(let x = 0; x < W; x++){ const v = acc[y*W+x]/tot, k = Math.max(0, (v - .52)/.48), c3 = Math.pow(k, 1.4)*band*255;
        const i = (y*W+x)*4; D[i] = D[i+1] = D[i+2] = c3; D[i+3] = 255; } }

  }
  function astrolabeTexture(S, r0, r1){
    const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'), h = S/2, k = h/r1;
    g.translate(h, h); g.strokeStyle = 'rgba(255,214,150,.9)'; g.fillStyle = 'rgba(255,226,168,.95)';
    g.lineWidth = 1.4; g.beginPath(); g.arc(0, 0, r1*k - 2, 0, Math.PI*2); g.stroke();
    g.lineWidth = .9; g.beginPath(); g.arc(0, 0, r0*k + 2, 0, Math.PI*2); g.stroke();
    for(let i = 0; i < 360; i += 2){ const a = i*Math.PI/180, L = i % 30 === 0 ? 14 : i % 10 === 0 ? 8 : 4;

    const text = ' ORBIS · TERRARUM · MEMORIA · STELLARUM · ITER · NOSTRUM ·'.repeat(2);
    const rm = (r0 + (r1 - r0)*.36)*k; g.font = `500 ${Math.round((r1 - r0)*k*.26)}px Cinzel, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const step = (Math.PI*2)/text.length;
    [...text].forEach((ch, i) => { g.save(); g.rotate(i*step); g.translate(0, -rm); g.fillText(ch, 0, 0); g.restore(); });
    return new T.CanvasTexture(c);
  }

  function buildConstellations(n){

  function buildCities(){

      const key = Math.round(c.lon*10) + ',' + Math.round(c.lat*10); if(seen.has(key)) continue; seen.add(key);

  /* 足迹光弧：把我们点亮的城市按时间连成大圆弧 */
  function buildArcs(){
    if(!arcGroup) return;
    while(arcGroup.children.length){ const o = arcGroup.children[0]; arcGroup.remove(o); o.geometry?.dispose?.(); }
    arcMats = []; arcRunners = [];
    const pts = SB.store.cities.filter(c => c.lon != null && c.lat != null).sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    const max = hi() ? 24 : 12; let n = 0;
    for(let i = 1; i < pts.length && n < max; i++){
      const a = lonLatToVec(pts[i-1].lon, pts[i-1].lat, 1).normalize(), b = lonLatToVec(pts[i].lon, pts[i].lat, 1).normalize();
      const ang = a.angleTo(b); if(ang < .01) continue;

  /* 聚焦标记：星标 + 两圈贴地扩散光环 */

  function resize(){

  /* ── 交互：拖拽旋转、惯性、缩放、悬停、点击 ── */
  const ray = { rc:null, v:null };
  function pick(x, y){
    if(!ray.rc){ ray.rc = new T.Raycaster(); ray.v = new T.Vector2(); }
    const r = cv.getBoundingClientRect();
    ray.v.set((x - r.left)/r.width*2 - 1, -(y - r.top)/r.height*2 + 1);
    ray.rc.setFromCamera(ray.v, camera);
    const hit = ray.rc.intersectObject(earth)[0];

    const lon = hit.uv.x*360 - 180, lat = hit.uv.y*180 - 90;
    return { lon, lat, country: SB.geo.countryAt(lon, lat) };
  }
  function bindControls(){
    const pts = new Map(); let pinch = 0, moved = 0, lastHover = 0;

    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0; view.idle = 0; cv.classList.add('dragging');
      closeResults();
      if(pts.size === 2){ const [a,b] = [...pts.values()]; pinch = Math.hypot(a.x-b.x, a.y-b.y); } });
    cv.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId);
      if(!p){
        if(SB.perf.touch || performance.now() - lastHover < 60) return; lastHover = performance.now();
        const h = pick(e.clientX, e.clientY); setHover(h, e.clientX, e.clientY); return;
      }
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
      if(moved > tapMoveLimit){ fly.on = false; if(focus.on) endFocus(); }
      if(pts.size === 2){ const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); if(pinch){ view.zoomT = SB.clamp(view.zoomT*pinch/d, .58, 1.9); } pinch = d; return; }

    });

      pts.delete(e.pointerId); if(pts.size < 2) pinch = 0; if(!pts.size) cv.classList.remove('dragging');

        const h = pick(e.clientX, e.clientY);
        if(h?.country) SB.scenes.go('country', {k:h.country.key}, {transition:'portal', x:e.clientX, y:e.clientY});
      }
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => setHover(null));
    cv.addEventListener('wheel', e => { e.preventDefault(); view.zoomT = SB.clamp(view.zoomT*(1 + Math.sign(e.deltaY)*.12), .58, 1.9); view.idle = 0; }, {passive:false});
  }
  let warmCountryT = 0, warmCountryKey = '';
  function setHover(h, x, y){

    if(!c){ clearTimeout(warmCountryT); warmCountryKey = ''; tip.classList.remove('show'); return; }
    if(c.key !== warmCountryKey){ clearTimeout(warmCountryT); warmCountryKey = c.key; warmCountryT = setTimeout(() => SB.scenes.prefetch?.('country',{k:c.key}),180); }

    tip.innerHTML = `<b>${SB.esc(c.zh)}</b>${SB.esc(SB.geo.continent(c.cont)?.name || '')}${n ? ` · ${SB.icon('star')}${n} 座城市` : ''}`;

  /* ── 飞转定位：把经纬度转到正对镜头 ── */
  const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
  function targetRotation(lon, lat){
    const v = lonLatToVec(lon, lat, 1), r = Math.hypot(v.x, v.z);
    let y = -Math.atan2(v.x, v.z); const x = SB.clamp(Math.atan2(v.y, r), -1.25, 1.25);

  }
  function flyTo(lon, lat, zoom){

    const ang = Math.abs(to.y - view.rotY) + Math.abs(to.x - view.rotX);

      r.position.set(r.userData.pos[k*3], r.userData.pos[k*3+1], r.userData.pos[k*3+2]); r.material.opacity = Math.sin(Math.PI*p); });
    if(focusGroup.visible){
      const ft = (now - focus.t0)/1000;
      focusRings.forEach((m, i) => { const ph = ((ft*.55 + i*.5) % 1); const s = m.userData.big*(.3 + ph*1.1); m.scale.set(s, s, s); m.material.opacity = (1 - ph)*.9*(focus.on ? 1 : 0); });
      focusStar.material.opacity = focusStar.userData.show && focus.on ? .85 + .15*Math.sin(ft*5) : 0; focusStar.scale.setScalar(.09 + .02*Math.sin(ft*3));
    }
    if(!tmpV.v){ tmpV.v = new T.Vector3(); tmpV.n = new T.Vector3(); }
    globe.updateMatrixWorld();
    const W = innerWidth, H = innerHeight;
    contBtns.forEach(({c, b}) => {
      const p = lonLatToVec(c.center[0], c.center[1], 1.02).applyMatrix4(globe.matrixWorld);
      tmpV.n.copy(p).normalize();
      const facing = tmpV.n.dot(tmpV.v.copy(camera.position).sub(p).normalize());
      p.project(camera);
      const x = (p.x*.5 + .5)*W, y = (-p.y*.5 + .5)*H;
      const a = SB.clamp((facing - .1)*3, 0, 1)*ease*(focus.on && focus.kind !== 'cont' ? .35 : 1);
      b.style.opacity = a.toFixed(2); b.style.pointerEvents = a > .3 ? 'auto' : 'none';
      b.style.transform = `translate(${(x - b.offsetWidth/2).toFixed(1)}px, ${(y - b.offsetHeight + 3).toFixed(1)}px)`;
    });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  function start(){ if(running || !ready) return; running = true; last = 0; requestAnimationFrame(loop); }
  function stop(){ running = false; if(fly.on){ view.rotX = fly.x1; view.rotY = fly.y1; fly.on = false; fly.done?.(); fly.done = null; } }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(SB.scenes.current === 'globe') start(); });

  /* 记住刚离开的国家：从国家地图返回时地球转向它 */
  let lastCountry = null;
  document.addEventListener('sb:scene', e => { if(e.detail.id === 'country') lastCountry = e.detail.params?.k || null; else if(e.detail.id !== 'globe') lastCountry = null; });

  SB.globe = { warmEngine:()=>SB.loadScript(THREE_URLS), prepare:init, focus:o => focusTo(o), search:q => { qIn.value = q; search(); return S; } };

  SB.scenes.register('globe', {
    world:'night', deepLink:true,
    title:()=>'世界星图',
    parent:()=>null,
    prepare(){ return init(); },
    async enter(p, opts){
      SB.fx.palette('night'); SB.fx.orbit(null);
      setTimeout(() => SB.fx.warp(false), p?.fromBook ? 900 : 0);
      setTimeout(() => SB.fx.calm(), 1400);
      refreshStats(); closeResults();
      const back = lastCountry && SB.geo.country(lastCountry); lastCountry = null;
      view.intro = p?.fromBook ? 0 : back ? .8 : .55;
      try{ await init(); }catch(e){ return; }
      resize(); view.zoomT = 1; start();
      if(back && back.mid){
        // 从国家地图返回：转向这个国家并短暂高亮（不弹信息卡）
        const v = back.mid; focusTo({kind:'country', key:back.key, zh:back.zh, lon:v[0], lat:v[1], silent:true});
        setTimeout(() => { if(focus.o?.silent) endFocus(); }, 4200);
      }
    },
    leave(){ stop(); setHover(null); closeResults(); hideCard(); }
  });

  SB.menu.add({id:'globe', order:20, icon:'globe', label:'世界星图', desc:'旋转地球，搜索任意城市，寻找我们的足迹',
    current:() => SB.scenes.current === 'globe',
    action(){ if(SB.scenes.current === 'book') SB.magicBook.open(); else SB.scenes.go('globe', {}, {transition:'flash'}); } });
})(window.SB);

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('cm-svg'), view = $('cm-view'), pop = $('cm-pop');
  const STAR = '<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 -10 L1.8 -1.8 L10 0 L1.8 1.8 L0 10 L-1.8 1.8 L-10 0 L-1.8 -1.8Z" fill="#ffe2a8"/></svg>';
  $('cm-zin').innerHTML = SB.icon('plus'); $('cm-zout').innerHTML = SB.icon('minus'); $('cm-zreset').innerHTML = SB.icon('reset');
  const S = { k:null, country:null, map:null, regions:[], fit:null, vb:null, pathEls:{}, starEls:{}, hot:null, hideT:0, token:0 };

  /* ── 坐标拟合与缩放 ── */
  function fitBox(){
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    S.regions.forEach(r => { b[0] = Math.min(b[0], r.bbox[0]); b[1] = Math.min(b[1], r.bbox[1]); b[2] = Math.max(b[2], r.bbox[2]); b[3] = Math.max(b[3], r.bbox[3]); });
    const W = innerWidth, H = innerHeight, top = W < 700 ? 150 : 110, bottom = 40;
    // 视图坐标 = 屏幕像素：把地图塞进 (0, top) - (W, H - bottom)
    const aw = W - 40, ah = H - top - bottom;
    const s = Math.min(aw/(b[2]-b[0] || 1), ah/(b[3]-b[1] || 1));
    S.fit = { s, ox: (W - (b[2]-b[0])*s)/2 - b[0]*s, oy: top + (ah - (b[3]-b[1])*s)/2 - b[1]*s };
    S.vb = { x:0, y:0, k:1 };
  }
  const X = x => x*S.fit.s + S.fit.ox, Y = y => y*S.fit.s + S.fit.oy;
  function applyView(){
    view.setAttribute('transform', `translate(${S.vb.x.toFixed(1)} ${S.vb.y.toFixed(1)}) scale(${S.vb.k.toFixed(4)})`);
    const ks = 1/S.vb.k;
    for(const id in S.starEls) S.starEls[id].setAttribute('transform', `translate(${S.starEls[id]._x} ${S.starEls[id]._y}) scale(${ks.toFixed(4)})`);
  }
  function zoomAt(f, cx, cy){
    const k = SB.clamp(S.vb.k*f, 1, 14); f = k/S.vb.k;
    S.vb.x = cx - (cx - S.vb.x)*f; S.vb.y = cy - (cy - S.vb.y)*f; S.vb.k = k; applyView(); hidePop(true);
  }

  /* ── 绘制 ── */
  function pathD(polys){
    let d = '';
    for(const poly of polys) for(const r of poly){ d += 'M' + X(r[0]).toFixed(1) + ' ' + Y(r[1]).toFixed(1);
      for(let i = 2; i < r.length; i += 2) d += 'L' + X(r[i]).toFixed(1) + ' ' + Y(r[i+1]).toFixed(1); d += 'Z'; }
    return d;
  }
  function draw(){
    fitBox();
    const gR = $('cm-regions'), gL = $('cm-lines'), gS = $('cm-stars');
    gR.innerHTML = gL.innerHTML = gS.innerHTML = ''; S.pathEls = {}; S.starEls = {};
    for(const r of S.regions){
      const p = document.createElementNS(NS, 'path'); p.setAttribute('d', pathD(r.polys)); p.setAttribute('class', 'cm-region');
      p.dataset.key = r.key; p.setAttribute('aria-label', r.name);
      gR.appendChild(p); S.pathEls[r.key] = p;
      const s = document.createElementNS(NS, 'g'); s.setAttribute('class', 'cm-star');
      s.innerHTML = '<circle class="halo" r="22"/><use class="core" href="#cmStarShape" x="-7" y="-7" width="14" height="14"/>';
      s._x = X(r.mid[0]).toFixed(1); s._y = Y(r.mid[1]).toFixed(1);
      gS.appendChild(s); S.starEls[r.key] = s;
    }
    for(const l of (S.map?.lines || [])){
      const p = document.createElementNS(NS, 'path'); let d = 'M' + X(l[0]).toFixed(1) + ' ' + Y(l[1]).toFixed(1);
      for(let i = 2; i < l.length; i += 2) d += 'L' + X(l[i]).toFixed(1) + ' ' + Y(l[i+1]).toFixed(1);
      p.setAttribute('d', d); p.setAttribute('class', 'cm-line'); gL.appendChild(p);
    }
    applyView(); paint();
  }
  function paint(popKey){
    const lit = SB.store.visitedRegions(S.k);
    let n = 0;
    for(const r of S.regions){
      const on = lit.has(r.key); if(on) n++;
      S.pathEls[r.key]?.classList.toggle('lit', on);
      const s = S.starEls[r.key]; if(!s) continue;
      s.classList.toggle('lit', on);
      if(popKey === r.key){ s.classList.remove('pop'); void s.getBBox; requestAnimationFrame(() => s.classList.add('pop')); setTimeout(() => s.classList.remove('pop'), 1300); }
    }
    const cityN = SB.store.citiesIn(S.k).length;
    const unit = {cn:'个省份', us:'个州', jp:'个都道府县', au:'个州', ca:'个省', in:'个邦', de:'个州', ru:'个联邦主体'}[S.k] || '个地区';
    $('cm-stat').textContent = S.regions.length > 1 ? `点亮 ${n} / ${S.regions.length} ${unit} · ${cityN} 座城市` : (cityN ? `已点亮 · ${cityN} 个足迹` : '还没有点亮');
  }

  /* ── 悬浮窗 ── */
  function regionByKey(key){ return S.regions.find(r => r.key === key); }
  function showPop(key, anchor){
    const r = regionByKey(key); if(!r) return;
    clearTimeout(S.hideT);
    if(S.hot && S.hot !== key) S.pathEls[S.hot]?.classList.remove('hot');
    S.hot = key; S.pathEls[key]?.classList.add('hot');
    buildPop(r);
    // 定位：星星旁边
    const sr = (S.starEls[key] || S.pathEls[key]).getBoundingClientRect();
    const px = anchor?.x ?? (sr.left + sr.width/2), py = anchor?.y ?? (sr.top + sr.height/2);
    pop.classList.add('show');
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let x = px + 18, y = py - h/2;
    if(x + w > innerWidth - 12) x = px - w - 18;
    x = SB.clamp(x, 12, innerWidth - w - 12); y = SB.clamp(y, 70, innerHeight - h - 12);
    pop.style.transform = ''; pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function hidePop(now){
    clearTimeout(S.hideT);
    const go = () => { pop.classList.remove('show'); if(S.hot) S.pathEls[S.hot]?.classList.remove('hot'); S.hot = null; };
    if(now === true) go(); else S.hideT = setTimeout(go, 400);
  }
  pop.addEventListener('pointerenter', () => clearTimeout(S.hideT));
  pop.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse' && !pop.contains(document.activeElement)) hidePop(); });

  function buildPop(r){
    const cities = SB.store.citiesInRegion(r.key);
    pop.innerHTML = '';
    const x = SB.el('button','x'); x.type = 'button'; x.setAttribute('aria-label','关闭'); x.innerHTML = SB.icon('close'); x.addEventListener('click', () => hidePop(true));
    const h = SB.el('h4'); h.textContent = r.name;
    pop.append(x, h);
    if(r.en && r.en !== r.name){ const en = SB.el('div','en'); en.textContent = r.en; pop.appendChild(en); }
    if(cities.length){
      const ul = SB.el('ul');
      for(const c of cities){
        const li = SB.el('li');
        const b = SB.el('button','city'); b.type = 'button';
        const mN = SB.store.memoriesOf(c.id).length;
        b.innerHTML = `${STAR}<span></span>${mN ? `<em>${mN} 段回忆</em>` : ''}`; b.querySelector('span').textContent = c.name;
        b.addEventListener('click', e => { hidePop(true); SB.scenes.go('city', {id:c.id}, {transition:'quill', x:e.clientX, y:e.clientY}); });
        li.appendChild(b);
        if(SB.store.canEdit){
          const ed = SB.el('button','edit'); ed.type = 'button'; ed.setAttribute('aria-label', '编辑 ' + c.name); ed.innerHTML = SB.icon('quill');
          ed.addEventListener('click', () => editCity(c)); li.appendChild(ed);
        }
        ul.appendChild(li);
      }
      pop.appendChild(ul);
    }else{ const p = SB.el('p','none'); p.textContent = '这里还没有我们的足迹'; pop.appendChild(p); }
    if(SB.store.canEdit){
      const add = SB.el('div','add');
      const btn = SB.ui.button('添加城市', 'small', null, 'plus');
      btn.addEventListener('click', () => {
        add.innerHTML = '';
        const inp = SB.ui.input({type:'text', placeholder:'城市名，例如：成都', maxlength:'30', 'aria-label':'城市名'});
        const ok = SB.ui.button('点亮', 'primary small');
        const save = async () => {
          ok.disabled = true;
          try{
            const lon = r.lonlat?.[0] ?? S.country.mid?.[0], lat = r.lonlat?.[1] ?? S.country.mid?.[1];
            await SB.store.addCity({country:S.k, countryName:S.country.zh, region:r.key, regionName:r.name, name:inp.value, lon, lat});
            SB.toast(`${inp.value.trim()} 已点亮`);
            SB.fx.burst(500);
            paint(r.key); buildPop(r);
          }catch(e){ SB.toast(e.msg || SB.store.errText(e)); ok.disabled = false; }
        };
        ok.addEventListener('click', save);
        inp.addEventListener('keydown', e => { if(e.key === 'Enter') save(); });
        add.append(inp, ok); inp.focus();
      });
      add.appendChild(btn); pop.appendChild(add);
    }
  }
  function editCity(c){
    hidePop(true);
    let inp;
    SB.ui.dialog({ title:'编辑城市', sub:c.regionName + ' · ' + c.countryName,
      build(b){ inp = SB.ui.input({type:'text', value:c.name, maxlength:'30'}); b.appendChild(SB.ui.field('城市名', inp)); },
      actions:[
        {text:'删除这座城市', kind:'danger', async onClick(){
          const n = SB.store.memoriesOf(c.id).length;
          if(!await SB.ui.confirm(n ? `删除「${c.name}」会同时删除它的 ${n} 段回忆和照片，无法恢复。确定吗？` : `确定删除「${c.name}」吗？`, '删除')) return false;
          try{ await SB.store.removeCity(c.id); SB.toast('已删除'); paint(); }catch(e){ SB.toast(SB.store.errText(e)); return false; } }},
        'spacer',
        {text:'取消'},
        {text:'保存', kind:'primary', async onClick(){
          const name = inp.value.trim(); if(!name){ SB.toast('城市名不能为空'); return false; }
          try{ await SB.store.updateCity(c.id, {name}); SB.toast('已保存'); }catch(e){ SB.toast(SB.store.errText(e)); return false; } }}
      ]});
  }

  /* ── 指针：悬停、点按、拖拽、缩放 ── */
  const ptrs = new Map(); let pinch = 0, moved = 0;
  const tapMoveLimit = SB.perf.touch ? 14 : 6;
  svg.addEventListener('pointerover', e => {
    if(e.pointerType !== 'mouse' || ptrs.size) return;
    const key = e.target.dataset?.key; if(key) showPop(key);
  });
  svg.addEventListener('pointerout', e => { if(e.pointerType === 'mouse' && e.target.dataset?.key && !pop.contains(e.relatedTarget)) hidePop(); });
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, key:e.target.dataset?.key}); moved = 0;
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a.x-b.x, a.y-b.y); }
  });
  svg.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinch) zoomAt(d/pinch, (a.x+b.x)/2, (a.y+b.y)/2); pinch = d; return; }
    if(moved > 4){ svg.classList.add('dragging'); S.vb.x += dx; S.vb.y += dy; applyView(); if(moved > 8) hidePop(true); }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = 0; svg.classList.remove('dragging');
    if(p && moved < tapMoveLimit && e.type === 'pointerup'){
      // 手机点按 / 鼠标点击：打开悬浮窗
      const el = document.elementFromPoint(e.clientX, e.clientY), key = el?.dataset?.key;
      if(key) showPop(key, e.pointerType === 'mouse' ? null : null); else hidePop(true);
    }
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, e.clientX, e.clientY); }, {passive:false});
  svg.addEventListener('dblclick', () => { S.vb = {x:0, y:0, k:1}; applyView(); });
  $('cm-zin').addEventListener('click', () => zoomAt(1.4, innerWidth/2, innerHeight/2));
  $('cm-zout').addEventListener('click', () => zoomAt(1/1.4, innerWidth/2, innerHeight/2));
  $('cm-zreset').addEventListener('click', () => { S.vb = {x:0, y:0, k:1}; applyView(); hidePop(true); });
  document.addEventListener('pointerdown', e => { if(SB.scenes.current === 'country' && pop.classList.contains('show') && !pop.contains(e.target) && !svg.contains(e.target)) hidePop(true); });
  addEventListener('resize', () => { if(SB.scenes.current === 'country' && S.regions.length) draw(); });
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'country' && S.regions.length){ paint(); if(S.hot && pop.classList.contains('show')) buildPop(regionByKey(S.hot)); } });

  /* ── 载入国家 ── */
  function fallbackRegions(c){
    const polar = c.key === 'aq', R = Math.PI/180;
    const proj = polar ? (lon, lat) => { const r = 90 + lat, a = lon*R; return [Math.sin(a)*r, Math.cos(a)*r]; }
                       : (lon, lat) => [lon, -Math.log(Math.tan(Math.PI/4 + SB.clamp(lat,-85,85)*R/2))/R];
    const polys = c.rings.map(r => { const o = []; let off = 0;
      for(let i = 0; i < r.length; i += 2){ if(polar && r[i+1] < -89.5) continue; if(i){ const d = r[i] - r[i-2]; if(d > 180) off -= 360; else if(d < -180) off += 360; } o.push(...proj(r[i] + off, r[i+1])); }
      return [o]; });
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    polys.forEach(p => p.forEach(r => { for(let i = 0; i < r.length; i += 2){ b[0] = Math.min(b[0], r[i]); b[1] = Math.min(b[1], r[i+1]); b[2] = Math.max(b[2], r[i]); b[3] = Math.max(b[3], r[i+1]); } }));
    const mid = c.mid?.[0] != null && !polar ? proj(c.mid[0], c.mid[1]) : [(b[0]+b[2])/2, (b[1]+b[3])/2];
    return [{ key:c.key + '-all', en:c.en, name:c.zh, polys, bbox:b, mid, lonlat:c.mid }];
  }
  async function load(k){
    const token = ++S.token;
    S.k = k; S.country = SB.geo.country(k);
    $('cm-title').textContent = S.country?.zh || k; $('cm-en').textContent = (S.country?.en || '').toUpperCase();
    $('cm-regions').innerHTML = $('cm-lines').innerHTML = $('cm-stars').innerHTML = ''; S.regions = []; hidePop(true);
    $('cm-stat').textContent = '';
    const loadEl = $('cm-load'); loadEl.hidden = false; loadEl.innerHTML = ''; loadEl.appendChild(SB.ui.spinner('正在描绘星图…'));
    let regions = null; S.map = null;
    if(S.country?.hasMap){
      try{ S.map = await SB.geo.loadCountryMap(k); regions = S.map.regions; }
      catch(e){ SB.toast('省级地图暂时加载不了，先用整国地图'); }
    }
    if(token !== S.token) return;
    if(!regions || !regions.length) regions = fallbackRegions(S.country);
    S.regions = regions; loadEl.hidden = true;
    draw();
  }

  SB.scenes.register('country', {
    world:'night',
    title:p => SB.geo.country(p.k)?.zh || '国家',
    // v1.8.0：大洲国家目录页已删除，国家地图直接返回世界星图（地球会自动转向这个国家）
    parent:() => ({id:'globe', params:{}}),
    prepare(p){ const c = SB.geo.country(p.k); return c?.hasMap ? SB.geo.loadCountryMap(p.k).catch(()=>null) : Promise.resolve(); },
    enter(p){ SB.fx.palette('night'); return load(p.k); },
    leave(){ hidePop(true); }
  });
})(window.SB);

      <div class="ca-sigil" aria-hidden="true"><svg viewBox="-100 -100 200 200"><g fill="none" stroke="currentColor">
        <circle r="96" stroke-width=".6"/><circle r="90" stroke-width=".4" stroke-dasharray="1 3"/><circle r="62" stroke-width=".5"/>
        <path d="M0-88 L18-18 88 0 18 18 0 88-18 18-88 0-18-18Z" stroke-width=".6"/><path d="M-62-62 62 62M62-62-62 62" stroke-width=".35"/>
        <path d="M0-62 L44-44 62 0 44 44 0 62-44 44-62 0-44-44Z" stroke-width=".4"/></g></svg></div>
      <small id="ca-en"></small><h1 id="ca-title"></h1><div class="ca-rule" id="ca-rule"></div>
      <div class="ca-stats" id="ca-stats"></div><div id="ca-cta"></div>
    </header>
    <div id="ca-body"></div>
  </div>
</section>

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12Z" fill="currentColor"/></svg>';
  const GRADE = {spring:'rgba(255,170,195,.6)', summer:'rgba(255,205,120,.6)', autumn:'rgba(235,120,40,.65)', winter:'rgba(150,190,255,.65)'};
  let cityId = null, revealT = 0;
  SB.fmtDate = d => { if(!d) return '未标注时间'; const [y,m] = d.split('-'); return m ? `${y} 年 ${+m} 月` : `${y} 年`; };
  const roman = n => { const R = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for(const [v,r] of R) while(n >= v){ s += r; n -= v; } return s; };
  const ROMAN = n => n <= 39 ? roman(n) : String(n);
  const fmtDur = ms => { const s = Math.round(ms/1000); return s < 60 ? `约 ${s} 秒` : `约 ${Math.floor(s/60)} 分${s % 60 ? ' ' + s % 60 + ' 秒' : ''}`; };
  const img = (id, eager=false, priority='low') => {
    const u = id ? SB.store.url(id) : '';
    return u ? `<img alt="" loading="${eager ? 'eager' : 'lazy'}" decoding="async" fetchpriority="${priority}" src="${SB.esc(u)}">` : '';
  };
  const go = (e, m, autoplay) => {
    SB.player?.prime?.(m);
    return SB.scenes.go('player', autoplay ? {id:m.id, autoplay:true} : {id:m.id},
      {transition:'pensieve', x:e?.clientX || innerWidth/2, y:e?.clientY || innerHeight/2});
  };

  function chapter(m, k){
    const ch = SB.el('article', 'ca-ch'); ch.setAttribute('role', 'article');
    ch.innerHTML = `<div class="ca-node" aria-hidden="true"><span class="num">${ROMAN(k + 1)}</span><span class="ym">${SB.esc((m.date || '').replace('-', ' · '))}</span></div>`;
    const card = SB.el('div', 'ca-card'); card.tabIndex = 0; card.style.animationDelay = (k*90) + 'ms';
    card.setAttribute('aria-label', '打开放映厅：' + m.title);
    const C = SB.cinema, style = C?.styleOf(m) || 'cinema', sty = C?.styles.find(s => s.id === style);
    const season = C ? C.resolveSeason(C.seasonPref(m), m.date) : 'none', sea = C?.seasons.find(s => s.id === season);
    const slides = (m.slides || []).filter(s => s.id), cover = m.cover?.id || slides[0]?.id;
    let dur = ''; try{ if(slides.length && SB.player?.estimate) dur = fmtDur(SB.player.estimate(m, style)); }catch(e){}
    const music = m.bgmMode !== 'none' && (m.bgm || SB.store.settings?.bgm);
    const thumbLimit = SB.perf.touch || SB.perf.level !== 'high' ? 3 : 5;
    const thumbs = slides.slice(0, thumbLimit).map((s, i) =>
      i === thumbLimit - 1 && slides.length > thumbLimit ? `<i class="more">+${slides.length - (thumbLimit - 1)}</i>` : `<i>${img(s.id, false, 'low')}</i>`
    ).join('');
    const eagerCover = k < (SB.perf.touch ? 1 : 2);
    card.innerHTML = `
      <div class="ca-poster">${img(cover, eagerCover, eagerCover ? 'high' : 'low')}<div class="grade" style="background:${GRADE[season] || 'transparent'}"></div>
        <div class="ca-badges">${sty ? `<span class="ca-badge">${C.icon(style)}${sty.en}</span>` : '<span></span>'}${season !== 'none' && sea ? `<span class="ca-badge">${C.icon(season)}${sea.en}</span>` : ''}</div></div>
      <div class="ca-info">
        <div class="ca-kicker">CHAPTER ${ROMAN(k + 1)}<em>${SB.esc(SB.fmtDate(m.date))}</em></div>
        <h2></h2>
        <div class="ca-facts"><span>${SB.icon('star')}${slides.length} 张照片</span>${dur ? `<span>${PLAY.replace('<svg', '<svg class="sb-ico"')}${dur}</span>` : ''}${sty ? `<span>${C.icon(style)}${sty.name}${season !== 'none' && sea ? ' · ' + sea.name : ''}</span>` : ''}${music ? `<span>${SB.icon('note')}配乐</span>` : ''}</div>
        ${m.note ? '<p class="ca-note"></p>' : ''}
        ${thumbs ? `<div class="ca-strip" aria-hidden="true">${thumbs}</div>` : ''}
        <div class="ca-acts"></div>
      </div>`;
    card.querySelector('h2').textContent = SB.fmtTitle(m.title);
    if(m.note) card.querySelector('.ca-note').textContent = m.note;
    const acts = card.querySelector('.ca-acts');
    const play = SB.ui.button('放映', 'primary play', e => { e.stopPropagation(); go(e, m, true); });
    play.innerHTML = PLAY + '<span>放映</span>'; play.setAttribute('aria-label', '放映：' + m.title);
    const hall = SB.ui.button('放映厅', 'small', e => { e.stopPropagation(); go(e, m, false); }); hall.setAttribute('aria-label', '打开放映厅：' + m.title);
    acts.append(play, hall);
    if(SB.store.canEdit){ const ed = SB.ui.button('编辑', 'small', e => { e.stopPropagation(); SB.editor.open({cityId, memory:m}); }, 'quill'); ed.setAttribute('aria-label', '编辑：' + m.title); acts.appendChild(ed); }
    card.addEventListener('click', e => go(e, m, false));
    card.addEventListener('keydown', e => { if(e.target === card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); go(null, m, false); } });
    ch.appendChild(card);
    return ch;
  }

  function render(){
    const c = SB.store.city(cityId);
    const body = $('ca-body'); body.innerHTML = ''; $('ca-stats').innerHTML = ''; $('ca-cta').innerHTML = '';
    if(!c){ const e = SB.el('div','sb-empty'); e.textContent = '这座城市已经不在星图上了'; body.appendChild(e); return; }
    $('ca-title').textContent = c.name; $('ca-ghost').textContent = c.name;
    $('ca-en').textContent = [c.countryName, c.regionName].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ');
    $('ca-rule').innerHTML = SB.icon('spark');
    const list = SB.store.memoriesOf(cityId);
    if(list.length){
      const photos = list.reduce((n, m) => n + (m.slides || []).length, 0);
      const dates = list.map(m => m.date).filter(Boolean).sort();
      const span = dates.length ? (dates[0] === dates[dates.length - 1] ? SB.fmtDate(dates[0]) : `${SB.fmtDate(dates[0])} — ${SB.fmtDate(dates[dates.length - 1])}`) : '';
      $('ca-stats').innerHTML = `<span><b>${list.length}</b>段回忆</span><span><b>${photos}</b>张照片</span>${span ? `<span>${SB.esc(span)}</span>` : ''}`;
      if(SB.store.canEdit) $('ca-cta').appendChild(SB.ui.button('新的回忆', 'primary', () => SB.editor.open({cityId}), 'plus'));
    }
    if(!list.length){
      // v1.8.1 空白章节卡：与章节卡片同比例（左 3:4 空相框 + 右文字），手机上相框为 4:3 横幅
      $('ca-stats').innerHTML = '<span><b>0</b>段回忆</span><span>等待第一章</span>';
      const can = SB.store.canEdit;
      const e = SB.el('article','ca-blank'); e.setAttribute('aria-label', '空白章节');
      e.innerHTML = `<button type="button" class="ca-blank-frame"${can ? ' aria-label="添加第一段回忆"' : ' disabled aria-hidden="true" tabindex="-1"'}>
          <svg class="dash" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="8"/></svg>
          <svg class="emb" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><circle r="44"/><circle r="36" stroke-dasharray="1.5 3.5"/><path d="M0 -34 L10 -7 L34 0 L10 7 L0 34 L-10 7 L-34 0 L-10 -7Z"/></g></svg>
          ${can ? `<span class="plus">${SB.icon('plus')}</span><small>第一张照片</small>` : ''}</button>
        <div class="ca-blank-info"><span class="rn">CHAPTER I<b>第一章</b></span><h2>这里还没有回忆</h2>
          <p>${can ? '把在这座城市的照片和故事放进来，它就会成为星图上的一颗星。' : '这座城市的故事还在等待被写下。'}</p></div>`;
      if(can){
        e.querySelector('.ca-blank-frame').addEventListener('click', () => SB.editor.open({cityId}));
        e.querySelector('.ca-blank-info').appendChild(SB.ui.button('写下第一章', 'primary', () => SB.editor.open({cityId}), 'plus'));
      }
      body.appendChild(e); return;
    }
    const line = SB.el('div','ca-line');
    list.forEach((m, k) => line.appendChild(chapter(m, k)));
    if(SB.store.canEdit){
      const ch = SB.el('div', 'ca-ch');
      ch.innerHTML = `<div class="ca-node" aria-hidden="true"><span class="num">${SB.icon('spark')}</span></div>`;
      const b = SB.el('button', 'ca-new', `<span class="ring">${SB.icon('plus')}</span><span><b>写下第 ${ROMAN(list.length + 1)} 章</b><span>新的一页：添加照片、写下它们的故事，选好放映风格与季节</span></span>`);
      b.type = 'button'; b.style.animationDelay = (list.length*90) + 'ms';
      b.addEventListener('click', () => SB.editor.open({cityId}));
      ch.appendChild(b); line.appendChild(ch);
    }
    body.appendChild(line);
    // 保险：入场动画结束（或在个别设备上没有启动）后移除动画，保证卡片一定可见
    const n = line.children.length;
    clearTimeout(revealT); revealT = setTimeout(() => line.querySelectorAll('.ca-card,.ca-new').forEach(e => { e.style.animation = 'none'; }), 1000 + n*90);
  }
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'city') render(); });


  async function prepareCity(p){
    const memories = SB.store.memoriesOf(p.id);
    const limit = SB.perf.touch ? 2 : 4, ids = [];
    for(const m of memories.slice(0, limit)){
      const slides = (m.slides || []).filter(s => s.id);
      const cover = m.cover?.id || slides[0]?.id;
      if(cover) ids.push(cover);
    }
    if(ids.length) await SB.store.prefetchUrls?.(ids);
  }

  SB.scenes.register('city', {
    world:'night',
    title:p => SB.store.city(p.id)?.name || '城市',
    parent:p => { const c = SB.store.city(p.id); return c ? {id:'country', params:{k:c.country}} : {id:'globe', params:{}}; },
    prepare:prepareCity,
    enter(p){ cityId = p.id; SB.fx.palette('night'); render(); document.querySelector('.sb-scene[data-scene="city"]').scrollTop = 0; }
  });
})(window.SB);
</script>

<script>
/* ── 背景音乐 SB.audio：全站一个播放器，切换时淡入淡出；duck() 平滑压低 ── */
(function(SB){
  const el = new Audio(); el.loop = true; el.preload = 'auto';
  const BASE = .8;
  let want = true, unlocked = false, cur = null, override = null, fadeT = 0, gain = 1;
  try{ want = localStorage.getItem('sb-music') !== 'off'; }catch(e){}
  function fade(to, ms){
    cancelAnimationFrame(fadeT);
    return new Promise(res => { const from = el.volume, t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0)/ms); el.volume = SB.clamp(from + (to - from)*k, 0, 1); k < 1 ? fadeT = requestAnimationFrame(step) : res(); };
      fadeT = requestAnimationFrame(step); });
  }
  async function sync(){
    const track = override === undefined ? null : (override || SB.store.settings?.bgm || null);
    const id = track?.id || null;
    if(!want || !unlocked || !id){ if(!el.paused){ await fade(0, 900); el.pause(); } cur = id ? track : cur; SB.dock?.sync(); return; }
    if(cur?.id !== id || el.paused){
      if(!el.paused) await fade(0, 900);
      if(cur?.id !== id || !el.src){ el.src = SB.store.url(id); }
      cur = track; el.volume = 0;
      try{ await el.play(); await fade(BASE*gain, 1400); }catch(e){}
    }
    SB.dock?.sync();
  }
  SB.audio = {
    unlock(){ if(unlocked) return; unlocked = true; sync(); },
    set(track){ override = track; gain = 1; sync(); },          // 放映时：专属曲目 / null 表示用全站曲目 / undefined 表示静音
    clear(){ override = null; gain = 1; sync(); },
    duck(level = 1, ms = 1200){ gain = SB.clamp(level, 0, 1); if(!el.paused) fade(BASE*gain, ms); },   // 终章时把音量平滑压低，duck(1) 恢复
    toggle(){ want = !want; try{ localStorage.setItem('sb-music', want ? 'on' : 'off'); }catch(e){} unlocked = true; sync(); return want; },
    get on(){ return want; }, get playing(){ return !el.paused; }, get track(){ return cur; },
    preview(id){ const a = new Audio(SB.store.url(id)); a.volume = .8; return a; }
  };
  document.addEventListener('pointerdown', () => SB.audio.unlock(), {once:true});
  document.addEventListener('sb:data', () => { if(override === null) sync(); });

  /* v1.8.1：背景音乐从菜单移到右上角「音乐」标识（SB.dock）；全站音乐的试听 / 上传 / 更换 / 移除也从总览页迁移到这里 */
  let previewA = null;
  SB.dock.add({id:'music', order:10, label:'背景音乐', eq:true,
    icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.2V6.3l10-2v10.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="6.8" cy="17.3" r="2.3" fill="currentColor"/><circle cx="16.8" cy="15.2" r="2.3" fill="currentColor"/></svg>',
    state(b){ b.classList.toggle('playing', SB.audio.playing); },
    render(p){
      p.innerHTML = '<h4>背景音乐</h4><p class="rn">CANTUS · STELLARUM</p>';
      const row = SB.el('div', 'row'); const lb = SB.el('span', 'lb'); lb.textContent = SB.audio.on ? '音乐已开启' : '音乐已关闭'; row.appendChild(lb);
      const sw = SB.el('button', 'sb-switch'); sw.type = 'button'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', String(SB.audio.on)); sw.setAttribute('aria-label', '背景音乐开关');
      sw.addEventListener('click', () => { SB.audio.toggle(); SB.dock.refresh('music'); });
      row.appendChild(sw); p.appendChild(row);
      const bgm = SB.store.settings?.bgm, now = SB.audio.track?.name;
      const info = SB.el('p', 'sm'); info.style.margin = '6px 0 0';
      info.textContent = now ? (SB.audio.playing ? '♪ 正在播放：' : '♪ ') + now : bgm ? '♪ 全站音乐：' + bgm.name : '还没有全站背景音乐' + (SB.store.canEdit ? '，上传一首属于你们的歌吧' : '');
      p.appendChild(info);
      const acts = SB.el('div', 'acts');
      if(bgm) acts.appendChild(SB.ui.button(previewA && !previewA.paused ? '停止试听' : '试听', 'small', () => {
        if(previewA && !previewA.paused){ previewA.pause(); } else { previewA = SB.audio.preview(bgm.id); previewA.play().catch(()=>{}); previewA.onended = () => SB.dock.refresh('music'); }
        SB.dock.refresh('music'); }));
      if(SB.store.canEdit && SB.store.canUpload){
        const up = SB.el('label', 'sb-btn small primary'); up.style.position = 'relative'; up.textContent = bgm ? '换一首' : '上传音乐';
        const inp = SB.el('input'); inp.type = 'file'; inp.accept = 'audio/*,.mp3,.m4a,.aac,.wav,.mp4'; inp.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer';
        inp.setAttribute('aria-label', '选择音乐文件');
        inp.addEventListener('change', async () => {
          const f = inp.files[0]; if(!f) return; inp.value = '';
          try{ const r = await SB.store.uploadAudio(f, step => { info.textContent = step; });
            const old = SB.store.settings?.bgm?.id;
            await SB.store.saveSettings({bgm:r});
            if(old && !SB.store.memories.some(m => m.bgm?.id === old)) SB.store.deleteFile(old);
            SB.toast('全站背景音乐已更新'); SB.audio.unlock(); SB.dock.refresh('music');
          }catch(e){ SB.toast(e.msg || SB.store.errText(e), 4200); SB.dock.refresh('music'); }
        });
        up.appendChild(inp); acts.appendChild(up);
        if(bgm) acts.appendChild(SB.ui.button('移除', 'small danger', async () => {
          SB.dock.close();
          if(!await SB.ui.confirm('移除全站背景音乐？', '移除')) return;
          try{ await SB.store.saveSettings({bgm:null}); if(!SB.store.memories.some(m => m.bgm?.id === bgm.id)) SB.store.deleteFile(bgm.id); }catch(e){ SB.toast(SB.store.errText(e)); }
        }));
      }
      if(acts.children.length) p.appendChild(acts);
    }});
  el.addEventListener('play', () => SB.dock.sync()); el.addEventListener('pause', () => SB.dock.sync());
  document.addEventListener('sb:data', () => SB.dock.refresh('music'));
})(window.SB);

/* ── 放映风格与季节的公共定义（编辑器也使用）：SB.cinema ── */
(function(SB){
  const svg = (inner, cls) => `<svg class="sb-ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${inner}</svg>`;
  const S = 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    cinema:`<rect x="3" y="5" width="18" height="14" rx="1.5" ${S}/><path d="M12 5v14M3 9h3M3 15h3M18 9h3M18 15h3" ${S}/>`,
    constellation:`<path d="M5 17 10 8l5 5 4-8" ${S} stroke-width="1.1" opacity=".75"/><circle cx="5" cy="17" r="1.8" fill="currentColor"/><circle cx="10" cy="8" r="1.6" fill="currentColor"/><circle cx="15" cy="13" r="1.8" fill="currentColor"/><circle cx="19" cy="5" r="1.4" fill="currentColor"/>`,
