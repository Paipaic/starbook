<script>
/* ── 块 05 · v1.5 周年桥接存储：Supabase book_data(JSONB) + Private Storage ──
   对外继续暴露 V1 的 cities / memories / settings API，让地图、编辑器、播放器无需大改。
   book_data 是周年桥接层；V2 再正规化 memories / locations / assets 等表。 */
(function(SB){
  const cfg = window.STARBOOK_CONFIG || {};
  const BUCKET = cfg.storageBucket || 'starbook-media';
  const SIGN_TTL = Math.max(900, Number(cfg.signedUrlTtlSeconds) || 21600);
  const MAX_FILE = 25 * 1024 * 1024;
  const st = SB.store = { mode:'connecting', role:'viewer', canEdit:false, canUpload:false, cities:[], memories:[], settings:{}, revision:0, ready:null };
  const emit = () => document.dispatchEvent(new CustomEvent('sb:data'));
  const now = () => new Date().toISOString();
  const empty = () => ({cities:{}, memories:{}, settings:{}, trash:emptyTrash()});
  // v1.12.0 回收站（prompts/16-archive.md）：删除先进入 trash，30 天后才真正删除 Storage 文件
  const TRASH_DAYS = 30, DAY = 86400000;
  function emptyTrash(){ return {memories:{}, cities:{}, photos:{}, files:{}}; }
  function normTrash(t){ t = t || {}; return {memories:t.memories || {}, cities:t.cities || {}, photos:t.photos || {}, files:t.files || {}}; }
  const clone = o => JSON.parse(JSON.stringify(o));
  let data = empty(), dataSig = '';
  const preview = Object.create(null);   // 本次浏览器会话刚上传的文件 path → object URL
  const signed = Object.create(null);    // Private Storage path → {url, expiresAt}
  const signing = new Set();             // 正在补签的 path，避免同一图片并发重复请求

  function normalize(d){ return {cities:d?.cities || {}, memories:d?.memories || {}, settings:d?.settings || {}, trash:normTrash(d?.trash)}; }
  function setData(d){
    d = normalize(d); const sig = JSON.stringify(d); data = d;
    st.cities = Object.entries(d.cities).map(([id,v]) => ({id, ...v}));
    st.memories = Object.entries(d.memories).map(([id,v]) => ({id, ...v}));
    st.settings = d.settings;
    st.trash = d.trash;
    if(sig !== dataSig){ dataSig = sig; emit(); }
  }
  function memRefs(m, s){
    m?.cover?.id && s.add(m.cover.id);
    (m?.slides || []).forEach(x => x.id && s.add(x.id));
    m?.bgm?.id && s.add(m.bgm.id);
  }
  function liveRefs(d){
    const s = new Set();
    for(const m of Object.values(d?.memories || {})) memRefs(m, s);
    d?.settings?.bgm?.id && s.add(d.settings.bgm.id);
    return s;
  }
  // v1.12.0：回收站里的回忆、照片、文件也算「仍被引用」——在回收站期间不会删除 Storage 文件
  function refs(d){
    const s = liveRefs(d), t = d?.trash;
    if(t){
      for(const m of Object.values(t.memories || {})) memRefs(m, s);
      for(const [id, p] of Object.entries(t.photos || {})){ s.add(id); p?.slide?.id && s.add(p.slide.id); }
      for(const id of Object.keys(t.files || {})) s.add(id);
    }
    return s;
  }
  function errText(e){
    const c = e?.code || e?.statusCode || e?.status;
    const raw = String(e?.message || e?.error || '');
    if(e?.msg) return e.msg;
    if(c === 'conflict') return '另一台设备刚刚更新了这本书，请稍后再保存一次';
    if(c === 401 || /jwt|not authenticated/i.test(raw)) return '登录状态已失效，请重新登录';
    if(c === 403 || /row-level security|permission|policy/i.test(raw)) return '你目前没有执行这个操作的权限';
    if(c === 404) return '没有找到要读取的星屿数据';
    if(c === 'too_large' || /maximum allowed size|too large/i.test(raw)) return '文件太大（单个文件最多 25MB）';
    if(c === 'unsupported_type') return '暂不支持这种文件格式';
    if(c === 'decode') return '这张照片暂时无法读取，请换成 JPG / PNG 后再试';
    if(c === 429 || /rate limit|too many/i.test(raw)) return '操作有点频繁，请稍等一会儿再试';
    return '网络有点问题，没有保存成功，请再试一次';
  }
  st.errText = errText;

  function bookId(){ return SB.book?.current?.id || ''; }
  function bucket(){ return SB.supabase.storage.from(BUCKET); }
  function mayEdit(role){ return role === 'owner' || role === 'editor'; }

  async function readRow(){
    const id = bookId(); if(!id) throw new Error('book_not_ready');
    const {data:row,error} = await SB.supabase.from('book_data').select('payload,revision,updated_at').eq('book_id',id).maybeSingle();
    if(error) throw error;
    if(row) return {payload:normalize(row.payload), revision:Number(row.revision)||0, updated_at:row.updated_at};
    if(!st.canEdit) throw {code:403,msg:'这本书还没有初始化数据'};
    const seed = {book_id:id,schema_version:1,payload:empty(),revision:0};
    const {data:created,error:createErr} = await SB.supabase.from('book_data').insert(seed).select('payload,revision,updated_at').single();
    if(createErr) throw createErr;
    return {payload:normalize(created.payload),revision:Number(created.revision)||0,updated_at:created.updated_at};
  }

  async function signPaths(paths,{notify=false}={}){
    const soon = Date.now() + 5*60*1000;
    const need = [...new Set((paths || []).filter(path => path && !preview[path] && !signing.has(path) && (!signed[path] || signed[path].expiresAt < soon)))];
    if(!need.length) return true;
    need.forEach(path => signing.add(path));
    const expiresAt = Date.now() + SIGN_TTL*1000;
    let changed = false;
    try{
      const b = bucket();
      if(typeof b.createSignedUrls === 'function'){
        const {data:rows,error} = await b.createSignedUrls(need,SIGN_TTL); if(error) throw error;
        (rows || []).forEach((row,i) => {
          const path = row?.path || need[i], url = row?.signedUrl || row?.signedURL;
          if(path && url){ signed[path] = {url,expiresAt}; changed = true; }
        });
      }else{
        for(const path of need){
          const {data:row,error} = await b.createSignedUrl(path,SIGN_TTL); if(error) throw error;
          const url = row?.signedUrl || row?.signedURL;
          if(url){ signed[path] = {url,expiresAt}; changed = true; }
        }
      }
      return true;
    }catch(e){
      console.error('[Starbook signed urls]',e);
      return false;
    }finally{
      need.forEach(path => signing.delete(path));
      if(changed && notify) emit();
    }
  }
  async function warmUrls(d){ return signPaths([...refs(d)]); }
  // v1.7.2：播放器 / 相册可提前批量补齐签名地址，避免逐张轮询造成首屏等待。
  st.prefetchUrls = paths => signPaths(paths || []);

  async function applyRemote(row){
    st.revision = Number(row?.revision)||0;
    // v1.7.3：启动阶段只读取 JSONB，不再为整本书所有照片/音频批量签名。
    // 媒体 URL 由城市首屏 / 播放器 prepare 按需批量预取，避免登录后长时间只有背景。
    setData(row?.payload || empty());
  }

  async function refreshRemote({silent=false}={}){
    try{ await applyRemote(await readRow()); }
    catch(e){ if(!silent) throw e; console.error('[Starbook refresh]',e); }
  }
  st.refresh = refreshRemote;

  async function init(){
    await SB.runtime.ready;
    st.mode = 'supabase';
    st.role = SB.book.current?.role || 'viewer';
    st.canEdit = mayEdit(st.role); st.canUpload = st.canEdit;
    SB.menu?.status(`${SB.book.current?.name || '星屿之书'} · ${st.canEdit ? '可以编辑' : '只读浏览'}`);
    SB.menu?.refresh();
    await refreshRemote();
    // v1.12.0：编辑者载入后静默清理超过 30 天的回收站条目（只有这时才真正删除 Storage 文件）
    if(st.canEdit && expired(data, Date.now() - TRASH_DAYS*DAY).length) setTimeout(() => st.purgeTrash('expired').catch(e => console.warn('[Starbook trash purge]', e)), 4000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden && st.mode==='supabase' && !document.querySelector('.sb-modal')) refreshRemote({silent:true});
    });
  }
  st.ready = init();
  st.isConnected = () => st.mode === 'supabase' && !!SB.user?.current && !!SB.book?.current;

  async function removeObjects(paths){
    paths = [...new Set(paths.filter(Boolean))]; if(!paths.length || !st.canUpload) return;
    try{
      const {error} = await bucket().remove(paths); if(error) throw error;
      for(const id of paths){ if(preview[id]){ URL.revokeObjectURL(preview[id]); delete preview[id]; } delete signed[id]; dropProxies(id); }
    }catch(e){ console.error('[Starbook storage cleanup]',e); }
  }

  /* 基于 revision 的轻量冲突检测：保留 JSONB 桥接结构，同时避免两台设备静默覆盖。 */
  async function mutate(fn, {purge=false}={}){
    if(!st.canEdit) throw {code:403};
    for(let attempt=0; attempt<3; attempt++){
      const cur = await readRow();
      const next = clone(normalize(cur.payload)); fn(next);
      // v1.12.0 通用兜底：之前被引用、现在不再被引用的文件先记入 trash.files（30 天后清理），不立即删除；
      // 只有 purge（彻底删除 / 过期清理）才真正删除 Storage 文件
      if(!purge){ const after = refs(next), at = now(); for(const id of refs(cur.payload)) if(!after.has(id)) next.trash.files[id] = {deletedAt:at};
        const live = liveRefs(next); for(const id of Object.keys(next.trash.files)) if(live.has(id)) delete next.trash.files[id]; }
      const nextRevision = (Number(cur.revision)||0) + 1;
      const {data:updated,error} = await SB.supabase.from('book_data')
        .update({payload:next,revision:nextRevision,updated_at:now()})
        .eq('book_id',bookId()).eq('revision',Number(cur.revision)||0)
        .select('payload,revision,updated_at').maybeSingle();
      if(error) throw error;
      if(updated){
        const removed = [...refs(cur.payload)].filter(id => !refs(next).has(id));
        await applyRemote(updated);
        if(removed.length) removeObjects(removed);
        return;
      }
      await SB.wait(220 + Math.random()*360);
    }
    throw {code:'conflict'};
  }

  const strip = o => { const c = {...o}; delete c.id; return JSON.parse(JSON.stringify(c)); };
  st.addCity = async (c) => {
    const name = String(c.name || '').trim();
    if(!name) throw {code:'empty',msg:'请输入城市名'};
    if(st.cities.some(x => x.region === c.region && x.name === name)) throw {code:'dup',msg:'这座城市已经点亮过了'};
    const id = SB.uid();
    await mutate(d => { d.cities[id] = strip({...c,name,createdAt:now()}); });
    return id;
  };
  st.updateCity = (id,patch) => mutate(d => { if(d.cities[id]) d.cities[id] = {...d.cities[id],...patch,updatedAt:now()}; });
  // v1.12.0：删除城市 / 回忆 = 移入回收站（30 天内可恢复）
  st.removeCity = id => mutate(d => {
    const c = d.cities[id], at = now(); if(!c) return;
    d.trash.cities[id] = {...c, deletedAt:at}; delete d.cities[id];
    for(const [mid,m] of Object.entries(d.memories)) if(m.cityId === id){ d.trash.memories[mid] = {...m, deletedAt:at, viaCity:id}; delete d.memories[mid]; }
  });
  st.saveMemory = async m => {
    const id = m.id || SB.uid();
    await mutate(d => {
      const prev = d.memories[id], at = now();
      d.memories[id] = strip({...m, createdAt:prev?.createdAt || now(), updatedAt:at});
      // 编辑时移除的照片进入回收站（保留原 slide，恢复时追加回这段回忆）
      if(prev){ const keep = new Set((d.memories[id].slides || []).map(x => x.id));
        for(const sl of prev.slides || []) if(sl.id && !keep.has(sl.id)) d.trash.photos[sl.id] = {slide:sl, memoryId:id, memoryTitle:prev.title || '', deletedAt:at}; }
    });
    return id;
  };
  st.removeMemory = id => mutate(d => { const m = d.memories[id]; if(!m) return; d.trash.memories[id] = {...m, deletedAt:now()}; delete d.memories[id]; });

  /* ── v1.12.0 回收站：恢复 / 彻底删除 / 过期清理 ── */
  const bare = o => { const c = {...o}; delete c.deletedAt; delete c.viaCity; return c; };
  const sameCity = (d, c) => Object.entries(d.cities).find(([, x]) => x.region === c.region && x.name === c.name && x.country === c.country);
  function reviveCity(d, cid){
    if(d.cities[cid]) return cid;
    const c = d.trash.cities[cid]; if(!c) return null;
    const dup = sameCity(d, c); delete d.trash.cities[cid];
    if(dup) return dup[0];                                  // 删除后又重新加过同名城市 → 并入现有城市
    d.cities[cid] = bare(c); return cid;
  }
  st.restoreMemory = id => mutate(d => {
    const m = d.trash.memories[id]; if(!m) return;
    const cid = reviveCity(d, m.cityId);
    if(!cid) throw {code:'gone', msg:'它所在的城市已经彻底删除，无法恢复这段回忆'};
    d.memories[id] = {...bare(m), cityId:cid}; delete d.trash.memories[id];
  });
  st.restoreCity = id => mutate(d => {
    if(!d.trash.cities[id]) return;
    const cid = reviveCity(d, id);
    for(const [mid, m] of Object.entries(d.trash.memories)) if(m.viaCity === id){ d.memories[mid] = {...bare(m), cityId:cid}; delete d.trash.memories[mid]; }
  });
  st.restorePhoto = pid => mutate(d => {
    const p = d.trash.photos[pid]; if(!p) return;
    const m = d.memories[p.memoryId];
    if(!m) throw {code:'gone', msg:d.trash.memories[p.memoryId] ? `请先恢复它所在的回忆「${p.memoryTitle || '未命名的回忆'}」` : '它所在的回忆已经彻底删除，无法恢复这张照片'};
    const sl = {...p.slide}; delete sl.g;                    // 追加到末尾，去掉分组标记（保持组成员连续）
    m.slides = [...(m.slides || []).filter(x => x.id !== sl.id), sl];
    if(!m.cover?.id) m.cover = {id:sl.id};
    delete d.trash.photos[pid];
  });
  function dropEntry(d, kind, id){
    const t = d.trash;
    if(kind === 'city'){ delete t.cities[id]; for(const [mid, m] of Object.entries(t.memories)) if(m.viaCity === id || m.cityId === id) dropEntry(d, 'memory', mid); }
    else if(kind === 'memory'){ delete t.memories[id]; for(const [pid, p] of Object.entries(t.photos)) if(p.memoryId === id) delete t.photos[pid]; }
    else if(kind === 'photo') delete t.photos[id];
    else if(kind === 'file') delete t.files[id];
  }
  const KIND = {cities:'city', memories:'memory', photos:'photo', files:'file'};
  function expired(d, cutoff){
    const out = [];
    for(const [k, kind] of Object.entries(KIND)) for(const [id, e] of Object.entries(d.trash[k])){ const t = Date.parse(e?.deletedAt || ''); if(!(t > cutoff)) out.push([kind, id]); }
    return out;
  }
  // which：{kind, id} 单项 | 'expired' 超过 30 天的 | 'all' 全部
  st.purgeTrash = which => mutate(d => {
    if(which === 'all'){ d.trash = emptyTrash(); return; }
    if(which === 'expired'){ expired(d, Date.now() - TRASH_DAYS*DAY).forEach(([k, id]) => dropEntry(d, k, id)); return; }
    if(which?.kind && which.id) dropEntry(d, which.kind, which.id);
  }, {purge:true});
  st.TRASH_DAYS = TRASH_DAYS;
  st.trashCount = () => { const t = st.trash || emptyTrash(); return Object.keys(t.cities).length + Object.keys(t.memories).length + Object.keys(t.photos).length; };
  st.trashDaysLeft = e => Math.max(0, Math.ceil((Date.parse(e?.deletedAt || 0) + TRASH_DAYS*DAY - Date.now())/DAY));
  /* ── v1.12.0 导出：整本书引用到的全部媒体路径（含回收站）与原文件下载 ── */
  st.allMediaPaths = () => [...refs(data)];
  st.exportPayload = () => clone(data);
  st.download = async path => { const {data:blob, error} = await bucket().download(path); if(error) throw error; return blob; };
  st.saveSettings = patch => mutate(d => { d.settings = strip({...d.settings,...patch}); });

  /* ── Private Storage ── */
  st.url = id => {
    if(!id) return '';
    if(preview[id]) return preview[id];
    const hit = signed[id];
    if(hit?.url){
      if(hit.expiresAt < Date.now()+5*60*1000) signPaths([id],{notify:true});
      return hit.url;
    }
    // 初次签名若曾因弱网失败，组件再次询问 URL 时自动补签；成功后 sb:data 会触发重绘。
    signPaths([id],{notify:true});
    return '';
  };

  /* ── v1.10.2 显示尺寸代理图（prompts/performance/06-android.md）：只在安卓启用。
     签名地址 → fetch Blob → createImageBitmap 后台解码并缩放 → JPEG → blob: 地址；任何一步失败都回退原签名地址。
     原图（上传上限 2400px）在手机上只需要约 1280–1800px：解码内存约为原来的 1/2–1/3，安卓光栅不再因大图解码卡顿 / 棋盘格闪烁。 */
  const proxies = new Map(), PROXY_MAX = 160;
  st.proxyOn = () => !!SB.perf?.android && typeof createImageBitmap === 'function' && typeof fetch === 'function';
  st.displaySide = () => SB.clamp(Math.round(Math.max(screen.width || innerWidth, screen.height || innerHeight)*Math.min(devicePixelRatio || 1, 2)), 1280, 1800);
  function dropProxies(id){ for(const [k, r] of proxies) if(k.startsWith(id + '@')){ if(r.url) URL.revokeObjectURL(r.url); proxies.delete(k); } }
  function trimProxies(){
    if(proxies.size <= PROXY_MAX) return;
    const old = [...proxies.entries()].sort((a, b) => a[1].at - b[1].at);
    for(const [k, r] of old){
      if(proxies.size <= PROXY_MAX*.8) break;
      if(r.url && document.querySelector(`img[src="${r.url}"]`)) continue;           // 页面上还在用的不回收
      if(r.url) URL.revokeObjectURL(r.url); proxies.delete(k);
    }
  }
  // 同时最多生成 3 张（按请求顺序），避免一次性解码十几张大图把手机 CPU 打满
  let proxyBusy = 0; const proxyQ = [];
  const proxySlot = () => new Promise(r => { if(proxyBusy < 3){ proxyBusy++; r(); } else proxyQ.push(r); });
  const proxyFree = () => { const n = proxyQ.shift(); if(n) n(); else proxyBusy--; };
  async function makeProxy(src, side){
    await proxySlot();
    try{ return await makeProxyNow(src, side); } finally { proxyFree(); }
  }
  async function makeProxyNow(src, side){
    const res = await fetch(src, {mode:'cors', credentials:'omit'}); if(!res.ok) throw new Error('http ' + res.status);
    const blob = await res.blob(), bm = await createImageBitmap(blob);
    const k = Math.min(1, side/Math.max(bm.width, bm.height));
    if(k > 1/1.15){ bm.close?.(); return URL.createObjectURL(blob); }                   // 原图已经够小：直接用下载好的 Blob
    const w = Math.max(1, Math.round(bm.width*k)), h = Math.max(1, Math.round(bm.height*k));
    let small; try{ small = await createImageBitmap(bm, {resizeWidth:w, resizeHeight:h, resizeQuality:'high'}); } finally { bm.close?.(); }
    // 用 CPU 画布编码（willReadFrequently）：避免 GPU 画布 convertToBlob 的回读等待；toBlob 由浏览器在后台线程编码
    const cv = Object.assign(document.createElement('canvas'), {width:w, height:h});
    cv.getContext('2d', {alpha:false, willReadFrequently:true}).drawImage(small, 0, 0, w, h); small.close?.();
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', .86)); cv.width = cv.height = 0;
    if(!out) throw new Error('encode');
    return URL.createObjectURL(out);
  }
  st.displayUrl = async (id, side) => {
    if(!id) return '';
    if(!st.url(id)) await signPaths([id]);
    const src = st.url(id);
    if(!src || preview[id] || !st.proxyOn()) return src;
    side = Math.round(side || st.displaySide());
    const key = id + '@' + side, hit = proxies.get(key);
    if(hit){ hit.at = Date.now(); const u = await hit.p; return u || st.url(id); }
    const rec = {at:Date.now(), url:''};
    rec.p = makeProxy(src, side).then(u => (rec.url = u), e => { console.warn('[Starbook proxy]', e?.message || e); return ''; });
    proxies.set(key, rec); trimProxies();
    return (await rec.p) || st.url(id);
  };

  st.health = async () => {
    const result = {
      connected: st.isConnected(),
      userId: SB.user?.current?.id || null,
      bookId: bookId() || null,
      role: st.role,
      canEdit: st.canEdit,
      revision: st.revision,
      database: false,
      storage: false
    };
    try{ await readRow(); result.database = true; }catch(e){ result.databaseError = errText(e); }
    try{
      const probe = `${bookId()}/.healthcheck-never-created`;
      const {error} = await bucket().createSignedUrl(probe,60);
      // 对不存在对象，Storage 可能返回错误；只要不是权限/RLS 类错误，就说明 Bucket API 已可访问。
      if(!error) result.storage = true;
      else{
        const raw=String(error?.message||'');
        result.storage = !/row-level security|permission|unauthorized|jwt/i.test(raw);
        if(!result.storage) result.storageError = errText(error);
      }
    }catch(e){ result.storageError = errText(e); }
    return result;
  };

  async function putFile(blob,ext,type,folder){
    if(!st.canUpload) throw {code:403};
    if(!blob || blob.size > MAX_FILE) throw {code:'too_large'};
    const path = `${bookId()}/${folder}/${SB.uid()}.${ext}`;
    const {error} = await bucket().upload(path,blob,{contentType:type||undefined,cacheControl:'31536000',upsert:false});
    if(error) throw error;
    preview[path] = URL.createObjectURL(blob);
    return path;
  }

  st.deleteFile = async id => {
    if(!id || refs(data).has(id)) return;
    await removeObjects([id]);
  };

  async function decodeImage(file){
    try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){
      return await new Promise((res,rej)=>{
        const img=new Image(),u=URL.createObjectURL(file);
        img.onload=()=>{ URL.revokeObjectURL(u); res(img); };
        img.onerror=()=>{ URL.revokeObjectURL(u); rej({code:'decode'}); };
        img.src=u;
      });
    }
  }
  st.uploadImage = async (file,onStep) => {
    if(!file) throw {code:'unsupported_type'};
    onStep?.('读取中');
    let img; try{ img=await decodeImage(file); }
    catch(e){ throw {code:'decode',msg:`「${file.name}」无法读取。HEIC 如上传失败，请先在手机相册中导出为 JPG`}; }
    const w0=img.width,h0=img.height,k=Math.min(1,2400/Math.max(w0,h0));
    const w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    canvas.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h); img.close?.();
    onStep?.('压缩中');
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.86));
    if(!blob) throw {code:'decode',msg:'照片压缩失败，请换一张照片后再试'};
    onStep?.('上传中');
    return {id:await putFile(blob,'jpg','image/jpeg','images'),w,h};
  };

  st.uploadAudio = async (file,onStep) => {
    if(!file) throw {code:'unsupported_type'};
    let ext=(file.name.split('.').pop()||'').toLowerCase();
    const types={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',mp4:'audio/mp4',wav:'audio/wav'};
    if(!types[ext]) throw {code:'unsupported_type',msg:'周年版本建议上传 mp3 或 m4a 音乐'};
    if(file.size > 20*1024*1024) throw {code:'too_large',msg:'音乐文件请控制在 20MB 以内'};
    onStep?.('上传中');
    const name=file.name.replace(/\.[^.]+$/,'');
    return {id:await putFile(file,ext,file.type||types[ext],'audio'),name};
  };

  /* ── 派生查询 ── */
  st.citiesIn = country => st.cities.filter(c => c.country === country);
  st.citiesInRegion = region => st.cities.filter(c => c.region === region).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  st.city = id => st.cities.find(c => c.id === id);
  st.memory = id => st.memories.find(m => m.id === id);
  // v1.10.1：按日序号排序（YYYY-MM 视为当月 1 日），同一天按创建先后
  st.memoriesOf = cityId => st.memories.filter(m => m.cityId === cityId).sort((a,b)=>((SB.date?.day(a.date) ?? 1e9) - (SB.date?.day(b.date) ?? 1e9)) || (a.createdAt||'').localeCompare(b.createdAt||''));
  st.visitedCountries = () => new Set(st.cities.map(c => c.country));
  st.visitedRegions = country => new Set(st.cities.filter(c => c.country === country).map(c => c.region));
  st.stats = () => ({
    countries:new Set(st.cities.map(c=>c.country)).size,
    regions:new Set(st.cities.map(c=>c.region)).size,
    cities:st.cities.length,
    memories:st.memories.length,
    photos:st.memories.reduce((n,m)=>n+(m.slides||[]).length,0)
  });
})(window.SB);
</script>
