<style>
/* ── 块 10 · 城市回忆目录（v1.7.1「星屿手稿 · 目录页」）──
   页眉（法阵 + 城市名 + 统计 + 新的回忆）→ 单列金色时间线（罗马数字章节徽记）→ 章节卡片（海报 + 信息 + 缩影 + 放映操作）。
   视觉语言与回忆编辑器「星屿手稿」一致。 */
.sb-scene[data-scene="city"]{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.ca-ghost{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-size:min(34vw,320px);line-height:1;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1px rgba(244,184,96,.08);text-shadow:0 0 80px rgba(244,184,96,.05);pointer-events:none;letter-spacing:.1em;}
.ca-wrap{position:relative;padding-block:calc(78px + var(--safe-t)) calc(56px + var(--safe-b));
  padding-left:max(16px,var(--safe-l));padding-right:max(16px,var(--safe-r));max-width:960px;margin:0 auto;}

/* 页眉 */
.ca-head{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:38px;}
.ca-sigil{position:absolute;left:50%;top:50%;width:min(440px,92vw);aspect-ratio:1;transform:translate(-50%,-52%);pointer-events:none;color:rgba(244,184,96,.16);z-index:-1;}
.ca-sigil svg{width:100%;height:100%;animation:sbSpin 120s linear infinite;}
.ca-head small{font-family:var(--f-rune);font-weight:500;font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--gold-dim);}
.ca-head h1{margin:0;padding-left:.22em;font-family:var(--f-display);font-weight:900;font-size:clamp(46px,7vw,76px);line-height:1.15;letter-spacing:.22em;
  color:var(--gold-hi);text-shadow:0 0 34px rgba(244,184,96,.55),0 2px 0 rgba(60,30,8,.5);}
.ca-rule{display:flex;align-items:center;gap:12px;width:min(360px,70vw);color:var(--gold-hi);}
.ca-rule::before,.ca-rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(244,184,96,.75));}
.ca-rule::after{background:linear-gradient(90deg,rgba(244,184,96,.75),transparent);}
.ca-rule .sb-ico{width:14px;height:14px;filter:drop-shadow(0 0 6px rgba(255,214,150,.9));}
.ca-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px;}
.ca-stats span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1px solid rgba(244,184,96,.26);background:rgba(10,8,22,.5);
  font-size:13px;letter-spacing:.1em;color:#d9cfee;}
.ca-stats b{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--gold-hi);letter-spacing:.04em;}
.ca-head .sb-btn{margin-top:10px;}

/* 时间线 */
.ca-line{position:relative;display:flex;flex-direction:column;gap:30px;padding-left:76px;}
.ca-line::before{content:"";position:absolute;left:29px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(transparent,rgba(244,184,96,.75) 5%,rgba(244,184,96,.75) 95%,transparent);box-shadow:0 0 10px rgba(244,184,96,.45);}
.ca-ch{position:relative;content-visibility:auto;contain-intrinsic-size:360px;}
.ca-node{position:absolute;left:-76px;top:18px;width:60px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.ca-node .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-rune);font-size:13px;color:var(--gold-hi);
  background:#0d0a1c;border:1px solid rgba(244,184,96,.7);box-shadow:0 0 14px rgba(244,184,96,.35), inset 0 0 8px rgba(244,184,96,.2);}
.ca-node .num .sb-ico{width:16px;height:16px;}
.ca-node .ym{writing-mode:vertical-rl;font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.18em;color:var(--gold);
  background:rgba(10,8,22,.8);padding:6px 2px;border-radius:999px;}

/* 章节卡片 */
.ca-card{position:relative;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;padding:16px;border-radius:16px;cursor:pointer;
  background:radial-gradient(120% 70% at 0% 0%,rgba(244,184,96,.08),transparent 60%),linear-gradient(180deg,rgba(32,24,48,.82),rgba(12,10,26,.88));
  border:1px solid rgba(244,184,96,.24);box-shadow:0 16px 40px rgba(0,0,0,.45);
  transition:transform .45s var(--ease-soft), box-shadow .45s, border-color .45s;animation:caIn .9s var(--ease-soft) backwards;}
.ca-card::before,.ca-card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid rgba(244,184,96,.55);pointer-events:none;}
.ca-card::before{left:7px;top:7px;border-right:0;border-bottom:0;} .ca-card::after{right:7px;bottom:7px;border-left:0;border-top:0;}
.ca-card:hover,.ca-card:focus-visible{transform:translateY(-4px);border-color:rgba(255,226,168,.7);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 34px rgba(244,184,96,.22);outline:none;}
@keyframes caIn{from{opacity:0;transform:translateY(16px);filter:blur(4px)}}
@keyframes caInLite{from{opacity:0;transform:translateY(10px)}}
html[data-sb-perf="low"] .ca-card,html[data-sb-perf="low"] .ca-new{animation-name:caInLite;animation-duration:.5s;}
html[data-sb-perf="low"] .ca-badge{backdrop-filter:none;-webkit-backdrop-filter:none;}

/* 海报（与编辑器预览同款） */
.ca-poster{position:relative;aspect-ratio:4/5;border-radius:5px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#2a1e4a,#0d0a1c);align-self:start;
  box-shadow:0 0 0 1px rgba(255,226,168,.7),0 0 0 5px rgba(16,10,6,.8),0 0 0 6px rgba(244,184,96,.42),0 16px 34px rgba(0,0,0,.5);}
.ca-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease-soft);}
.ca-card:hover .ca-poster img{transform:scale(1.06);}
.ca-poster .grade{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55;pointer-events:none;}
.ca-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,240,210,.22) 50%,transparent 62%);
  transform:translateX(-80%);transition:transform 1.2s var(--ease-soft);pointer-events:none;}
.ca-card:hover .ca-poster::after{transform:translateX(80%);}
.ca-badges{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;}
.ca-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(8,6,18,.72);border:1px solid rgba(244,184,96,.4);
  font-family:var(--f-rune);font-size:9px;letter-spacing:.2em;color:var(--gold-hi);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.ca-badge .sb-ico{width:11px;height:11px;}

/* 信息 */
.ca-info{display:flex;flex-direction:column;gap:10px;min-width:0;padding:4px 4px 2px 0;}
.ca-kicker{font-family:var(--f-rune);font-size:10px;letter-spacing:.36em;color:var(--gold-dim);}
.ca-kicker em{font-style:normal;font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--gold);margin-left:6px;}
.ca-info h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.4vw,26px);line-height:1.4;letter-spacing:.08em;color:var(--gold-hi);
  text-shadow:0 0 16px rgba(244,184,96,.3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ca-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;letter-spacing:.06em;color:#cfc6e6;}
.ca-facts span{display:inline-flex;align-items:center;gap:5px;}
.ca-facts .sb-ico{width:13px;height:13px;color:var(--gold);}
.ca-note{margin:0;font-size:14px;line-height:1.8;color:rgba(234,223,200,.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ca-strip{display:flex;gap:8px;}
.ca-strip i{position:relative;flex:0 0 auto;width:68px;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:#151230;
  box-shadow:0 0 0 1px rgba(244,184,96,.3);}
.ca-strip i img{width:100%;height:100%;object-fit:cover;display:block;}
.ca-strip i.more{display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--gold-hi);background:rgba(244,184,96,.08);}
.ca-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px;}
.ca-acts .sb-btn{background-color:rgba(10,8,22,.4);}
.ca-acts .sb-btn.primary{background:linear-gradient(180deg,#ffe7b5,#f4b860 55%,#c98636);}
.ca-acts .play svg{width:14px;height:14px;}

/* 新的一页 */
.ca-new{display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:16px;cursor:pointer;text-align:left;color:var(--text);font:inherit;width:100%;
  border:1.5px dashed rgba(244,184,96,.45);background:radial-gradient(80% 120% at 0% 50%,rgba(244,184,96,.1),transparent 70%);
  transition:border-color .3s, box-shadow .3s, background .3s;animation:caIn .9s var(--ease-soft) backwards;}
.ca-new:hover,.ca-new:focus-visible{border-color:var(--gold-hi);box-shadow:0 0 24px rgba(244,184,96,.2);outline:none;}
.ca-new .ring{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);border:1px solid rgba(244,184,96,.55);box-shadow:0 0 16px rgba(244,184,96,.25);}
.ca-new .ring .sb-ico{width:22px;height:22px;}
.ca-new b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.16em;color:var(--gold-hi);}
.ca-new span{display:block;margin-top:4px;font-size:13px;color:var(--text-dim);letter-spacing:.04em;}

/* 空状态 */
.ca-empty{position:relative;margin:10px auto 0;width:min(480px,100%);padding:44px 28px 36px;border-radius:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;
  background:radial-gradient(90% 60% at 50% 0%,rgba(244,184,96,.12),transparent 70%),linear-gradient(180deg,rgba(32,24,48,.85),rgba(12,10,26,.9));
  border:1px solid rgba(244,184,96,.35);box-shadow:0 0 0 5px rgba(14,10,22,.7),0 0 0 6px rgba(244,184,96,.25),0 24px 60px rgba(0,0,0,.5);}
.ca-empty .big{font-family:var(--f-rune);font-size:84px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,226,168,.75);text-shadow:0 0 30px rgba(244,184,96,.35);}
.ca-empty p{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.16em;line-height:1.9;color:var(--gold-hi);}
.ca-empty small{font-family:var(--f-rune);font-size:10px;letter-spacing:.42em;color:var(--gold-dim);}

@media (prefers-reduced-motion:reduce){ .ca-sigil svg{animation:none;} .ca-card,.ca-new{animation:none;} }
@media (max-width:760px){
  .ca-wrap{padding-top:calc(70px + var(--safe-t));max-width:680px;}
  .ca-head{margin-bottom:28px;}
  .ca-line{padding-left:40px;gap:22px;}
  .ca-line::before{left:15px;}
  .ca-node{left:-40px;width:32px;top:12px;}
  .ca-node .num{width:30px;height:30px;font-size:11px;}
  .ca-node .ym{display:none;}
  .ca-card{grid-template-columns:1fr;gap:14px;padding:12px;}
  .ca-poster{aspect-ratio:3/2;}
  .ca-strip i{width:58px;}
  .ca-strip i:nth-child(n+5){display:none;}
  .ca-acts .sb-btn{min-height:44px;}
  .ca-acts .play{flex:1 1 100%;}
  .ca-acts .sb-btn:not(.play){flex:1 1 0;}
  .ca-new{padding:16px;}
}
@media (max-width:520px){
  .ca-poster{aspect-ratio:4/3;}
  .ca-info h2{font-size:21px;}
  .ca-note{-webkit-line-clamp:3;}
}
</style>

<section class="sb-scene" data-scene="city" aria-label="城市回忆">
  <div class="ca-ghost" id="ca-ghost" aria-hidden="true"></div>
  <div class="ca-wrap">
    <header class="ca-head">
      <div class="ca-sigil" aria-hidden="true"><svg viewBox="-100 -100 200 200"><g fill="none" stroke="currentColor">
        <circle r="96" stroke-width=".6"/><circle r="90" stroke-width=".4" stroke-dasharray="1 3"/><circle r="62" stroke-width=".5"/>
        <path d="M0-88 L18-18 88 0 18 18 0 88-18 18-88 0-18-18Z" stroke-width=".6"/><path d="M-62-62 62 62M62-62-62 62" stroke-width=".35"/>
        <path d="M0-62 L44-44 62 0 44 44 0 62-44 44-62 0-44-44Z" stroke-width=".4"/></g></svg></div>
      <small id="ca-en"></small><h1 id="ca-title"></h1><div class="ca-rule" id="ca-rule"></div>
      <div class="ca-stats" id="ca-stats"></div><div id="ca-cta"></div>
    </header>
    <div id="ca-body"></div>
  </div>
</section>

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12Z" fill="currentColor"/></svg>';
  const GRADE = {spring:'rgba(255,170,195,.6)', summer:'rgba(255,205,120,.6)', autumn:'rgba(235,120,40,.65)', winter:'rgba(150,190,255,.65)'};
  let cityId = null, revealT = 0;
  SB.fmtDate = d => { if(!d) return '未标注时间'; const [y,m] = d.split('-'); return m ? `${y} 年 ${+m} 月` : `${y} 年`; };
  const roman = n => { const R = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for(const [v,r] of R) while(n >= v){ s += r; n -= v; } return s; };
  const ROMAN = n => n <= 39 ? roman(n) : String(n);
  const fmtDur = ms => { const s = Math.round(ms/1000); return s < 60 ? `约 ${s} 秒` : `约 ${Math.floor(s/60)} 分${s % 60 ? ' ' + s % 60 + ' 秒' : ''}`; };
  const img = (id, eager=false, priority='low') => {
    const u = id ? SB.store.url(id) : '';
    return u ? `<img alt="" loading="${eager ? 'eager' : 'lazy'}" decoding="async" fetchpriority="${priority}" src="${SB.esc(u)}">` : '';
  };
  const go = (e, m, autoplay) => {
    SB.player?.prime?.(m);
    return SB.scenes.go('player', autoplay ? {id:m.id, autoplay:true} : {id:m.id},
      {transition:'portal', x:e?.clientX || innerWidth/2, y:e?.clientY || innerHeight/2});
  };

  function chapter(m, k){
    const ch = SB.el('article', 'ca-ch'); ch.setAttribute('role', 'article');
    ch.innerHTML = `<div class="ca-node" aria-hidden="true"><span class="num">${ROMAN(k + 1)}</span><span class="ym">${SB.esc((m.date || '').replace('-', ' · '))}</span></div>`;
    const card = SB.el('div', 'ca-card'); card.tabIndex = 0; card.style.animationDelay = (k*90) + 'ms';
    card.setAttribute('aria-label', '打开放映厅：' + m.title);
    const C = SB.cinema, style = C?.styleOf(m) || 'cinema', sty = C?.styles.find(s => s.id === style);
    const season = C ? C.resolveSeason(C.seasonPref(m), m.date) : 'none', sea = C?.seasons.find(s => s.id === season);
    const slides = (m.slides || []).filter(s => s.id), cover = m.cover?.id || slides[0]?.id;
    let dur = ''; try{ if(slides.length && SB.player?.estimate) dur = fmtDur(SB.player.estimate(m, style)); }catch(e){}
    const music = m.bgmMode !== 'none' && (m.bgm || SB.store.settings?.bgm);
    const thumbLimit = SB.perf.touch || SB.perf.level !== 'high' ? 3 : 5;
    const thumbs = slides.slice(0, thumbLimit).map((s, i) =>
      i === thumbLimit - 1 && slides.length > thumbLimit ? `<i class="more">+${slides.length - (thumbLimit - 1)}</i>` : `<i>${img(s.id, false, 'low')}</i>`
    ).join('');
    const eagerCover = k < (SB.perf.touch ? 1 : 2);
    card.innerHTML = `
      <div class="ca-poster">${img(cover, eagerCover, eagerCover ? 'high' : 'low')}<div class="grade" style="background:${GRADE[season] || 'transparent'}"></div>
        <div class="ca-badges">${sty ? `<span class="ca-badge">${C.icon(style)}${sty.en}</span>` : '<span></span>'}${season !== 'none' && sea ? `<span class="ca-badge">${C.icon(season)}${sea.en}</span>` : ''}</div></div>
      <div class="ca-info">
        <div class="ca-kicker">CHAPTER ${ROMAN(k + 1)}<em>${SB.esc(SB.fmtDate(m.date))}</em></div>
        <h2></h2>
        <div class="ca-facts"><span>${SB.icon('star')}${slides.length} 张照片</span>${dur ? `<span>${PLAY.replace('<svg', '<svg class="sb-ico"')}${dur}</span>` : ''}${sty ? `<span>${C.icon(style)}${sty.name}${season !== 'none' && sea ? ' · ' + sea.name : ''}</span>` : ''}${music ? `<span>${SB.icon('note')}配乐</span>` : ''}</div>
        ${m.note ? '<p class="ca-note"></p>' : ''}
        ${thumbs ? `<div class="ca-strip" aria-hidden="true">${thumbs}</div>` : ''}
        <div class="ca-acts"></div>
      </div>`;
    card.querySelector('h2').textContent = SB.fmtTitle(m.title);
    if(m.note) card.querySelector('.ca-note').textContent = m.note;
    const acts = card.querySelector('.ca-acts');
    const play = SB.ui.button('放映', 'primary play', e => { e.stopPropagation(); go(e, m, true); });
    play.innerHTML = PLAY + '<span>放映</span>'; play.setAttribute('aria-label', '放映：' + m.title);
    const hall = SB.ui.button('放映厅', 'small', e => { e.stopPropagation(); go(e, m, false); }); hall.setAttribute('aria-label', '打开放映厅：' + m.title);
    acts.append(play, hall);
    if(SB.store.canEdit){ const ed = SB.ui.button('编辑', 'small', e => { e.stopPropagation(); SB.editor.open({cityId, memory:m}); }, 'quill'); ed.setAttribute('aria-label', '编辑：' + m.title); acts.appendChild(ed); }
    card.addEventListener('click', e => go(e, m, false));
    card.addEventListener('keydown', e => { if(e.target === card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); go(null, m, false); } });
    ch.appendChild(card);
    return ch;
  }

  function render(){
    const c = SB.store.city(cityId);
    const body = $('ca-body'); body.innerHTML = ''; $('ca-stats').innerHTML = ''; $('ca-cta').innerHTML = '';
    if(!c){ const e = SB.el('div','sb-empty'); e.textContent = '这座城市已经不在星图上了'; body.appendChild(e); return; }
    $('ca-title').textContent = c.name; $('ca-ghost').textContent = c.name;
    $('ca-en').textContent = [c.countryName, c.regionName].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ');
    $('ca-rule').innerHTML = SB.icon('spark');
    const list = SB.store.memoriesOf(cityId);
    if(list.length){
      const photos = list.reduce((n, m) => n + (m.slides || []).length, 0);
      const dates = list.map(m => m.date).filter(Boolean).sort();
      const span = dates.length ? (dates[0] === dates[dates.length - 1] ? SB.fmtDate(dates[0]) : `${SB.fmtDate(dates[0])} — ${SB.fmtDate(dates[dates.length - 1])}`) : '';
      $('ca-stats').innerHTML = `<span><b>${list.length}</b>段回忆</span><span><b>${photos}</b>张照片</span>${span ? `<span>${SB.esc(span)}</span>` : ''}`;
      if(SB.store.canEdit) $('ca-cta').appendChild(SB.ui.button('新的回忆', 'primary', () => SB.editor.open({cityId}), 'plus'));
    }
    if(!list.length){
      const e = SB.el('div','ca-empty');
      e.innerHTML = '<span class="big" aria-hidden="true">I</span><small>CHAPTER ONE</small><p>这里还没有回忆<br>写下第一章吧</p>';
      if(SB.store.canEdit) e.appendChild(SB.ui.button('新的回忆', 'primary', () => SB.editor.open({cityId}), 'plus'));
      body.appendChild(e); return;
    }
    const line = SB.el('div','ca-line');
    list.forEach((m, k) => line.appendChild(chapter(m, k)));
    if(SB.store.canEdit){
      const ch = SB.el('div', 'ca-ch');
      ch.innerHTML = `<div class="ca-node" aria-hidden="true"><span class="num">${SB.icon('spark')}</span></div>`;
      const b = SB.el('button', 'ca-new', `<span class="ring">${SB.icon('plus')}</span><span><b>写下第 ${ROMAN(list.length + 1)} 章</b><span>新的一页：添加照片、写下它们的故事，选好放映风格与季节</span></span>`);
      b.type = 'button'; b.style.animationDelay = (list.length*90) + 'ms';
      b.addEventListener('click', () => SB.editor.open({cityId}));
      ch.appendChild(b); line.appendChild(ch);
    }
    body.appendChild(line);
    // 保险：入场动画结束（或在个别设备上没有启动）后移除动画，保证卡片一定可见
    const n = line.children.length;
    clearTimeout(revealT); revealT = setTimeout(() => line.querySelectorAll('.ca-card,.ca-new').forEach(e => { e.style.animation = 'none'; }), 1000 + n*90);
  }
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'city') render(); });

  SB.scenes.register('city', {
    world:'night',
    title:p => SB.store.city(p.id)?.name || '城市',
    parent:p => { const c = SB.store.city(p.id); return c ? {id:'country', params:{k:c.country}} : {id:'globe', params:{}}; },
    enter(p){ cityId = p.id; SB.fx.palette('night'); render(); document.querySelector('.sb-scene[data-scene="city"]').scrollTop = 0; }
  });
})(window.SB);
</script>
