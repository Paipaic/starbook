<style>
/* ── 块 01b · 秘境之门：门钥匙 / 幻影显形 / 熄灯器 三种奇幻转场（v1.8.0） ── */
#sb-magic-gate{position:fixed;inset:0;width:100vw;height:100vh;z-index:53;pointer-events:none;display:none;}
#sb-magic-gate.on{display:block;}
</style>
<canvas id="sb-magic-gate" aria-hidden="true"></canvas>
<script>
/* 依据 prompts/00-gate.md：只替换 Scene Runtime 的 cover / reveal 视觉，不改变 prepare → swap(await enter → nextPaint) → reveal 事务。 */
(function(SB){
  const cv = document.getElementById('sb-magic-gate'), g = cv.getContext('2d');
  const TAU = Math.PI*2;
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const eIn3 = k => k*k*k, eOut3 = k => 1 - Math.pow(1 - k, 3), eIO = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
  const rnd = (a, b) => a + Math.random()*(b - a);
  const NIGHT = '7,9,28';
  function sprite(r, stops){ const c = document.createElement('canvas'); c.width = c.height = r*2; const x = c.getContext('2d'), gr = x.createRadialGradient(r,r,0,r,r,r);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); x.fillStyle = gr; x.fillRect(0, 0, r*2, r*2); return c; }
  const GLOW = sprite(64, [[0,'rgba(255,250,236,1)'],[.18,'rgba(255,226,168,.85)'],[.45,'rgba(244,184,96,.35)'],[1,'rgba(244,184,96,0)']]);
  const SPARK = sprite(12, [[0,'rgba(255,252,236,1)'],[.3,'rgba(255,200,110,.85)'],[1,'rgba(0,0,0,0)']]);
  const VAPOR = (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d');
    for(let i = 0; i < 11; i++){ const px = 80 + rnd(-34, 34), py = 80 + rnd(-34, 34), r = rnd(26, 52), gr = x.createRadialGradient(px,py,0,px,py,r);
      gr.addColorStop(0,'rgba(255,240,214,.34)'); gr.addColorStop(.55,'rgba(255,206,140,.12)'); gr.addColorStop(1,'rgba(255,190,120,0)'); x.fillStyle = gr; x.fillRect(0,0,160,160); }
    return c; })();

  const G = { on:false, raf:0, mode:'', kind:'', t0:0, D:0, last:0, W:0, H:0, dpr:1, cx:0, cy:0, R:0,
    done:null, safety:0, light:null, strands:[], comets:[], vapor:[], blobs:[], sparks:[], P:null, holdT:0 };
  const lowTier = () => SB.perf.level !== 'high';

  function size(){
    G.dpr = Math.min(devicePixelRatio || 1, lowTier() ? 1 : 1.5);
    G.W = innerWidth; G.H = innerHeight;
    cv.width = Math.round(G.W*G.dpr); cv.height = Math.round(G.H*G.dpr);
  }
  function origin(at){
    G.cx = at?.x ?? G.W/2; G.cy = at?.y ?? G.H/2;
    G.R = Math.hypot(Math.max(G.cx, G.W - G.cx), Math.max(G.cy, G.H - G.cy));
  }
  function show(){ if(!G.on){ size(); cv.classList.add('on'); G.on = true; G.last = performance.now(); } if(!G.raf) G.raf = requestAnimationFrame(frame); }
  function hide(){
    G.on = false; G.mode = ''; G.P = null; G.sparks.length = 0;
    if(G.raf) cancelAnimationFrame(G.raf); G.raf = 0; clearTimeout(G.safety);
    g.setTransform(1,0,0,1,0,0); g.clearRect(0, 0, cv.width, cv.height); cv.classList.remove('on');
  }
  function settle(){ const d = G.done; G.done = null; d?.(); }

  /* 门钥匙的「光幕」：一次绘制到半分辨率离屏画布，之后每帧只 drawImage。 */
  function buildLight(){
    const s = .5, c = G.light || document.createElement('canvas');
    c.width = Math.max(2, Math.round(G.W*s)); c.height = Math.max(2, Math.round(G.H*s));
    const x = c.getContext('2d'), gr = x.createRadialGradient(G.cx*s, G.cy*s, 0, G.cx*s, G.cy*s, G.R*s*1.05);
    gr.addColorStop(0,'#fff8ea'); gr.addColorStop(.22,'#ffe7bc'); gr.addColorStop(.5,'#f6c47f'); gr.addColorStop(.8,'#b9702f'); gr.addColorStop(1,'#5a2c10');
    x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height); G.light = c;
  }
  function seed(kind){
    const lo = lowTier();
    G.strands = Array.from({length: kind === 'portkey' ? (lo ? 30 : 60) : 0}, () => ({ a:rnd(0, TAU), r0:G.R*rnd(.7, 1.15), d:rnd(0, .34), w:rnd(.7, 1.5), sp:rnd(.8, 1.3), f:rnd(.55, 1.25) }));
    G.comets = Array.from({length: kind === 'nox' ? (lo ? 24 : 52) : 0}, () => ({ a:rnd(0, TAU), r0:G.R*rnd(.55, 1.05), d:rnd(0, .3), curl:rnd(.7, 1.6)*(Math.random() < .5 ? -1 : 1), s:rnd(.7, 1.4), f:rnd(.6, 1.3) }));
    G.vapor = Array.from({length: kind === 'portkey' ? (lo ? 5 : 8) : 0}, (_, i, n) => ({ a:i/(lo ? 5 : 8)*TAU + rnd(-.3, .3), s:rnd(.32, .6), rot:rnd(0, TAU), vr:rnd(-.6, .6) }));
    G.blobs = Array.from({length: lo ? 6 : 8}, (_, i) => ({ a:i/(lo ? 6 : 8)*TAU + rnd(-.35, .35), o:rnd(.62, .86), s:rnd(.28, .44) }));
  }

  /* 旋转的符文刻度环（门钥匙等待态、幻影显形边缘共用） */
  function runeRing(x, y, r, rot, alpha, color, lw){
    if(alpha <= .01 || r < 2) return;
    g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.fillStyle = color; g.lineWidth = lw;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
    g.beginPath(); g.arc(x, y, r + Math.max(5, r*.07), 0, TAU); g.lineWidth = lw*.6; g.stroke();
    const n = r < 40 ? 24 : r < 160 ? 48 : 72, inner = Math.max(3, r*.045);
    g.lineWidth = lw*.7; g.beginPath();
    for(let i = 0; i < n; i++){ const a = rot + i/n*TAU, l = i % 6 === 0 ? inner*1.9 : inner;
      g.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r); g.lineTo(x + Math.cos(a)*(r - l), y + Math.sin(a)*(r - l)); }
    g.stroke();
    const dd = Math.max(3, r*.05);
    for(let i = 0; i < 4; i++){ const a = -rot*1.3 + i*TAU/4 + Math.PI/4, px = x + Math.cos(a)*(r + dd*.6), py = y + Math.sin(a)*(r + dd*.6);
      g.beginPath(); g.moveTo(px + Math.cos(a)*dd, py + Math.sin(a)*dd); g.lineTo(px + Math.cos(a + 1.57)*dd*.55, py + Math.sin(a + 1.57)*dd*.55);
      g.lineTo(px - Math.cos(a)*dd, py - Math.sin(a)*dd); g.lineTo(px - Math.cos(a + 1.57)*dd*.55, py - Math.sin(a + 1.57)*dd*.55); g.closePath(); g.fill(); }
    g.restore();
  }
  function glowAt(x, y, r, a){ if(a <= .01 || r < 1) return; g.globalAlpha = a; g.drawImage(GLOW, x - r, y - r, r*2, r*2); g.globalAlpha = 1; }

  /* ── 门钥匙 Portkey ── */
  function strandPath(s, p, outward){
    const pts = [], N = 12;
    for(let j = 0; j < N; j++){
      const q = p - j*.035; if(q < 0) break;
      const e = outward ? eOut3(q) : eIn3(q)*.6 + q*.4;
      const r = outward ? G.R*.04 + e*s.r0*1.25 : s.r0*Math.pow(1 - e, 1.15) + 2;
      const th = s.a + (outward ? -s.sp*(.9 + 2.6*e) : s.sp*(1.6*q + 2.4*q*q));
      pts.push([G.cx + Math.cos(th)*r, G.cy + Math.sin(th)*r]);
    }
    return pts;
  }
  function drawStrands(k, outward){
    const lo = lowTier();
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(const s of G.strands){
      const p = outward ? clamp(k*1.05 - s.d*.25) : clamp((k - s.d)/(1 - s.d)*1.08);
      if(p <= 0) continue;
      const pts = strandPath(s, p, outward); if(pts.length < 2) continue;
      const a = outward ? (1 - p)*.9 : (.25 + .75*p)*s.f;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(let j = 1; j < pts.length; j++) g.lineTo(pts[j][0], pts[j][1]);
      if(!lo){ g.strokeStyle = `rgba(255,190,110,${(a*.18).toFixed(3)})`; g.lineWidth = 5*s.w; g.stroke(); }
      g.strokeStyle = `rgba(255,232,190,${(a*.85).toFixed(3)})`; g.lineWidth = 1.2*s.w; g.stroke();
      const sz = 7*s.w; g.globalAlpha = clamp(a); g.drawImage(SPARK, pts[0][0] - sz/2, pts[0][1] - sz/2, sz, sz); g.globalAlpha = 1;
    }
    g.globalCompositeOperation = 'source-over';
  }
  function drawVapor(k, t, outward){
    g.globalCompositeOperation = 'lighter';
    for(const v of G.vapor){
      const rr = outward ? G.R*(.1 + .9*eOut3(k)) : G.R*(.08 + .55*Math.pow(1 - k, 1.2));
      const a = v.a + t*.0009 + (outward ? -1.2*k : 2.4*k);
      const s = G.R*v.s*(outward ? 1 + k*.6 : 1 - k*.25);
      g.save(); g.globalAlpha = outward ? .55*(1 - k) : .18 + .5*k;
      g.translate(G.cx + Math.cos(a)*rr, G.cy + Math.sin(a)*rr); g.rotate(v.rot + t*.0004*v.vr); g.drawImage(VAPOR, -s, -s, s*2, s*2); g.restore();
    }
    g.globalCompositeOperation = 'source-over';
  }
  function portkeyCover(k, t){
    // 1. 中心光门从小迅速扩大（遮罩 + 光幕）
    const gr = G.R*1.3*eIn3(k) + G.R*.04*k;
    if(gr > 1){
      g.save();
      const m = g.createRadialGradient(G.cx, G.cy, gr*.55, G.cx, G.cy, gr);
      m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
      g.beginPath(); g.arc(G.cx, G.cy, gr, 0, TAU); g.clip();
      // 画布此时为空：先画光幕，再用 destination-in 羽化边缘
      g.drawImage(G.light, 0, 0, G.W, G.H);
      g.globalCompositeOperation = 'destination-in'; g.fillStyle = m; g.fillRect(0, 0, G.W, G.H);
      g.restore(); g.globalCompositeOperation = 'source-over';
    }
    // 2. 旧画面四周微暗，像被吸入旋涡（画在光门之下）
    g.globalCompositeOperation = 'destination-over'; g.fillStyle = `rgba(20,10,4,${(.35*eIn3(k)).toFixed(3)})`; g.fillRect(0, 0, G.W, G.H);
    g.globalCompositeOperation = 'source-over';
    if(k > .86){ g.globalAlpha = clamp((k - .86)/.14); g.drawImage(G.light, 0, 0, G.W, G.H); g.globalAlpha = 1; }
    drawVapor(k, t, false);
    drawStrands(k, false);
    glowAt(G.cx, G.cy, G.R*(.06 + .3*eIn3(k)), .5 + .5*k);
  }
  function portkeyHold(t){
    g.drawImage(G.light, 0, 0, G.W, G.H);
    drawVapor(1, t, false);
    const h = clamp(G.holdT/420), r = Math.min(G.W, G.H)*.17;
    runeRing(G.cx, G.cy, r, t*.0004, .42*h, 'rgba(140,72,20,1)', 1.4);
    runeRing(G.cx, G.cy, r*.62, -t*.0007, .3*h, 'rgba(140,72,20,1)', 1);
    glowAt(G.cx, G.cy, G.R*.36*(1 + .04*Math.sin(t*.004)), .9);
  }
  function holeMask(k, scale){
    // 撕开的光门：主圆 + 偏移小圆，羽化边缘
    const h = G.R*scale*eOut3(k);
    if(h < 1) return h;
    g.globalCompositeOperation = 'destination-out';
    const cut = (x, y, r) => { const m = g.createRadialGradient(x, y, r*.74, x, y, r); m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = m; g.fillRect(x - r, y - r, r*2, r*2); };
    cut(G.cx, G.cy, h);
    for(const b of G.blobs) cut(G.cx + Math.cos(b.a)*h*b.o, G.cy + Math.sin(b.a)*h*b.o, h*b.s + 2);
    g.globalCompositeOperation = 'source-over';
    return h;
  }
  function rim(h, a, warm){
    if(h < 2 || a <= .01) return;
    g.globalCompositeOperation = 'lighter';
    const m = g.createRadialGradient(G.cx, G.cy, h*.72, G.cx, G.cy, h*1.08);
    m.addColorStop(0,'rgba(255,230,180,0)'); m.addColorStop(.7, warm ? `rgba(255,226,170,${(.5*a).toFixed(3)})` : `rgba(255,236,200,${(.42*a).toFixed(3)})`); m.addColorStop(1,'rgba(255,200,120,0)');
    g.fillStyle = m; g.beginPath(); g.arc(G.cx, G.cy, h*1.08, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
  }
  function portkeyReveal(k, t){
    const fade = 1 - clamp((k - .72)/.28);
    g.globalAlpha = fade; g.drawImage(G.light, 0, 0, G.W, G.H); g.globalAlpha = 1;
    const h = holeMask(k, 1.25);
    rim(h*.9, fade, true);
    drawVapor(k, t, true);
    drawStrands(k, true);
  }

  /* ── 熄灯器 Nox / 荧光闪烁 Lumos ── */
  function nightClose(a){
    // a：夜色边界半径（大 → 小）；外侧不透明、内侧透明
    if(a <= 0){ g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H); return; }
    const m = g.createRadialGradient(G.cx, G.cy, a*.55, G.cx, G.cy, a + G.R*.22);
    m.addColorStop(0, `rgba(${NIGHT},0)`); m.addColorStop(1, `rgba(${NIGHT},1)`);
    g.fillStyle = m; g.fillRect(0, 0, G.W, G.H);
  }
  function drawComets(k, outward){
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    let absorbed = 0;
    for(const c of G.comets){
      const u = outward ? clamp(k*1.1 - c.d*.3) : clamp((k - c.d)/(.84 - c.d));
      if(!outward && u >= 1){ absorbed++; continue; }
      if(u <= 0) continue;
      const pos = q => { const e = outward ? eOut3(q) : eIn3(q)*.55 + q*.45; const r = outward ? G.R*.03 + e*c.r0*1.2 : c.r0*Math.pow(1 - e, 1.5);
        const th = c.a + c.curl*(outward ? -e : e); return [G.cx + Math.cos(th)*r, G.cy + Math.sin(th)*r]; };
      const head = pos(u), a = outward ? (1 - u)*c.f : (.35 + .65*u)*c.f;
      g.beginPath(); g.moveTo(head[0], head[1]);
      for(let j = 1; j < 9; j++){ const q = u - j*.028; if(q < 0) break; const p = pos(q); g.lineTo(p[0], p[1]); }
      g.strokeStyle = `rgba(255,226,170,${(a*.55).toFixed(3)})`; g.lineWidth = 1.6*c.s; g.stroke();
      const sz = 12*c.s; g.globalAlpha = clamp(a); g.drawImage(SPARK, head[0] - sz/2, head[1] - sz/2, sz, sz); g.globalAlpha = 1;
    }
    g.globalCompositeOperation = 'source-over';
    return absorbed/(G.comets.length || 1);
  }
  function noxCover(k){
    nightClose(G.R*1.15*(1 - k*k) - G.R*.05*k);
    if(k > .88){ g.fillStyle = `rgba(${NIGHT},${clamp((k - .88)/.12).toFixed(3)})`; g.fillRect(0, 0, G.W, G.H); }
    const got = drawComets(k, false);
    // 中心最后一点光：吸收彗星后变亮，最后熄灭
    const out = clamp((k - .8)/.2), flick = .9 + .1*Math.sin(k*90);
    glowAt(G.cx, G.cy, G.R*(.05 + .07*got)*(1 - out*.7), (.35 + .65*got)*(1 - out)*flick);
  }
  function noxHold(t){
    g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H);
    glowAt(G.cx, G.cy, 14 + 3*Math.sin(t*.005), .18 + .1*Math.sin(t*.005));
  }
  function noxReveal(k){
    // 0–22%：中心荧光闪烁亮起；之后光向外推开夜色
    const lum = clamp(k/.22), push = clamp((k - .12)/.88), h = G.R*1.25*eIO(push);
    g.fillStyle = `rgb(${NIGHT})`; g.fillRect(0, 0, G.W, G.H);
    if(h > 1){
      g.globalCompositeOperation = 'destination-out';
      const m = g.createRadialGradient(G.cx, G.cy, h*.5, G.cx, G.cy, h); m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = m; g.beginPath(); g.arc(G.cx, G.cy, h, 0, TAU); g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    rim(h*.82, (1 - push)*.8, false);
    drawComets(push, true);
    const fl = lum*(1 - clamp((k - .35)/.5));
    glowAt(G.cx, G.cy, G.R*(.04 + .16*eOut3(lum)), fl);
  }

  /* ── 幻影显形 Apparition（装饰 Scene Runtime 的圆形揭示） ── */
  function portalDraw(t, dt){
    const P = G.P; if(!P) return;
    const lo = lowTier();
    if(P.phase === 'prep'){
      const b = .5 + .5*Math.sin(t*.008);
      glowAt(P.x, P.y, 46 + 10*b, .35 + .25*b);
      runeRing(P.x, P.y, 20 + 3*b, t*.003, .85, 'rgba(255,226,168,1)', 1.3);
      return;
    }
    const r = Math.max(22, P.r), k = P.k, a = Math.pow(1 - k, .8);
    // 边缘外侧柔光：照亮周围
    g.globalCompositeOperation = 'lighter';
    const m = g.createRadialGradient(P.x, P.y, Math.max(0, r - 8), P.x, P.y, r + 80);
    m.addColorStop(0,'rgba(255,214,150,0)'); m.addColorStop(.1, `rgba(255,214,150,${(.38*a).toFixed(3)})`); m.addColorStop(1,'rgba(244,184,96,0)');
    g.fillStyle = m; g.beginPath(); g.arc(P.x, P.y, r + 80, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
    runeRing(P.x, P.y, r, k*1.4 + t*.0005, .9*a, 'rgba(255,230,180,1)', 1.5);
    // 6 条螺旋金丝绕边缘旋转
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(let i = 0; i < 6; i++){
      const a0 = i/6*TAU + t*.0035 + k*2.2, span = .9, rr = r + 6 + 9*Math.sin(t*.006 + i);
      g.beginPath();
      for(let j = 0; j <= 14; j++){ const q = j/14, th = a0 + span*q, rq = rr + 10*Math.sin(q*Math.PI)*(i % 2 ? 1 : -1); const px = P.x + Math.cos(th)*rq, py = P.y + Math.sin(th)*rq; j ? g.lineTo(px, py) : g.moveTo(px, py); }
      if(!lo){ g.strokeStyle = `rgba(255,190,110,${(.2*a).toFixed(3)})`; g.lineWidth = 5; g.stroke(); }
      g.strokeStyle = `rgba(255,236,200,${(.8*a).toFixed(3)})`; g.lineWidth = 1.3; g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    // 向外抛出火星
    if(k < .9){ P.acc += dt*(lo ? 50 : 110); while(P.acc > 1){ P.acc--; const th = rnd(0, TAU), sp = rnd(60, 180);
      G.sparks.push({x:P.x + Math.cos(th)*r, y:P.y + Math.sin(th)*r, vx:Math.cos(th)*sp, vy:Math.sin(th)*sp, life:rnd(.35, .7), age:0, s:rnd(4, 9)}); } }
  }
  function sparksStep(dt){
    if(!G.sparks.length) return;
    g.globalCompositeOperation = 'lighter';
    for(let i = G.sparks.length - 1; i >= 0; i--){ const s = G.sparks[i]; s.age += dt; if(s.age > s.life){ G.sparks.splice(i, 1); continue; }
      s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= .96; s.vy *= .96;
      g.globalAlpha = 1 - s.age/s.life; g.drawImage(SPARK, s.x - s.s/2, s.y - s.s/2, s.s, s.s); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function frame(now){
    G.raf = 0; if(!G.on) return;
    const dt = Math.min(.05, (now - G.last)/1000); G.last = now;
    g.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); g.clearRect(0, 0, G.W, G.H);
    const k = G.D ? clamp((now - G.t0)/G.D) : 1;
    if(G.mode === 'cover'){ G.kind === 'portkey' ? portkeyCover(k, now) : noxCover(k); if(k >= 1){ G.mode = 'hold'; G.holdT = 0; settle(); } }
    else if(G.mode === 'hold'){ G.holdT += dt*1000; G.kind === 'portkey' ? portkeyHold(now) : noxHold(now); }
    else if(G.mode === 'reveal'){ G.kind === 'portkey' ? portkeyReveal(k, now) : noxReveal(k); if(k >= 1){ hide(); settle(); return; } }
    else if(G.mode === 'portal'){ portalDraw(now, dt); }
    sparksStep(dt);
    if(G.mode === 'portal-end' && !G.sparks.length){ hide(); return; }
    G.raf = requestAnimationFrame(frame);
  }
  function run(mode, kind, D, at){
    // 后台标签页 RAF 暂停时，用定时器兜底，保证场景事务不会卡住。
    settle(); clearTimeout(G.safety);
    G.mode = mode; G.kind = kind; G.D = D; G.t0 = performance.now();
    return new Promise(res => {
      G.done = res;
      G.safety = setTimeout(() => { if(G.done !== res) return; if(mode === 'reveal') hide(); else G.mode = 'hold'; settle(); }, D + 400);
      show();
    });
  }
  const DUR = { portkey:{cover:[620, 420], reveal:[760, 520]}, nox:{cover:[520, 360], reveal:[620, 420]} };
  const dur = (kind, ph) => DUR[kind][ph][lowTier() ? 1 : 0];

  SB.gate = {
    cover(kind = 'portkey', at){
      kind = kind === 'nox' ? 'nox' : 'portkey';
      size(); origin(at); seed(kind); if(kind === 'portkey') buildLight();
      G.P = null; G.sparks.length = 0;
      return run('cover', kind, dur(kind, 'cover'), at);
    },
    reveal(kind = 'portkey', at){
      kind = kind === 'nox' ? 'nox' : 'portkey';
      if(G.kind !== kind || !G.on){ size(); origin(at); seed(kind); if(kind === 'portkey') buildLight(); }
      else seed(kind);
      return run('reveal', kind, dur(kind, 'reveal'), at);
    },
    portalStart(x, y){ settle(); size(); G.mode = 'portal'; G.kind = 'portal'; G.D = 0; G.P = {x, y, r:0, k:0, phase:'prep', acc:0}; G.sparks.length = 0; show(); },
    portalFrame(x, y, r, k){ if(!G.P) return; G.P.x = x; G.P.y = y; G.P.r = r; G.P.k = k; G.P.phase = 'open'; },
    portalEnd(){ if(G.mode !== 'portal') return; G.P = null; G.mode = 'portal-end'; if(!G.sparks.length) hide(); },
    abort(){ settle(); hide(); },
    get active(){ return G.on; }
  };
  addEventListener('resize', () => { if(!G.on) return; size(); if(G.kind === 'portkey' || G.kind === 'nox'){ origin({x:G.cx, y:G.cy}); if(G.kind === 'portkey') buildLight(); } }, {passive:true});
})(window.SB);
