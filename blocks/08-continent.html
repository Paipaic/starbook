<style>
/* ── 块 08 · 大洲国家目录 ── */
.sb-scene[data-scene="continent"]{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.ct-wrap{position:relative;min-height:100%;padding-block:calc(84px + var(--safe-t)) calc(40px + var(--safe-b));
  padding-left:max(16px,var(--safe-l));padding-right:max(16px,var(--safe-r));max-width:1280px;margin:0 auto;}
.ct-sigil{position:fixed;left:50%;top:44%;width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;opacity:.08;pointer-events:none;animation:bkSpin 220s linear infinite;}
.ct-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:22px;}
.ct-head small{font-family:var(--f-rune);font-weight:500;font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--gold-dim);}
.ct-head h1{margin:0;padding-left:.28em;font-family:var(--f-display);font-weight:var(--fw-display);font-size:clamp(36px,6vw,60px);letter-spacing:.28em;color:var(--gold-hi);
  text-shadow:0 0 30px rgba(244,184,96,.6), 0 0 2px rgba(255,240,210,.9);}
.ct-head p{margin:0;color:#c9c6ea;letter-spacing:.14em;font-size:14px;}
.ct-search{width:min(420px,100%);margin:6px auto 0;position:relative;}
.ct-search input{width:100%;padding:10px 16px 10px 40px;border-radius:999px;border:1px solid var(--line);background:rgba(14,14,40,.7);color:var(--text);font-size:15px;outline:none;transition:box-shadow .3s,border-color .3s;}
.ct-search input:focus{border-color:var(--gold-hi);box-shadow:0 0 20px rgba(244,184,96,.3);}
.ct-search svg{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--gold-dim);}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:14px;}
.ct-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;border-radius:14px;cursor:pointer;text-align:left;min-width:0;
  border:1px solid rgba(244,184,96,.22);background:linear-gradient(180deg, rgba(26,24,62,.72), rgba(10,10,28,.72));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);overflow:hidden;
  transition:transform .35s var(--ease-soft), border-color .35s, box-shadow .35s;animation:ctIn .7s var(--ease-soft) backwards;}
@keyframes ctIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.ct-card:hover,.ct-card:focus-visible{transform:translateY(-4px);border-color:rgba(255,226,168,.7);box-shadow:0 10px 30px rgba(0,0,0,.4), 0 0 24px rgba(244,184,96,.25);}
.ct-card::after{content:"";position:absolute;inset:-50% -80%;background:linear-gradient(105deg, transparent 45%, rgba(255,240,210,.18) 50%, transparent 55%);
  transform:translateX(-60%);transition:transform .9s var(--ease-soft);pointer-events:none;}
.ct-card:hover::after{transform:translateX(60%);}
.ct-card.lit{border-color:rgba(255,214,150,.6);background:linear-gradient(180deg, rgba(60,44,40,.8), rgba(22,16,30,.8));animation:ctIn .7s var(--ease-soft) backwards, ctBreath 4s ease-in-out infinite;}
@keyframes ctBreath{0%,100%{box-shadow:0 0 10px rgba(244,184,96,.15)}50%{box-shadow:0 0 26px rgba(244,184,96,.4)}}
.ct-card canvas{width:100%;aspect-ratio:16/10;display:block;}
.ct-card .nm{font-family:var(--f-display);font-weight:var(--fw-display);font-size:17px;letter-spacing:.08em;color:var(--text);line-height:1.3;}
.ct-card.lit .nm{color:var(--gold-hi);}
.ct-card .en{font-family:var(--f-num);font-style:italic;font-size:12.5px;color:var(--text-dim);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ct-card .badge{position:absolute;top:10px;right:10px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;color:#2a1608;display:inline-flex;align-items:center;gap:3px;
  background:linear-gradient(180deg,#ffe7b5,#f4b860);box-shadow:0 0 12px rgba(244,184,96,.6);}
.ct-none{grid-column:1/-1;padding:40px 0;}
/* 南极洲：世界尽头 */
.ct-end{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;}
.ct-end canvas{width:min(380px,80vw);aspect-ratio:1;cursor:pointer;}
.ct-end p{max-width:30em;line-height:1.9;color:var(--text-dim);letter-spacing:.08em;margin:0;}
@media (max-width:520px){ .ct-grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;} .ct-card .nm{font-size:16px;} }
</style>

<section class="sb-scene" data-scene="continent" aria-label="大洲国家目录">
  <svg class="ct-sigil" viewBox="-100 -100 200 200" aria-hidden="true"><g fill="none" stroke="#f4b860" stroke-width=".4"><circle r="96"/><circle r="90" stroke-dasharray="1 3"/><circle r="60"/><path d="M0 -96 L56 78 L-91 -30 L91 -30 L-56 78Z"/></g></svg>
  <div class="ct-wrap">
    <header class="ct-head"><small id="ct-en"></small><h1 id="ct-title"></h1><p id="ct-stat"></p>
      <label class="ct-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 15 L21 21" stroke="currentColor" stroke-width="1.6"/></svg>
        <input id="ct-q" type="search" placeholder="搜索国家（中文或英文）" aria-label="搜索国家"></label>
    </header>
    <div id="ct-body"></div>
  </div>
</section>

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  let code = 'as';

  function silhouette(cv, country, lit, big){
    const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth || 180, H = cv.clientHeight || 112;
    cv.width = W*dpr; cv.height = H*dpr; const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    // 只保留主体附近的轮廓（去掉远方属地）
    let rings = country.rings.map(r => { const o = new Float32Array(r.length); let off = 0;
      for(let i = 0; i < r.length; i += 2){ if(i){ const d = r[i] - r[i-2]; if(d > 180) off -= 360; else if(d < -180) off += 360; } o[i] = r[i] + off; o[i+1] = r[i+1]; } return o; });
    if(!rings.length) return;
    const area = r => { let a = 0; for(let i = 0, j = r.length-2; i < r.length; j = i, i += 2) a += r[j]*r[i+1] - r[i]*r[j+1]; return Math.abs(a/2); };
    const main = rings.reduce((a,b) => area(a) > area(b) ? a : b);
    let mx = 0, my = 0; for(let i = 0; i < main.length; i += 2){ mx += main[i]; my += main[i+1]; } mx /= main.length/2; my /= main.length/2;
    const polar = country.key === 'aq';
    if(polar) rings = rings.map(r => r.filter((v, i) => r[i - (i % 2) + 1] > -89.5));
    else rings = rings.filter(r => r === main || (Math.abs(r[0] - mx) < 32 && Math.abs(r[1] - my) < 26));
    const P = polar ? (lon, lat) => { const r = (90 + lat), a = lon*Math.PI/180; return [Math.sin(a)*r, Math.cos(a)*r]; }
                    : (lon, lat) => [lon*Math.cos(my*Math.PI/180), -lat];
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    const proj = rings.map(r => { const o = []; for(let i = 0; i < r.length; i += 2){ const [x,y] = P(r[i], r[i+1]); o.push(x,y); b[0] = Math.min(b[0],x); b[1] = Math.min(b[1],y); b[2] = Math.max(b[2],x); b[3] = Math.max(b[3],y); } return o; });
    const pad = big ? 30 : 10, s = Math.min((W - pad*2)/Math.max(.01, b[2]-b[0]), (H - pad*2)/Math.max(.01, b[3]-b[1]));
    const ox = (W - (b[2]-b[0])*s)/2 - b[0]*s, oy = (H - (b[3]-b[1])*s)/2 - b[1]*s;
    g.beginPath();
    proj.forEach(o => { g.moveTo(o[0]*s + ox, o[1]*s + oy); for(let i = 2; i < o.length; i += 2) g.lineTo(o[i]*s + ox, o[i+1]*s + oy); g.closePath(); });
    if(lit){
      const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#ffe2a8'); gr.addColorStop(1, '#d48f38');
      g.shadowColor = 'rgba(255,190,90,.9)'; g.shadowBlur = 16; g.fillStyle = gr; g.fill(); g.shadowBlur = 0;
      g.strokeStyle = '#fff4d8'; g.lineWidth = 1; g.stroke();
    }else{
      g.fillStyle = 'rgba(244,184,96,.08)'; g.fill();
      g.shadowColor = 'rgba(244,184,96,.6)'; g.shadowBlur = 6; g.strokeStyle = 'rgba(244,184,96,.75)'; g.lineWidth = 1; g.stroke(); g.shadowBlur = 0;
    }
    return { proj, s, ox, oy, P };
  }

  function render(){
    const cont = SB.geo.continent(code);
    $('ct-title').textContent = cont.name; $('ct-en').textContent = cont.en;
    const body = $('ct-body'); body.innerHTML = '';
    const vis = SB.store.visitedCountries();
    if(code === 'an'){
      const aq = SB.geo.antarctica, n = SB.store.citiesIn('aq').length;
      $('ct-stat').textContent = n ? `世界尽头已留下 ${n} 个足迹` : '世界的尽头，留给我们最遥远的约定';
      $('ct-q').parentElement.hidden = true;
      const wrap = SB.el('div','ct-end');
      const cv = SB.el('canvas'); cv.setAttribute('role','button'); cv.setAttribute('aria-label','打开南极洲地图'); cv.tabIndex = 0;
      const p = SB.el('p'); p.textContent = '冰原、极光与企鹅。等我们真的到了这里，就在这片大陆上点亮一颗星。';
      const btn = SB.ui.button('进入南极洲星图', 'primary', () => SB.scenes.go('country', {k:'aq'}));
      cv.addEventListener('click', () => btn.click());
      wrap.append(cv, p, btn); body.appendChild(wrap);
      requestAnimationFrame(() => silhouette(cv, aq, n > 0, true));
      return;
    }
    $('ct-q').parentElement.hidden = false;
    const list = SB.geo.inContinent(code).filter(c => c.key !== 'aq');
    const litN = list.filter(c => vis.has(c.key)).length, cityN = SB.store.cities.filter(c => list.some(x => x.key === c.country)).length;
    $('ct-stat').textContent = `${list.length} 个国家和地区 · 已点亮 ${litN} 个国家 · ${cityN} 座城市`;
    const q = $('ct-q').value.trim().toLowerCase();
    const coll = new Intl.Collator('zh-Hans-CN');
    const shown = list.filter(c => !q || c.zh.toLowerCase().includes(q) || c.en.toLowerCase().includes(q))
      .sort((a,b) => (vis.has(b.key) - vis.has(a.key)) || coll.compare(a.zh, b.zh));
    const grid = SB.el('div','ct-grid');
    if(!shown.length){ const e = SB.el('div','sb-empty ct-none'); e.textContent = '没有找到这个国家'; grid.appendChild(e); }
    shown.forEach((c, i) => {
      const n = SB.store.citiesIn(c.key).length, lit = n > 0;
      const card = SB.el('button','ct-card' + (lit ? ' lit' : '')); card.type = 'button';
      card.style.animationDelay = Math.min(i*30, 900) + 'ms';
      card.innerHTML = `<canvas aria-hidden="true"></canvas><span class="nm"></span><span class="en"></span>${lit ? `<span class="badge sb-num">${SB.icon('star')}${n}</span>` : ''}`;
      card.querySelector('.nm').textContent = c.zh; card.querySelector('.en').textContent = c.en;
      card.addEventListener('click', e => SB.scenes.go('country', {k:c.key}, {transition:'portal', x:e.clientX, y:e.clientY}));
      grid.appendChild(card);
    });
    body.appendChild(grid);
    requestAnimationFrame(() => grid.querySelectorAll('.ct-card').forEach((card, i) => silhouette(card.querySelector('canvas'), shown[i], card.classList.contains('lit'))));
  }
  $('ct-q').addEventListener('input', () => render());
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'continent') render(); });

  SB.scenes.register('continent', {
    world:'night',
    title:p => SB.geo.continent(p.c)?.name || '大洲',
    parent:() => ({id:'globe', params:{}}),
    enter(p){ code = p.c || 'as'; $('ct-q').value = ''; SB.fx.palette('night'); render();
      document.querySelector('.sb-scene[data-scene="continent"]').scrollTop = 0; }
  });

  SB.menu.add({id:'continents', order:30, icon:'compass', label:'七大洲', desc:'按大洲翻阅国家目录',
    children:() => { const vis = SB.store.visitedCountries();
      return SB.geo.CONTINENTS.map(c => { const n = SB.geo.inContinent(c.code).filter(x => vis.has(x.key)).length;
        return {label:c.name, badge: n ? String(n) : '', scene:'continent', params:{c:c.code}}; }); }});
})(window.SB);
</script>
