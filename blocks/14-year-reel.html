<script>
/* 「时光剪影」：SB.yearReel.open({year, from:'YYYY-MM-DD', to:'YYYY-MM-DD'|null（不含当天）, list:[memory…], now})（v1.10.1 起精确到日；仍兼容 'YYYY-MM'） —— 由时光长卷的周年节点调用。只读回忆数据，不写入任何内容。 */
(function(SB){
  const CN = n => ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][n] || String(n);
  const ROMAN = n => { const R = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let o = ''; for(const [v, r] of R) while(n >= v){ o += r; n -= v; } return o || String(n); };
  const len = s => [...String(s || '')].length;
  const mIdx = d => { const [y, m] = String(d || '').split('-'); return +y ? +y*12 + ((+m || 1) - 1) : null; };
  const dot = k => `${Math.floor(k/12)} · ${String(k % 12 + 1).padStart(2, '0')}`;
  // v1.10.1：一段回忆在这一年中的位置（0…1，按日计算）；「至今」一段按 365 天计
  const yearFrac = d => { const a = SB.date.day(R.opt.from), b = R.opt.to ? SB.date.day(R.opt.to) : a + 365, v = SB.date.day(d); return v == null ? 0 : SB.clamp((v - a)/Math.max(1, b - a), 0, .9999); };
  const ICON = {
    pause:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>',
    play:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg>',
    close:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  };
  const R = {el:null, T:0, playing:false, cues:[], ci:0, raf:0, last:0, opt:null, built:false, idleT:0};
  const $q = s => R.el.querySelector(s);

  /* ── 素材：每段回忆最多 4 张（封面 + 有描述的照片优先） ── */
  function pickPhotos(m){
    const sl = (m.slides || []).filter(s => s.id), cov = m.cover?.id || sl[0]?.id, out = [];
    const add = s => { if(s && !out.some(x => x.id === s.id) && out.length < 4) out.push(s); };
    add(sl.find(s => s.id === cov) || sl[0]);
    sl.filter(s => (s.caption || '').trim()).forEach(add);
    sl.forEach(add);
    return out;
  }
  function excerpt(m, ph){
    const g = (Array.isArray(m.groups) ? m.groups : []).map(x => String(x?.text || '').trim()).find(Boolean);
    let t = g || ph.map(s => String(s.caption || '').trim()).find(Boolean) || String(m.note || '').trim() || (m.slides || []).map(s => String(s.caption || '').trim()).find(Boolean) || '';
    t = t.replace(/\s+/g, ' ');

  /* ── v1.10.2 跳转：清空舞台，按顺序重放 ≤ T 的状态切换；每个切换新产生的 CSS 动画 / 过渡前移 (T − 切换时间)，

  function seekTo(T){

      const c = R.cues[ci++]; R.T = c.t; R.lag = T - c.t;
      const before = canAdv ? new Set(R.el.getAnimations({subtree:true})) : null;
      try{ c.fn(); }catch(e){ console.warn('[yearReel seek]', e); }
      if(canAdv && R.lag > 0) for(const an of R.el.getAnimations({subtree:true})){ if(before.has(an)) continue; try{ an.currentTime = (an.currentTime || 0) + R.lag; }catch(_){} }
    }

    return null;

  function buildBar(){

    const w = bar.clientWidth;
    bar.querySelector('.fill').style.transform = `scaleX(${p.toFixed(4)})`;
    bar.querySelector('.thumb').style.transform = `translateX(${(p*w).toFixed(1)}px)`;
    const sec = Math.floor(T/1000);
    if(force || sec !== R.barT){ R.barT = sec; $q('.yr-time').textContent = `${mmss(T)} / ${mmss(R.p.total)}`;
      const sg = segAt(T), tot = Math.round(R.p.total/1000); bar.setAttribute('aria-valuenow', String(sec));
      bar.setAttribute('aria-valuetext', `${sg ? sg.label + '，' : ''}${Math.floor(sec/60)} 分 ${sec % 60} 秒，共 ${Math.floor(tot/60)} 分 ${tot % 60} 秒`); }
  }
  function showTip(T, x){
    const bar = $q('.yr-bar'), tip = bar.querySelector('.tip'), sg = segAt(T);
    tip.innerHTML = `<b>${mmss(T)}</b>${SB.esc(sg?.label || '')}`;
    const w = bar.clientWidth, half = Math.min(tip.offsetWidth/2, w/2);
    tip.style.left = SB.clamp(x, half - 16, w - half + 16).toFixed(0) + 'px'; bar.classList.add('hot');
  }
  function bindBar(){
    const bar = $q('.yr-bar'), lite = () => SB.perf.level !== 'high';
    const tAt = cx => { const r = bar.getBoundingClientRect(); return {T:SB.clamp((cx - r.left)/r.width, 0, 1)*R.p.total, x:SB.clamp(cx - r.left, 0, r.width)}; };
    let lastSeek = 0;
    // 电脑（华丽档）拖动中每 180ms 实时定位；柔和档 / 手机拖动中只移动拇指与提示，松手再定位（避免频繁重建）
    const move = (cx, live) => { const {T, x} = tAt(cx); showTip(T, x); updBar(true, T); R.scrub.T = T;
      if(live && !lite()){ const now = performance.now(); if(now - lastSeek > 180){ lastSeek = now; seekTo(T); } } };
    bar.addEventListener('pointerdown', e => { if(!R.p) return; e.stopPropagation(); e.preventDefault();
      try{ bar.setPointerCapture(e.pointerId); }catch(_){}
      R.scrub = {id:e.pointerId, was:R.playing && R.T < R.p.total, T:R.T}; if(R.playing) setPlaying(false); R.inZone = true; wake(); move(e.clientX, true); });
    bar.addEventListener('pointermove', e => {
      if(R.scrub && R.scrub.id === e.pointerId){ move(e.clientX, true); return; }
      if(e.pointerType === 'mouse' && R.p){ const {T, x} = tAt(e.clientX); showTip(T, x); } });
    const end = e => { const sc = R.scrub; if(!sc || sc.id !== e.pointerId) return; R.scrub = null; bar.classList.remove('hot'); if(e.pointerType !== 'mouse') R.inZone = false;
      seekTo(sc.T); if(sc.was) setPlaying(true); wake(); };
    bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end); bar.addEventListener('lostpointercapture', end);
    bar.addEventListener('pointerleave', () => { if(!R.scrub) bar.classList.remove('hot'); });
    bar.addEventListener('keydown', e => {
      if(!R.p) return; let T = null; const segs = [0, ...R.p.seq.map(c => c.t0), R.p.end + 300];
      if(e.key === 'ArrowRight' || e.key === 'ArrowUp') T = R.T + 5000; else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown') T = R.T - 5000;
      else if(e.key === 'PageDown') T = segs.find(t => t > R.T + 50) ?? R.p.total; else if(e.key === 'PageUp') T = [...segs].reverse().find(t => t < R.T - 1500) ?? 0;
      else if(e.key === 'Home') T = 0; else if(e.key === 'End') T = R.p.total - 1;
      if(T == null) return; e.preventDefault(); e.stopPropagation(); seekTo(T); wake();
    });
  }

  /* ── 时钟 ── */
  function loop(now){
    R.raf = 0; if(!R.open || !R.playing) return;
    const dt = Math.min(80, now - (R.last || now)); R.last = now; R.T += dt;
    while(R.ci < R.cues.length && R.cues[R.ci].t <= R.T){ const c = R.cues[R.ci++]; try{ c.fn(); }catch(e){ console.warn('[yearReel]', e); } }
    updBar();
    if(R.counting){ const s = R.counting; s.el.querySelectorAll('b[data-v]').forEach(b => { const p = SB.clamp((R.T - s.t - +b.dataset.t)/1400, 0, 1); b.textContent = Math.round(+b.dataset.v*(1 - Math.pow(1 - p, 3))); }); }
    if(R.T >= R.p.total){ R.playing = false; R.el.classList.add('awake'); R.el.classList.remove('playing'); return; }
    R.raf = requestAnimationFrame(loop);
  }
  async function start(o){
    ensure(); R.opt = o; R.open = true;
    R.el.hidden = false; document.body.classList.add('sb-reel-open'); measure();
    stage().innerHTML = ''; R.counting = null;
    requestAnimationFrame(() => R.el.classList.add('on'));
    SB.audio?.unlock?.(); SB.audio?.clear?.(); SB.audio?.duck?.(1, 800);
    R.p = plan(o);
    // 先准备照片（最多 8 秒）
    const ids = [...new Set(R.p.chs.flatMap(c => c.ph.map(s => s.id)))], wait = $q('.yr-wait');
    wait.textContent = ''; $q('.yr-dial').innerHTML = ''; R.playing = false; cancelAnimationFrame(R.raf); R.raf = 0;
    if(ids.length){
      // v1.10.1：超时后迟到的照片不再改写提示（之前会把「正在准备…」写回放映画面）；提示随准备层淡出
      let done = 0, live = true; const show = () => { if(live && R.opt === o && R.open) wait.textContent = `正在准备这一年的胶片 ${done} / ${ids.length}`; };
      wait.classList.remove('gone'); show();
      await SB.store.prefetchUrls?.(ids);
      R.urls = new Map(); R.sils = new Map();
      const one = async id => { if(SB.store.proxyOn?.()){ const [u, v] = await Promise.all([SB.store.displayUrl(id), SB.store.displayUrl(id, 640)]); if(u) R.urls.set(id, u); if(v) R.sils.set(id, v); }
        await loadImg(R.urls.get(id) || SB.store.url(id)); if(R.sils.get(id)) await loadImg(R.sils.get(id)); };
      await Promise.race([Promise.all(ids.map(id => one(id).then(() => { done++; show(); }))), SB.wait(8000)]);
      live = false; wait.classList.add('gone'); setTimeout(() => { if(!live && wait.classList.contains('gone')) wait.textContent = ''; }, 600);
    }
    if(!R.open || R.opt !== o) return;
    const p = R.p, cues = [];
    cues.push({t:0, fn:() => buildDial(mIdx(o.from))});
    cues.push({t:200, fn:prologue});
    cues.push({t:4600, fn:() => { R.pro?.classList.add('yr-out'); if((R.lag || 0) > 1200){ R.pro?.remove(); R.pro = null; } $q('.yr-dial').classList.add('bg'); }});
    p.seq.forEach(c => {
      if(c.stats){ cues.push({t:c.t0, fn:() => stats(c)}, {t:c.t0 + c.dur - 900, fn:() => { c.el?.classList.add('yr-out'); if((R.lag || 0) > 1100) c.el?.remove(); R.counting = null; }}); return; }
      cues.push({t:c.t0, fn:() => chapter(c)}, {t:c.t0 + c.dur - 1000, fn:() => chapterOut(c)});
    });
    cues.push({t:p.end + 300, fn:epilogue});
    R.cues = cues.sort((a, b) => a.t - b.t); R.ci = 0; R.T = 0; buildBar();
    R.el.classList.remove('awake'); document.body.classList.remove('sb-reel-awake'); R.inZone = false;
    setPlaying(true);
  }
  function close(silent){
    if(!R.el || !R.open) return;
    R.open = false; R.playing = false; cancelAnimationFrame(R.raf); R.raf = 0; clearTimeout(R.idleT);
    document.body.classList.remove('sb-reel-open', 'sb-reel-awake');
    SB.audio?.duck?.(1, 1000);
    const el = R.el; el.classList.remove('on');
    setTimeout(() => { if(!R.open){ el.hidden = true; stage().innerHTML = ''; $q('.yr-wait').textContent = ''; } }, silent ? 0 : 900);
  }
  SB.yearReel = { open:start, close, get state(){ return {open:!!R.open, T:R.T, playing:R.playing, total:R.p?.total || 0, chapters:R.p?.chs.map(c => ({t0:c.t0, dur:c.dur, layout:c.layout, n:c.ph.length, title:c.m.title})) || [], stats:R.p?.seq.filter(x => x.stats).map(x => x.t0) || []}; },
    seek:T => seekTo(T) };
})(window.SB);
</script>
