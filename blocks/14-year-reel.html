<style>
/* ── 块 14 ·「时光剪影」周年回放（v1.10.0）──
   依据 prompts/14-year-reel.md：年轮表盘为主线；照片先以高反差剪影出现，再显影成彩色；胶片带 / 折扇 / 主镜三种版式轮换；
   所有动画都是 CSS 关键帧（transform / opacity），JS 只在时间点切换状态 → 暂停时全部动画一起暂停。 */
.yr{position:absolute;inset:0;z-index:3000;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#151233,#06050f 70%);color:var(--text);opacity:0;transition:opacity .9s var(--ease-soft);
  user-select:none;-webkit-user-select:none;cursor:default;}
.yr.on{opacity:1;}
.yr.paused *,.yr.paused *::before,.yr.paused *::after{animation-play-state:paused!important;}
.yr:not(.awake).playing{cursor:none;}
body.sb-reel-open #sb-nav,body.sb-reel-open #sb-dock{transition:opacity .5s var(--ease-soft);}
body.sb-reel-open:not(.sb-reel-awake) #sb-nav,body.sb-reel-open:not(.sb-reel-awake) #sb-dock{opacity:0;pointer-events:none;}
.yr-grain{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.7));}
/* 年轮表盘 */
.yr-dial{position:absolute;left:50%;top:50%;width:var(--dial);height:var(--dial);margin:calc(var(--dial) / -2) 0 0 calc(var(--dial) / -2);overflow:visible;pointer-events:none;
  transition:transform 1.8s var(--ease-soft), opacity 1.8s var(--ease-soft);}
.yr-dial.bg{transform:scale(.86);opacity:.32;}
.yr-dial.end{transform:scale(1);opacity:1;}
.yr-dial .ring{fill:none;stroke:rgba(240,212,156,.6);stroke-width:1.6;stroke-dasharray:2520;stroke-dashoffset:2520;}
.yr-dial.draw .ring{animation:yrDraw 2.4s var(--ease-soft) forwards;}
@keyframes yrDraw{to{stroke-dashoffset:0}}
.yr-dial .ring2{fill:none;stroke:rgba(240,212,156,.22);stroke-width:1;stroke-dasharray:3 9;}
.yr-dial .prog{fill:none;stroke:url(#yr-gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:2513;stroke-dashoffset:2513;transform:rotate(-90deg);
  transition:stroke-dashoffset 1.8s var(--ease-soft);filter:drop-shadow(0 0 8px rgba(244,184,96,.7));}
.yr-dial .tk{opacity:0;}
.yr-dial.draw .tk{animation:yrFade .8s var(--ease-soft) forwards;animation-delay:var(--d);}
.yr-dial .tk line{stroke:rgba(255,226,168,.75);stroke-width:2;}
.yr-dial .tk text{fill:rgba(240,214,160,.8);font-family:var(--f-num);font-weight:600;font-size:30px;letter-spacing:2px;text-anchor:middle;dominant-baseline:middle;}
.yr-dial .tk text.y{fill:var(--gold-hi);font-size:24px;}
.yr-dial .tk.lit line{stroke:#fff3d6;stroke-width:4;}
.yr-dial .tk.lit text{fill:#fff3d6;}
.yr-dial .hand{transition:transform 1.8s var(--ease-soft);opacity:0;}
.yr-dial.draw .hand{animation:yrFade 1s var(--ease-soft) 1.6s forwards;}
.yr-dial .hand line{stroke:url(#yr-gold);stroke-width:3;stroke-linecap:round;}
.yr-dial .hand circle{fill:#fff3d6;filter:drop-shadow(0 0 10px rgba(255,214,150,.95));}
.yr-dial .tail{fill:none;stroke:rgba(255,226,170,.85);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;filter:drop-shadow(0 0 6px rgba(244,184,96,.8));}
.yr-dial.end .tail{animation:yrDraw 3.2s var(--ease-soft) 1.4s forwards;}
@keyframes yrFade{to{opacity:1}}
/* 文字 */
.yr-txt{position:absolute;pointer-events:none;text-align:center;}
.yr-k{display:block;font-family:var(--f-rune);font-weight:500;font-size:12px;letter-spacing:.5em;padding-left:.5em;color:var(--gold-dim);}
.yr-big{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(46px,8vw,92px);line-height:1.2;letter-spacing:.2em;padding-left:.2em;color:var(--gold-hi);text-shadow:0 0 34px rgba(244,184,96,.55);}
.yr-rng{display:block;font-family:var(--f-num);font-weight:600;font-size:clamp(16px,2vw,22px);letter-spacing:.24em;color:var(--gold);}
.yr-line{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);letter-spacing:.16em;color:#eadfc8;}
.yr-in{opacity:0;animation:yrUp 1.2s var(--ease-soft) forwards;animation-delay:var(--d,0ms);}
@keyframes yrUp{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.yr-out{animation:yrOut 1s var(--ease-soft) forwards!important;}
@keyframes yrOut{from{opacity:1}to{opacity:0;transform:translateY(-22px);filter:blur(5px)}}
.yr-pro{left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;width:90%;}
/* 篇章标题 */
.yr-h{display:flex;flex-direction:column;gap:10px;max-width:var(--hw);}
.yr-h .no{font-family:var(--f-num);font-weight:600;font-size:clamp(13px,1.3vw,16px);letter-spacing:.24em;color:var(--gold);opacity:0;animation:yrUp 1s var(--ease-soft) forwards;}
.yr-h .tt{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,46px);line-height:1.3;letter-spacing:.1em;color:var(--gold-hi);text-shadow:0 0 26px rgba(244,184,96,.45),0 2px 10px rgba(0,0,0,.8);}
.yr-h .tt span{display:inline-block;white-space:pre;opacity:0;animation:yrUp .9s var(--ease-soft) forwards;animation-delay:var(--d);}
.yr-h .ex{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.45vw,18px);line-height:1.9;letter-spacing:.18em;color:#f2e6cc;opacity:0;animation:yrUp 1.4s var(--ease-soft) forwards;animation-delay:var(--d);
  text-shadow:0 2px 10px rgba(0,0,0,.9);}
.yr-h .rule{height:1px;width:5em;background:linear-gradient(90deg,var(--gold-hi),transparent);transform-origin:0 50%;transform:scaleX(0);animation:yrRule 1.2s var(--ease-soft) .5s forwards;}
@keyframes yrRule{to{transform:scaleX(1)}}
.yr-h.c{align-items:center;text-align:center;} .yr-h.c .rule{transform-origin:50% 50%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);}
.yr-h.r{align-items:flex-end;text-align:right;} .yr-h.r .rule{transform-origin:100% 50%;background:linear-gradient(270deg,var(--gold-hi),transparent);}
/* 照片：彩色底图 + 剪影层（静态滤镜，透明度 1 → 0 显影）+ 金色轮廓光 */
.yr-ph{position:absolute;left:0;top:0;width:var(--w);height:var(--h);opacity:0;will-change:transform,opacity;}
.yr-ph .im{position:absolute;inset:0;overflow:hidden;border-radius:3px;background:#0a0816;}
.yr-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.yr-ph img.s{filter:grayscale(1) brightness(.3) contrast(2.4) sepia(.3);animation:yrDev 1.6s var(--ease-soft) forwards;animation-delay:var(--dv);}
@keyframes yrDev{to{opacity:0}}
.yr-ph::after{content:"";position:absolute;inset:-1px;border-radius:4px;pointer-events:none;box-shadow:0 0 0 1px rgba(255,226,168,.95),0 0 26px rgba(244,184,96,.75),inset 0 0 30px rgba(244,184,96,.35);
  animation:yrRim 1.8s var(--ease-soft) forwards;animation-delay:var(--dv);}
@keyframes yrRim{to{box-shadow:0 0 0 1px rgba(255,226,168,.55),0 0 0 rgba(244,184,96,0),inset 0 0 0 rgba(244,184,96,0)}}
.yr-ph.out img.s{animation:yrSil 1s var(--ease-soft) forwards!important;}
@keyframes yrSil{from{opacity:0}to{opacity:1}}
/* 胶片带 */
.yr-strip{position:absolute;left:0;top:var(--sy);height:var(--sh);width:var(--sw);padding:calc(var(--sh) * .1) 0;opacity:0;
  background:linear-gradient(#0c0a14,#0c0a14) padding-box;border-top:1px solid rgba(255,226,168,.35);border-bottom:1px solid rgba(255,226,168,.35);
  animation:yrStrip var(--dur) linear forwards, yrFadeIn 1s var(--ease-soft) forwards;}
.yr-strip::before,.yr-strip::after{content:"";position:absolute;left:0;right:0;height:calc(var(--sh) * .1);
  background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(240,214,160,.55) 10px 22px,transparent 22px 34px);background-size:34px 46%;background-repeat:repeat-x;background-position:0 50%;}
.yr-strip::before{top:0;} .yr-strip::after{bottom:0;}
@keyframes yrStrip{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
@keyframes yrFadeIn{to{opacity:1}}
.yr-strip .yr-ph{position:absolute;top:calc(var(--sh) * .1);animation:yrFadeIn 1s var(--ease-soft) forwards;animation-delay:var(--da);}
.yr-strip.out{animation:yrStrip var(--dur) linear forwards, yrOut 1.1s var(--ease-soft) forwards!important;}
/* 折扇 */
.yr-Lfan .yr-ph{animation:yrFan 1.5s cubic-bezier(.2,.9,.25,1.05) forwards;animation-delay:var(--da);transform-origin:50% 120%;}
@keyframes yrFan{from{opacity:0;transform:translate(var(--x),calc(var(--y) + 46vh)) rotate(0deg)}to{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.yr-Lfan .yr-ph.out{animation:yrFanOut 1.1s var(--ease-soft) forwards!important;}
@keyframes yrFanOut{from{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}to{opacity:0;transform:translate(var(--x),calc(var(--y) - 8vh)) rotate(var(--r))}}
.yr-Lfan .yr-ph .im{box-shadow:0 0 0 5px #f2e9d6,0 18px 40px rgba(0,0,0,.6);}
/* 主镜 */
.yr-Lhero .yr-ph{animation:yrHero var(--dur) linear forwards, yrFadeIn 1.2s var(--ease-soft) forwards;}
@keyframes yrHero{from{transform:translate(var(--x),var(--y)) scale(1)}to{transform:translate(var(--x),var(--y)) scale(1.06)}}
.yr-Lhero .yr-ph.out{animation:yrHero var(--dur) linear forwards, yrOut 1.1s var(--ease-soft) forwards!important;}
/* 间奏：这一年 */
.yr-stats{left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:22px;width:92%;}
.yr-nums{display:flex;gap:clamp(22px,6vw,80px);justify-content:center;}
.yr-num{display:flex;flex-direction:column;align-items:center;gap:6px;}
.yr-num b{font-family:var(--f-num);font-weight:600;font-size:clamp(46px,7vw,88px);line-height:1;color:var(--gold-hi);text-shadow:0 0 30px rgba(244,184,96,.5);}
.yr-num span{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.24em;color:var(--text-dim);}
.yr-trail{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 0;max-width:900px;}
.yr-trail i{display:block;width:clamp(16px,3vw,44px);height:1px;background:linear-gradient(90deg,rgba(244,184,96,.2),var(--gold-hi),rgba(244,184,96,.2));transform:scaleX(0);animation:yrRule .8s var(--ease-soft) forwards;animation-delay:var(--d);}
.yr-trail span{font-family:var(--f-display);font-weight:600;font-size:clamp(13px,1.4vw,17px);letter-spacing:.14em;color:#f2e6cc;opacity:0;animation:yrUp .9s var(--ease-soft) forwards;animation-delay:var(--d);padding:0 8px;}
/* 尾声 */
.yr-end{left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;width:90%;}
.yr-acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;pointer-events:auto;opacity:0;animation:yrUp 1s var(--ease-soft) forwards;animation-delay:var(--d);}
/* 控制：电影模式（鼠标进入下方 20% 或轻触时浮现） */
.yr-ui{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:12px;padding:40px 16px calc(18px + var(--safe-b));
  background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .5s var(--ease-soft), transform .5s var(--ease-soft);}
.yr.awake .yr-ui{opacity:1;transform:none;pointer-events:auto;}
.yr-ui button{min-width:46px;height:46px;border-radius:999px;border:1px solid var(--line);background:rgba(10,10,28,.65);color:var(--gold-hi);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;
  font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.1em;}
.yr-ui button:hover{box-shadow:0 0 16px rgba(244,184,96,.45);}
.yr-ui .sb-ico{width:18px;height:18px;}
.yr-wait{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.2em;color:var(--gold);text-align:center;}
.yr-wait:empty{display:none;}
html[data-sb-perf="reduced"] .yr-strip,html[data-sb-perf="reduced"] .yr-Lfan .yr-ph,html[data-sb-perf="reduced"] .yr-Lhero .yr-ph{animation:yrFadeIn 1s ease forwards!important;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg))!important;}
html[data-sb-perf="reduced"] .yr-strip{transform:translateX(var(--x0))!important;}
@media (max-width:760px){ .yr-k{font-size:10.5px;} .yr-ui button span{display:none;} }
</style>

<script>
/* 「时光剪影」：SB.yearReel.open({year, from:'YYYY-MM', to:'YYYY-MM'|null, list:[memory…], now}) —— 由时光长卷的周年节点调用。只读回忆数据，不写入任何内容。 */
(function(SB){
  const CN = n => ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][n] || String(n);
  const ROMAN = n => { const R = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let o = ''; for(const [v, r] of R) while(n >= v){ o += r; n -= v; } return o || String(n); };
  const len = s => [...String(s || '')].length;
  const mIdx = d => { const [y, m] = String(d || '').split('-'); return +y ? +y*12 + ((+m || 1) - 1) : null; };
  const dot = k => `${Math.floor(k/12)} · ${String(k % 12 + 1).padStart(2, '0')}`;
  const ICON = {
    pause:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>',
    play:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg>',
    close:'<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  };
  const R = {el:null, T:0, playing:false, cues:[], ci:0, raf:0, last:0, opt:null, built:false, idleT:0};
  const $q = s => R.el.querySelector(s);

  /* ── 素材：每段回忆最多 4 张（封面 + 有描述的照片优先） ── */
  function pickPhotos(m){
    const sl = (m.slides || []).filter(s => s.id), cov = m.cover?.id || sl[0]?.id, out = [];
    const add = s => { if(s && !out.some(x => x.id === s.id) && out.length < 4) out.push(s); };
    add(sl.find(s => s.id === cov) || sl[0]);
    sl.filter(s => (s.caption || '').trim()).forEach(add);
    sl.forEach(add);
    return out;
  }
  function excerpt(m, ph){
    const g = (Array.isArray(m.groups) ? m.groups : []).map(x => String(x?.text || '').trim()).find(Boolean);
    let t = g || ph.map(s => String(s.caption || '').trim()).find(Boolean) || String(m.note || '').trim() || (m.slides || []).map(s => String(s.caption || '').trim()).find(Boolean) || '';
    t = t.replace(/\s+/g, ' ');
    return len(t) > 40 ? [...t].slice(0, 39).join('') + '…' : t;
  }
  function loadImg(url){ return new Promise(res => { if(!url) return res(); const i = new Image(); i.decoding = 'async'; i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(res); i.onerror = res; i.src = url; }); }

  /* ── 编排：序幕 → 篇章（间奏插在中间）→ 尾声 ── */
  function plan(o){
    const list = [...o.list].filter(m => m.date).sort((a, b) => a.date.localeCompare(b.date));
    const chs = list.map((m, i) => { const ph = pickPhotos(m); return {m, i, ph, ex:excerpt(m, ph), city:SB.store.city(m.cityId)?.name || '', layout:['strip', 'fan', 'hero'][i % 3]}; });
    // 照片很少时不用胶片带
    chs.forEach(c => { if(c.layout === 'strip' && c.ph.length < 2) c.layout = 'hero'; if(c.layout === 'fan' && c.ph.length < 2) c.layout = 'hero'; });
    let t = 5600; const seq = [];
    chs.forEach((c, k) => {
      c.dur = 5400 + 1100*Math.max(0, c.ph.length - 1) + Math.min(2400, len(c.ex)*45);
      c.t0 = t; t += c.dur; seq.push(c);
      if(k === Math.ceil(chs.length/2) - 1 && chs.length >= 4){ seq.push({stats:true, t0:t, dur:6200}); t += 6200; }
    });
    return {list, chs, seq, end:t, total:t + 9000};
  }

  /* ── DOM ── */
  function ensure(){
    if(R.el) return;
    const host = document.querySelector('.sb-scene[data-scene="overview"]') || document.body;
    R.el = SB.el('section', 'yr'); R.el.hidden = true; R.el.setAttribute('aria-label', '时光剪影'); R.el.setAttribute('role', 'dialog');
    R.el.innerHTML = `<div class="yr-grain"></div><svg class="yr-dial" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg><div class="yr-stage"></div>
      <div class="yr-wait" aria-live="polite"></div>
      <div class="yr-ui"><button type="button" class="yr-pp" aria-label="暂停">${ICON.pause}<span>暂停</span></button><button type="button" class="yr-x" aria-label="退出时光剪影">${ICON.close}<span>退出</span></button></div>
      <div class="pl-live" aria-live="polite"></div>`;
    host.appendChild(R.el);
    $q('.yr-pp').addEventListener('click', e => { e.stopPropagation(); setPlaying(!R.playing); wake(); });
    $q('.yr-x').addEventListener('click', e => { e.stopPropagation(); close(); });
    R.el.addEventListener('pointerdown', e => { R.px = e.clientX; R.py = e.clientY; R.pt = performance.now(); });
    R.el.addEventListener('pointerup', e => {
      if(e.target.closest('button') || performance.now() - (R.pt || 0) > 400 || Math.hypot(e.clientX - R.px, e.clientY - R.py) > 12) return;
      if(e.pointerType === 'mouse'){ if(R.T < R.p.total) setPlaying(!R.playing); wake(); }
      else R.el.classList.contains('awake') ? sleep() : wake(4000);
    });
    R.el.addEventListener('pointermove', e => { if(e.pointerType !== 'mouse') return; const inZone = e.clientY > innerHeight - Math.max(140, innerHeight*.2) || !!e.target.closest('.yr-ui');
      R.inZone = inZone; if(inZone) wake(); });
    document.addEventListener('keydown', e => { if(!R.open) return;
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } else if(e.key === ' '){ e.preventDefault(); setPlaying(!R.playing); wake(); } }, true);
    document.addEventListener('visibilitychange', () => { if(document.hidden && R.open) setPlaying(false); });
    addEventListener('resize', () => { if(R.open) measure(); });
  }
  function wake(ms = 2600){ R.el.classList.add('awake'); document.body.classList.add('sb-reel-awake'); clearTimeout(R.idleT); R.idleT = setTimeout(sleep, ms); }
  function sleep(){ if(R.inZone || !R.playing){ clearTimeout(R.idleT); R.idleT = setTimeout(sleep, 1200); return; } R.el.classList.remove('awake'); document.body.classList.remove('sb-reel-awake'); }
  function measure(){
    const W = R.W = R.el.clientWidth || innerWidth, H = R.H = R.el.clientHeight || innerHeight, land = R.land = W >= H*1.05;
    R.el.style.setProperty('--dial', Math.round(Math.min(W*.92, H*.86)) + 'px');
  }
  function setPlaying(v){ R.playing = v; R.el.classList.toggle('paused', !v); R.el.classList.toggle('playing', v);
    const b = $q('.yr-pp'); b.innerHTML = (v ? ICON.pause : ICON.play) + `<span>${v ? '暂停' : '继续'}</span>`; b.setAttribute('aria-label', v ? '暂停' : '继续'); R.last = 0;
    if(v && !R.raf) R.raf = requestAnimationFrame(loop); }

  /* 表盘：12 个月刻度从起始月份开始（顶部），一月处标年份 */
  function buildDial(k0){
    const svg = $q('.yr-dial'), r = 400;
    let h = `<defs><linearGradient id="yr-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1cc"/><stop offset=".55" stop-color="#f4b860"/><stop offset="1" stop-color="#c88a3c"/></linearGradient></defs>
      <circle class="ring2" r="${r + 26}"/><circle class="ring" r="${r}"/><circle class="prog" r="${r}"/>`;
    for(let i = 0; i < 12; i++){
      const a = -Math.PI/2 + i*Math.PI/6, c = Math.cos(a), s = Math.sin(a), k = k0 + i, mo = k % 12 + 1, jan = mo === 1 || i === 0;
      h += `<g class="tk" data-i="${i}" style="--d:${(300 + i*110)}ms"><line x1="${(c*(r - 14)).toFixed(1)}" y1="${(s*(r - 14)).toFixed(1)}" x2="${(c*(r + 14)).toFixed(1)}" y2="${(s*(r + 14)).toFixed(1)}"/>
        <text x="${(c*(r + 58)).toFixed(1)}" y="${(s*(r + 58)).toFixed(1)}">${mo}</text>${jan ? `<text class="y" x="${(c*(r + 58)).toFixed(1)}" y="${(s*(r + 58) + (i === 0 ? -34 : 32)).toFixed(1)}">${Math.floor(k/12)}</text>` : ''}</g>`;
    }
    h += `<g class="hand" style="transform:rotate(0deg)"><line x1="0" y1="0" x2="0" y2="${-(r - 40)}"/><circle cx="0" cy="${-(r - 40)}" r="9"/><circle r="7"/></g>
      <path class="tail" d="M ${(r*Math.cos(-Math.PI/2 - .2)).toFixed(1)} ${(r*Math.sin(-Math.PI/2 - .2)).toFixed(1)} C 160 -560 520 -520 980 -380"/>`;
    svg.innerHTML = h; svg.classList.remove('draw', 'bg', 'end'); void svg.getBoundingClientRect(); svg.classList.add('draw');
  }
  function dialTo(frac, tick){
    const svg = $q('.yr-dial');
    svg.querySelector('.prog').style.strokeDashoffset = (2513*(1 - SB.clamp(frac, 0, 1))).toFixed(1);
    svg.querySelector('.hand').style.transform = `rotate(${(frac*360).toFixed(1)}deg)`;
    if(tick != null){ svg.querySelectorAll('.tk.lit').forEach(x => x.classList.remove('lit')); svg.querySelector(`.tk[data-i="${tick}"]`)?.classList.add('lit'); }
  }

  /* ── 场景片段 ── */
  const stage = () => $q('.yr-stage');
  function txt(cls, html, css = ''){ const d = SB.el('div', 'yr-txt ' + cls, html); if(css) d.style.cssText += css; stage().appendChild(d); return d; }
  const chars = (s, d0 = 0, step = 55) => [...String(s || '')].map((ch, j) => `<span style="--d:${d0 + j*step}ms">${SB.esc(ch)}</span>`).join('');
  function prologue(){
    const o = R.opt, p = R.p, cities = new Set(p.list.map(m => m.cityId)).size;
    const endK = o.to ? mIdx(o.to) - 1 : null;
    R.pro = txt('yr-pro', `<span class="yr-k yr-in" style="--d:600ms">${o.now ? 'ANNUS ' + ROMAN(o.year) + ' · NUNC' : 'ANNIVERSARIUM · ' + ROMAN(o.year)}</span>
      <span class="yr-big yr-in" style="--d:1100ms">第${CN(o.year)}年</span>
      <span class="yr-rng yr-in" style="--d:1700ms">${dot(mIdx(o.from))} — ${endK != null ? dot(endK) : '此刻'}</span>
      <span class="yr-line yr-in" style="--d:2300ms">这一年，我们去了 ${cities} 座城市，写下 ${p.list.length} 段回忆</span>`);
  }
  function chapter(c){
    const W = R.W, H = R.H, land = R.land, root = SB.el('div', 'yr-ch yr-L' + c.layout); stage().appendChild(root); c.root = root;
    const k0 = mIdx(R.opt.from), mk = mIdx(c.m.date), tick = SB.clamp(mk - k0, 0, 11);
    dialTo((tick + .5)/12, tick);
    const url = id => SB.store.url(id);
    const phEl = (s, w, h, dv, extra = '') => { const e = SB.el('div', 'yr-ph', `<div class="im"><img class="c" alt="" src="${SB.esc(url(s.id))}"><img class="s" alt="" src="${SB.esc(url(s.id))}"></div>`);
      e.style.cssText = `--w:${w.toFixed(0)}px;--h:${h.toFixed(0)}px;--dv:${dv}ms;${extra}`; return e; };
    const ar = s => SB.clamp((s.w && s.h) ? s.w/s.h : 1.5, .62, 1.8);
    const n = c.ph.length, dur = c.dur;
    let head = {cls:'', css:''};
    if(c.layout === 'strip'){
      const fh = land ? Math.min(H*.36, W*.2) : H*.24, frames = c.ph.map(s => ({s, w:fh*Math.min(1.6, Math.max(.75, ar(s)))}));
      const gap = fh*.12, total = frames.reduce((a, f) => a + f.w + gap, gap), sh = fh*1.25;
      const strip = SB.el('div', 'yr-strip');
      const x0 = total > W*.9 ? W*.06 : (W - total)/2 + W*.05, x1 = total > W*.9 ? W*.94 - total : (W - total)/2 - W*.05;
      strip.style.cssText = `--sh:${sh.toFixed(0)}px;--sw:${total.toFixed(0)}px;--sy:${((land ? H*.56 : H*.5) - sh/2).toFixed(0)}px;--x0:${x0.toFixed(0)}px;--x1:${x1.toFixed(0)}px;--dur:${dur}ms`;
      let x = gap; frames.forEach((f, k) => { const e = phEl(f.s, f.w, fh, 900 + k*900, `left:${x.toFixed(0)}px;--da:${300 + k*900}ms`); strip.appendChild(e); x += f.w + gap; });
      root.appendChild(strip);
      head = land ? {cls:'', css:`left:7vw;top:${(H*.56 - sh/2 - H*.04).toFixed(0)}px;transform:translateY(-100%);text-align:left;--hw:60vw`} : {cls:'c', css:`left:6vw;right:6vw;top:${(H*.5 - sh/2 - 18).toFixed(0)}px;transform:translateY(-100%);--hw:88vw`};
    } else if(c.layout === 'fan'){
      const pw = land ? Math.min(W*.2, H*.34) : W*.36, list = c.ph.slice(0, 3), m = list.length, rot = m === 2 ? [-6, 6] : [-9, 0, 9];
      const cx = W/2, by = land ? H*.84 : H*.8;
      list.forEach((s, k) => { const w = pw, h = pw/ar(s), off = (k - (m - 1)/2)*pw*(land ? .78 : .62);
        root.appendChild(phEl(s, w, h, 1100 + k*800, `--x:${(cx + off - w/2).toFixed(0)}px;--y:${(by - h).toFixed(0)}px;--r:${rot[k]}deg;--da:${200 + k*700}ms;z-index:${k === (m - 1)/2 ? 3 : 2}`)); });
      head = {cls:'c', css:`left:6vw;right:6vw;top:${land ? '13vh' : '14vh'};--hw:88vw`};
    } else {
      const s = c.ph[0], side = c.i % 2 ? 'r' : 'l';
      let w, h, x, y;
      if(land){ h = H*.68; w = Math.min(W*.5, h*ar(s)); h = w/ar(s); if(h > H*.74){ h = H*.74; w = h*ar(s); } x = side === 'l' ? W*.07 : W*.93 - w; y = (H - h)/2; }
      else { w = W*.86; h = Math.min(H*.46, w/ar(s)); w = Math.min(w, h*ar(s)); x = (W - w)/2; y = H*.14; }
      root.appendChild(phEl(s, w, h, 700, `--x:${x.toFixed(0)}px;--y:${y.toFixed(0)}px;--dur:${dur}ms`));
      head = land ? {cls:side === 'l' ? '' : 'r', css:side === 'l' ? `left:${(x + w + W*.05).toFixed(0)}px;right:6vw;top:50%;transform:translateY(-50%);text-align:left;--hw:${(W*.93 - x - w - W*.05).toFixed(0)}px`
                                                             : `right:${(W - x + W*.05).toFixed(0)}px;left:6vw;top:50%;transform:translateY(-50%);--hw:${(x - W*.11).toFixed(0)}px`}
                  : {cls:'c', css:`left:7vw;right:7vw;top:${(y + h + H*.05).toFixed(0)}px;--hw:86vw`};
    }
    const no = `No. ${String(c.i + 1).padStart(2, '0')} · ${dot(mk)}${c.city ? ' · ' + SB.esc(c.city) : ''}`;
    const h = SB.el('div', 'yr-txt yr-h ' + head.cls, `<span class="no">${no}</span><span class="tt">${chars(c.m.title || '未命名的回忆', 250, 60)}</span><i class="rule"></i>${c.ex ? `<span class="ex" style="--d:${900 + len(c.m.title)*60}ms">${SB.esc(c.ex)}</span>` : ''}`);
    h.style.cssText += head.css; root.appendChild(h); c.head = h;
    $q('.pl-live').textContent = `${c.m.title || ''} ${c.ex || ''}`;
  }
  function chapterOut(c){
    if(!c.root) return;
    c.root.querySelectorAll('.yr-ph, .yr-strip').forEach(x => x.classList.add('out'));
    c.head?.classList.add('yr-out');
    const r = c.root; setTimeout(() => r.remove(), 1400);
  }
  function stats(seg){
    const p = R.p, photos = p.list.reduce((a, m) => a + (m.slides || []).filter(s => s.id).length, 0);
    const cities = []; p.list.forEach(m => { const n = SB.store.city(m.cityId)?.name; if(n && cities[cities.length - 1] !== n && !cities.includes(n)) cities.push(n); });
    const nums = [[p.list.length, '段回忆'], [new Set(p.list.map(m => m.cityId)).size, '座城市'], [photos, '张照片']];
    let trail = ''; cities.slice(0, 12).forEach((n, k) => { trail += `${k ? `<i style="--d:${1800 + k*260 - 130}ms"></i>` : ''}<span style="--d:${1800 + k*260}ms">${SB.esc(n)}</span>`; });
    seg.el = txt('yr-stats', `<span class="yr-k yr-in" style="--d:100ms">HOC ANNO · 这一年</span><div class="yr-nums">${nums.map(([v, l], k) => `<div class="yr-num yr-in" style="--d:${300 + k*350}ms"><b data-v="${v}" data-t="${300 + k*350}">0</b><span>${l}</span></div>`).join('')}</div>
      ${trail ? `<div class="yr-trail">${trail}</div>` : ''}`);
    seg.t = R.T; R.counting = seg;
  }
  function epilogue(){
    const o = R.opt, svg = $q('.yr-dial');
    svg.classList.remove('bg'); svg.classList.add('end'); dialTo(11.6/12, null);
    svg.querySelectorAll('.tk').forEach(x => x.classList.add('lit'));
    SB.audio?.duck?.(.45, 3000);
    R.endEl = txt('yr-end', `<span class="yr-k yr-in" style="--d:600ms">FINIS ANNI · ${ROMAN(o.year)}</span>
      <span class="yr-big yr-in" style="--d:1000ms;font-size:clamp(34px,5.4vw,64px)">第${CN(o.year)}年 · 完</span>
      <span class="yr-line yr-in" style="--d:2600ms">故事未完待续</span><span class="yr-k yr-in" style="--d:3200ms">TO BE CONTINUED</span>`);
    const acts = SB.el('div', 'yr-acts'); acts.style.setProperty('--d', '4200ms');
    acts.append(SB.ui.button('再看一遍', 'primary', () => start(R.opt), 'reset'), SB.ui.button('回到时光长卷', '', () => close()));
    R.endEl.appendChild(acts);
  }

  /* ── 时钟 ── */
  function loop(now){
    R.raf = 0; if(!R.open || !R.playing) return;
    const dt = Math.min(80, now - (R.last || now)); R.last = now; R.T += dt;
    while(R.ci < R.cues.length && R.cues[R.ci].t <= R.T){ const c = R.cues[R.ci++]; try{ c.fn(); }catch(e){ console.warn('[yearReel]', e); } }
    if(R.counting){ const s = R.counting; s.el.querySelectorAll('b[data-v]').forEach(b => { const p = SB.clamp((R.T - s.t - +b.dataset.t)/1400, 0, 1); b.textContent = Math.round(+b.dataset.v*(1 - Math.pow(1 - p, 3))); }); }
    if(R.T >= R.p.total){ R.playing = false; R.el.classList.add('awake'); R.el.classList.remove('playing'); return; }
    R.raf = requestAnimationFrame(loop);
  }
  async function start(o){
    ensure(); R.opt = o; R.open = true;
    R.el.hidden = false; document.body.classList.add('sb-reel-open'); measure();
    stage().innerHTML = ''; R.counting = null;
    requestAnimationFrame(() => R.el.classList.add('on'));
    SB.audio?.unlock?.(); SB.audio?.clear?.(); SB.audio?.duck?.(1, 800);
    R.p = plan(o);
    // 先准备照片（最多 8 秒）
    const ids = [...new Set(R.p.chs.flatMap(c => c.ph.map(s => s.id)))], wait = $q('.yr-wait');
    $q('.yr-dial').innerHTML = ''; R.playing = false; cancelAnimationFrame(R.raf); R.raf = 0;
    if(ids.length){
      let done = 0; const show = () => { wait.textContent = `正在准备这一年的胶片 ${done} / ${ids.length}`; }; show();
      await SB.store.prefetchUrls?.(ids);
      await Promise.race([Promise.all(ids.map(id => loadImg(SB.store.url(id)).then(() => { done++; show(); }))), SB.wait(8000)]);
      wait.textContent = '';
    }
    if(!R.open || R.opt !== o) return;
    const p = R.p, cues = [];
    cues.push({t:0, fn:() => buildDial(mIdx(o.from))});
    cues.push({t:200, fn:prologue});
    cues.push({t:4600, fn:() => { R.pro?.classList.add('yr-out'); $q('.yr-dial').classList.add('bg'); }});
    p.seq.forEach(c => {
      if(c.stats){ cues.push({t:c.t0, fn:() => stats(c)}, {t:c.t0 + c.dur - 900, fn:() => { c.el?.classList.add('yr-out'); R.counting = null; }}); return; }
      cues.push({t:c.t0, fn:() => chapter(c)}, {t:c.t0 + c.dur - 1000, fn:() => chapterOut(c)});
    });
    cues.push({t:p.end + 300, fn:epilogue});
    R.cues = cues.sort((a, b) => a.t - b.t); R.ci = 0; R.T = 0;
    R.el.classList.remove('awake'); document.body.classList.remove('sb-reel-awake'); R.inZone = false;
    setPlaying(true);
  }
  function close(silent){
    if(!R.el || !R.open) return;
    R.open = false; R.playing = false; cancelAnimationFrame(R.raf); R.raf = 0; clearTimeout(R.idleT);
    document.body.classList.remove('sb-reel-open', 'sb-reel-awake');
    SB.audio?.duck?.(1, 1000);
    const el = R.el; el.classList.remove('on');
    setTimeout(() => { if(!R.open){ el.hidden = true; stage().innerHTML = ''; } }, silent ? 0 : 900);
  }
  SB.yearReel = { open:start, close, get state(){ return {open:!!R.open, T:R.T, playing:R.playing, total:R.p?.total || 0, chapters:R.p?.chs.map(c => ({t0:c.t0, dur:c.dur, layout:c.layout, n:c.ph.length, title:c.m.title})) || [], stats:R.p?.seq.filter(x => x.stats).map(x => x.t0) || []}; },
    seek(T){ /* 测试用：跳到某个时间（重放之前的状态切换） */ if(!R.open) return; R.T = 0; R.ci = 0; stage().innerHTML = ''; R.counting = null; while(R.ci < R.cues.length && R.cues[R.ci].t <= T){ try{ R.cues[R.ci].fn(); }catch(e){} R.ci++; } R.T = T; } };
})(window.SB);
</script>
