<style>
/* ── 块 12 · 回忆编辑器（v1.7.0「星屿手稿」）──
   左：实时海报预览（封面、标题、日期、地点、放映风格与季节）；右：四章——故事 / 影像 / 放映 / 乐章。
   手机：单列，预览缩成顶部横条。 */
.sb-scroll.ed-book{width:min(1120px,100%);}
.sb-scroll.ed-book > header{padding-top:22px;}
.sb-scroll.ed-book > .body{padding:6px 24px 18px;}
.ed-wrap{display:grid;grid-template-columns:clamp(240px,25vw,300px) minmax(0,1fr);gap:clamp(20px,2.4vw,30px);align-items:start;}

/* 预览海报 */
.ed-side{position:sticky;top:0;display:flex;flex-direction:column;gap:12px;}
.ed-poster{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#2a1e4a,#0d0a1c);
  box-shadow:0 0 0 1px rgba(255,226,168,.7),0 0 0 6px rgba(16,10,6,.8),0 0 0 7px rgba(244,184,96,.42),0 22px 50px rgba(0,0,0,.55),0 0 40px rgba(244,184,96,.14);}
.ed-poster > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;}
.ed-poster > img.ok{opacity:1;}
.ed-poster .empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:var(--gold-dim);font-family:var(--f-rune);font-size:10px;letter-spacing:.4em;}
.ed-poster .empty .sb-ico{width:44px;height:44px;color:rgba(244,184,96,.45);}
.ed-poster .grade{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55;transition:background-color .8s;}
.ed-poster .fall{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.ed-poster .fall i{position:absolute;top:-10%;display:block;animation:edFall linear infinite;opacity:.9;}
@keyframes edFall{to{transform:translate3d(var(--dx,20px),125cqh,0) rotate(var(--rot,320deg));}}
@keyframes edRise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translate3d(var(--dx,10px),-125cqh,0);opacity:0}}
.ed-poster{container-type:size;}
.ed-poster .shade{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(transparent,rgba(6,4,14,.92));}
.ed-poster .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.ed-poster .cap small{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.24em;color:var(--gold);}
.ed-poster .cap b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.4;letter-spacing:.1em;color:var(--gold-hi);text-shadow:0 0 16px rgba(244,184,96,.45);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ed-poster .cap b:empty::before{content:"为这段回忆起个名字";color:rgba(255,226,168,.4);}
.ed-poster .cap span{font-size:11.5px;letter-spacing:.2em;color:var(--text-dim);}
.ed-poster .badges{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:6px;}
.ed-poster .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(8,6,18,.7);border:1px solid rgba(244,184,96,.4);
  font-family:var(--f-rune);font-size:9.5px;letter-spacing:.22em;color:var(--gold-hi);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.ed-poster .badge .sb-ico{width:12px;height:12px;}
.ed-sum{display:flex;justify-content:center;gap:10px;font-size:12.5px;letter-spacing:.12em;color:var(--text-dim);}
.ed-sum i{width:3px;height:3px;border-radius:50%;background:var(--gold-dim);align-self:center;}

/* 章节 */
.ed-main{display:flex;flex-direction:column;gap:24px;min-width:0;}
.ed-sec{display:flex;flex-direction:column;gap:14px;}
.ed-h{display:flex;align-items:center;gap:12px;}
.ed-h .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-rune);font-size:12px;color:var(--gold-hi);
  border:1px solid rgba(244,184,96,.55);box-shadow:0 0 12px rgba(244,184,96,.25), inset 0 0 8px rgba(244,184,96,.15);}
.ed-h .tt{display:flex;flex-direction:column;gap:1px;}
.ed-h .tt b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.16em;color:var(--gold-hi);}
.ed-h .tt span{font-family:var(--f-rune);font-size:9.5px;letter-spacing:.42em;color:var(--gold-dim);}
.ed-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(244,184,96,.45),transparent);}

.ed-tale{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px 18px;}   /* v1.10.1：时间多了「日」，加宽 */
.ed-tale .full{grid-column:1/-1;}
.ed-title-in{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.06em;}
.ed-date{display:flex;gap:8px;}
.ed-date select{flex:1 1 0;min-width:0;min-height:42px;padding:8px 24px 8px 10px;border-radius:10px;border:1px solid rgba(244,184,96,.32);background:rgba(10,8,20,.55);color:var(--text);font-family:var(--f-num);font-weight:600;font-size:16px;letter-spacing:.06em;
  -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;}
.ed-date select.vague{color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:400;letter-spacing:0;}
.ed-date select:nth-child(1),.ed-date select:nth-child(3){flex-grow:1.3;}
.ed-date-hint{display:block;margin-top:6px;font-size:11.5px;letter-spacing:.06em;color:var(--text-dim);}
.ed-date-hint[hidden]{display:none;}
.ed-date select:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 12px rgba(244,184,96,.3);}
.ed-count{align-self:flex-end;font-family:var(--f-num);font-size:12px;letter-spacing:.1em;color:var(--gold-dim);margin-top:-2px;}

/* 照片网格 */
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.ed-card{position:relative;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:rgba(8,6,16,.55);border:1px solid rgba(244,184,96,.2);
  transition:border-color .3s, box-shadow .3s, transform .3s var(--ease-soft);}
.ed-card:hover{border-color:rgba(244,184,96,.5);box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 16px rgba(244,184,96,.12);}
.ed-card.cover{border-color:rgba(255,226,168,.85);box-shadow:0 0 0 1px rgba(255,226,168,.4),0 0 22px rgba(244,184,96,.28);}
.ed-card .ph{position:relative;aspect-ratio:4/3;background:#151230;display:grid;place-items:center;overflow:hidden;}
.ed-card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ed-card .ph .st{position:relative;font-size:12px;letter-spacing:.1em;color:var(--gold);text-align:center;padding:0 10px;}
.ed-card .no{position:absolute;left:8px;top:6px;font-family:var(--f-num);font-weight:600;font-size:20px;line-height:1;color:#fff8e6;text-shadow:0 1px 6px rgba(0,0,0,.8);}
.ed-card .cv{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;letter-spacing:.14em;
  color:#2a1608;background:linear-gradient(180deg,#ffe7b5,#f4b860);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.ed-card .cv .sb-ico{width:11px;height:11px;}
.ed-card .ops{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:22px 8px 8px;background:linear-gradient(transparent,rgba(4,3,10,.85));
  opacity:0;transform:translateY(6px);transition:opacity .25s, transform .25s var(--ease-soft);}
.ed-card:hover .ops,.ed-card:focus-within .ops{opacity:1;transform:none;}
@media (hover:none){ .ed-card .ops{opacity:1;transform:none;} }
.ed-card .ops button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(244,184,96,.45);background:rgba(10,8,22,.75);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;font-size:14px;}
.ed-card .ops button:hover{background:rgba(244,184,96,.2);}
.ed-card .ops button.on{color:#2a1608;background:var(--gold-hi);border-color:transparent;}
.ed-card .ops button[disabled]{opacity:.35;pointer-events:none;}
.ed-card textarea{border:0;border-top:1px solid rgba(244,184,96,.16);border-radius:0;background:transparent;padding:10px 12px;min-height:62px;font-size:14px;line-height:1.6;color:var(--text);resize:none;outline:none;font-family:var(--f-body);}
.ed-card textarea:focus{background:rgba(244,184,96,.05);box-shadow:inset 0 -1px 0 var(--gold-hi);}
.ed-card textarea::placeholder{color:rgba(191,165,130,.45);}
.ed-add{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;padding:16px;border-radius:10px;cursor:pointer;text-align:center;
  border:1.5px dashed rgba(244,184,96,.45);background:radial-gradient(80% 60% at 50% 40%,rgba(244,184,96,.08),transparent 70%);transition:background .3s, border-color .3s, box-shadow .3s;}
.ed-add:hover,.ed-add.over{border-color:var(--gold-hi);background:radial-gradient(80% 60% at 50% 40%,rgba(244,184,96,.16),transparent 70%);box-shadow:0 0 22px rgba(244,184,96,.18);}
.ed-add .ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);border:1px solid rgba(244,184,96,.55);box-shadow:0 0 16px rgba(244,184,96,.25);}
.ed-add .ring .sb-ico{width:22px;height:22px;}
.ed-add b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.16em;color:var(--gold-hi);}
.ed-add span{font-size:11.5px;line-height:1.6;color:var(--text-dim);}
.ed-add input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.ed-note{font-size:12px;color:var(--text-dim);line-height:1.7;margin:0;}
/* v1.9.0 影像管理台：工具栏 / 上传进度 / 选择模式 / 批量操作栏 / 撤销 / 拖动排序 / 紧凑视图 */
.ed-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-4px;}
.ed-tools .cnt{flex:1;min-width:110px;font-family:var(--f-display);font-weight:var(--fw-display);font-size:13.5px;letter-spacing:.1em;color:var(--text-dim);}
.ed-tools .cnt b{font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--gold-hi);margin:0 2px;}
.ed-tools .sb-btn{min-height:36px;}
.ed-tools .sb-btn .sb-ico{width:15px;height:15px;}
.ed-tools label.sb-btn{position:relative;overflow:hidden;}
.ed-tools label.sb-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.ed-seg{display:inline-flex;border:1px solid rgba(244,184,96,.32);border-radius:999px;overflow:hidden;}
.ed-seg button{border:0;background:transparent;color:var(--text-dim);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:var(--fw-display);font-size:13px;letter-spacing:.08em;}
.ed-seg button.on{background:rgba(244,184,96,.2);color:var(--gold-hi);}
.ed-seg button .sb-ico{width:14px;height:14px;}
.ed-up{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid rgba(244,184,96,.22);background:rgba(10,8,22,.5);}
.ed-up[hidden]{display:none!important;}
.ed-up .row{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.06em;color:var(--text-dim);}
.ed-up .row b{color:var(--gold-hi);font-family:var(--f-num);font-weight:600;}
.ed-up .bar{height:3px;border-radius:2px;background:rgba(244,184,96,.16);overflow:hidden;}
.ed-up .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c99a4c,#fbe7b8);box-shadow:0 0 8px rgba(244,184,96,.6);transition:width .35s var(--ease-soft);}
.ed-up .fail{color:#f0a48a;}
.ed-up .fail button{border:0;background:none;color:var(--gold-hi);cursor:pointer;text-decoration:underline;font-size:12.5px;padding:0 4px;}
.ed-sec.drop-on{outline:1.5px dashed rgba(255,226,168,.75);outline-offset:8px;border-radius:12px;}
.ed-sec .drop-tip{display:none;text-align:center;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--gold-hi);}
.ed-sec.drop-on .drop-tip{display:block;}
/* 选择模式 */
.ed-card .pick{position:absolute;left:6px;top:6px;z-index:2;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,240,210,.85);background:rgba(8,6,18,.55);
  display:none;place-items:center;color:#2a1608;cursor:pointer;padding:0;}
.ed-card .pick::after{content:"";position:absolute;inset:-8px;}
.ed-card .pick .sb-ico{width:16px;height:16px;opacity:0;}
.ed-grid.selecting .ed-card .pick{display:grid;}
.ed-grid.selecting .ed-card .ops{display:none;}
.ed-grid.selecting .ed-card .no{left:42px;}
.ed-grid.selecting .ed-card{cursor:pointer;}
.ed-grid.selecting .ed-card.picked{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(255,226,168,.55),0 0 22px rgba(244,184,96,.3);}
.ed-grid.selecting .ed-card.picked .pick{background:var(--gold-hi);border-color:var(--gold-hi);}
.ed-grid.selecting .ed-card.picked .pick .sb-ico{opacity:1;}
.ed-grid.selecting .ed-card.picked .ph img{transform:scale(.94);filter:brightness(.85);}
.ed-card .ph img{transition:transform .25s var(--ease-soft), filter .25s;}
.ed-grid.selecting .ed-card textarea{pointer-events:none;opacity:.6;}
.ed-grid.selecting .ed-add{display:none;}
/* 批量操作栏 */
.ed-bulk{position:sticky;bottom:6px;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
  border:1px solid rgba(255,226,168,.5);background:linear-gradient(180deg,rgba(30,24,52,.96),rgba(14,11,28,.97));box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 20px rgba(244,184,96,.15);
  overflow-x:auto;scrollbar-width:none;}
.ed-bulk[hidden]{display:none!important;}
.ed-bulk .k{flex:none;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--gold-hi);padding-right:6px;margin-right:2px;border-right:1px solid rgba(244,184,96,.25);}
.ed-bulk .k b{font-family:var(--f-num);font-size:17px;margin:0 2px;}
.ed-bulk .sb-btn{flex:none;min-height:36px;white-space:nowrap;}
.ed-bulk .sb-btn .sb-ico{width:14px;height:14px;}
.ed-undo{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid rgba(244,184,96,.3);background:rgba(20,14,30,.85);font-size:13px;color:var(--text);}
.ed-undo[hidden]{display:none!important;}
.ed-undo span{flex:1;}
.ed-undo button{border:1px solid rgba(255,226,168,.6);background:transparent;color:var(--gold-hi);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;}
/* 拖动排序 */
.ed-card[draggable="true"] .ph{cursor:grab;}
.ed-card.dragging{opacity:.4;}
.ed-card.drop-before::before,.ed-card.drop-after::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--gold-hi);box-shadow:0 0 12px rgba(244,184,96,.9);z-index:3;}
.ed-card.drop-before::before{left:-9px;} .ed-card.drop-after::after{right:-9px;}
.ed-card{overflow:visible;} .ed-card .ph{border-radius:10px 10px 0 0;}
/* 紧凑视图：只看缩略图，便于一次管理很多照片 */
.ed-grid.dense{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.ed-grid.dense .ed-card textarea{display:none;}
.ed-grid.dense .ed-card .ph{aspect-ratio:1;border-radius:10px;}
.ed-grid.dense .ed-card .no{font-size:15px;}
.ed-grid.dense .ed-card .cv{font-size:0;padding:4px;}
.ed-grid.dense .ed-card .ops{padding:14px 4px 5px;gap:3px;}
.ed-grid.dense .ed-card .ops button{width:26px;height:26px;font-size:12px;}
.ed-grid.dense .ed-add{min-height:104px;padding:8px;}
.ed-grid.dense .ed-add span{display:none;}
@media (max-width:640px){
  .ed-tools .lbl{display:none;}
  .ed-grid.dense{grid-template-columns:repeat(3,minmax(0,1fr));}
  .ed-bulk{bottom:calc(6px + var(--safe-b));}
}

/* v1.9.1 照片分组「同一时刻」：横跨整行的金色括线框 */
.ed-group{grid-column:1/-1;position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px 24px;border-radius:12px;
  border:1px solid rgba(244,184,96,.34);background:linear-gradient(180deg,rgba(72,48,20,.26),rgba(16,11,28,.34) 70%);
  box-shadow:inset 0 0 0 1px rgba(255,226,168,.05),0 0 24px rgba(244,184,96,.07);}
.ed-group::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:6px;border:1.5px solid rgba(255,226,168,.72);border-right:0;border-radius:5px 0 0 5px;box-shadow:-2px 0 10px rgba(244,184,96,.22);}
.ed-group::after{content:"";position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;transform:rotate(45deg);background:var(--gold-hi);box-shadow:0 0 8px rgba(244,184,96,.85);}
.ed-ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ed-ghead .gk{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.ed-ghead .gk .sb-ico{width:22px;height:22px;color:var(--gold-hi);flex:none;}
.ed-ghead .gk b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--gold-hi);white-space:nowrap;}
.ed-ghead .gk small{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ed-ghead .gops{display:flex;align-items:center;gap:6px;}
.ed-ghead .gops .sb-btn{min-height:32px;}
.ed-ghead .gops .sb-btn .sb-ico{width:14px;height:14px;}
.ed-ghead .gmv{width:32px;height:32px;border-radius:50%;border:1px solid rgba(244,184,96,.45);background:rgba(10,8,22,.6);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;padding:0;}
.ed-ghead .gmv:hover{background:rgba(244,184,96,.18);}
.ed-ghead .gmv[disabled]{opacity:.3;pointer-events:none;}
.ed-ghead .gmv .sb-ico{width:16px;height:16px;}
.ed-gtext-w{position:relative;}
.ed-gtext{display:block;box-sizing:border-box;width:100%;min-height:68px;resize:none;overflow:hidden;padding:10px 12px 20px;border-radius:10px;border:1px solid rgba(244,184,96,.3);background:rgba(8,6,16,.55);
  color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.7;outline:none;transition:border-color .25s, box-shadow .25s;}
.ed-gtext:focus{border-color:var(--gold-hi);box-shadow:0 0 14px rgba(244,184,96,.22);}
.ed-gtext::placeholder{color:rgba(191,165,130,.5);}
.ed-gtext-w .n{position:absolute;right:10px;bottom:5px;font-family:var(--f-num);font-size:11px;letter-spacing:.06em;color:var(--gold-dim);pointer-events:none;}
.ed-ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.ed-group .ed-card textarea{display:none;}          /* 组内单张描述收起（数据保留） */
.ed-grid.dense .ed-ggrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.ed-grid.selecting .ed-group{border-color:rgba(255,226,168,.5);}
/* v1.9.2 拖放：所有组框进入可放入状态；进入组框高亮 + 提示；组内照片拖动时出现「移出」区 */
.ed-ghead .ghandle{display:grid;place-items:center;width:26px;height:30px;margin:-4px -2px -4px -6px;border-radius:6px;color:var(--gold-dim);cursor:grab;flex:none;}
.ed-ghead .ghandle:hover{color:var(--gold-hi);background:rgba(244,184,96,.12);}
.ed-ghead .ghandle .sb-ico{width:16px;height:16px;}
.ed-group.dragging{opacity:.45;}
.ed-grid.dnd .ed-group{border-style:dashed;border-color:rgba(255,226,168,.5);transition:border-color .2s, box-shadow .2s, background .2s;}
.ed-group.drop-in{border-style:solid!important;border-color:var(--gold-hi)!important;box-shadow:0 0 0 2px rgba(255,226,168,.3),0 0 34px rgba(244,184,96,.3);
  background:linear-gradient(180deg,rgba(110,74,28,.34),rgba(24,16,36,.4) 70%);}

  };
  // 组框头的「一叠相片」图形
  const STACK_I = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="7.2" width="12" height="9.6" rx="1.4" transform="rotate(-9 8.8 12)" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".7"/><g transform="rotate(6 14.6 11.4)"><rect x="8.6" y="6.6" width="12" height="9.6" rx="1.4" fill="rgba(244,184,96,.16)" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 14.2l2.6-2.7 2.1 2 1.6-1.5 2.1 2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="17.4" cy="9.4" r="1" fill="currentColor"/></g></svg>';

  /* v1.9.1 照片分组「同一时刻」：slides[k].g = 组 id；st.groups: Map(id → {id, text})；组成员在 slides 里必须连续 */
  const newGid = () => 'g' + Math.random().toString(36).slice(2, 8);
  // 把照片切成单元：同组连续照片为一段，其余每张单独一段

  function normalizeGroups(st){
    const runs = runsOf(st.slides).filter(r => r.g), best = new Map();
    runs.forEach(r => { const b = best.get(r.g); if(!b || r.items.length > b.items.length) best.set(r.g, r); });

  function snapOf(st, text){
    const gs = st.slides.map(x => [x, x.g]), gt = [...st.groups.values()].map(g => [g.id, g.text]);

  const moveTo = (sel, st, front) => { const rest = st.slides.filter(x => !sel.includes(x)); st.slides = front ? [...sel, ...rest] : [...rest, ...sel]; normalizeGroups(st); };

        runsOf(st.slides).forEach(r => { if(r.g) grid.appendChild(buildGroup(r, ++gno)); else r.items.forEach(s => grid.appendChild(buildCard(s))); });
        if(SB.store.canUpload) grid.appendChild(addTile());
        refreshSum(); renderTools(); renderBulk();
      }
    }
  };
})(window.SB);
</script>
