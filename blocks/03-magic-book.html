<style>
/* ── 块 03 · 首页魔法书（皮革浮雕、压印烫金、流光、黄铜包角、机匣、宝石折射） ── */
.sb-scene[data-scene="book"]{
  --bw:min(92vw, calc(min(100vh, 100dvh) * .80 * .75), 760px);
  --bh:calc(var(--bw) * 4 / 3);
  --bt:calc(var(--bw) * .1);
}
.bk-aura{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;
  opacity:.16;pointer-events:none;animation:bkSpin 260s linear infinite;will-change:transform;}
.bk-aura.a2{width:95vmax;height:95vmax;margin:-47.5vmax 0 0 -47.5vmax;opacity:.12;animation-duration:180s;animation-direction:reverse;}
@keyframes bkSpin{to{transform:rotate(360deg)}}

.bk-stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1900px;perspective-origin:50% 40%;}
.bk-float{position:relative;width:var(--bw);height:var(--bh);transform-style:preserve-3d;
  animation:bkBob 6s ease-in-out infinite;margin-top:calc(var(--bh) * .02);}
@keyframes bkBob{0%,100%{transform:translate3d(0,-3px,0)}50%{transform:translate3d(0,4px,0)}}
.bk-tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transform:rotateX(10deg) rotateY(-14deg);}
.bk-body{position:absolute;inset:0;transform-style:preserve-3d;}

.bk-under{position:absolute;left:-18%;right:-18%;bottom:-16%;height:34%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(255,170,80,.45), rgba(255,130,40,.12) 55%, transparent 75%);transform:translateZ(-60px);}
.bk-veins{position:absolute;left:-22%;width:144%;bottom:-11%;height:22%;pointer-events:none;overflow:visible;transform:translateZ(-20px);}
.bk-veins path{fill:none;stroke:#ffd38a;stroke-linecap:round;}
.bk-veins .v1{stroke-width:1.6;stroke-dasharray:60 340;animation:bkFlow 14s linear infinite;}
.bk-veins .v2{stroke-width:1.1;stroke-dasharray:30 260;animation:bkFlow 19s linear infinite reverse;opacity:.8;}
.bk-veins .v3{stroke-width:.8;stroke-dasharray:18 200;animation:bkFlow 11s linear infinite;opacity:.65;}
.bk-veins .base{stroke:#f4b860;stroke-width:.6;opacity:.25;stroke-dasharray:none;animation:none;}
@keyframes bkFlow{to{stroke-dashoffset:-800}}

/* 书的各个面 */
.bk-face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.bk-edge-r,.bk-edge-b,.bk-edge-t,.bk-spine{backface-visibility:visible;-webkit-backface-visibility:visible;}
.bk-back{inset:0;border-radius:10px 4px 4px 10px;transform:translateZ(calc(var(--bt) / -2)) rotateY(180deg);
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)), var(--tex-leather) center/512px;box-shadow:0 30px 80px rgba(0,0,0,.7);}
.bk-edge-r{top:.8%;height:98.4%;width:calc(var(--bt) - 4px);left:calc(99.3% - (var(--bt) - 4px) / 2);transform:rotateY(-90deg);
  background:linear-gradient(90deg, rgba(255,200,120,0), rgba(255,210,140,.4) 50%, rgba(255,200,120,0)),
    repeating-linear-gradient(90deg, #f1dcae 0 1px, #c99e62 1px 2px, #e6cc96 2px 3px);
  box-shadow:0 0 22px rgba(255,180,90,.55), inset 0 0 6px rgba(120,70,20,.6);}
.bk-edge-b{left:.6%;width:98.7%;height:calc(var(--bt) - 4px);top:calc(99.2% - (var(--bt) - 4px) / 2);transform:rotateX(90deg);
  background:linear-gradient(0deg, rgba(255,210,140,0), rgba(255,220,150,.4) 50%, rgba(255,200,120,0)),
    repeating-linear-gradient(0deg, #f1dcae 0 1px, #c99e62 1px 2px, #e6cc96 2px 3px);
  box-shadow:0 0 26px rgba(255,180,90,.6), inset 0 0 6px rgba(120,70,20,.6);}
.bk-edge-t{left:.6%;width:98.7%;height:calc(var(--bt) - 4px);top:calc(.8% - (var(--bt) - 4px) / 2);transform:rotateX(-90deg);
  background:repeating-linear-gradient(0deg, #e9d2a0 0 1px, #b88b52 1px 2px);}
.bk-spine{top:0;height:100%;width:var(--bt);left:calc(var(--bt) / -2);transform:rotateY(90deg);border-radius:6px;
  background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(255,220,170,.08) 50%, rgba(0,0,0,.55)), var(--tex-leather) center/512px;}
/* 鎏金书页叠层：正面视角下也能看见厚度 */
.bk-sr,.bk-sb{position:absolute;pointer-events:none;transform:translateZ(calc(var(--bt) / 2 - 6px));}
.bk-sr{top:1.4%;bottom:-.8%;right:-1.5%;width:3%;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg, rgba(90,50,20,.6), transparent 40%, rgba(255,214,140,.35)),
    repeating-linear-gradient(90deg, #f6e4b8 0 1px, #c99e62 1px 2px);
  box-shadow:4px 0 18px rgba(255,180,90,.6), 1px 0 0 #ffd890;}
.bk-sb{left:1.2%;right:-1.5%;bottom:-1.4%;height:2.5%;border-radius:0 0 4px 4px;
  background:linear-gradient(0deg, rgba(255,214,140,.35), transparent 60%, rgba(90,50,20,.6)),
    repeating-linear-gradient(0deg, #f6e4b8 0 1px, #c99e62 1px 2px);
  box-shadow:0 5px 20px rgba(255,180,90,.65), 0 1px 0 #ffd890;}

/* 扉页与翻页 */
.bk-page{left:.6%;right:.7%;top:.8%;bottom:.8%;transform:translateZ(calc(var(--bt) / 2 - 3px));
  border-radius:2px 6px 6px 2px;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 48%, rgba(255,232,176,.95), rgba(255,200,120,.35) 45%, transparent 75%),
    linear-gradient(90deg, rgba(90,50,20,.45), transparent 9%), var(--tex-paper) center/256px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;color:#5a3416;text-align:center;}
.bk-page .emb{width:46%;opacity:.85;}
.bk-page h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:calc(var(--bw) * .07);letter-spacing:.2em;color:#6b3a12;}
.bk-page p{margin:0;font-size:calc(var(--bw) * .03);letter-spacing:.12em;color:#7a4e24;}
.bk-beam{position:absolute;left:50%;top:50%;width:140%;height:140%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,236,190,.0) 0deg 7deg, rgba(255,226,168,.5) 9deg 11deg, rgba(255,236,190,0) 13deg 22deg);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 62%);mask:radial-gradient(circle, #000 0%, transparent 62%);
  transition:transform 1.6s var(--ease-soft), opacity 1s;}
.bk-page.lit .bk-beam{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(25deg);}
.bk-leaf{position:absolute;left:.6%;right:.9%;top:1%;bottom:1%;transform-origin:left center;transform:translateZ(calc(var(--bt) / 2 - 2px));
  background:linear-gradient(90deg, rgba(120,70,30,.25), transparent 15%), var(--tex-paper) center/256px;
  border-radius:2px 6px 6px 2px;opacity:0;box-shadow:0 0 18px rgba(255,190,100,.35);}

/* 封面 */
.bk-cover{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%;
  transform:translateZ(calc(var(--bt) / 2)) rotateY(0deg);transition:transform 1.8s cubic-bezier(.55,.02,.3,1);}
.bk-cover.is-open{transform:translateZ(calc(var(--bt) / 2)) rotateY(-165deg);}
.bk-front{inset:0;border-radius:4px 10px 10px 4px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 56%, rgba(255,170,80,.30), transparent 42%),
    radial-gradient(130% 95% at 52% 50%, transparent 50%, rgba(10,5,2,.85)),
    var(--tex-leather) center/512px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 8px 0 16px rgba(0,0,0,.65), inset -2px -3px 10px rgba(255,200,140,.08);}
.cv-gloss{position:absolute;inset:-30%;pointer-events:none;will-change:transform;mix-blend-mode:soft-light;
  background:linear-gradient(115deg, transparent 35%, rgba(255,236,200,.22) 48%, transparent 60%);}
.bk-inner{inset:0;border-radius:10px 4px 4px 10px;transform:rotateY(180deg);
  background:radial-gradient(circle at 50% 50%, rgba(244,184,96,.14), transparent 40%),
    repeating-radial-gradient(circle at 30% 40%, #2a1a10 0 6px, #22140c 6px 13px), #24160d;
  box-shadow:inset 0 0 0 10px #3a2416, inset 0 0 0 11px rgba(244,184,96,.5);display:grid;place-items:center;}
.bk-inner svg{width:30%;opacity:.7;}
.cv-art,.cv-art-hot{position:absolute;inset:0;width:100%;height:100%;}
.cv-art-hot{opacity:0;transition:opacity 1s ease;}
.bk-cover.is-lit .cv-art-hot{opacity:1;}
/* 烫金流光：用图案本身做遮罩，只照亮金色 */
.cv-sheen{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;}
.cv-sheen i{position:absolute;inset:-40% -60%;will-change:transform;
  background:linear-gradient(110deg, transparent 42%, rgba(255,250,232,.0) 44%, rgba(255,250,232,.95) 50%, rgba(255,250,232,0) 56%, transparent 58%);}
.cv-brass{position:absolute;width:13%;aspect-ratio:1;pointer-events:none;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.6));}
.cv-brass.tl{top:-.4%;left:-.4%}.cv-brass.tr{top:-.4%;right:-.4%;transform:scaleX(-1)}
.cv-brass.bl{bottom:-.4%;left:-.4%;transform:scaleY(-1)}.cv-brass.br{bottom:-.4%;right:-.4%;transform:scale(-1)}
.cv-rot{position:absolute;will-change:transform;pointer-events:none;}
.cv-flow{left:10%;top:26.25%;width:80%;height:60%;}
.cv-mech{left:25%;top:37.5%;width:50%;height:37.5%;}

/* 宝石 */
.bk-rays{position:absolute;left:50%;top:56.25%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:.55;
  background:repeating-conic-gradient(from 0deg, rgba(255,226,168,0) 0deg 10deg, rgba(255,214,150,.35) 13deg 15deg, rgba(255,226,168,0) 18deg 30deg);
  -webkit-mask:radial-gradient(circle, #000 12%, transparent 66%);mask:radial-gradient(circle, #000 12%, transparent 66%);
  animation:bkRays 40s linear infinite;}
@keyframes bkRays{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bk-cover.is-charging .bk-rays{opacity:1;animation-duration:4s;}
.bk-gemglow{position:absolute;left:50%;top:56.25%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle, rgba(255,240,200,.85) 0%, rgba(255,190,90,.45) 22%, rgba(255,140,40,.12) 48%, transparent 70%);
  animation:bkGemBreath 4.2s ease-in-out infinite;transition:width .8s var(--ease-soft);}
@keyframes bkGemBreath{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.06)}}
.bk-cover.is-hover .bk-gemglow{width:56%;}
.bk-cover.is-charging .bk-gemglow{width:120%;animation-duration:.9s;}
.bk-refract{position:absolute;left:50%;top:56.25%;width:9.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.55) 8%, rgba(255,255,255,0) 18%, rgba(255,240,200,0) 45%, rgba(255,240,200,.45) 52%, rgba(255,255,255,0) 62%);
  mix-blend-mode:screen;animation:bkRefract 9s linear infinite;}
@keyframes bkRefract{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bk-glint{position:absolute;left:53.5%;top:53.5%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);pointer-events:none;
  animation:bkGlint 5.5s ease-in-out infinite;}
.bk-cover.is-charging .bk-glint{animation-duration:1.1s;}
@keyframes bkGlint{0%,78%,100%{transform:translate(-50%,-50%) scale(0) rotate(0)}86%{transform:translate(-50%,-50%) scale(1) rotate(45deg)}}
.bk-gembtn{position:absolute;left:50%;top:56.25%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:0;background:transparent;cursor:pointer;z-index:3;}
.bk-shock{position:absolute;left:50%;top:56.25%;width:16%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  border:2px solid rgba(255,236,190,.95);box-shadow:0 0 30px 8px rgba(255,190,90,.75), inset 0 0 20px rgba(255,220,150,.7);}
.bk-shock.go{animation:bkShock 1.1s cubic-bezier(.2,.6,.3,1) forwards;}
.bk-shock.s2.go{animation-delay:.18s;}
@keyframes bkShock{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}

.bk-smoke{position:absolute;left:50%;top:-6%;width:30%;height:40%;pointer-events:none;transform:translate(-50%,-60%) translateZ(10px);}
.bk-smoke i{position:absolute;bottom:0;left:30%;width:40%;height:60%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,226,190,.16), transparent);animation:bkSmoke 11s ease-in infinite;opacity:0;}
.bk-smoke i:nth-child(2){animation-delay:3.6s;left:42%;}
.bk-smoke i:nth-child(3){animation-delay:7.2s;left:22%;}
@keyframes bkSmoke{0%{opacity:0;transform:translate3d(0,40%,0) scale(.5,.7)}25%{opacity:1}100%{opacity:0;transform:translate3d(18%,-120%,0) scale(1.4,1.8) rotate(12deg)}}

.bk-hint{position:absolute;left:50%;top:min(calc(50% + var(--bh) * .5 + 26px), calc(100% - 36px - var(--safe-b)));transform:translateX(-50%);
  font-family:var(--f-title);font-size:15px;letter-spacing:.3em;color:var(--gold-hi);white-space:nowrap;
  text-shadow:0 0 12px rgba(244,184,96,.7);animation:bkHint 4s ease-in-out infinite;pointer-events:none;transition:opacity .5s;}
@keyframes bkHint{0%,100%{opacity:.35}50%{opacity:.95}}
.sb-scene[data-scene="book"].is-opening .bk-hint{opacity:0;animation:none;}
@media (prefers-reduced-motion:reduce){ .bk-aura,.bk-float,.bk-veins path,.bk-smoke i,.bk-gemglow,.bk-hint,.bk-rays,.bk-refract,.bk-glint{animation:none!important;} }
</style>

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  const P = (r,a) => [ (r*Math.cos(a)).toFixed(2), (r*Math.sin(a)).toFixed(2) ];
  const rad = d => d*Math.PI/180;
  const scene = document.querySelector('.sb-scene[data-scene="book"]');

  /* ── 程序生成纹理 ── */
  function noise2(size, octaves){
    // 多层值噪声 → 高度图
    const h = new Float32Array(size*size);
    for(let o = 0; o < octaves; o++){
      const cell = Math.max(2, size >> (o + 2)), n = Math.ceil(size/cell) + 1, amp = 1/(o+1.2);
      const grid = new Float32Array(n*n).map(()=>Math.random());
      for(let y = 0; y < size; y++){ const gy = y/cell, y0 = gy|0, fy = gy - y0, sy = fy*fy*(3-2*fy);
        for(let x = 0; x < size; x++){ const gx = x/cell, x0 = gx|0, fx = gx - x0, sx = fx*fx*(3-2*fx);
          const a = grid[(y0%(n-1))*n + x0%(n-1)], b = grid[(y0%(n-1))*n + (x0+1)%(n-1)], c = grid[((y0+1)%(n-1))*n + x0%(n-1)], d = grid[((y0+1)%(n-1))*n + (x0+1)%(n-1)];
          h[y*size+x] += (a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy)*amp; } }
    }
    return h;
  }
  function leather(){
    const s = 512, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
    const h = noise2(s, 6);
    // 荔枝纹：用细胞距离制造颗粒凸起
    const cells = Array.from({length:5200}, () => [Math.random()*s, Math.random()*s]);
    const bump = new Float32Array(s*s);
    const bucket = new Map(), B = 32;
    cells.forEach(p => { const k = ((p[0]/B)|0) + ',' + ((p[1]/B)|0); (bucket.get(k) || bucket.set(k, []).get(k)).push(p); });
    for(let y = 0; y < s; y++) for(let x = 0; x < s; x++){
      let m = 1e9; const bx = (x/B)|0, by = (y/B)|0;
      for(let j = -1; j <= 1; j++) for(let i = -1; i <= 1; i++){
        const arr = bucket.get(((bx+i+s/B)%(s/B)) + ',' + ((by+j+s/B)%(s/B))); if(!arr) continue;
        for(const p of arr){ let dx = Math.abs(p[0]-x), dy = Math.abs(p[1]-y); dx = Math.min(dx, s-dx); dy = Math.min(dy, s-dy); const d = dx*dx+dy*dy; if(d < m) m = d; }
      }
      bump[y*s+x] = Math.min(1, Math.sqrt(m)/6.5);
    }
    const img = g.createImageData(s, s), D = img.data;
    const H = (x,y) => { x = (x+s)%s; y = (y+s)%s; return h[y*s+x]*.35 + (1 - bump[y*s+x]*bump[y*s+x])*.32; };
    for(let y = 0; y < s; y++) for(let x = 0; x < s; x++){
      const nx = H(x-1,y) - H(x+1,y), ny = H(x,y-1) - H(x,y+1);
      const light = SB.clamp(.86 + (nx*1.2 + ny*1.5)*1.5, .62, 1.16);   // 左上光源
      const tone = .82 + h[y*s+x]*.22 + (Math.random()-.5)*.05;
      const i = (y*s+x)*4;
      D[i] = 62*tone*light; D[i+1] = 36*tone*light; D[i+2] = 21*tone*light; D[i+3] = 255;
    }
    g.putImageData(img, 0, 0);
    // 细划痕与磨损
    g.globalCompositeOperation = 'multiply'; g.strokeStyle = 'rgba(30,14,6,.35)'; g.lineWidth = .7;
    for(let i = 0; i < 60; i++){ let x = Math.random()*s, y = Math.random()*s; g.beginPath(); g.moveTo(x,y);
      for(let k = 0; k < 5; k++){ x += (Math.random()-.5)*26; y += (Math.random()-.5)*12; g.lineTo(x,y); } g.stroke(); }
    g.globalCompositeOperation = 'screen'; g.strokeStyle = 'rgba(255,214,170,.06)';
    for(let i = 0; i < 40; i++){ const x = Math.random()*s, y = Math.random()*s; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-.5)*40, y+(Math.random()-.5)*8); g.stroke(); }
    return `url(${c.toDataURL('image/jpeg', .9)})`;
  }
  function paper(){
    const s = 256, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
    const h = noise2(s, 4), img = g.createImageData(s, s), D = img.data;
    for(let i = 0; i < s*s; i++){ const t = .9 + h[i]*.08 + (Math.random()-.5)*.05; D[i*4] = 240*t; D[i*4+1] = 220*t; D[i*4+2] = 180*t; D[i*4+3] = 255; }
    g.putImageData(img, 0, 0); return `url(${c.toDataURL('image/jpeg', .88)})`;
  }
  scene.style.setProperty('--tex-leather', leather());
  scene.style.setProperty('--tex-paper', paper());

  /* ── 几何工具 ── */
  function gear(rO, rR, teeth){
    const step = Math.PI*2/teeth; let d = '';
    for(let i = 0; i < teeth; i++){ const a = i*step, w = step*.22;
      const pts = [P(rR,a-step*.5+w*.2),P(rR,a-w*1.2),P(rO,a-w*.7),P(rO,a+w*.7),P(rR,a+w*1.2)];
      d += (i ? 'L' : 'M') + pts.map(p=>p.join(' ')).join(' L') + ' '; }
    return d + 'Z';
  }
  function star(r, n, skip, cx=0, cy=0, rot=-90){ let d = ''; for(let i = 0; i < n; i++){ const a1 = rad(rot+i*360/n), a2 = rad(rot+(i+skip)*360/n);
      d += `M${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)} L${(cx+r*Math.cos(a2)).toFixed(2)} ${(cy+r*Math.sin(a2)).toFixed(2)} `; } return d; }
  function ticks(r1, r2, n, cx=0, cy=0){ let d = ''; for(let i = 0; i < n; i++){ const a = rad(i*360/n);
    d += `M${(cx+r1*Math.cos(a)).toFixed(2)} ${(cy+r1*Math.sin(a)).toFixed(2)} L${(cx+r2*Math.cos(a)).toFixed(2)} ${(cy+r2*Math.sin(a)).toFixed(2)} `; } return d; }

  /* 压印烫金滤镜：辉光 + 压进皮革的暗影 + 金属浮雕高光 */
  const FOIL = (id, glow) => `<defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fff0c4"/><stop offset=".3" stop-color="#f7c46c"/><stop offset=".62" stop-color="#d48f38"/><stop offset="1" stop-color="#8f5a1e"/></linearGradient>
    <filter id="${id}f" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="a"/>
      <feSpecularLighting in="a" surfaceScale="2.6" specularConstant="1.15" specularExponent="24" lighting-color="#fff4d8" result="sp"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting>
      <feComposite in="sp" in2="SourceAlpha" operator="in" result="spIn"/>
      <feOffset in="SourceAlpha" dx="1.1" dy="1.5" result="off"/><feGaussianBlur in="off" stdDeviation=".8" result="offb"/>
      <feFlood flood-color="#0a0402" flood-opacity=".85"/><feComposite in2="offb" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="${glow}" result="gl"/>
      <feMerge><feMergeNode in="gl"/><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="spIn"/></feMerge>
    </filter></defs>`;

  /* ── 封面主画 ── */
  const cx = 300, cy = 450;
  const CORNER = `<path d="M0 64 C0 26 26 0 64 0 M10 52 C12 30 30 12 52 10 M16 16 C34 32 26 48 14 44 C4 40 14 28 24 34 M64 0 C70 6 76 4 80 0 M0 64 C6 70 4 76 0 80" fill="none"/><circle cx="12" cy="12" r="4"/><circle cx="40" cy="40" r="2"/>`;
  function shapes(fillStroke, withText){
    return `<g ${fillStroke} stroke-width="1.5">
      <rect x="22" y="22" width="556" height="756" rx="10" fill="none" stroke-width="2"/>
      <rect x="34" y="34" width="532" height="732" rx="6" fill="none" stroke-width=".9"/>
      <g transform="translate(40 40)">${CORNER}</g><g transform="translate(560 40) scale(-1 1)">${CORNER}</g>
      <g transform="translate(40 760) scale(1 -1)">${CORNER}</g><g transform="translate(560 760) scale(-1 -1)">${CORNER}</g>
      ${withText ? `<text x="300" y="140" text-anchor="middle" stroke="none" font-family="ZCOOL XiaoWei, Noto Serif SC, serif" font-size="66" letter-spacing="16">星屿之书</text>
      <text x="300" y="178" text-anchor="middle" stroke="none" font-family="Cinzel Decorative, serif" font-size="13" letter-spacing="7" opacity=".9">THE BOOK OF STAR ISLES</text>` : ''}
      <path d="M190 196 H270 M330 196 H410" stroke-width=".9" fill="none"/><path d="M300 189 l6 7 -6 7 -6 -7z" stroke="none"/>
      <g fill="none">
        <circle cx="${cx}" cy="${cy}" r="236" stroke-width="1.8"/><circle cx="${cx}" cy="${cy}" r="228" stroke-width=".8"/>
        <circle cx="${cx}" cy="${cy}" r="200" stroke-width="1.2"/><circle cx="${cx}" cy="${cy}" r="160" stroke-width=".9"/>
        <path d="${ticks(228,236,72,cx,cy)}" stroke-width=".8"/><path d="${star(200,8,3,cx,cy)}" stroke-width="1.1"/>
        <path d="${star(200,6,2,cx,cy,-90)}" stroke-width=".8" opacity=".7"/><path d="${ticks(160,200,24,cx,cy)}" stroke-width=".6" opacity=".55"/>
      </g>
      ${Array.from({length:8},(_,i)=>{const [x,y]=P(200,rad(-90+i*45));const X=(cx+ +x).toFixed(1),Y=(cy+ +y).toFixed(1);return `<circle cx="${X}" cy="${Y}" r="5.5" fill="none" stroke-width="1.1"/><circle cx="${X}" cy="${Y}" r="2" stroke="none"/>`;}).join('')}
    </g>`;
  }
  function coverArt(id, glow){
    return FOIL(id, glow) + `<g filter="url(#${id}f)">${shapes(`stroke="url(#${id}g)" fill="url(#${id}g)"`, true)}
      <path id="${id}tp" d="M ${cx-214} ${cy} A 214 214 0 1 1 ${cx+214} ${cy} A 214 214 0 1 1 ${cx-214} ${cy}" fill="none" stroke="none"/>
      <text fill="url(#${id}g)" font-family="Cinzel Decorative, serif" font-size="11.5" letter-spacing="3.2"><textPath href="#${id}tp">✦ AMOR VINCIT OMNIA ✦ PER ASPERA AD ASTRA ✦ TECUM UBIQUE DOMUS ✦ MEMORIA STELLARUM ✦ ITER NOSTRUM ✦</textPath></text>
      <text x="300" y="726" text-anchor="middle" fill="url(#${id}g)" font-family="ZCOOL XiaoWei, Noto Serif SC, serif" font-size="22" letter-spacing="8">✦ 爱与远方的记忆 ✦</text>
      <text x="300" y="752" text-anchor="middle" fill="url(#${id}g)" font-family="Cinzel Decorative, serif" font-size="10" letter-spacing="6" opacity=".75">MMXXVI · LIBER PRIMUS</text></g>`;
  }
  $('cv-art').innerHTML = coverArt('ca', 1.6);
  $('cv-art-hot').innerHTML = coverArt('ch', 5.5);
  // 流光遮罩（不含文字，避免遮罩里字体不一致）
  const maskSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">${shapes('stroke="#fff" fill="#fff"', false)}</svg>`;
  const maskUrl = `url("data:image/svg+xml;utf8,${encodeURIComponent(maskSvg)}")`;
  $('cv-sheen').style.webkitMaskImage = maskUrl; $('cv-sheen').style.maskImage = maskUrl;

  /* 黄铜包角 */
  const brass = `<defs><linearGradient id="brg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c8"/><stop offset=".25" stop-color="#d9a24e"/><stop offset=".55" stop-color="#8a5a22"/><stop offset=".8" stop-color="#c88f3e"/><stop offset="1" stop-color="#5e3a14"/></linearGradient></defs>
    <path d="M0 0 H70 Q62 10 52 12 Q30 14 22 22 Q14 30 12 52 Q10 62 0 70 Z" fill="url(#brg)"/>
    <path d="M4 4 H58 Q50 10 44 11 Q24 13 17 17 Q13 24 11 44 Q10 50 4 58 Z" fill="none" stroke="#fff3d0" stroke-opacity=".55" stroke-width=".8"/>
    <path d="M14 30 Q22 22 30 14" fill="none" stroke="#5e3a14" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="url(#brg)" stroke="#4a2c0e" stroke-width=".8"/><circle cx="13" cy="13" r="1.4" fill="#fff7dc"/>
    <circle cx="42" cy="7" r="2.6" fill="url(#brg)" stroke="#4a2c0e" stroke-width=".6"/><circle cx="7" cy="42" r="2.6" fill="url(#brg)" stroke="#4a2c0e" stroke-width=".6"/>`;
  document.querySelectorAll('.cv-brass').forEach(s => s.innerHTML = brass);

  /* 法阵流光 */
  $('cv-flow').innerHTML = `<defs><filter id="flb"><feGaussianBlur stdDeviation="3"/></filter></defs>
    <circle r="228" fill="none" stroke="#ffe2a8" stroke-width="5" stroke-dasharray="90 1343" stroke-linecap="round" filter="url(#flb)" opacity=".9"/>
    <circle r="228" fill="none" stroke="#fff6dc" stroke-width="1.6" stroke-dasharray="70 1363" stroke-dashoffset="-10" stroke-linecap="round"/>
    <circle r="200" fill="none" stroke="#ffd38a" stroke-width="3" stroke-dasharray="40 1217" stroke-dashoffset="-600" stroke-linecap="round" filter="url(#flb)" opacity=".7"/>`;

  /* ── 机匣 ── */
  const runes = 'AMOR · ITER · STELLAE · MEMORIA · DOMUS · LUX · ';
  $('mk-r1').innerHTML = FOIL('m1', 1.2) + `<g filter="url(#m1f)" stroke="url(#m1g)" fill="none">
    <circle r="146" stroke-width="2.6"/><circle r="132" stroke-width="1.3"/>
    <path d="${ticks(140,146,120)}" stroke-width=".7"/><path d="${ticks(134,146,12)}" stroke-width="1.8"/>
    <path id="m1tp" d="M -137 0 A 137 137 0 1 1 137 0 A 137 137 0 1 1 -137 0" stroke="none"/>
    <text fill="url(#m1g)" stroke="none" font-family="Cinzel Decorative, serif" font-size="7.2" letter-spacing="2.4"><textPath href="#m1tp">${runes+runes}</textPath></text></g>`;
  $('mk-r2').innerHTML = FOIL('m2', 1.2) + `<path d="${gear(124,116,48)}" fill="#4a2c12"/><circle r="104" fill="#1c1009"/>
    <g filter="url(#m2f)" stroke="url(#m2g)">
    <path d="${gear(124,116,48)}" fill="none" stroke-width="1.3"/>
    <circle r="104" fill="none" stroke-width="1.5"/>
    ${Array.from({length:12},(_,i)=>{const [x,y]=P(110,rad(i*30));return `<circle cx="${x}" cy="${y}" r="2.8" fill="url(#m2g)" stroke="none"/>`;}).join('')}
    <path d="${ticks(96,104,36)}" stroke-width=".8" fill="none"/></g>`;
  const smallGear = k => `<g id="mk-sg${k}"><path d="${gear(30,24,11)}" fill="#6a4019" stroke="url(#m3g)" stroke-width="1.1"/>
    <circle r="16" fill="none" stroke="url(#m3g)" stroke-width=".9"/><path d="${ticks(4,16,6)}" stroke="url(#m3g)" stroke-width="1.5"/><circle r="4" fill="url(#m3g)"/></g>`;
  $('mk-r3').innerHTML = FOIL('m3', 1) + `<g filter="url(#m3f)">
    <circle r="72" fill="none" stroke="url(#m3g)" stroke-width=".7" stroke-dasharray="2 4"/>
    ${[0,1,2].map(k=>{const [x,y]=P(72,rad(-90+k*120));return `<g transform="translate(${x} ${y})">${smallGear(k)}</g>`;}).join('')}</g>`;
  $('mk-r4').innerHTML = FOIL('m4', 1.2) + `<circle r="44" fill="#1c1009"/><g filter="url(#m4f)" stroke="url(#m4g)" fill="none">
    <circle r="44" stroke-width="1.5"/>
    <path d="${star(54,8,3)}" stroke-width="1.2"/><circle r="54" stroke-width=".6" stroke-dasharray="1 3"/>
    ${[0,1,2,3].map(k=>{const [x,y]=P(58,rad(k*90+45));return `<circle cx="${x}" cy="${y}" r="2.6" fill="#fff1cf" stroke="none"/>`;}).join('')}</g>`;
  (function(){
    const n = 8, R = 30, r = 14; let facets = '';
    const shades = ['#fff3d2','#f7c46d','#e09838','#b9651d','#8f4a14','#c47a2a','#f0b052','#ffe0a0'];
    for(let i = 0; i < n; i++){
      const a1 = rad(-90+i*45), a2 = rad(-90+(i+1)*45), am = rad(-90+(i+.5)*45);
      const o1 = P(R,a1), o2 = P(R,a2), i1 = P(r,a1), i2 = P(r,a2), m = P(R*.86,am);
      facets += `<path d="M${i1} L${o1} L${m} Z" fill="${shades[i]}" opacity=".96"/><path d="M${i1} L${m} L${i2} Z" fill="${shades[(i+3)%8]}" opacity=".8"/><path d="M${i2} L${m} L${o2} Z" fill="${shades[i]}" opacity=".88"/>`;
    }
    const table = Array.from({length:n},(_,i)=>P(r,rad(-90+i*45)).join(' ')).join(' L');
    $('mk-gem').innerHTML = `<defs><radialGradient id="gmT" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fffaf0"/><stop offset=".5" stop-color="#ffd27a"/><stop offset="1" stop-color="#c06d1e"/></radialGradient>
      <filter id="gmF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <circle r="35" fill="none" stroke="#7a4a18" stroke-width="5"/><circle r="35" fill="none" stroke="#ffd890" stroke-width=".8"/>
      ${Array.from({length:6},(_,i)=>{const [x,y]=P(35,rad(i*60+30));return `<path d="M${x} ${y} l-3 -3 l3 -3 l3 3z" transform="translate(0 3)" fill="#ffe2a8"/>`;}).join('')}
      <g filter="url(#gmF)">${facets}<path d="M${table} Z" fill="url(#gmT)"/>
      <path d="M${table} Z" fill="none" stroke="#fff6dc" stroke-width=".6" opacity=".8"/>
      <circle r="${R}" fill="none" stroke="#ffe2a8" stroke-width="1.2"/><path d="M-7 -9 L-2 -11 L-4 -5 Z" fill="#fff" opacity=".95"/></g>`;
  })();

  const auraSvg = dense => `<g fill="none" stroke="#f4b860" stroke-width="${dense?1.2:.9}">
    <circle r="480"/><circle r="462" stroke-dasharray="3 9"/><circle r="380"/>
    <path d="${ticks(462,480,180)}" stroke-width=".6"/><path d="${star(380,dense?12:7,dense?5:3)}" stroke-width=".7"/>
    <circle r="250" stroke-dasharray="1 6"/></g>`;
  $('bk-aura').innerHTML = auraSvg(true); $('bk-aura2').innerHTML = auraSvg(false);
  const emb = `<g fill="none" stroke="#8a4f1c" stroke-width="1.2"><circle r="92"/><circle r="84" stroke-dasharray="2 4"/>
    <path d="${star(84,8,3)}"/><circle r="40"/><path d="${ticks(40,84,16)}" stroke-width=".5"/></g>
    <path d="M0 -26 L16 -6 L0 28 L-16 -6 Z" fill="#c47f2c" stroke="#6b3a12"/><path d="M-16 -6 H16" stroke="#6b3a12"/>`;
  $('bk-emb').innerHTML = emb;
  $('bk-inner-emb').innerHTML = emb.replaceAll('#8a4f1c','#c48a3c').replaceAll('#6b3a12','#f4b860');

  /* ── 动画驱动 ── */
  const rings = [{el:$('mk-r1'), speed:3}, {el:$('mk-r2'), speed:-6}, {el:$('mk-r3'), speed:4.5}, {el:$('mk-r4'), speed:9}, {el:$('cv-flow'), speed:45}];
  const sg = [0,1,2].map(k => document.getElementById('mk-sg'+k));
  const tilt = $('bk-tilt'), cover = $('bk-cover'), band = $('cv-sheen-band'), gloss = $('cv-gloss');
  const state = { spin:1, spinTarget:1, angle:[0,0,0,0,0], sga:0, tx:0, ty:0, cx:0, cy:0, running:false, base:{x:10,y:-14}, sheen:-1 };
  const fine = matchMedia('(pointer:fine)').matches;

  function nearGem(x, y){
    const r = $('bk-gembtn').getBoundingClientRect();
    return Math.hypot(x - (r.left + r.width/2), y - (r.top + r.height/2)) < Math.max(36, r.width*.75);
  }
  let hovering = false;
  document.addEventListener('pointermove', e => {
    if(SB.scenes.current !== 'book' || SB.magicBook.busy) return;
    if(fine){ state.tx = (e.clientX/innerWidth - .5)*2; state.ty = (e.clientY/innerHeight - .5)*2; }
    const h = nearGem(e.clientX, e.clientY);
    if(h !== hovering){ hovering = h; cover.classList.toggle('is-hover', h); state.spinTarget = h ? 1.8 : 1; scene.style.cursor = h ? 'pointer' : ''; }
  });
  /* 3D 层里的点击在部分浏览器上会落空，所以按"离宝石多近"判断 */
  document.addEventListener('click', e => {
    if(SB.scenes.current !== 'book' || SB.magicBook.busy || e.target.closest('#sb-nav')) return;
    if(e.target === $('bk-gembtn') || nearGem(e.clientX, e.clientY)) SB.magicBook.open?.();
  });

  function placeOrbit(){
    const r = $('bk-float').getBoundingClientRect();
    SB.fx.orbit({ cx:r.left + r.width/2, cy:r.top + r.height*.58, rx:r.width*.82, ry:r.height*.16, tilt:-.14, speed:.16 });
  }
  let last = 0;
  function loop(now){
    if(!state.running) return;
    const dt = Math.min(.05, (now - (last||now))/1000); last = now;
    const still = SB.perf.level === 'reduced' ? 0 : 1;
    state.spin = SB.lerp(state.spin, state.spinTarget, Math.min(1, dt*1.8));
    rings.forEach((r,i) => { state.angle[i] = (state.angle[i] + r.speed*state.spin*dt*still) % 360; r.el.style.transform = `rotate(${state.angle[i].toFixed(2)}deg)`; });
    state.sga = (state.sga - 22*state.spin*dt*still) % 360;
    sg.forEach(g => g.setAttribute('transform', `rotate(${state.sga.toFixed(1)})`));
    if(!fine && still){ state.tx = Math.sin(now/5200)*.4; state.ty = Math.sin(now/7300)*.3; }
    state.cx = SB.lerp(state.cx, state.tx, Math.min(1, dt*2.2)); state.cy = SB.lerp(state.cy, state.ty, Math.min(1, dt*2.2));
    tilt.style.transform = `rotateX(${(state.base.x - state.cy*6).toFixed(2)}deg) rotateY(${(state.base.y + state.cx*7).toFixed(2)}deg)`;
    // 流光与皮革反光跟随倾斜；再叠加缓慢的自主扫光
    const sweep = ((now/9000) % 1)*1.6 - .8;
    const s = (state.cx*.35 + sweep).toFixed(3);
    if(s !== state.sheen){ state.sheen = s; band.style.transform = `translate3d(${s*60}%, ${(state.cy*12).toFixed(1)}%, 0)`; gloss.style.transform = `translate3d(${(state.cx*14).toFixed(1)}%, ${(state.cy*10).toFixed(1)}%, 0)`; }
    requestAnimationFrame(loop);
  }
  function start(){ if(state.running) return; state.running = true; last = 0; requestAnimationFrame(loop); }
  function stop(){ state.running = false; }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(SB.scenes.current === 'book') start(); });
  addEventListener('resize', () => { if(SB.scenes.current === 'book' && !SB.magicBook.busy) placeOrbit(); });

  const gemBtn = $('bk-gembtn');
  SB.magicBook = {
    busy:false, state, scene, cover, tilt, gemBtn, page:$('bk-page'),
    stage:$('bk-stage'), shocks:[$('bk-shock'), $('bk-shock2')], leaves:[$('bk-leaf1'),$('bk-leaf2'),$('bk-leaf3')],
    setSpin(v){ state.spinTarget = v; },
    gemCenter(){ const r = gemBtn.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; },
    reset(){
      this.busy = false; state.spinTarget = 1; state.spin = 1;
      scene.classList.remove('is-opening'); this.page.classList.remove('lit');
      cover.classList.remove('is-open','is-lit','is-charging','is-hover');
      this.stage.style.transition = 'none'; this.stage.style.transform = ''; this.stage.style.opacity = '';
      this.leaves.forEach(l => { l.style.transition = 'none'; l.style.opacity = '0'; l.style.transform = ''; });
      void this.stage.offsetWidth; this.stage.style.transition = '';
    }
  };
  SB.scenes.register('book', {
    world:'book', deepLink:true,
    title:()=>'魔法书',
    enter(){ SB.magicBook.reset(); SB.fx.palette('warm'); SB.fx.calm(); SB.fx.orbitBoost(1); start(); requestAnimationFrame(placeOrbit); },
    leave(){ stop(); SB.fx.orbit(null); }
  });
})(window.SB);
</script>
