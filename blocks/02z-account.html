<script>
/* ── v1.5 · 账户菜单：当前仅登录 / 退出；未来可升级为 Library / Profile ── */
(function(SB){
  SB.menu.icons.user = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 19c.8-4 3-6 6.5-6s5.7 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
  SB.menu.add({id:'account',order:95,icon:'user',label:'账户',
    desc:()=>SB.user?.current?.email || '未登录',
    tag:()=>SB.book?.current?.role ? `<span class="sb-seg"><span class="on">${SB.esc(SB.book.current.role)}</span></span>` : '',
    hidden:()=>!SB.user?.current,
    action:async()=>{ if(await SB.ui.confirm('退出当前账号？','退出','danger')) await SB.user.signOut(); }
  });
  document.addEventListener('sb:book',()=>SB.menu.refresh());
})(window.SB);
</script>
