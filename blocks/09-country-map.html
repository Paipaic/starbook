<style>
/* ── 块 09 · 国家星门面板（v1.11.0「时空裂隙」，prompts/09-country-map.md）──
   v1.10.2 及以前是独立的「国家地图」场景；v1.11.0 改为世界星图上的悬浮面板，面板是 globe 场景的子状态（SB.scenes update 钩子）。 */
.cp-root{position:absolute;inset:0;z-index:6;pointer-events:none;user-select:none;-webkit-user-select:none;}
.cp-root[hidden]{display:none!important;}
.cp-root input,.cp-root select{user-select:text;-webkit-user-select:text;}
.cp-scrim{position:absolute;inset:0;pointer-events:auto;opacity:0;
  background:radial-gradient(75% 70% at 50% 52%, rgba(8,9,32,.42), rgba(3,4,14,.74));}
.cp-root.on .cp-scrim{opacity:1;}
/* 面板 */
.cp-panel{position:absolute;left:50%;top:calc(50% + 30px);width:min(1120px,92vw);height:min(780px, calc(100% - 104px - var(--safe-t)));transform:translate(-50%,-50%);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-radius:22px;overflow:hidden;pointer-events:auto;visibility:hidden;
  background:linear-gradient(180deg,#0b0e2c,#06071a);color:var(--text);
  box-shadow:0 0 0 1px rgba(255,226,170,.45),0 0 0 6px rgba(9,10,30,.6),0 0 0 7px rgba(242,182,94,.22),0 40px 120px rgba(0,0,0,.7),0 0 80px rgba(242,182,94,.12);}
.cp-root.live .cp-panel{visibility:visible;}
.cp-panel:focus{outline:none;}
/* 背景：华丽档 canvas 极光；柔和档三条 CSS 光带（只动 transform） */
.cp-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.cp-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.cp-bg i{position:absolute;top:-10%;bottom:-10%;width:16%;border-radius:50%;filter:none;opacity:.55;will-change:transform;
  background:linear-gradient(90deg,rgba(120,140,255,0),rgba(150,170,255,.22),rgba(120,140,255,0));animation:cpBand 22s ease-in-out infinite alternate;}
.cp-bg i:nth-child(1){left:12%;}
.cp-bg i:nth-child(2){left:46%;width:12%;background:linear-gradient(90deg,rgba(255,214,150,0),rgba(255,214,150,.14),rgba(255,214,150,0));animation-duration:27s;animation-delay:-9s;}
.cp-bg i:nth-child(3){left:72%;width:18%;animation-duration:31s;animation-delay:-4s;}
.cp-root.hi .cp-bg i{display:none;}
@keyframes cpBand{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.cp-veil{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .9s var(--ease-soft);
  background:radial-gradient(70% 70% at 45% 55%, rgba(7,9,32,.9) 30%, rgba(7,9,32,.55) 70%, rgba(7,9,32,.12) 100%);}
.cp-panel.s1 .cp-veil{opacity:1;}
.cp-head,.cp-body,.cp-foot{position:relative;z-index:1;}
.cp-grip{display:none;}
/* 头部 */
.cp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 26px 6px;opacity:0;transform:translateY(-8px);
  transition:opacity .6s var(--ease-soft), transform .6s var(--ease-soft);}
.cp-panel.s1 .cp-head{opacity:1;transform:none;}
.cp-head small{display:block;font-family:var(--f-rune);font-weight:500;font-size:11px;letter-spacing:.42em;color:var(--gold-dim);}
.cp-head h2{margin:4px 0;font-family:var(--f-display);font-weight:var(--fw-display);font-size:clamp(26px,3.4vw,38px);letter-spacing:.2em;color:var(--gold-hi);text-shadow:0 0 24px rgba(242,182,94,.4);}
.cp-head p{margin:0;font-size:13px;letter-spacing:.1em;color:#c9c6ea;font-variant-numeric:tabular-nums;}
.cp-x{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,12,34,.7);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;}
.cp-x:hover{box-shadow:0 0 16px rgba(242,182,94,.45);}
.cp-x .sb-ico{width:16px;height:16px;}
.cp-root button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;}
/* 主体 */
.cp-body{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr);gap:18px;padding:6px 26px 10px;min-height:0;}
.cp-map{position:relative;min-height:0;min-width:0;overflow:hidden;border-radius:14px;touch-action:none;}
#cp-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;cursor:grab;}
#cp-svg.dragging{cursor:grabbing;}
.cp-region{fill:rgba(40,48,120,.0);stroke:rgba(255,214,150,.55);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;opacity:0;
  transition:fill .5s, stroke .35s, opacity .6s var(--ease-soft);}
.cp-panel.s2 .cp-region{opacity:1;fill:rgba(42,52,140,.42);}
.cp-panel.s2 .cp-region.lit{fill:rgba(242,182,94,.26);stroke:rgba(255,227,171,.85);}
.cp-panel.s2 .cp-region.hot{fill:rgba(90,100,200,.5);stroke:#fff4d8;}
.cp-panel.s2 .cp-region.lit.hot{fill:rgba(242,182,94,.4);}
.cp-panel.s2 .cp-region.sel{fill:rgba(242,182,94,.46);stroke:#fff4d8;}
/* 华丽档：省份轮廓描边绘入 */
.cp-root.hi .cp-region{opacity:1;stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset 1.3s var(--ease-soft) var(--d,0ms), fill .8s var(--ease-soft) calc(var(--d,0ms) + 700ms), stroke .35s;}
.cp-root.hi .cp-panel.s2 .cp-region{stroke-dashoffset:0;}
.cp-root.hi .cp-panel.drawn .cp-region{stroke-dasharray:none;transition:fill .5s, stroke .35s;}
.cp-line{fill:none;stroke:rgba(244,184,96,.3);stroke-dasharray:4 4;vector-effect:non-scaling-stroke;pointer-events:none;}
.cp-star{pointer-events:none;opacity:0;transition:opacity .6s var(--ease-soft) var(--d,0ms);}
.cp-panel.s3 .cp-star{opacity:1;}
.cp-star .halo{fill:url(#cpStarHalo);opacity:0;}
.cp-star.lit .halo{opacity:1;}
.cp-star .core{fill:#7d7466;opacity:.5;}
.cp-star.lit .core{fill:#fff6dc;opacity:1;}
.cp-star text{fill:var(--gold-hi);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:1.5px;paint-order:stroke;stroke:#070920;stroke-width:4px;stroke-linejoin:round;}
.cp-star.hot .halo{animation:cpPop 1.1s var(--ease-soft);}
.cp-star.pop .halo{animation:cpPop 1.2s var(--ease-soft);}
@keyframes cpPop{0%{transform:scale(.3);opacity:0}40%{transform:scale(2.4);opacity:1}100%{transform:scale(1);opacity:1}}
.cp-star .halo{transform-box:fill-box;transform-origin:center;}
.cp-tools{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2;}
.cp-tools button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,12,34,.82);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;}
.cp-tools .sb-ico{width:15px;height:15px;}
.cp-tip{position:absolute;left:0;top:0;z-index:2;pointer-events:none;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(12,12,34,.88);
  font-size:13px;letter-spacing:.08em;color:var(--text);white-space:nowrap;opacity:0;transition:opacity .2s;}
.cp-tip b{font-family:var(--f-display);color:var(--gold-hi);margin-right:6px;}
.cp-tip.show{opacity:1;}
.cp-load{position:absolute;inset:0;display:grid;place-items:center;z-index:2;}
.cp-load[hidden]{display:none!important;}
/* 城市栏 */
.cp-side{display:flex;flex-direction:column;gap:10px;min-height:0;opacity:0;transform:translateX(12px);transition:opacity .6s var(--ease-soft), transform .6s var(--ease-soft);}
.cp-panel.s3 .cp-side{opacity:1;transform:none;}
.cp-side h3{margin:4px 0 0;font-family:var(--f-rune);font-weight:600;font-size:11.5px;letter-spacing:.36em;color:var(--gold-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cp-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;border:1px solid rgba(255,227,171,.6);background:rgba(242,182,94,.14);
  color:var(--gold-hi);font-family:var(--f-display);font-size:13px;letter-spacing:.08em;cursor:pointer;}
.cp-chip .sb-ico{width:12px;height:12px;}
.cp-list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:2px 2px 2px 0;overscroll-behavior:contain;}
.cp-card{position:relative;flex:none;display:flex;align-items:stretch;border-radius:12px;border:1px solid var(--line);background:rgba(14,16,46,.78);transition:border-color .3s, box-shadow .3s;}
.cp-card:hover,.cp-card.hot{border-color:rgba(255,227,171,.75);box-shadow:0 0 18px rgba(242,182,94,.22);}
.cp-card .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border:0;background:none;color:var(--text);cursor:pointer;text-align:left;font:inherit;border-radius:12px;}
.cp-card .go i{flex:none;width:10px;height:10px;border-radius:50%;background:#fff3d6;box-shadow:0 0 10px 3px rgba(255,214,150,.6);}
.cp-card .go span{min-width:0;display:flex;flex-direction:column;gap:2px;}
.cp-card .go b{font-family:var(--f-display);font-weight:var(--fw-display);font-size:16.5px;letter-spacing:.1em;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-card .go em{font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-card .ed{flex:none;width:44px;border:0;border-left:1px solid rgba(240,214,160,.14);background:none;color:var(--text-dim);cursor:pointer;display:grid;place-items:center;border-radius:0 12px 12px 0;}
.cp-card .ed:hover{color:var(--gold-hi);background:rgba(244,184,96,.08);}
.cp-card .ed .sb-ico{width:16px;height:16px;}
.cp-empty{padding:16px;border-radius:12px;border:1px dashed var(--line);font-size:13px;line-height:1.8;letter-spacing:.06em;color:var(--text-dim);}
/* 底部 */
.cp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 26px 20px;opacity:0;transition:opacity .6s var(--ease-soft);}
.cp-panel.s3 .cp-foot{opacity:1;}
.cp-note{font-size:12px;letter-spacing:.06em;color:var(--text-dim);}
.cp-add{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 28px;border:0;border-radius:999px;cursor:pointer;color:#2a1608;
  font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.14em;flex:none;
  background:linear-gradient(180deg,#ffe7b5,#f2b65e 60%,#cf903c);box-shadow:0 0 22px rgba(242,182,94,.45),inset 0 1px 0 rgba(255,255,255,.6);}
.cp-add[hidden]{display:none;}
.cp-add .sb-ico{width:16px;height:16px;}
/* 裂隙边缘（不被面板裁切；只动 transform / opacity） */
.cp-edge{position:absolute;left:0;top:0;width:60px;margin-left:-30px;pointer-events:none;opacity:0;will-change:transform,opacity;
  background:linear-gradient(90deg,rgba(150,170,255,0),rgba(150,170,255,.22) 35%,rgba(255,240,210,.55) 48%,rgba(255,252,240,.95) 50%,rgba(255,240,210,.55) 52%,rgba(150,170,255,.22) 65%,rgba(150,170,255,0));}
.cp-edge::after{content:"";position:absolute;left:18px;right:18px;top:0;bottom:0;opacity:.85;
  background-image:radial-gradient(circle,rgba(255,236,200,.95) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(200,214,255,.8) 0 1px,transparent 1.6px);
  background-size:13px 37px,17px 53px;background-position:2px 0,8px 11px;animation:cpSpark .9s linear infinite;}
@keyframes cpSpark{to{background-position:2px -37px,8px -53px;}}
html:not([data-sb-perf="high"]) .cp-edge::after{animation:none;}
/* 手机：底部抽屉 */
@media (max-width:720px){
  .cp-panel{left:0;right:0;top:auto;bottom:0;width:auto;height:calc(100% - 66px - var(--safe-t));transform:none;border-radius:22px 22px 0 0;
    box-shadow:0 0 0 1px rgba(255,226,170,.45),0 -20px 60px rgba(0,0,0,.6),0 0 60px rgba(242,182,94,.1);}
  .cp-head{padding:20px 16px 4px;touch-action:none;}
  /* v1.11.1 下拉关闭把手（装饰；关闭仍以 × 为准，prompts/09-country-map.md 9.1） */
  .cp-grip{display:block;position:absolute;left:50%;top:8px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,227,171,.42);z-index:2;pointer-events:none;}
  .cp-head h2{font-size:26px;}
  .cp-head p{font-size:12px;letter-spacing:.06em;}
  .cp-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;padding:4px 12px 6px;gap:8px;}
  .cp-side h3{font-size:10.5px;}
  .cp-side h3 .lbl{display:none;}
  .cp-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scroll-snap-type:x mandatory;}
  .cp-card{min-width:148px;max-width:220px;scroll-snap-align:start;}
  /* v1.11.1：城市 ≤ 2 座时纵向排列、占满宽度 */
  .cp-list.few{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;}
  .cp-list.few .cp-card{min-width:0;max-width:none;}
  .cp-card .go{min-height:56px;padding:8px 12px;}
  .cp-empty{padding:12px;}
  .cp-foot{padding:8px 12px calc(12px + var(--safe-b));}
  .cp-note{display:none;}
  .cp-add{flex:1;}
  .cp-tools button{width:34px;height:34px;}
}
@media (max-width:720px) and (max-height:620px){ .cp-head p{display:none;} }
/* 地球场景：面板打开时隐藏自己的界面 */
.sb-scene[data-scene="globe"].cp-on .gl-head,.sb-scene[data-scene="globe"].cp-on .gl-labels,.sb-scene[data-scene="globe"].cp-on .gl-card,
.sb-scene[data-scene="globe"].cp-on .gl-dock,.sb-scene[data-scene="globe"].cp-on .gl-hint,.sb-scene[data-scene="globe"].cp-on .gl-tip{opacity:0!important;pointer-events:none!important;transition:opacity .4s;}
/* v1.12.2 · 添加 / 校准城市的位置候选（prompts/09-country-map.md v1.12.2） */
.cp-pick{display:flex;flex-direction:column;gap:6px;}
.cp-pick > span{font-family:var(--f-display);font-weight:var(--fw-display);font-size:13.5px;letter-spacing:.12em;color:var(--text-dim);}
.cp-pick-l{display:flex;flex-direction:column;gap:4px;max-height:236px;overflow:auto;overscroll-behavior:contain;}
.cp-pk{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:7px 12px;border-radius:10px;border:1px solid rgba(244,184,96,.16);background:rgba(244,184,96,.03);
  color:var(--text);text-align:left;cursor:pointer;font:inherit;transition:border-color .25s, background .25s;}
.cp-pk:hover{border-color:rgba(244,184,96,.42);}
.cp-pk[aria-selected="true"]{border-color:rgba(255,226,168,.75);background:rgba(244,184,96,.1);box-shadow:0 0 14px rgba(244,184,96,.16);}
.cp-pk i{flex:none;width:14px;height:14px;border-radius:50%;border:1.4px solid rgba(244,184,96,.55);position:relative;}
.cp-pk[aria-selected="true"] i{border-color:var(--gold-hi);}
.cp-pk[aria-selected="true"] i::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 6px rgba(255,214,150,.9);}
.cp-pk span{display:flex;flex-direction:column;min-width:0;line-height:1.35;}
.cp-pk b{font-weight:600;font-size:15px;color:var(--gold-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-pk em{font-style:normal;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-pk.none b{color:var(--text);font-weight:500;font-size:14px;}
.cp-pick-n{margin:0;font-size:12px;line-height:1.7;color:var(--text-dim);}
.cp-pick-n.warn{color:#e7c493;}
.cp-loc{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-dim);}
.cp-loc b{font-weight:500;color:var(--text);}
</style>

<div class="cp-root" id="cp-root" hidden>
  <div class="cp-scrim" id="cp-scrim"></div>
  <section class="cp-panel" id="cp-panel" role="dialog" aria-modal="true" aria-labelledby="cp-title" tabindex="-1">
    <div class="cp-bg" id="cp-bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cp-veil" aria-hidden="true"></div>
    <i class="cp-grip" aria-hidden="true"></i>
    <header class="cp-head">
      <div><small id="cp-en">TERRA</small><h2 id="cp-title"></h2><p id="cp-stat"></p></div>
      <button type="button" class="cp-x" id="cp-x" aria-label="关闭国家面板（Esc）"></button>
    </header>
    <div class="cp-body">
      <div class="cp-map" id="cp-map">
        <svg id="cp-svg" xmlns="http://www.w3.org/2000/svg" aria-label="省级地图">
          <defs>
            <radialGradient id="cpStarHalo"><stop offset="0" stop-color="#fff4d8" stop-opacity=".95"/><stop offset=".25" stop-color="#ffcf80" stop-opacity=".55"/><stop offset="1" stop-color="#f4b860" stop-opacity="0"/></radialGradient>
            <symbol id="cpStarShape" viewBox="-10 -10 20 20"><path d="M0 -10 L1.6 -1.6 L10 0 L1.6 1.6 L0 10 L-1.6 1.6 L-10 0 L-1.6 -1.6Z"/></symbol>
          </defs>
          <g id="cp-view"><g id="cp-regions"></g><g id="cp-lines"></g><g id="cp-stars"></g></g>
        </svg>
        <div class="cp-tip" id="cp-tip"></div>
        <div class="cp-tools"><button type="button" id="cp-zin" aria-label="放大"></button><button type="button" id="cp-zout" aria-label="缩小"></button><button type="button" id="cp-zreset" aria-label="复位"></button></div>

      <button type="button" class="cp-add" id="cp-add"></button>
    </footer>
  </section>
</div>

<script>
(function(SB){
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const root = $('cp-root'), panel = $('cp-panel'), scrim = $('cp-scrim'), svg = $('cp-svg'), view = $('cp-view'), mapEl = $('cp-map'), tip = $('cp-tip');
  const globeEl = SB.scenes.el('globe');
  if(globeEl) globeEl.appendChild(root);          // 面板是地球场景的一部分（位于地球画布之上）
  $('cp-x').innerHTML = SB.icon('close'); $('cp-zin').innerHTML = SB.icon('plus'); $('cp-zout').innerHTML = SB.icon('minus'); $('cp-zreset').innerHTML = SB.icon('reset');
  $('cp-add').innerHTML = `${SB.icon('plus')}<span>添加城市</span>`;

  const S = { act:0, dragOut:false, open:false, k:null, country:null, map:null, regions:[], fit:null, vb:{x:0, y:0, k:1}, pathEls:{}, starEls:{}, sel:null, hot:null,
    token:0, anims:[], timers:[], phase:'', at:null, inerted:[], ret:null, edges:[], bgRun:false, closeP:null, closeRes:null };
  const fancy = () => SB.perf.level === 'high' && !SB.perf.android;
  const reduced = () => SB.perf.level === 'reduced';
  const UNIT = {cn:'个省份', us:'个州', jp:'个都道府县', au:'个州', ca:'个省', in:'个邦', de:'个州', ru:'个联邦主体'};

  /* ── 地图：拟合到容器、绘制、上色 ── */
  function fitBox(){
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    S.regions.forEach(r => { b[0] = Math.min(b[0], r.bbox[0]); b[1] = Math.min(b[1], r.bbox[1]); b[2] = Math.max(b[2], r.bbox[2]); b[3] = Math.max(b[3], r.bbox[3]); });
    const W = mapEl.clientWidth || 600, H = mapEl.clientHeight || 400, pad = W < 420 ? 12 : 20;
    const aw = Math.max(40, W - pad*2), ah = Math.max(40, H - pad*2);
    const s = Math.min(aw/(b[2]-b[0] || 1), ah/(b[3]-b[1] || 1));
    S.fit = { s, ox:(W - (b[2]-b[0])*s)/2 - b[0]*s, oy:(H - (b[3]-b[1])*s)/2 - b[1]*s, W, H };
    S.vb = { x:0, y:0, k:1 };
  }
  const X = x => x*S.fit.s + S.fit.ox, Y = y => y*S.fit.s + S.fit.oy;
  function applyView(){
    view.setAttribute('transform', `translate(${S.vb.x.toFixed(1)} ${S.vb.y.toFixed(1)}) scale(${S.vb.k.toFixed(4)})`);
    const ks = (1/S.vb.k).toFixed(4);
    for(const id in S.starEls){ const s = S.starEls[id]; s.setAttribute('transform', `translate(${s._x} ${s._y}) scale(${ks})`); }
  }
  function zoomAt(f, cx, cy){
    const k = SB.clamp(S.vb.k*f, 1, 14); f = k/S.vb.k;
    S.vb.x = cx - (cx - S.vb.x)*f; S.vb.y = cy - (cy - S.vb.y)*f; S.vb.k = k; applyView(); hideTip();
  }
  function pathD(polys){
    let d = '';
    for(const poly of polys) for(const r of poly){ d += 'M' + X(r[0]).toFixed(1) + ' ' + Y(r[1]).toFixed(1);
      for(let i = 2; i < r.length; i += 2) d += 'L' + X(r[i]).toFixed(1) + ' ' + Y(r[i+1]).toFixed(1); d += 'Z'; }
    return d;
  }
  function draw(){
    if(!S.regions.length) return;
    fitBox();
    const gR = $('cp-regions'), gL = $('cp-lines'), gS = $('cp-stars'), n = S.regions.length;
    gR.innerHTML = gL.innerHTML = gS.innerHTML = ''; S.pathEls = {}; S.starEls = {};
    S.regions.forEach((r, i) => {
      const p = document.createElementNS(NS, 'path'); p.setAttribute('d', pathD(r.polys)); p.setAttribute('class', 'cp-region');
      p.setAttribute('pathLength', '1'); p.style.setProperty('--d', Math.round(i/n*650) + 'ms');
      p.dataset.key = r.key; p.setAttribute('aria-label', r.name);
      gR.appendChild(p); S.pathEls[r.key] = p;
      const s = document.createElementNS(NS, 'g'); s.setAttribute('class', 'cp-star'); s.style.setProperty('--d', Math.round(i/n*400) + 'ms');
      s.innerHTML = '<circle class="halo" r="20"/><use class="core" href="#cpStarShape" x="-6" y="-6" width="12" height="12"/><text x="11" y="5"></text>';
      s._x = X(r.mid[0]).toFixed(1); s._y = Y(r.mid[1]).toFixed(1);
      gS.appendChild(s); S.starEls[r.key] = s;
    });
    for(const l of (S.map?.lines || [])){
      const p = document.createElementNS(NS, 'path'); let d = 'M' + X(l[0]).toFixed(1) + ' ' + Y(l[1]).toFixed(1);
      for(let i = 2; i < l.length; i += 2) d += 'L' + X(l[i]).toFixed(1) + ' ' + Y(l[i+1]).toFixed(1);
      p.setAttribute('d', d); p.setAttribute('class', 'cp-line'); gL.appendChild(p);
    }
    applyView(); paint();
  }
  function paint(popKey){
    if(!S.k) return;
    const cities = SB.store.citiesIn(S.k), by = {};
    cities.forEach(c => (by[c.region] = by[c.region] || []).push(c));
    let lit = 0;
    for(const r of S.regions){
      const cs = by[r.key] || [], on = cs.length > 0; if(on) lit++;
      S.pathEls[r.key]?.classList.toggle('lit', on);
      S.pathEls[r.key]?.classList.toggle('sel', S.sel === r.key);
      const s = S.starEls[r.key]; if(!s) continue;
      s.classList.toggle('lit', on);
      s.querySelector('text').textContent = on ? (cs.length > 1 ? `${cs[0].name} 等 ${cs.length} 城` : cs[0].name) : '';
      if(popKey === r.key){ s.classList.remove('pop'); requestAnimationFrame(() => s.classList.add('pop')); setTimeout(() => s.classList.remove('pop'), 1300); }
    }
    const mem = cities.reduce((a, c) => a + SB.store.memoriesOf(c.id).length, 0);
    const parts = [];
    if(S.regions.length > 1) parts.push(`点亮 ${lit} / ${S.regions.length} ${UNIT[S.k] || '个地区'}`);
    parts.push(cities.length ? `${cities.length} 座城市` : '还没有点亮的城市');
    if(mem) parts.push(`${mem} 段回忆`);
    $('cp-stat').textContent = parts.join(' · ');
  }
  const regionByKey = key => S.regions.find(r => r.key === key);

  /* ── 城市栏 ── */
  function buildList(){
    const list = $('cp-list'), filter = $('cp-filter'); list.innerHTML = ''; filter.innerHTML = ''; list.classList.remove('few');
    if(!S.k) return;
    const sel = S.sel && regionByKey(S.sel);
    if(sel && S.regions.length > 1){
      const chip = SB.el('button', 'cp-chip'); chip.type = 'button'; chip.setAttribute('aria-label', `取消筛选 ${sel.name}`);
      chip.innerHTML = `<span></span>${SB.icon('close')}`; chip.querySelector('span').textContent = sel.name;
      chip.addEventListener('click', () => select(null)); filter.appendChild(chip);
    }
    const all = SB.store.citiesIn(S.k).filter(c => !sel || c.region === sel.key)
      .map(c => ({c, n:SB.store.memoriesOf(c.id).length}))
      .sort((a, b) => b.n - a.n || (a.c.createdAt || '').localeCompare(b.c.createdAt || ''));
    if(!all.length){
      const p = SB.el('div', 'cp-empty');
      p.textContent = sel ? `${sel.name}还没有点亮的城市。` + (SB.store.canEdit ? '点下方「添加城市」写下这里的第一段回忆。' : '')
                          : `这里还没有我们的足迹。` + (SB.store.canEdit ? `点下方「添加城市」，写下在${S.country.zh}的第一段回忆。` : '');
      list.appendChild(p); return;
    }
    list.classList.toggle('few', all.length <= 2);
    for(const {c, n} of all){
      const card = SB.el('div', 'cp-card'); card.dataset.region = c.region || '';
      const go = SB.el('button', 'go'); go.type = 'button';
      const rg = regionByKey(c.region)?.name || c.regionName || '';
      go.innerHTML = '<i></i><span><b></b><em></em></span>';
      go.querySelector('b').textContent = c.name;
      go.querySelector('em').textContent = [S.regions.length > 1 ? rg : '', n ? `${n} 段回忆` : '还没有回忆'].filter(Boolean).join(' · ');
      go.addEventListener('click', e => { const r = go.getBoundingClientRect();
        SB.scenes.go('city', {id:c.id}, {transition:'quill', x:e.clientX || r.left + r.width/2, y:e.clientY || r.top + r.height/2}); });
      card.addEventListener('pointerenter', () => hotStar(c.region, true));
      card.addEventListener('pointerleave', () => hotStar(c.region, false));
      card.appendChild(go);
      if(SB.store.canEdit){
        const ed = SB.el('button', 'ed'); ed.type = 'button'; ed.setAttribute('aria-label', '编辑 ' + c.name); ed.innerHTML = SB.icon('quill');
        ed.addEventListener('click', () => editCity(c)); card.appendChild(ed);
      }
      list.appendChild(card);
    }
  }
  function hotStar(key, on){ S.pathEls[key]?.classList.toggle('hot', on); }
  function select(key){
    S.sel = key && S.sel !== key ? key : null;
    paint(); buildList(); $('cp-list').scrollTo?.({left:0, top:0});
  }

  /* ── 添加 / 编辑城市 ── */
  /* v1.12.2：位置候选。本地结果立即显示，在线结果 350ms 后补充；名称完全相同的第一条自动选中（用户点选后不再自动改） */
  function placePicker(opts){
    const box = SB.el('div', 'cp-pick');
    box.innerHTML = '<span>位置</span><div class="cp-pick-l" role="listbox" aria-label="选择城市的位置"></div><p class="cp-pick-n" aria-live="polite"></p>';
    // 编辑城市时用单独的搜索框（城市名可以和地名不同，例如「京都站」），添加城市时由城市名驱动
    if(opts.ownSearch){
      const q = SB.ui.input({type:'text', placeholder:'搜索地点，例如：京都', maxlength:'40', 'aria-label':'搜索地点', autocomplete:'off', value:opts.ownSearch});
      q.addEventListener('input', () => search(q.value));
      q.addEventListener('keydown', e => { if(e.key === 'Enter') e.preventDefault(); });
      box.insertBefore(q, box.children[1]); box.querySelector('span').textContent = '校准位置';
    }
    const listEl = box.querySelector('.cp-pick-l'), note = box.querySelector('.cp-pick-n');
    const P = {q:'', local:[], online:[], state:'', pick:null, user:false, locked:false, timer:0, ctl:null};
    const regionOf = c => SB.geo.guessRegion(S.regions, c);
    const all = () => {
      const out = P.local.map(l => ({...l, admin1:l.admin1 || ''}));
      for(const o of P.online){
        const same = out.find(l => Math.abs(l.lat - o.lat) < .25 && Math.abs(l.lon - o.lon) < .25);
        // 本地城市库没有一级行政区：借用同一地点在线结果的 admin1 来判断地区（比「最近的地区代表点」准确）
        if(same){ if(!same.admin1 && o.admin1) same.admin1 = o.admin1; } else out.push(o);
      }
      P.list = out.slice(0, 8);
      if(P.pick) P.pick = P.list.find(c => c.lon === P.pick.lon && c.lat === P.pick.lat && c.zh === P.pick.zh) || P.pick;
      return P.list;
    };
    function auto(){
      if(P.user) return;
      const list = all(), want = opts.region?.();
      const ex = list.filter(c => c.exact);
      // 用户亲手选过「所在地区」：只在这个地区里自动选；否则名称完全相同的第一条，并把地区切过去（面板筛选带入的地区不算亲手选）
      P.pick = (want && ex.find(c => regionOf(c)?.key === want)) || (P.locked ? null : ex[0]) || null;
      if(P.pick && opts.onRegion){ const r = regionOf(P.pick); if(r && r.key !== want) opts.onRegion(r); }
    }
    function render(){
      listEl.innerHTML = '';
      const list = all();
      const row = (c, label, sub) => {
        const b = SB.el('button', 'cp-pk' + (c ? '' : ' none')); b.type = 'button'; b.setAttribute('role', 'option');
        b.setAttribute('aria-selected', String(c ? P.pick === c : !P.pick && P.user));
        b.innerHTML = '<i></i><span><b></b><em></em></span>'; b.querySelector('b').textContent = label; b.querySelector('em').textContent = sub || '';
        b.addEventListener('click', () => { P.user = true; P.pick = c; if(c){ const r = regionOf(c); if(r) opts.onRegion?.(r); } render(); });
        listEl.appendChild(b);
      };
      for(const c of list){
        const r = regionOf(c);
        // 副标题：所在地区 + 来源给的补充（与地区同名的部分不重复，例如「云南 · 云南省」只留「云南」）
        const rn = r && S.regions.length > 1 ? r.name : '';
        const extra = String(c.sub || '').split(' · ').filter(v => v && !(rn && (v === rn || v.startsWith(rn) || rn.startsWith(v.replace(/(省|州|府|县|県|都|道|市|区)$/, '')))));
        const sub = [rn, ...extra].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ');
        row(c, c.zh, sub || S.country?.zh || '');
      }
      if(P.q) row(null, '不指定位置', '放在所在地区的中心，之后可以校准');
      listEl.hidden = !P.q;
      let t = '';
      if(!P.q) t = '输入城市名后，在这里选一个位置，地球上的光点会落在那里。';
      else if(P.state === 'wait') t = list.length ? '正在星图中寻找更多地点…' : '正在星图中寻找「' + P.q + '」…';
      else if(P.state === 'fail') t = list.length ? '在线搜索暂时不可用，已显示本地结果。' : '在线搜索暂时不可用。可以先保存，之后在编辑里校准位置。';
      else if(!list.length) t = '没有找到这个地方。可以换个写法（中文或英文），或者先保存，城市会放在地区中心。';
      const r = P.pick && regionOf(P.pick), cur = opts.region?.();
      if(P.pick && opts.moveNote && r && cur && r.key !== cur) t = `这个位置在「${r.name}」，保存后城市会移到${r.name}。`;
      note.textContent = t; note.classList.toggle('warn', P.state === 'fail');
      opts.onChange?.();
    }
    function search(q){
      q = String(q || '').trim(); if(q === P.q) return; P.q = q;
      clearTimeout(P.timer); P.ctl?.abort(); P.ctl = null;
      P.user = false; P.pick = null; P.online = [];
      P.local = q ? SB.geo.placesLocal(S.k, q) : [];
      P.state = q && [...q].length >= 2 ? 'wait' : '';
      auto(); render();
      if(P.state !== 'wait') return;
      const asked = q, ctl = P.ctl = new AbortController();
      P.timer = setTimeout(async () => {
        try{ const r = await SB.geo.placesOnline(S.k, asked, ctl.signal); if(asked !== P.q) return; P.online = r; P.state = ''; }
        catch(e){ if(asked !== P.q) return; P.online = []; P.state = 'fail'; }
        auto(); render();
      }, 350);
    }
    render();
    return { el:box, search, value:() => P.pick, region:() => P.pick ? regionOf(P.pick) : null, refresh:() => { auto(); render(); },
      // 用户改了「所在地区」：已选的位置不在这个地区时取消（城市放在新地区的中心），并且之后只在这个地区里自动选
      regionChanged:() => { P.locked = true; const w = opts.region?.(); if(P.pick && regionOf(P.pick)?.key !== w){ P.pick = null; P.user = false; } auto(); render(); },
      stop:() => { clearTimeout(P.timer); P.ctl?.abort(); }, get state(){ return P.state; } };
  }
  const near = (a, b) => a && b && Math.abs(a[0] - b[0]) < .01 && Math.abs(a[1] - b[1]) < .01;
  const roughPos = c => c.lon == null || near([c.lon, c.lat], regionByKey(c.region)?.lonlat) || near([c.lon, c.lat], S.country?.mid);
  function addCity(){
    if(!SB.store.canEdit || !S.k) return;
    let sel, inp, pick;
    const multi = S.regions.length > 1;
    SB.ui.dialog({ title:'添加城市', sub:S.country.zh,
      build(b){
        if(multi){
          sel = SB.el('select', 'sb-input');
          sel.innerHTML = '<option value="">选择所在地区…</option>' + [...S.regions].sort((a, c) => a.name.localeCompare(c.name, 'zh'))
            .map(r => `<option value="${SB.esc(r.key)}">${SB.esc(r.name)}</option>`).join('');
          if(S.sel) sel.value = S.sel;
          b.appendChild(SB.ui.field('所在地区', sel));
        }
        inp = SB.ui.input({type:'text', placeholder:'城市名，例如：京都', maxlength:'30', 'aria-label':'城市名', autocomplete:'off'});
        inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); b.closest('.sb-modal')?.querySelector('.sb-btn.primary')?.click(); } });
        b.appendChild(SB.ui.field('城市名', inp));
        pick = placePicker({ region:() => multi ? sel.value : S.regions[0]?.key, onRegion:r => { if(multi) sel.value = r.key; } });
        inp.addEventListener('input', () => pick.search(inp.value));
        sel?.addEventListener('change', () => pick.regionChanged());
        b.appendChild(pick.el);
      },
      onClose(){ pick?.stop(); },
      actions:[ {text:'取消'}, {text:'点亮', kind:'primary', async onClick(){
        const r = multi ? regionByKey(sel.value) : S.regions[0];
        if(!r){ SB.toast('请选择城市所在的地区'); return false; }
        const name = inp.value.trim(); if(!name){ SB.toast('请输入城市名'); return false; }
        try{
          const p = pick.value();
          const lon = p ? +p.lon.toFixed(4) : r.lonlat?.[0] ?? S.country.mid?.[0], lat = p ? +p.lat.toFixed(4) : r.lonlat?.[1] ?? S.country.mid?.[1];
          await SB.store.addCity({country:S.k, countryName:S.country.zh, region:r.key, regionName:r.name, name, lon, lat});
          SB.toast(p ? `${name} 已点亮` : `${name} 已点亮 · 暂放在地区中心，可以在编辑里校准位置`, p ? 2600 : 4200); SB.fx?.burst?.(500);
          if(multi) S.sel = r.key;
          paint(r.key); buildList();
        }catch(e){ SB.toast(e.msg || SB.store.errText(e)); return false; }
      }} ]});
  }
  function editCity(c){
    let inp, pick, locRow;
    SB.ui.dialog({ title:'编辑城市', sub:(c.regionName ? c.regionName + ' · ' : '') + (c.countryName || S.country?.zh || ''),
      build(b){
        inp = SB.ui.input({type:'text', value:c.name, maxlength:'30'}); b.appendChild(SB.ui.field('城市名', inp));
        // v1.12.2：校准位置（旧城市多数放在地区或国家中心）
        locRow = SB.el('div', 'cp-loc'); const t = SB.el('span');
        t.innerHTML = '位置：<b></b>'; t.querySelector('b').textContent = roughPos(c) ? '大致位置（地区中心）' : '已校准';
        const btn = SB.ui.button('校准位置', 'small', () => {
          btn.hidden = true;
          pick = placePicker({ region:() => c.region, moveNote:true, ownSearch:inp.value || c.name });
          b.appendChild(pick.el); pick.search(inp.value || c.name);
          setTimeout(() => pick.el.querySelector('input')?.focus(), 60);
        });
        locRow.append(t, btn); b.appendChild(locRow);
      },
      onClose(){ pick?.stop(); },
      actions:[
        {text:'删除这座城市', kind:'danger', async onClick(){
          const n = SB.store.memoriesOf(c.id).length;
          if(!await SB.ui.confirm(n ? `删除「${c.name}」？它的 ${n} 段回忆和照片会一起移到「最近删除」，${SB.store.TRASH_DAYS || 30} 天内可以在右上角「珍藏与备份」里恢复。` : `删除「${c.name}」？${SB.store.TRASH_DAYS || 30} 天内可以在「最近删除」里恢复。`, '删除')) return false;
          try{ await SB.store.removeCity(c.id); SB.toast('已移到最近删除'); paint(); buildList(); }catch(e){ SB.toast(SB.store.errText(e)); return false; } }},
        'spacer',
        {text:'取消'},
        {text:'保存', kind:'primary', async onClick(){
          const name = inp.value.trim(); if(!name){ SB.toast('城市名不能为空'); return false; }
          const patch = {name}, p = pick?.value();
          if(p){
            patch.lon = +p.lon.toFixed(4); patch.lat = +p.lat.toFixed(4);
            const r = pick.region();
            if(r && r.key !== c.region){
              if(SB.store.cities.some(x => x.id !== c.id && x.region === r.key && x.name === name)){ SB.toast(`${r.name}已经有一座「${name}」`); return false; }
              patch.region = r.key; patch.regionName = r.name;
            }
          }
          try{ await SB.store.updateCity(c.id, patch); SB.toast(p ? '已保存，位置已校准' : '已保存');
            if(patch.region) S.sel = S.sel ? patch.region : S.sel;
            paint(); buildList(); }catch(e){ SB.toast(SB.store.errText(e)); return false; } }}
      ]});
  }
  $('cp-add').addEventListener('click', addCity);

  /* ── 地图指针：悬停、点选、拖拽、缩放（v1.10.2 拖动稳定规则） ── */
  const ptrs = new Map(); let pinch = 0, moved = 0;
  const tapMoveLimit = SB.perf.touch ? 14 : 6;
  const local = e => { const r = svg.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
  function showTip(key, e){
    const r = regionByKey(key); if(!r) return hideTip();
    const n = SB.store.citiesInRegion(key).length;
    tip.innerHTML = `<b>${SB.esc(r.name)}</b>${n ? `${n} 座城市` : '还没有足迹'}`;
    const p = local(e), w = tip.offsetWidth, W = mapEl.clientWidth;
    tip.style.transform = `translate(${SB.clamp(p.x + 14, 4, W - w - 4).toFixed(0)}px, ${Math.max(4, p.y - 40).toFixed(0)}px)`; tip.classList.add('show');
    if(S.hot !== key){ if(S.hot) S.pathEls[S.hot]?.classList.remove('hot'); S.hot = key; S.pathEls[key]?.classList.add('hot'); }
  }
  function hideTip(){ tip.classList.remove('show'); if(S.hot){ S.pathEls[S.hot]?.classList.remove('hot'); S.hot = null; } }
  svg.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if(!p){ if(e.pointerType === 'mouse'){ const key = e.target.dataset?.key; key ? showTip(key, e) : hideTip(); } return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
      if(pinch) zoomAt(d/pinch, (a.x + b.x)/2 - r.left, (a.y + b.y)/2 - r.top); pinch = d; return; }
    if(moved > 4){ svg.classList.add('dragging'); S.vb.x += dx; S.vb.y += dy; applyView(); hideTip(); }
  });
  svg.addEventListener('pointerleave', () => { if(!ptrs.size) hideTip(); });
  svg.addEventListener('pointerdown', e => {
    if(e.button && e.pointerType === 'mouse') return;
    if(e.isPrimary){ ptrs.clear(); pinch = 0; }
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0;
    if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId); if(!p) return;
    ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = 0; if(!ptrs.size) svg.classList.remove('dragging');
    if(moved < tapMoveLimit && e.type === 'pointerup' && !ptrs.size){
      const el = document.elementFromPoint(e.clientX, e.clientY), key = el?.dataset?.key;
      if(key && S.regions.length > 1) select(key); else if(!key && S.sel) select(null);
    }
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('lostpointercapture', e => { if(ptrs.has(e.pointerId)) up(e); });
  addEventListener('pointerup', e => { if(ptrs.has(e.pointerId)) up(e); });
  addEventListener('blur', () => { ptrs.clear(); pinch = 0; svg.classList.remove('dragging'); });
  SB.dragSurface?.(svg);
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, p.x, p.y); }, {passive:false});
  svg.addEventListener('dblclick', () => { S.vb = {x:0, y:0, k:1}; applyView(); });
  const mid = () => [mapEl.clientWidth/2, mapEl.clientHeight/2];
  $('cp-zin').addEventListener('click', () => zoomAt(1.4, ...mid()));
  $('cp-zout').addEventListener('click', () => zoomAt(1/1.4, ...mid()));
  $('cp-zreset').addEventListener('click', () => { S.vb = {x:0, y:0, k:1}; applyView(); });

  /* ── 载入国家地图（不阻塞面板展开） ── */
  function fallbackRegions(c){
    const polar = c.key === 'aq', R = Math.PI/180;
    const proj = polar ? (lon, lat) => { const r = 90 + lat, a = lon*R; return [Math.sin(a)*r, Math.cos(a)*r]; }
                       : (lon, lat) => [lon, -Math.log(Math.tan(Math.PI/4 + SB.clamp(lat, -85, 85)*R/2))/R];
    const polys = c.rings.map(r => { const o = []; let off = 0;
      for(let i = 0; i < r.length; i += 2){ if(polar && r[i+1] < -89.5) continue; if(i){ const d = r[i] - r[i-2]; if(d > 180) off -= 360; else if(d < -180) off += 360; } o.push(...proj(r[i] + off, r[i+1])); }
      return [o]; });
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    polys.forEach(p => p.forEach(r => { for(let i = 0; i < r.length; i += 2){ b[0] = Math.min(b[0], r[i]); b[1] = Math.min(b[1], r[i+1]); b[2] = Math.max(b[2], r[i]); b[3] = Math.max(b[3], r[i+1]); } }));
    const mid = c.mid?.[0] != null && !polar ? proj(c.mid[0], c.mid[1]) : [(b[0]+b[2])/2, (b[1]+b[3])/2];
    return [{ key:c.key + '-all', en:c.en, name:c.zh, polys, bbox:b, mid, lonlat:c.mid }];
  }
  async function loadMap(k){
    const token = ++S.token, loadEl = $('cp-load');
    $('cp-regions').innerHTML = $('cp-lines').innerHTML = $('cp-stars').innerHTML = ''; S.regions = []; S.map = null;
    let regions = null;
    if(S.country?.hasMap){
      loadEl.hidden = false; loadEl.innerHTML = ''; loadEl.appendChild(SB.ui.spinner('正在描绘星图…'));
      try{ S.map = await SB.geo.loadCountryMap(k); regions = S.map.regions; }
      catch(e){ if(token === S.token) SB.toast('省级地图暂时加载不了，先用整国地图'); }
    }
    if(token !== S.token) return;
    loadEl.hidden = true;
    S.regions = regions && regions.length ? regions : fallbackRegions(S.country);
    draw(); buildList();
  }

  /* ── 面板背景：华丽档 canvas 极光（约 30fps，仅面板打开时运行） ── */
  const BG = { cv:null, g:null, w:0, h:0, last:0, t:0, calm:1, sp:null };
  function bgStart(){
    if(!fancy() || BG.on) return;
    if(!BG.cv){ BG.cv = document.createElement('canvas'); $('cp-bg').prepend(BG.cv); BG.g = BG.cv.getContext('2d');
      BG.sp = Array.from({length:90}, () => ({x:Math.random(), z:Math.random(), s:Math.random()*.6 + .4})); }
    const r = panel.getBoundingClientRect(), dpr = Math.min(1.5, devicePixelRatio || 1);
    BG.w = r.width; BG.h = r.height; BG.cv.width = Math.round(BG.w*dpr); BG.cv.height = Math.round(BG.h*dpr); BG.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    BG.on = true; BG.last = 0; requestAnimationFrame(bgLoop);
  }
  function bgStop(){ BG.on = false; }
  function bgLoop(now){
    if(!BG.on) return;
    if(document.hidden){ BG.on = false; return; }
    requestAnimationFrame(bgLoop);
    // v1.11.1：面板 20 秒无操作降到约 10fps，有操作立即恢复约 30fps（prompts/09-country-map.md 9.3）
    if(BG.last && now - BG.last < (now - S.act > 20000 ? 99 : 31)) return;
    const dt = BG.last ? Math.min(.1, (now - BG.last)/1000) : 0; BG.last = now; BG.t += dt;
    const g = BG.g, w = BG.w, h = BG.h, t = BG.t, a = S.phase === 'opening' ? .75 : .42;
    g.clearRect(0, 0, w, h);
    for(let i = 0; i < 9; i++){
      const x = w*(.08 + .84*((i*.137 + Math.sin(t*.13 + i)*.04 + .5) % 1)), bw = w*(.05 + .05*Math.sin(i*1.7) + .05);
      const gr = g.createLinearGradient(x - bw, 0, x + bw, 0), al = a*(.32 + .22*Math.sin(t*.7 + i*2.1));
      gr.addColorStop(0, 'rgba(120,140,255,0)'); gr.addColorStop(.5, `rgba(${i % 3 ? '150,170,255' : '255,214,150'},${al.toFixed(3)})`); gr.addColorStop(1, 'rgba(120,140,255,0)');
      g.fillStyle = gr; g.fillRect(x - bw, 0, bw*2, h);
    }
    for(const p of BG.sp){ const y = ((p.z + t*.05*p.s) % 1)*h; g.fillStyle = `rgba(255,236,200,${(a*.5*p.s).toFixed(3)})`; g.fillRect(p.x*w, h - y, 1.2, 1.2 + 6*p.s); }
  }
  document.addEventListener('visibilitychange', () => { if(!document.hidden && S.open && fancy() && !BG.on){ BG.on = false; bgStart(); } });

  /* ── 时空裂隙：WAAPI clip-path inset 两段动画 + 两道边缘光（只动 transform / opacity） ── */
  function clearAnims(){
    S.anims.forEach(a => { try{ a.cancel(); }catch(_){} }); S.anims = [];
    S.timers.forEach(clearTimeout); S.timers = [];
    S.edges.forEach(e => e.remove()); S.edges = [];
    panel.style.clipPath = ''; scrim.style.opacity = '';
  }
  const later = (ms, fn) => S.timers.push(setTimeout(fn, ms));
  function geom(){
    const r = panel.getBoundingClientRect(), rr = root.getBoundingClientRect();
    const at = S.at || {x:r.left + r.width/2, y:r.top + r.height/2};
    const px = SB.clamp(at.x - r.left, 28, r.width - 28), py = SB.clamp(at.y - r.top, 28, r.height - 28);
    return { r, px, py, W:r.width, H:r.height, ox:r.left - rr.left, oy:r.top - rr.top };
  }
  function makeEdges(G){
    return [0, 1].map(() => { const e = SB.el('div', 'cp-edge');
      e.style.left = (G.ox + G.px) + 'px'; e.style.top = G.oy + 'px'; e.style.height = G.H + 'px'; e.style.transformOrigin = `50% ${G.py}px`;
      root.appendChild(e); S.edges.push(e); return e; });
  }
  const EASE_A = 'cubic-bezier(.2,.8,.3,1)', EASE_B = 'cubic-bezier(.65,0,.35,1)', OUT = -64;
  function slitFrames(G){
    const {px, py, W, H} = G;
    return [`inset(${py}px ${W - px}px ${H - py}px ${px}px round 2px)`,
            `inset(${OUT}px ${W - px - 1.5}px ${OUT}px ${px - 1.5}px round 2px)`,
            `inset(${OUT}px ${OUT}px ${OUT}px ${OUT}px round 22px)`];
  }
  function animOpen(){
    const G = geom(), D = fancy() ? 1100 : 800, [k0, k1, k2] = slitFrames(G);
    S.anims.push(panel.animate([{clipPath:k0, easing:EASE_A}, {clipPath:k1, offset:.3, easing:EASE_B}, {clipPath:k2}], {duration:D, fill:'both'}));
    S.anims.push(scrim.animate([{opacity:0}, {opacity:1}], {duration:D*.6, easing:'ease-out', fill:'both'}));
    const [eL, eR] = makeEdges(G);
    const ef = dx => [{transform:'translateX(0) scaleY(0)', opacity:1, easing:EASE_A}, {transform:'translateX(0) scaleY(1)', opacity:1, offset:.3, easing:EASE_B},
                      {transform:`translateX(${dx}px) scaleY(1)`, opacity:.9, offset:.9}, {transform:`translateX(${dx}px) scaleY(1)`, opacity:0}];
    S.anims.push(eL.animate(ef(-G.px), {duration:D, fill:'both'}), eR.animate(ef(G.W - G.px), {duration:D, fill:'both'}));
    later(D*.5, () => panel.classList.add('s1'));
    later(D*.56, () => panel.classList.add('s2'));
    later(D*.82, () => panel.classList.add('s3'));
    later(D + 20, settle);
  }
  function settle(){
    clearAnims(); S.phase = 'idle'; root.classList.add('on'); S.act = performance.now();
    panel.classList.add('s1', 's2', 's3');
    later(1500, () => panel.classList.add('drawn'));
    $('cp-x').focus({preventScroll:true});
    SB.countryPortal.settled = true;
  }
  function animClose(){
    const G = geom(), D = fancy() ? 650 : 450, [k0, k1, k2] = slitFrames(G);
    S.anims.push(panel.animate([{clipPath:k2, easing:'cubic-bezier(.55,0,.75,.4)'}, {clipPath:k1, offset:.62, easing:'cubic-bezier(.5,0,.8,.4)'}, {clipPath:k0}], {duration:D, fill:'both'}));
    S.anims.push(scrim.animate([{opacity:1}, {opacity:0}], {duration:D, easing:'ease-in', fill:'both'}));
    const [eL, eR] = makeEdges(G);
    const ef = dx => [{transform:`translateX(${dx}px) scaleY(1)`, opacity:0, easing:'cubic-bezier(.55,0,.75,.4)'}, {transform:`translateX(${dx*.85}px) scaleY(1)`, opacity:1, offset:.1, easing:'cubic-bezier(.5,0,.7,.5)'},
                      {transform:'translateX(0) scaleY(1)', opacity:1, offset:.62, easing:'cubic-bezier(.5,0,.8,.4)'}, {transform:'translateX(0) scaleY(0)', opacity:.6}];
    S.anims.push(eL.animate(ef(-G.px), {duration:D, fill:'both'}), eR.animate(ef(G.W - G.px), {duration:D, fill:'both'}));
    later(D + 10, finishClose);
  }

  /* ── 打开 / 关闭 ── */
  function setInert(on){
    if(on === S.inertOn) return; S.inertOn = on;
    if(on){ S.inerted = [...(globeEl?.children || [])].filter(el => el !== root && !el.inert); S.inerted.forEach(el => { el.inert = true; }); globeEl?.classList.add('cp-on'); }
    else{ S.inerted.forEach(el => { el.inert = false; }); S.inerted = []; globeEl?.classList.remove('cp-on'); }
  }
  function open(k, o = {}){
    const c = SB.geo.country(k); if(!c) return false;
    if(S.open && S.k === k && S.phase !== 'closing') return true;
    const wasOpen = S.open && S.phase !== 'closing';
    clearAnims(); S.closeRes?.(); S.closeRes = null; S.closeP = null;
    S.k = k; S.country = c; S.sel = null; S.at = o.x != null ? {x:o.x, y:o.y} : null;
    if(!wasOpen && !S.ret){ S.ret = document.activeElement !== document.body ? document.activeElement : null; }
    $('cp-title').textContent = c.zh; $('cp-en').textContent = `TERRA · ${(c.a2 || c.key).toUpperCase()}`; $('cp-stat').textContent = '';
    $('cp-add').hidden = !SB.store.canEdit; $('cp-list').innerHTML = ''; $('cp-filter').innerHTML = ''; hideTip();
    root.classList.toggle('hi', fancy());
    root.hidden = false; root.classList.add('live'); S.open = true; SB.countryPortal.settled = false;
    if(!wasOpen) setInert(true);
    loadMap(k);
    bgStart();
    if(o.instant || wasOpen || reduced() || typeof panel.animate !== 'function'){
      panel.classList.remove('drawn');
      if(reduced() && !o.instant && !wasOpen && typeof panel.animate === 'function'){
        S.phase = 'opening';
        S.anims.push(panel.animate([{opacity:0}, {opacity:1}], {duration:200, fill:'both'}), scrim.animate([{opacity:0}, {opacity:1}], {duration:200, fill:'both'}));
        later(220, settle);
      }else settle();
      return true;
    }
    panel.classList.remove('s1', 's2', 's3', 'drawn'); root.classList.remove('on');
    S.phase = 'opening';
    animOpen();
    return true;
  }
  function close(o = {}){
    if(!S.open) return Promise.resolve();
    if(S.phase === 'closing' && !o.instant) return S.closeP || Promise.resolve();
    clearAnims();
    S.closeP = new Promise(res => { S.closeRes = res; });
    const p = S.closeP;
    hideTip(); bgStop();
    if(S.dragOut){ finishClose(); return p; }          // v1.11.1：已经下拉滑出，不再播放裂隙合拢
    if(o.instant || reduced() || typeof panel.animate !== 'function'){
      if(reduced() && !o.instant && typeof panel.animate === 'function'){
        S.phase = 'closing'; root.classList.remove('on');
        S.anims.push(panel.animate([{opacity:1}, {opacity:0}], {duration:180, fill:'both'}), scrim.animate([{opacity:1}, {opacity:0}], {duration:180, fill:'both'}));
        later(200, finishClose);
      }else finishClose();
      return p;
    }
    S.phase = 'closing'; root.classList.remove('on');
    panel.classList.remove('s3'); later(120, () => panel.classList.remove('s1', 's2'));
    animClose();
    return p;
  }
  function finishClose(){
    clearAnims();
    S.open = false; S.phase = ''; S.k = null; S.sel = null; S.token++;
    root.hidden = true; root.classList.remove('live', 'on'); panel.classList.remove('s1', 's2', 's3', 'drawn');
    S.dragOut = false; dg = null; panel.style.transform = panel.style.transition = ''; scrim.style.opacity = scrim.style.transition = '';
    SB.countryPortal.settled = false;
    setInert(false);
    const ret = S.ret; S.ret = null;
    if(ret && document.contains(ret) && !ret.closest('[inert]')) try{ ret.focus({preventScroll:true}); }catch(_){}
    const res = S.closeRes; S.closeRes = null; S.closeP = null; res?.();
  }

  /* ── v1.11.1 手机抽屉下拉关闭（prompts/09-country-map.md 9.1；阈值参考 smooth_sheets：位移 30% / 甩动 2 倍视口高度每秒） ── */
  const sheetMQ = matchMedia('(max-width:720px)'), head = panel.querySelector('.cp-head');
  let dg = null;
  const easeMs = ms => reduced() ? 0 : ms;
  function snapBack(){
    const ms = easeMs(240);
    panel.style.transition = ms ? `transform ${ms}ms var(--ease-soft)` : 'none'; scrim.style.transition = ms ? `opacity ${ms}ms` : 'none';
    panel.style.transform = ''; scrim.style.opacity = '';
    setTimeout(() => { if(!dg && !S.dragOut){ panel.style.transition = ''; scrim.style.transition = ''; } }, ms + 30);
  }
  function dismissByDrag(dy, h){
    S.dragOut = true;
    const ms = easeMs(200);
    panel.style.transition = ms ? `transform ${ms}ms cubic-bezier(.4,0,1,1)` : 'none'; scrim.style.transition = ms ? `opacity ${ms}ms` : 'none';
    panel.style.transform = `translateY(${Math.round(h + 40)}px)`; scrim.style.opacity = '0';
    setTimeout(() => { if(S.open && S.dragOut) requestClose(); }, ms + 20);
  }
  head.addEventListener('pointerdown', e => {
    if(!sheetMQ.matches || !S.open || S.phase !== 'idle' || (e.button && e.pointerType === 'mouse') || e.target.closest('button')) return;
    dg = {id:e.pointerId, x0:e.clientX, y0:e.clientY, dy:0, on:false, h:panel.offsetHeight, pts:[{y:e.clientY, t:e.timeStamp}]};
    try{ head.setPointerCapture(e.pointerId); }catch(_){}
  });
  head.addEventListener('pointermove', e => {
    if(!dg || e.pointerId !== dg.id) return;
    const dx = e.clientX - dg.x0, dy = e.clientY - dg.y0;
    if(!dg.on){
      if(Math.hypot(dx, dy) < 8) return;
      if(Math.abs(dx) > Math.abs(dy) || dy < 0){ dg = null; return; }      // 横向或向上：不是下拉
      dg.on = true; panel.style.transition = 'none'; scrim.style.transition = 'none';
    }
    dg.dy = Math.max(0, dy);
    panel.style.transform = `translateY(${dg.dy.toFixed(1)}px)`;
    scrim.style.opacity = (1 - Math.min(1, dg.dy/dg.h)).toFixed(3);
    dg.pts.push({y:e.clientY, t:e.timeStamp}); if(dg.pts.length > 6) dg.pts.shift();
  });
  const dragEnd = e => {
    if(!dg || (e && e.pointerId != null && e.pointerId !== dg.id)) return;
    const d = dg; dg = null; if(!d.on) return;
    const a = d.pts[0], b = d.pts[d.pts.length - 1], v = b.t > a.t ? (b.y - a.y)/(b.t - a.t) : 0;   // px/ms
    const fling = v*1000 >= 2*innerHeight && d.dy > 24;
    if(e?.type !== 'pointercancel' && (d.dy > d.h*.3 || fling)) dismissByDrag(d.dy, d.h); else snapBack();
  };
  head.addEventListener('pointerup', dragEnd); head.addEventListener('pointercancel', dragEnd);
  head.addEventListener('lostpointercapture', e => { if(dg && e.pointerId === dg.id) dragEnd({type:'pointerup', pointerId:e.pointerId}); });
  addEventListener('pointerup', dragEnd); addEventListener('pointercancel', dragEnd);
  addEventListener('blur', () => { if(dg){ const on = dg.on; dg = null; if(on) snapBack(); } });
  // 静置降耗：记录面板内最近一次操作
  ['pointerdown', 'pointermove', 'wheel', 'keydown', 'scroll'].forEach(t => root.addEventListener(t, () => { S.act = performance.now(); }, {passive:true, capture:true}));

  /* ── 关闭入口：全部走 SB.scenes.back()（历史、返回光球、系统返回键一致） ── */
  const requestClose = () => { if(S.open && S.phase !== 'closing' && SB.scenes.current === 'globe') SB.scenes.back(); };
  $('cp-x').addEventListener('click', requestClose);
  scrim.addEventListener('click', requestClose);
  document.addEventListener('keydown', e => {
    if(!S.open || SB.scenes.current !== 'globe') return;
    if(document.querySelector('.sb-modal') || document.getElementById('sb-nav')?.classList.contains('open')) return;
    if(e.key === 'Escape'){ e.preventDefault(); requestClose(); return; }
    if(e.key === 'Tab'){        // WAI-ARIA APG：Tab 在面板内循环
      const f = [...panel.querySelectorAll('button:not([disabled]):not([hidden]),[href],select,input,[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
      if(!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if(e.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && (document.activeElement === last || !panel.contains(document.activeElement))){ e.preventDefault(); first.focus(); }
    }
  });
  let rzT = 0;
  addEventListener('resize', () => { if(!S.open) return; clearTimeout(rzT); rzT = setTimeout(() => { draw(); if(BG.on){ BG.on = false; bgStart(); } }, 120); });
  document.addEventListener('sb:data', () => { if(S.open && S.regions.length){ paint(); buildList(); } });

  SB.countryPortal = {
    open, close, settled:false,
    get isOpen(){ return S.open && S.phase !== 'closing'; },
    get key(){ return S.open ? S.k : null; },
    get phase(){ return S.phase; }
  };
  // 调试 / 截图用（v1.11.1 移到 SB.debug）：冻结展开或合拢动画在第 t 毫秒（停止后续阶段计时）；resume() 继续
  SB.debug.add('portal', {
    freeze(t){ S.timers.forEach(clearTimeout); S.timers = []; S.anims.forEach(a => { a.pause(); a.currentTime = t; }); return S.anims.length; },
    resume(){ S.anims.forEach(a => a.play()); if(S.phase === 'opening') later(1200, settle); else if(S.phase === 'closing') later(800, finishClose); }
  });
})(window.SB);
</script>
