<style>
/* ── 块 11 · v1.7.0 「光影放映」多图编排放映 + 三种放映风格 + 四季主题 + 背景音乐 ──
   放映厅（海报 + 风格 / 季节 + 放映按钮）→ 开场（熄灯、墨滴入水、扉页）→ 导演时间线（多图接力、转场库、风格字幕）→ 终章。
   一个时钟驱动所有画面：暂停 = 停止时钟；任何时刻都可以 seek。 */
.sb-scene[data-scene="player"]{background:#04030a;--bar:0px;}
.pl-ambient{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(38px) brightness(.38) saturate(1.15);
  transform:scale(1.08);animation:plBreath 14s ease-in-out infinite alternate;transition:opacity 1.2s var(--ease-soft);}
@keyframes plBreath{from{transform:scale(1.08)}to{transform:scale(1.16)}}
html[data-sb-perf="low"] .pl-ambient{filter:blur(20px) brightness(.36) saturate(1.08);animation:none;transform:scale(1.1);}
html[data-sb-perf="low"] .pl-poster::after{animation:none;opacity:.35;}
.sb-scene[data-scene="player"].showing .pl-ambient{opacity:0;}

/* ── 放映厅 ── */
.pl-lobby{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:clamp(12px,2.2vh,22px);
  padding:calc(64px + var(--safe-t)) max(18px,var(--safe-r)) calc(28px + var(--safe-b)) max(18px,var(--safe-l));text-align:center;
  transition:opacity .8s var(--ease-soft), transform 1s var(--ease-soft), filter .8s var(--ease-soft);}
.sb-scene[data-scene="player"].showing .pl-lobby{opacity:0;transform:scale(.96);filter:blur(6px);pointer-events:none;}
.pl-poster{position:relative;width:min(260px,58vw,24vh);aspect-ratio:4/5;flex:none;border-radius:6px;overflow:hidden;background:#151230;
  box-shadow:0 0 0 1px rgba(255,226,168,.7),0 0 0 7px rgba(16,10,6,.75),0 0 0 8px rgba(244,184,96,.45),0 30px 70px rgba(0,0,0,.65),0 0 60px rgba(244,184,96,.2);
  animation:plPosterIn 1.2s var(--ease-soft) backwards;}
.pl-poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s;}
.pl-poster img.ok{opacity:1;}
.pl-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,240,210,.16) 50%,transparent 60%);
  transform:translateX(-70%);animation:plSheen 7s ease-in-out 1.2s infinite;}
@keyframes plSheen{0%,55%{transform:translateX(-70%)}85%,100%{transform:translateX(70%)}}
@keyframes plPosterIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px)}}
.pl-meta{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(760px,100%);animation:plPosterIn 1.2s var(--ease-soft) .15s backwards;}
.pl-meta small:empty{display:none;}
.pl-meta small{font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.24em;padding-left:.24em;color:var(--gold);}
.pl-meta h1{margin:0;font-size:clamp(22px,3.4vw,36px);letter-spacing:.12em;padding-left:.12em;line-height:1.35;}
.pl-meta .place{margin:0;font-size:13px;letter-spacing:.2em;padding-left:.2em;color:var(--text-dim);}
.pl-meta .stat{margin:0;font-size:13px;letter-spacing:.08em;color:#c9c0e6;display:flex;gap:10px;align-items:center;}
.pl-meta .stat i{width:3px;height:3px;border-radius:50%;background:var(--gold-dim);}
.pl-opts{display:flex;flex-direction:column;gap:8px;align-items:center;animation:plPosterIn 1.2s var(--ease-soft) .22s backwards;}
.pl-opt-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;}
.pl-opt-row > span{font-family:var(--f-rune);font-size:10px;letter-spacing:.4em;color:var(--gold-dim);margin-right:4px;}
.pl-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid rgba(244,184,96,.28);
  background:rgba(10,8,24,.5);color:var(--text-dim);font-family:var(--f-display);font-weight:var(--fw-display);font-size:13.5px;letter-spacing:.1em;cursor:pointer;
  transition:color .3s, border-color .3s, background .3s, box-shadow .3s;-webkit-tap-highlight-color:transparent;}
.pl-chip .sb-ico{width:15px;height:15px;}
.pl-chip:hover{color:var(--gold-hi);border-color:rgba(255,226,168,.6);}
.pl-chip.on{color:#2a1608;border-color:transparent;background:linear-gradient(180deg,#ffe7b5,#f4b860 60%,#d0913e);box-shadow:0 0 16px rgba(244,184,96,.4);}
@media (pointer:coarse){ .pl-chip{min-height:38px;} }
.pl-start{position:relative;width:112px;height:112px;flex:none;border:0;border-radius:50%;cursor:pointer;background:none;color:#2a1608;
  display:grid;place-items:center;animation:plPosterIn 1.2s var(--ease-soft) .3s backwards;-webkit-tap-highlight-color:transparent;}
.pl-start .ring{position:absolute;inset:0;width:100%;height:100%;animation:sbSpin 40s linear infinite;color:var(--gold);filter:drop-shadow(0 0 6px rgba(244,184,96,.6));}
.pl-start .core{position:relative;width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 35% 30%,#fff3d1,#f4b860 55%,#b8762c);box-shadow:0 0 30px rgba(244,184,96,.55),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .35s var(--ease-soft), box-shadow .35s;}
.pl-start .core svg{width:22px;height:22px;margin-left:3px;}
.pl-start .core span{font-family:var(--f-display);font-weight:var(--fw-display);font-size:13px;letter-spacing:.3em;padding-left:.3em;line-height:1;}
.pl-start::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(244,184,96,.28),transparent 68%);
  animation:plPulse 3.2s ease-in-out infinite;}
@keyframes plPulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.pl-start:hover .core,.pl-start:focus-visible .core{transform:scale(1.06);box-shadow:0 0 46px rgba(244,184,96,.85),inset 0 1px 0 rgba(255,255,255,.7);}
.pl-start[disabled]{opacity:.45;pointer-events:none;}
.pl-lobby-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:plPosterIn 1.2s var(--ease-soft) .45s backwards;}
.pl-lobby-acts .sb-btn{background:rgba(10,10,28,.55);}
.pl-wait{font-size:13px;letter-spacing:.14em;color:var(--text-dim);min-height:1.4em;}
@media (max-width:600px){
  .pl-lobby{gap:clamp(10px,1.6vh,16px);padding-top:calc(58px + var(--safe-t));}
  .pl-poster{width:min(220px,54vw,30vh);}
  .pl-start{width:100px;height:100px;} .pl-start .core{width:66px;height:66px;}
}

/* ── 银幕与舞台 ── */
.pl-screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .9s var(--ease-soft);}
.sb-scene[data-scene="player"].showing .pl-screen{opacity:1;pointer-events:auto;}
.pl-frame{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--bar);overflow:hidden;}
.pl-stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;z-index:0;transition:filter 1.4s var(--ease-soft);}
.pl-stage[data-style="constellation"]{background:radial-gradient(90% 70% at 70% 20%,rgba(70,52,130,.35),transparent 70%),radial-gradient(80% 60% at 15% 85%,rgba(120,60,90,.22),transparent 70%),linear-gradient(180deg,#07061a,#0b0920 60%,#06050f);}
.pl-stage[data-style="journal"]{background:#160e09;}
.pl-sky,.pl-season,.pl-dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.pl-desk{position:absolute;inset:-4%;pointer-events:none;
  background:radial-gradient(60% 55% at 22% 8%,rgba(255,190,110,.32),transparent 70%),radial-gradient(70% 60% at 85% 100%,rgba(120,60,30,.25),transparent 70%),
    repeating-linear-gradient(97deg,rgba(255,220,180,.025) 0 2px,transparent 2px 9px),linear-gradient(160deg,#2a1a10,#1a100a 55%,#0f0906);}
.pl-desk::after{content:"";position:absolute;inset:0;background:radial-gradient(55% 50% at 25% 12%,rgba(255,200,120,.22),transparent 70%);animation:plCandle 5.3s ease-in-out infinite;}
@keyframes plCandle{0%,100%{opacity:.85}17%{opacity:1}31%{opacity:.78}52%{opacity:.95}68%{opacity:.82}83%{opacity:1}}
.pl-cam{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;}
.pl-flat{position:absolute;inset:0;}

/* 照片元素 */
.pl-ph{position:absolute;left:0;top:0;contain:layout paint style;will-change:transform,opacity;backface-visibility:hidden;}
.pl-ph .im{position:absolute;inset:0;overflow:hidden;}
.pl-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 45%;will-change:transform;}
.pl-ph.fill .im img{filter:blur(28px) brightness(.4) saturate(1.2);transform:scale(1.15);}
.pl-ph.fill.lite .im img{filter:brightness(.3);}
.pl-ph.gilt .im{border-radius:2px;}
.pl-ph.gilt{box-shadow:0 0 0 1px rgba(255,226,168,.8),0 0 0 6px rgba(14,10,22,.85),0 0 0 7px rgba(244,184,96,.5),0 26px 60px rgba(0,0,0,.6),0 0 46px rgba(244,184,96,.16);border-radius:2px;}
.pl-ph.framed{box-shadow:0 0 0 1px rgba(255,226,168,.75),0 0 0 8px rgba(18,12,8,.7),0 0 0 9px rgba(244,184,96,.42),0 34px 80px rgba(0,0,0,.7);}
.pl-ph.print{background:linear-gradient(170deg,#f6efe2,#e9dfcc);border-radius:2px;}
.pl-ph.print .im{box-shadow:inset 0 0 0 1px rgba(60,40,20,.18);}
.pl-ph.print::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none;}
.pl-ph .seal{position:absolute;width:13%;aspect-ratio:1;right:-3%;top:-3%;border-radius:50%;display:grid;place-items:center;color:#5a2d0c;
  background:radial-gradient(circle at 35% 30%,#ffe2a0,#e0a04a 55%,#a8631f);box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);}
.pl-ph .seal .sb-ico{width:58%;height:58%;}
.pl-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.pl-lines line{stroke:rgba(255,226,168,.85);stroke-width:1;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(244,184,96,.9));}
.pl-leak{position:absolute;left:-60%;top:0;bottom:0;width:220%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(40% 70% at 30% 50%,rgba(255,170,80,.7),transparent 70%),radial-gradient(28% 60% at 52% 40%,rgba(255,226,160,.5),transparent 70%),
    radial-gradient(30% 80% at 70% 60%,rgba(255,120,60,.32),transparent 70%);}

/* 四季调色层 */
.pl-grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;transition:opacity 1.4s var(--ease-soft), background-color 1.4s;}
.pl-tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s var(--ease-soft);}
.pl-rays{position:absolute;right:-30%;top:-45%;width:110%;aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity 1.6s var(--ease-soft);mix-blend-mode:screen;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,236,180,.16) 0deg 4deg,transparent 4deg 13deg);
  -webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent);}
.pl-tint[data-s="spring"]{background:radial-gradient(80% 50% at 50% 0%,rgba(255,200,220,.28),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(255,170,200,.18),transparent 70%);}
.pl-tint[data-s="summer"]{background:radial-gradient(55% 45% at 92% 0%,rgba(255,236,170,.42),transparent 70%),linear-gradient(0deg,rgba(255,170,90,.10),transparent 40%);}
.pl-tint[data-s="autumn"]{background:radial-gradient(90% 60% at 50% 110%,rgba(200,80,20,.32),transparent 70%),radial-gradient(60% 40% at 100% 0%,rgba(255,170,80,.18),transparent 70%);}
.pl-tint[data-s="winter"]{background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(200,225,255,.30)),linear-gradient(180deg,rgba(190,215,255,.16),transparent 35%);}

/* 文字层 */
.pl-texts{position:absolute;inset:0;pointer-events:none;}
.pl-tx{position:absolute;left:0;top:0;pointer-events:none;z-index:900;}
.pl-tx span{display:inline-block;white-space:pre;}
.pl-tx.cinema{font-family:var(--f-display);font-weight:600;color:#fff6e6;text-align:center;line-height:1.5;
  text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 26px rgba(0,0,0,.55),0 0 30px rgba(244,184,96,.25);}
.pl-tx.cinema .ln{display:block;white-space:nowrap;}
.pl-tx.cinema .rule{display:block;height:1px;margin:.45em auto 0;width:min(46%,320px);background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);transform:scaleX(0);}
.pl-tx.cinema.v{writing-mode:vertical-rl;text-orientation:upright;line-height:1.2;}
.pl-tx.cinema.v .rule{width:1px;height:3.2em;margin:0 .5em 0 0;background:linear-gradient(180deg,transparent,var(--gold-hi),transparent);transform:scaleY(0);}
.pl-scrim{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;opacity:0;background:linear-gradient(transparent,rgba(4,3,10,.62));transition:opacity .8s;}
.pl-tx.editorial{font-family:var(--f-display);font-weight:600;color:#fff3dc;text-align:left;line-height:1.55;text-shadow:0 2px 10px rgba(0,0,0,.75);}
.pl-tx.editorial .idx{display:block;font-family:var(--f-num);font-weight:600;font-size:2.2em;line-height:1;letter-spacing:.06em;color:transparent;
  -webkit-text-stroke:1px rgba(255,226,168,.85);text-shadow:0 0 18px rgba(244,184,96,.35);margin-bottom:.12em;}
.pl-tx.editorial .rule{display:block;height:1px;width:4.2em;margin:.2em 0 .5em;background:linear-gradient(90deg,var(--gold-hi),transparent);transform-origin:0 50%;transform:scaleX(0);}
.pl-tx.editorial .ln{display:block;overflow:hidden;padding:.06em 0;}
.pl-tx.editorial .ln > b{display:block;font-weight:inherit;white-space:nowrap;}
.pl-tx.editorial.c{text-align:center;} .pl-tx.editorial.c .rule{margin-left:auto;margin-right:auto;transform-origin:50% 50%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);}
.pl-tx.ink{font-family:var(--f-display);font-weight:600;color:#e8b868;line-height:1.6;text-shadow:0 1px 0 rgba(40,20,5,.8),0 0 12px rgba(244,184,96,.25);}
.pl-tx.ink .ln{display:block;white-space:nowrap;}
.pl-tx.ink.c{text-align:center;}

/* 扉页 + 墨滴涟漪 */
.pl-title{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:0 max(22px,var(--safe-l));text-align:center;pointer-events:none;}
.pl-ripples{position:absolute;left:50%;top:50%;width:0;height:0;}
.pl-ripples i{position:absolute;left:0;top:0;width:60vmin;height:60vmin;margin:-30vmin 0 0 -30vmin;border-radius:50%;opacity:0;
  border:1px solid rgba(255,226,168,.7);box-shadow:0 0 18px rgba(244,184,96,.45), inset 0 0 18px rgba(244,184,96,.25);}
.pl-ripples b{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff3d6;opacity:0;
  box-shadow:0 0 14px 6px rgba(255,214,150,.9), 0 0 40px 14px rgba(244,184,96,.5);}
.pl-title small:empty{display:none;}
.pl-title small{font-family:var(--f-num);font-weight:600;font-size:17px;letter-spacing:.3em;padding-left:.3em;color:var(--gold);}
.pl-title h2{margin:0;font-size:clamp(30px,5.6vw,64px);letter-spacing:.14em;padding-left:.14em;line-height:1.35;max-width:16em;}
.pl-title h2 .pl-nb{white-space:nowrap;font-weight:inherit;}
.pl-title h2 span{display:inline-block;white-space:pre;color:var(--gold-hi);text-shadow:0 0 24px rgba(244,184,96,.55),0 1px 0 rgba(60,30,8,.6);}
.pl-title .rule{width:min(360px,62vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);}
.pl-title p{margin:0;max-width:24em;font-size:clamp(16px,1.9vw,21px);line-height:1.9;letter-spacing:.08em;color:#eadfc8;}

/* 终章 */
.pl-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;padding:0 20px;}
.pl-end .st{width:22px;height:22px;color:var(--gold-hi);filter:drop-shadow(0 0 10px rgba(255,214,150,.9));}
.pl-end .fin{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,8vw,84px);letter-spacing:.3em;padding-left:.3em;line-height:1.2;}
.pl-end .finis{font-family:var(--f-rune);font-weight:500;font-size:13px;letter-spacing:.6em;padding-left:.6em;color:var(--gold);}
.pl-end .meta{font-size:13.5px;letter-spacing:.16em;padding-left:.16em;color:var(--text-dim);}
.pl-end .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.pl-end .acts.on{pointer-events:auto;}

/* 质感 */
.pl-grain{position:absolute;inset:-50px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:160px 160px;animation:plGrain .9s steps(6) infinite;}
.pl-grain.off{display:none;}
@keyframes plGrain{0%{transform:translate(0,0)}20%{transform:translate(-30px,18px)}40%{transform:translate(22px,-26px)}60%{transform:translate(-14px,-34px)}80%{transform:translate(34px,12px)}100%{transform:translate(0,0)}}
.pl-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 48%,transparent 58%,rgba(0,0,0,.62));}
.pl-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fffaf0,#ffe6b8 45%,#f4c27a);}
.pl-cut{position:absolute;inset:0;pointer-events:none;background:#04030a;opacity:0;}
.pl-cut.go{animation:plCut .5s var(--ease-soft);}
@keyframes plCut{from{opacity:.92}to{opacity:0}}
.pl-flicker{animation:plFlicker .32s steps(4) 1;}
@keyframes plFlicker{0%{opacity:.75}25%{opacity:1}50%{opacity:.85}100%{opacity:1}}
.pl-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* 银幕黑边 */
.pl-bar{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:2;pointer-events:none;transition:transform 1s var(--ease-soft);}
.pl-bar.t{top:0;transform:translateY(-101%);} .pl-bar.b{bottom:0;transform:translateY(101%);}
.sb-scene[data-scene="player"].showing .pl-bar{transform:none;}

/* 控制 */
.pl-ui{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;gap:12px;
  padding:16px max(16px,var(--safe-r)) calc(14px + var(--safe-b)) max(16px,var(--safe-l));
  background:linear-gradient(transparent,rgba(0,0,0,.66));opacity:0;pointer-events:none;transition:opacity .5s;}
.pl-top{position:absolute;top:calc(14px + var(--safe-t));right:max(14px,var(--safe-r));z-index:4;display:flex;gap:8px;transition:opacity .5s;}
.pl-top .sb-btn{background:rgba(10,10,28,.6);}
.pl-count{position:absolute;top:calc(24px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:4;font-family:var(--f-num);font-weight:600;font-size:15px;
  letter-spacing:.24em;color:var(--gold);opacity:0;transition:opacity .5s;pointer-events:none;}
.sb-scene[data-scene="player"].showing.awake .pl-ui{opacity:1;pointer-events:auto;}
.sb-scene[data-scene="player"].showing.awake .pl-count{opacity:1;}
@media (max-width:600px){ .pl-count{display:none;} }
.sb-scene[data-scene="player"]:not(.showing) .pl-top{display:none;}
.sb-scene[data-scene="player"].showing:not(.awake) .pl-top{opacity:0;pointer-events:none;}
.sb-scene[data-scene="player"].showing:not(.awake){cursor:none;}
.pl-bars{display:flex;gap:4px;}
.pl-bars b{position:relative;flex:1;height:14px;cursor:pointer;}
.pl-bars b::before{content:"";position:absolute;left:0;right:0;top:5.5px;height:3px;border-radius:2px;background:rgba(255,226,168,.22);}
.pl-bars b i{position:absolute;left:0;top:5.5px;height:3px;width:0;border-radius:2px;background:linear-gradient(90deg,#f4b860,#fff1cc);box-shadow:0 0 8px #f4b860;}
.pl-bars b.t{flex:.6;}
.pl-ctl{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;}
.pl-ctl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,28,.6);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;font-size:20px;}
.pl-ctl button:hover{box-shadow:0 0 16px rgba(244,184,96,.45);}
.pl-ctl button.big{width:58px;height:58px;font-size:22px;}
.pl-ctl button.off{opacity:.45;}
.pl-seasons{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,8px);display:flex;gap:6px;padding:8px;border-radius:999px;

<script>
/* ── 背景音乐 SB.audio：全站一个播放器，切换时淡入淡出；duck() 平滑压低 ── */
(function(SB){
  const el = new Audio(); el.loop = true; el.preload = 'auto';
  const BASE = .8;
  let want = true, unlocked = false, cur = null, override = null, fadeT = 0, gain = 1;
  try{ want = localStorage.getItem('sb-music') !== 'off'; }catch(e){}
  function fade(to, ms){
    cancelAnimationFrame(fadeT);
    return new Promise(res => { const from = el.volume, t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0)/ms); el.volume = SB.clamp(from + (to - from)*k, 0, 1); k < 1 ? fadeT = requestAnimationFrame(step) : res(); };
      fadeT = requestAnimationFrame(step); });
  }
  async function sync(){
    const track = override === undefined ? null : (override || SB.store.settings?.bgm || null);
    const id = track?.id || null;
    if(!want || !unlocked || !id){ if(!el.paused){ await fade(0, 900); el.pause(); } cur = id ? track : cur; SB.dock?.sync(); return; }
    if(cur?.id !== id || el.paused){
      if(!el.paused) await fade(0, 900);
      if(cur?.id !== id || !el.src){ el.src = SB.store.url(id); }
      cur = track; el.volume = 0;
      try{ await el.play(); await fade(BASE*gain, 1400); }catch(e){}
    }
    SB.dock?.sync();
  }
  SB.audio = {
    unlock(){ if(unlocked) return; unlocked = true; sync(); },
    set(track){ override = track; gain = 1; sync(); },          // 放映时：专属曲目 / null 表示用全站曲目 / undefined 表示静音
    clear(){ override = null; gain = 1; sync(); },
    duck(level = 1, ms = 1200){ gain = SB.clamp(level, 0, 1); if(!el.paused) fade(BASE*gain, ms); },   // 终章时把音量平滑压低，duck(1) 恢复
    toggle(){ want = !want; try{ localStorage.setItem('sb-music', want ? 'on' : 'off'); }catch(e){} unlocked = true; sync(); return want; },
    get on(){ return want; }, get playing(){ return !el.paused; }, get track(){ return cur; },
    preview(id){ const a = new Audio(SB.store.url(id)); a.volume = .8; return a; }
  };
  document.addEventListener('pointerdown', () => SB.audio.unlock(), {once:true});
  document.addEventListener('sb:data', () => { if(override === null) sync(); });

  /* v1.8.1：背景音乐从菜单移到右上角「音乐」标识（SB.dock）；全站音乐的试听 / 上传 / 更换 / 移除也从总览页迁移到这里 */
  let previewA = null;
  SB.dock.add({id:'music', order:10, label:'背景音乐', eq:true,
    icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.2V6.3l10-2v10.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="6.8" cy="17.3" r="2.3" fill="currentColor"/><circle cx="16.8" cy="15.2" r="2.3" fill="currentColor"/></svg>',
    state(b){ b.classList.toggle('playing', SB.audio.playing); },
    render(p){
      p.innerHTML = '<h4>背景音乐</h4><p class="rn">CANTUS · STELLARUM</p>';
      const row = SB.el('div', 'row'); const lb = SB.el('span', 'lb'); lb.textContent = SB.audio.on ? '音乐已开启' : '音乐已关闭'; row.appendChild(lb);
      const sw = SB.el('button', 'sb-switch'); sw.type = 'button'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', String(SB.audio.on)); sw.setAttribute('aria-label', '背景音乐开关');
      sw.addEventListener('click', () => { SB.audio.toggle(); SB.dock.refresh('music'); });
      row.appendChild(sw); p.appendChild(row);
      const bgm = SB.store.settings?.bgm, now = SB.audio.track?.name;
      const info = SB.el('p', 'sm'); info.style.margin = '6px 0 0';
      info.textContent = now ? (SB.audio.playing ? '♪ 正在播放：' : '♪ ') + now : bgm ? '♪ 全站音乐：' + bgm.name : '还没有全站背景音乐' + (SB.store.canEdit ? '，上传一首属于你们的歌吧' : '');
      p.appendChild(info);
      const acts = SB.el('div', 'acts');
      if(bgm) acts.appendChild(SB.ui.button(previewA && !previewA.paused ? '停止试听' : '试听', 'small', () => {
        if(previewA && !previewA.paused){ previewA.pause(); } else { previewA = SB.audio.preview(bgm.id); previewA.play().catch(()=>{}); previewA.onended = () => SB.dock.refresh('music'); }
        SB.dock.refresh('music'); }));
      if(SB.store.canEdit && SB.store.canUpload){
        const up = SB.el('label', 'sb-btn small primary'); up.style.position = 'relative'; up.textContent = bgm ? '换一首' : '上传音乐';
        const inp = SB.el('input'); inp.type = 'file'; inp.accept = 'audio/*,.mp3,.m4a,.aac,.wav,.mp4'; inp.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer';
        inp.setAttribute('aria-label', '选择音乐文件');
        inp.addEventListener('change', async () => {
          const f = inp.files[0]; if(!f) return; inp.value = '';
          try{ const r = await SB.store.uploadAudio(f, step => { info.textContent = step; });
            const old = SB.store.settings?.bgm?.id;
            await SB.store.saveSettings({bgm:r});
            if(old && !SB.store.memories.some(m => m.bgm?.id === old)) SB.store.deleteFile(old);
            SB.toast('全站背景音乐已更新'); SB.audio.unlock(); SB.dock.refresh('music');
          }catch(e){ SB.toast(e.msg || SB.store.errText(e), 4200); SB.dock.refresh('music'); }
        });
        up.appendChild(inp); acts.appendChild(up);
        if(bgm) acts.appendChild(SB.ui.button('移除', 'small danger', async () => {
          SB.dock.close();
          if(!await SB.ui.confirm('移除全站背景音乐？', '移除')) return;
          try{ await SB.store.saveSettings({bgm:null}); if(!SB.store.memories.some(m => m.bgm?.id === bgm.id)) SB.store.deleteFile(bgm.id); }catch(e){ SB.toast(SB.store.errText(e)); }
        }));
      }
      if(acts.children.length) p.appendChild(acts);
    }});
  el.addEventListener('play', () => SB.dock.sync()); el.addEventListener('pause', () => SB.dock.sync());
  document.addEventListener('sb:data', () => SB.dock.refresh('music'));
})(window.SB);

/* ── 放映风格与季节的公共定义（编辑器也使用）：SB.cinema ── */
(function(SB){
  const svg = (inner, cls) => `<svg class="sb-ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${inner}</svg>`;
  const S = 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    cinema:`<rect x="3" y="5" width="18" height="14" rx="1.5" ${S}/><path d="M12 5v14M3 9h3M3 15h3M18 9h3M18 15h3" ${S}/>`,
    constellation:`<path d="M5 17 10 8l5 5 4-8" ${S} stroke-width="1.1" opacity=".75"/><circle cx="5" cy="17" r="1.8" fill="currentColor"/><circle cx="10" cy="8" r="1.6" fill="currentColor"/><circle cx="15" cy="13" r="1.8" fill="currentColor"/><circle cx="19" cy="5" r="1.4" fill="currentColor"/>`,
    journal:`<rect x="4.5" y="6.5" width="11" height="12" rx="1" transform="rotate(-8 10 12.5)" ${S}/><rect x="9" y="4.5" width="11" height="12" rx="1" transform="rotate(7 14.5 10.5)" ${S}/><path d="M11 18.5c2-1 4 .8 6-.2" ${S}/>`,
    auto:`<circle cx="12" cy="12" r="8.5" ${S}/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" opacity=".55"/>`,
    none:`<circle cx="12" cy="12" r="8" ${S}/><path d="M6.5 17.5 17.5 6.5" ${S}/>`,
    spring:`<g ${S}><circle cx="12" cy="7" r="3.1"/><circle cx="16.8" cy="10.5" r="3.1"/><circle cx="15" cy="16" r="3.1"/><circle cx="9" cy="16" r="3.1"/><circle cx="7.2" cy="10.5" r="3.1"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor"/>`,
    summer:`<circle cx="12" cy="12" r="4" ${S}/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" ${S}/>`,
    autumn:`<path d="M12 2.8l1.5 3.9 3-1.5-.7 3.5 3.6.4-2.6 2.7 2 2.1-3.6.6.3 3-2.8-1.7L12 21l-.7-5.2-2.8 1.7.3-3-3.6-.6 2-2.1-2.6-2.7 3.6-.4-.7-3.5 3 1.5Z" ${S}/><path d="M12 21v-9" ${S}/>`,
    winter:`<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.6 4.2 12 6.5l2.4-2.3M9.6 19.8 12 17.5l2.4 2.3M4.4 10.6l3.2.6-1 3.1M19.6 13.4l-3.2-.6 1-3.1M4.4 13.4l3.2-.6-1-3.1M19.6 10.6l-3.2.6 1 3.1" ${S} stroke-width="1.2"/>`
  };
  const styles = [
    {id:'cinema', name:'银幕', en:'CINEMA', desc:'电影蒙太奇：宽银幕、分屏拼接、光缝与百叶转场'},
    {id:'constellation', name:'星图', en:'CONSTELLATION', desc:'星河拼贴：烫金相框在星空里接力浮现，金线连成星座'},
    {id:'journal', name:'手札', en:'JOURNAL', desc:'魔法手札：相片逐张落在烛光书桌上，墨迹写下旁白'}
  ];
  const seasons = [
    {id:'auto', name:'按月份', en:'AUTO'}, {id:'none', name:'无', en:'NONE'},
    {id:'spring', name:'春', en:'SPRING', desc:'粉樱飘落，柔和的晨光'}, {id:'summer', name:'夏', en:'SUMMER', desc:'阳光光束与萤火，明亮温暖'},
    {id:'autumn', name:'秋', en:'AUTUMN', desc:'枫叶翻飞，琥珀色暖调'}, {id:'winter', name:'冬', en:'WINTER', desc:'雪花飘落，清冷的银蓝'}
  ];
  const styleOf = m => styles.some(s => s.id === m?.style) ? m.style : 'cinema';
  const seasonPref = m => seasons.some(s => s.id === m?.season) ? m.season : 'auto';
  function resolveSeason(pref, date){
    if(pref !== 'auto') return pref;
    const mo = parseInt(String(date || '').split('-')[1], 10);
    if(!mo) return 'none';
    return mo >= 3 && mo <= 5 ? 'spring' : mo >= 6 && mo <= 8 ? 'summer' : mo >= 9 && mo <= 11 ? 'autumn' : 'winter';
  }
  SB.cinema = { styles, seasons, styleOf, seasonPref, resolveSeason, icon:(id, cls) => svg(ICONS[id] || ICONS.none, cls) };
})(window.SB);

/* ── 「光影放映」 ── */
(function(SB){
  const $ = id => document.getElementById(id);
  const scene = document.querySelector('.sb-scene[data-scene="player"]');
  const clamp = SB.clamp, lerp = SB.lerp;
  const ease = x => .5 - .5*Math.cos(Math.PI*clamp(x, 0, 1));           // 正弦缓动
  const EO = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);                   // ease-out cubic
  const EO4 = x => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
  const EIC = x => { x = clamp(x, 0, 1); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
  const backOut = x => { x = clamp(x, 0, 1); const c1 = 1.2, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
  const ICON_PAUSE = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const ICON_PLAY = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg>';
  const CPS = 7, CUE_MIN = 2000, CUE_GAP = 250, END_EST = 4000, PRE = 1500;
  const BASE = {cinema:3400, constellation:3200, journal:3600};

  $('pl-prev').innerHTML = SB.icon('chevron'); $('pl-prev').querySelector('svg').style.transform = 'scaleX(-1)';
  $('pl-next').innerHTML = SB.icon('chevron'); $('pl-music').innerHTML = SB.icon('note');
  $('pl-e-star').innerHTML = SB.icon('spark');
  $('pl-buffer').appendChild(SB.ui.spinner('正在冲洗胶片…'));

  const P = { m:null, style:'cinema', seasonPref:'auto', season:'none', TL:null, T:0, playing:false, showing:false, raf:0, last:0, renderAt:0,
              W:0, H:0, bar:0, fw:0, fh:0, idleT:0, endShown:false, cur:0, liveKey:'', nodes:new Map() };
  const lite = () => SB.perf.level !== 'high';
  const reduced = () => SB.perf.level === 'reduced';
  const hash = (n, k = 1) => { const x = Math.sin(n*127.1 + k*311.7)*43758.5453; return x - Math.floor(x); };   // 固定伪随机：同一张照片每次都一样

  /* ── 质感资源 ── */
  const GRAIN = (function(){
    const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'); const d = g.createImageData(160, 160);
    for(let i = 0; i < d.data.length; i += 4){ const v = Math.random()*255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
    g.putImageData(d, 0, 0); return c.toDataURL('image/png');
  })();
  $('pl-grain').style.backgroundImage = `url(${GRAIN})`;
  const INK = (function(){
    const s = 256, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
    const gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s*.34); gr.addColorStop(0, '#fff'); gr.addColorStop(.8, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s); g.filter = 'blur(3px)'; g.fillStyle = '#fff';
    for(let i = 0; i < 38; i++){ const a = Math.random()*Math.PI*2, r = s*(.22 + Math.random()*.14), rr = s*(.03 + Math.random()*.06);
      g.beginPath(); g.arc(s/2 + Math.cos(a)*r, s/2 + Math.sin(a)*r, rr, 0, Math.PI*2); g.fill(); }
    return `url(${c.toDataURL('image/png')})`;
  })();

  /* ── 文字工具 ── */
  const len = t => [...String(t || '')].length;
  const PUN = '，、；：,; ';
  /* 按标点切成若干条，每条不超过 max 字 */
  function splitCues(text, max){
    text = String(text || '').replace(/\s+/g, ' ').trim(); if(!text) return [];
    const clauses = text.match(/[^，。！？；、,.!?;…]+[，。！？；、,.!?;…]*/g) || [text];
    const out = []; let buf = '';
    for(let c of clauses){
      c = c.trim(); if(!c) continue;
      while(len(c) > max){ const a = [...c]; if(buf){ out.push(buf); buf = ''; } out.push(a.slice(0, max).join('')); c = a.slice(max).join(''); }
      if(len(buf + c) <= max) buf += c; else { if(buf) out.push(buf); buf = c; }
    }
    if(buf) out.push(buf);
    return out.map(s => s.replace(/[，。、；,.;]+$/, '')).filter(Boolean);
  }
  /* 断行：每行不超过 per 字；两行时上短下长，优先在标点处断 */
  function wrap(text, per){
    const a = [...text]; if(a.length <= per) return [text];
    const n = Math.ceil(a.length/per);
    if(n === 2){
      const lo = Math.max(1, a.length - per), hi = Math.min(per, a.length - 1), mid = a.length/2;
      let cut = -1, best = 1e9;
      for(let k = lo; k <= hi; k++) if(PUN.includes(a[k-1]) && Math.abs(k - mid) < best){ best = Math.abs(k - mid); cut = k; }
      if(cut < 0) cut = clamp(Math.floor(mid), lo, hi);
      return [a.slice(0, cut).join('').replace(/[，、；,;\s]+$/, ''), a.slice(cut).join('').trim()];
    }
    const out = []; let i = 0; const even = Math.ceil(a.length/n);
    while(i < a.length){ let j = Math.min(a.length, i + even);
      for(let k = j; k > i + even - 4 && k < a.length; k--) if(PUN.includes(a[k-1])){ j = k; break; }
      out.push(a.slice(i, j).join('').trim()); i = j; }
    return out.filter(Boolean);
  }
  const cueDur = t => Math.max(CUE_MIN, len(t)/CPS*1000 + 700);
  function placeOf(m){
    const c = SB.store.city?.(m.cityId);
    return c ? [c.countryName, c.regionName, c.name].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(' · ') : '';
  }
  const fmtDur = ms => { const s = Math.round(ms/1000); return s < 60 ? `约 ${s} 秒` : `约 ${Math.floor(s/60)} 分${s%60 ? ' ' + (s%60) + ' 秒' : ''}`; };
  function dateLine(m){ const d = SB.fmtDate(m.date) || '', sq = x => String(x || '').replace(/\s/g, '');
    return d && sq(m.title).includes(sq(d)) ? '' : d; }

  /* ── 舞台尺寸 ── */
  function measure(style){
    const W = scene.clientWidth || innerWidth, H = scene.clientHeight || innerHeight, land = W >= H;
    const bar = style === 'cinema' ? Math.round(land ? Math.max(0, (H - W/1.85)/2) : H*(SB.perf.touch ? .045 : .06)) : 0;
    return {W, H, bar, fw:W, fh:H - bar*2, land};
  }

  /* ════════ 导演：把照片编排成时间线 ════════
     照片元素：{kind:'photo', slide, i, t0, t1, keys:[{t,x,y,w,h,r}], kb:{s0,s1,x0,x1,y0,y1}, frame, enter:{type,dur,dir}, exit:{type,dur,dir}, z, depth, space}
     文字元素：{kind:'text', look, lines, t0, t1, box:{x,y,w,ax,ay}, fs, vertical, idx, space, rot}
     坐标单位：画框宽高的比例。 */
  const photo = (o) => Object.assign({kind:'photo', keys:[], kb:{s0:1, s1:1, x0:50, x1:50, y0:50, y1:50}, frame:'bleed', enter:{type:'fade', dur:1000}, exit:{type:'fade', dur:900}, z:10, depth:0, space:'flat'}, o);
  const fitBox = (a, sw, sh, fw, fh) => { let w = sw*fw, h = w/a; if(h > sh*fh){ h = sh*fh; w = h*a; } return {w:w/fw, h:h/fh}; };
  const aspect = s => (s.w && s.h) ? s.w/s.h : 1.5;
  function cueItems(text, t0, per, make){
    const out = []; let t = t0;
    for(const c of splitCues(text, per*2)){ const d = cueDur(c); out.push(make(wrap(c, per), t, t + d, c)); t += d + CUE_GAP; }
    return {items: out, end: out.length ? t - CUE_GAP : t0};
  }
  const focusOf = (B, readEnd, t0) => Math.max(B, readEnd - t0 + 600);

  /* 风格一 · 银幕 */
  function dCinema(S, c){
    const {fw, fh, land} = c, A = fw/fh, items = [], marks = [];
    const fs = land ? clamp(fw*.034, 24, 44) : clamp(fw*.062, 21, 26);
    const per = Math.max(8, Math.min(14, Math.floor(fw*.84/(fs*1.18))));
    const isPort = x => x && x.a < .9, wide = x => x && x.a > 1.15;
    const shortCap = x => len(x.s.caption) <= 24;
    const G = []; let i = 0;
    while(i < S.length){
      const a = S[i], b = S[i+1], d = S[i+2];
      if(land && !c.lite && isPort(a) && isPort(b) && isPort(d) && shortCap(a) && shortCap(b) && shortCap(d) && G.length % 3 !== 0){ G.push({k:'trio', s:[a, b, d]}); i += 3; }
      else if(land && isPort(a) && isPort(b)){ if(isPort(d) && !isPort(S[i+3])){ G.push({k:'duo', s:[a, b, d]}); i += 3; } else { G.push({k:'duo', s:[a, b]}); i += 2; } }
      else if(!land && wide(a) && wide(b) && a.a > 1.2 && b.a > 1.2){ G.push({k:'stack', s:[a, b]}); i += 2; }
      else { G.push({k:'full', s:[a]}); i++; }
    }
    const FT = ['bloom', 'slit', 'iris', 'wipe', 'blinds', 'bloom', 'wipe', 'slit', 'iris'];
    const COVER = new Set(['slit', 'iris', 'wipe', 'blinds', 'ink']);
    const TRD = {bloom:1300, slit:1200, iris:1300, wipe:1100, blinds:1300, ink:2100};
    let t = c.C0 - 300, prev = null, nf = 0, z = 100, mg = 0;
    const capFull = (sl, t0, vertical) => cueItems(sl.s.caption, t0, per, (lines, a, b) => vertical
      ? {kind:'text', look:'cinema', vertical:true, lines:[lines.join('')], t0:a, t1:b, fs:Math.min(56, Math.max(28, fw*.044), fh*.78/(len(lines.join(''))*1.22 + .8)), box:{x:.9, y:.1, ax:'r', ay:'t'}}
      : {kind:'text', look:'cinema', lines, t0:a, t1:b, fs, box:{x:.5, y:land ? .9 : .88, w:.9, ax:'c', ay:'b'}, scrim:true});
    const kbFull = (sl, gi) => {
      const r = sl.a/A;
      if(r > 1.3) return {s0:1.01, s1:1.03, x0:gi % 2 ? 100 : 0, x1:gi % 2 ? 0 : 100, y0:50, y1:50};
      if(r < 1/1.3) return {s0:1.02, s1:1.02, x0:50, x1:50, y0:25, y1:70};
      return gi % 2 ? {s0:1.08, s1:1, x0:52, x1:50, y0:47, y1:50} : {s0:1, s1:1.08, x0:50, x1:50 + (gi % 4 < 2 ? 3 : -3), y0:50, y1:46};
    };
    G.forEach((g, gi) => {
      const next = G[gi + 1];
      if(g.k === 'full'){
        const sl = g.s[0], type = gi === 0 ? 'ink' : FT[nf++ % FT.length], dir = ['l', 'r', 'b', 't'][gi % 4];
        // 上一组的退场：被覆盖型转场时保持到被完全盖住；溶解时同步淡出
        if(prev) prev.forEach(p => { if(p.t1 == null){ p.t1 = t + TRD[type]; p.exit = COVER.has(type) ? {type:'hold', dur:1} : {type:'fade', dur:TRD[type]}; } });
        const framed = land && sl.a < .8;
        const its = [];
        if(framed){
          const bx = fitBox(sl.a, .62, .86, fw, fh);
          its.push(photo({slide:sl.s, i:sl.i, t0:t, frame:'fill', z:z++, keys:[{t, x:.5, y:.5, w:1, h:1}], enter:{type, dur:TRD[type], dir}, kb:{s0:1.16, s1:1.24, x0:50, x1:50, y0:50, y1:50}}));
          its.push(photo({slide:sl.s, i:sl.i, t0:t + 250, frame:'framed', z:z++, keys:[{t, x:.5, y:.5, w:bx.w, h:bx.h}], enter:{type:'bloom', dur:1300}, kb:{s0:1, s1:1.04, x0:50, x1:50, y0:50, y1:50}, tilt:true}));
        } else its.push(photo({slide:sl.s, i:sl.i, t0:t, z:z++, keys:[{t, x:.5, y:.5, w:1, h:1}], enter:{type, dur:TRD[type], dir}, kb:kbFull(sl, gi)}));
        items.push(...its); marks.push({t, i:sl.i});
        const cap = sl.s.caption ? splitCues(sl.s.caption, per*2) : [];
        const vertical = land && cap.length === 1 && len(cap[0]) <= 12 && !framed;
        const cu = capFull(sl, t + 700, vertical); items.push(...cu.items);
        if(type !== 'bloom' && gi % 4 === 3) items.push({kind:'leak', t0:t - 200, t1:t + 1500});
        t += focusOf(c.B, cu.end, t); prev = its;
        return;
      }
      // 多图组：双联 / 三联 / 上下叠放
      if(prev) prev.forEach(p => { if(p.t1 == null){ p.t1 = t + 1200; p.exit = {type:'fade', dur:1200}; } });
      const gap = .004, its = [], doors = [];
      let tt = t;
      const placeCap = (sl, at) => { const cu = cueItems(sl.s.caption, at, per, (lines, a, b) => ({kind:'text', look:'cinema', lines, t0:a, t1:b, fs, box:{x:.5, y:land ? .9 : .88, w:.9, ax:'c', ay:'b'}, scrim:true})); items.push(...cu.items); return cu.end; };
      if(g.k === 'duo'){
        const slot = k => ({x:k ? .75 + gap/2 : .25 - gap/2, y:.5, w:.5 - gap, h:1});
        const [a, b, d] = g.s;
        const A1 = photo({slide:a.s, i:a.i, t0:tt, z:z++, keys:[{t:tt, ...slot(0)}], enter:{type:'wipe', dir:'l', dur:1100}, kb:{s0:1.04, s1:1, x0:50, x1:50, y0:40, y1:58}});
        const B1 = photo({slide:b.s, i:b.i, t0:tt + 450, z:z++, keys:[{t:tt, ...slot(1)}], enter:{type:'wipe', dir:'r', dur:1100}, kb:{s0:1, s1:1.04, x0:50, x1:50, y0:58, y1:42}});
        its.push(A1, B1); marks.push({t:tt, i:a.i});
        let e = placeCap(a, tt + 700); tt += focusOf(c.B, e, tt);
        marks.push({t:tt, i:b.i}); e = placeCap(b, tt + 200); tt += focusOf(c.B*.85, e, tt);
        let last = B1, other = A1;
        if(d){
          A1.t1 = tt + 150 + 1100; A1.exit = {type:'hold', dur:1};          // 新照片擦入覆盖旧照片，不出现黑缝
          const C1 = photo({slide:d.s, i:d.i, t0:tt + 150, z:z++, keys:[{t:tt, ...slot(0)}], enter:{type:'wipe', dir:'l', dur:1100}, kb:{s0:1.04, s1:1, x0:50, x1:50, y0:45, y1:55}});
          its.push(C1); marks.push({t:tt, i:d.i}); e = placeCap(d, tt + 600); tt += focusOf(c.B, e, tt);
          last = C1; other = B1;
        }
        const expand = next?.k === 'full' && mg++ % 2 === 0 && !reduced();
        if(expand){
          // 一个面板扩展成全画面，另一面板滑出，随后作为全幅镜头停留片刻
          const k0 = last.keys[0];
          last.keys = [{...k0, t:tt}, {t:tt + 1300, x:.5, y:.5, w:1, h:1}];
          last.kb = {...last.kb, s1:1.06};
          other.t1 = tt + 1100; other.exit = {type:'slide', dir:other.keys[0].x < .5 ? 'l' : 'r', dur:1100};
          tt += 1700; its.forEach(p => { if(p !== last && p.t1 == null){ p.t1 = tt; p.exit = {type:'fade', dur:600}; } });
          prev = [last];
        } else {
          // 像两扇门一样向两侧打开，露出下一组
          its.forEach(p => { if(p.t1 == null){ p.t1 = tt + 1200; p.exit = {type:'slide', dir:p.keys[0].x < .5 ? 'l' : 'r', dur:1200}; } });
          doors.push(...its); prev = null;
        }
      } else if(g.k === 'trio'){
        const w = (1 - gap*2)/3;
        g.s.forEach((sl, k) => {
          const p = photo({slide:sl.s, i:sl.i, t0:tt + k*260, z:z++, keys:[{t:tt, x:w/2 + k*(w + gap), y:.5, w, h:1}], enter:{type:'slide', dir:k % 2 ? 'b' : 't', dur:1300}, kb:{s0:1.05, s1:1, x0:50, x1:50, y0:k % 2 ? 60 : 40, y1:50}});
          its.push(p);
        });
        g.s.forEach((sl, k) => { marks.push({t:tt, i:sl.i}); const e = placeCap(sl, tt + (k ? 200 : 900)); tt += focusOf(k ? c.B*.8 : c.B, e, tt); });
        its.forEach((p, k) => { p.t1 = tt + 1100 + k*180; p.exit = {type:'slide', dir:k % 2 ? 't' : 'b', dur:1100}; });
        doors.push(...its); prev = null;
      } else {   // stack：竖屏上两张横图上下叠放
        const slot = k => ({x:.5, y:k ? .75 + gap/2 : .25 - gap/2, w:1, h:.5 - gap});
        const [a, b] = g.s;
        its.push(photo({slide:a.s, i:a.i, t0:tt, z:z++, keys:[{t:tt, ...slot(0)}], enter:{type:'wipe', dir:'l', dur:1100}, kb:{s0:1.02, s1:1.03, x0:0, x1:100, y0:50, y1:50}}));
        its.push(photo({slide:b.s, i:b.i, t0:tt + 450, z:z++, keys:[{t:tt, ...slot(1)}], enter:{type:'wipe', dir:'r', dur:1100}, kb:{s0:1.03, s1:1.02, x0:100, x1:0, y0:50, y1:50}}));
        marks.push({t:tt, i:a.i}); let e = placeCap(a, tt + 700); tt += focusOf(c.B, e, tt);
        marks.push({t:tt, i:b.i}); e = placeCap(b, tt + 200); tt += focusOf(c.B*.85, e, tt);
        its.forEach((p, k) => { p.t1 = tt + 1200; p.exit = {type:'slide', dir:k ? 'b' : 't', dur:1200}; });
        doors.push(...its); prev = null;
      }
      items.push(...its);
      // 多图组里「正在讲述」的那张提亮，其余稍暗，引导视线
      const gm = marks.slice(-its.length - 1).filter(mm => its.some(p => p.i === mm.i));
      gm.forEach((mm, k) => { const nx = gm[k + 1]; its.filter(p => p.i === mm.i).forEach(p => { p.foc = [mm.t, nx ? nx.t : tt + 2000]; }); });
      if(gm.length > 1) its.forEach(p => { p.grp = its; });
      // 「开门」露出的下一组要在门的下面
      if(doors.length) items._under = (items._under || 0) + 1, doors.forEach(p => p.z += 400);
      t = tt;
    });
    if(prev) prev.forEach(p => { if(p.t1 == null){ p.t1 = t + 1100; p.exit = {type:'fade', dur:1100}; } });
    items.filter(x => x.kind === 'photo').forEach(p => { if(p.t1 == null) p.t1 = t + 1100; });
    return {items, marks, end:t + 300};
  }

  /* 风格二 · 星图 */
  const TPL_LAND = [
    {slots:[{x:.30, y:.47, sw:.42, sh:.68, r:-1.5, d:1}, {x:.74, y:.31, sw:.30, sh:.40, r:2.2, d:.55}], order:[0, 1, 0], text:{x:.56, y:.58, w:.38, ax:'l', ay:'t'}},
    {slots:[{x:.68, y:.52, sw:.42, sh:.68, r:1.5, d:1}, {x:.24, y:.68, sw:.30, sh:.38, r:-2.4, d:.55}], order:[0, 1, 0], text:{x:.07, y:.13, w:.38, ax:'l', ay:'t'}},
    {slots:[{x:.20, y:.40, sw:.25, sh:.46, r:-3, d:.6}, {x:.50, y:.50, sw:.27, sh:.52, r:1.8, d:1}, {x:.80, y:.40, sw:.25, sh:.46, r:-1.6, d:.6}], order:[0, 1, 2], text:{x:.5, y:.9, w:.8, ax:'c', ay:'b'}, center:true}
  ];
  const TPL_PORT = [
    {slots:[{x:.42, y:.24, sw:.70, sh:.30, r:-2, d:1}, {x:.62, y:.50, sw:.62, sh:.25, r:2, d:.6}], order:[0, 1, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true},
    {slots:[{x:.60, y:.23, sw:.66, sh:.29, r:2, d:.6}, {x:.38, y:.50, sw:.66, sh:.27, r:-2, d:1}], order:[0, 1, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true},
    {slots:[{x:.5, y:.35, sw:.84, sh:.48, r:0, d:1}], order:[0, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true}
  ];
  function dConstellation(S, c){
    const {fw, fh, land} = c, items = [], marks = [];
    let tpls = land ? TPL_LAND : TPL_PORT; if(c.lite && land) tpls = tpls.slice(0, 2);
    const fs = land ? clamp(fw*.026, 21, 36) : clamp(fw*.058, 20, 25);
    let ti = 0, tpl = tpls[0], occ = [], filled = 0, t = c.C0 + 100, prevIt = null, z = 100;
    const retire = (it, at, k = 0) => { it.t1 = at + k*220; it.exit = {type:'stardust', dur:1200}; };
    S.forEach((sl, n) => {
      if(filled >= tpl.order.length){
        occ.forEach((it, k) => it && retire(it, t + 300, k)); t += 900;
        ti = (ti + 1) % tpls.length; tpl = tpls[ti]; occ = []; filled = 0; prevIt = null;
      }
      const si = tpl.order[filled], slot = tpl.slots[si], old = occ[si];
      if(old) retire(old, t + 500);
      const bx = fitBox(sl.a, slot.sw, slot.sh, fw, fh);
      const t0 = t - 200 + (old ? 300 : 0);
      const it = photo({slide:sl.s, i:sl.i, t0, frame:'gilt', depth:slot.d, z:z++ + Math.round(slot.d*50), keys:[{t:t0, x:slot.x, y:slot.y, w:bx.w, h:bx.h, r:slot.r}],
        enter:{type:'bloom', dur:1400}, kb:{s0:1, s1:1.06, x0:50, x1:50, y0:50, y1:47}, tilt:true});
      items.push(it); marks.push({t, i:sl.i});
      if(prevIt) items.push({kind:'line', a:prevIt, b:it, t0:t + 300});
      const tb = tpl.text, per = Math.max(7, Math.min(16, Math.floor(tb.w*fw/(fs*1.06))));
      const cu = cueItems(sl.s.caption, t + 700, per, (lines, a, b) => ({kind:'text', look:'editorial', lines, t0:a, t1:b, fs, idx:String(sl.i + 1).padStart(2, '0'), center:!!tpl.center, box:{...tb}}));
      if(!cu.items.length) items.push({kind:'text', look:'editorial', lines:[], t0:t + 700, t1:t + 2600, fs, idx:String(sl.i + 1).padStart(2, '0'), center:!!tpl.center, box:{...tb}});
      items.push(...cu.items);
      occ[si] = it; filled++; prevIt = it;
      t += focusOf(c.B, cu.end, t);
    });
    occ.forEach((it, k) => it && retire(it, t + 300, k));
    items.filter(x => x.kind === 'line').forEach(l => { l.t1 = Math.min(l.a.t1, l.b.t1); });
    return {items, marks, end:t + 900};
  }

  /* 风格三 · 手札 */
  function dJournal(S, c){
    const {fw, fh, land} = c, items = [], marks = [], cam = [];
    const fs = land ? clamp(fw*.026, 22, 38) : clamp(fw*.06, 21, 26);
    const per = land ? Math.max(8, Math.floor(fw*.36/(fs*1.06))) : Math.max(8, Math.min(15, Math.floor(fw*.84/(fs*1.06))));
    let t = c.C0 + 250, px = 0, py = 0, pw = 0, ph = 0, z = 100;
    const prints = [];
    S.forEach((sl, n) => {
      const bx = fitBox(sl.a, land ? .34 : .72, land ? .52 : .38, fw, fh);
      const bpx = Math.max(7, Math.min(bx.w*fw, bx.h*fh)*.045);
      const w = bx.w + bpx*2/fw, h = bx.h + bpx*3.4/fh;
      let x, y;
      if(land){ x = n ? px + (pw + w)/2*.8 + .025 : .5; y = .40 + (hash(n, 3) - .5)*.06; }
      else { y = n ? py + (ph + h)/2*.74 + .02 : .38; x = (n % 2 ? .57 : .43) + (hash(n, 3) - .5)*.04; }
      const r = (n % 2 ? 1 : -1)*(2.5 + hash(n, 5)*4.5);
      const it = photo({slide:sl.s, i:sl.i, t0:t - 250, frame:'print', space:'desk', z:z++, border:bpx, seal:n % 3 === 2,
        keys:[{t, x, y, w, h, r}], enter:{type:'drop', dur:950, dir:n % 2 ? 1 : -1}, kb:{s0:1, s1:1.04, x0:50, x1:50, y0:50, y1:50}});
      items.push(it); prints.push(it); marks.push({t, i:sl.i});
      // 镜头沿桌面跟随最新的相片
      const cx = land ? x - .06 : .5, cy = land ? .5 : y + .1;
      cam.push({t:n ? t - 700 : t - 1000, x:cam.length ? cam[cam.length - 1].x : cx, y:cam.length ? cam[cam.length - 1].y : cy}, {t:t + 800, x:cx, y:cy});
      let tx;
      const text = String(sl.s.caption || '').trim();
      if(text){
        const lines = wrap(text, per).slice(0, 6), n2 = len(text), writeEnd = 500 + n2*110 + 900;
        if(land) tx = {kind:'text', look:'ink', space:'desk', lines, t0:t + 450, t1:null, fs:n2 > 40 ? fs*.85 : fs, rot:r*.35,
          box:{x:x - w/2 + .012, y:y + h/2 + .035, w:.4, ax:'l', ay:'t'}};
        else tx = {kind:'text', look:'ink', center:true, lines, t0:t + 450, t1:null, fs, box:{x:.5, y:.80, w:.86, ax:'c', ay:'t'}};
        items.push(tx); it.caption = tx;
        t += Math.max(c.B, writeEnd + Math.max(0, n2/CPS*1000 - n2*110));
      } else t += c.B*.85;
      px = x; py = y; pw = w; ph = h;
    });
    // 旧相片在镜头移开后退场；文字跟随相片
    prints.forEach((p, k) => {
      const later = prints[k + (land ? 3 : 2)];
      p.t1 = later ? later.t0 + 1800 : t + 1200; p.exit = {type:'fade', dur:700};
      // 上一段墨迹在下一段开始书写时淡去，避免相邻文字重叠
      if(p.caption){ const nx = prints.slice(k + 1).find(q => q.caption); p.caption.t1 = nx ? nx.caption.t0 + 700 : (land ? p.t1 : t + 1000); }
    });
    return {items, marks, end:t + 500, cam};
  }
  const DIRECT = {cinema:dCinema, constellation:dConstellation, journal:dJournal};

  function buildTL(m, style){
    const dim = measure(style);
    const S = (m.slides || []).filter(s => s.id).map((s, i) => ({s, i, a:aspect(s)}));
    const C0 = Math.min(9000, Math.max(4200, 3600 + (len(m.title) + len(m.note))/CPS*1000));
    const ctx = {...dim, C0, B:BASE[style], lite:lite()};
    const r = S.length ? DIRECT[style](S, ctx) : {items:[], marks:[], end:C0};
    r.items.forEach((it, k) => { it.id = 'e' + k; });
    r.items.sort((a, b) => a.t0 - b.t0);
    return {...r, ...dim, style, C0, endT:Math.max(r.end, C0 + 600), n:S.length};
  }
  const estimate = TL => TL.endT + END_EST;

  /* ── 照片：等待签名地址、预加载并解码 ── */
  const cache = new Map();
  async function urlOf(id){
    let u = SB.store.url(id); if(u) return u;
    await SB.store.prefetchUrls?.([id]);
    u = SB.store.url(id); if(u) return u;
    return new Promise(res => { let n = 0; const tryOnce = () => { const x = SB.store.url(id); if(x || n++ > 20) return res(x || ''); setTimeout(tryOnce, 120); }; tryOnce(); });
  }
  function load(id, priority='auto'){
    if(!id) return Promise.resolve(null);
    if(cache.has(id)) return cache.get(id).p;
    const rec = {ready:false, url:'', ok:false};
    rec.p = urlOf(id).then(url => new Promise(res => {
      rec.url = url; if(!url){ rec.ready = true; return res(rec); }
      const img = new Image(); img.decoding = 'async';
      if('fetchPriority' in img) img.fetchPriority = priority;

  /* 星空背景（星图风格） */

  /* ════════ 四季 ════════ */

  /* ── 扉页 / 终章 / 进度 ── */
  function renderTitle(T){

    const drop = el.querySelector('b'), dp = clamp(t/600, 0, 1);
    drop.style.opacity = t < 700 ? (dp < .85 ? 1 : (1 - (dp - .85)/.15)).toFixed(2) : '0';
    drop.style.transform = `translateY(${lerp(-30, 0, EO(dp)).toFixed(1)}vh)`;
    el.querySelectorAll('i').forEach((r, j) => { const rp = clamp((t - 550 - j*260)/2200, 0, 1);
      r.style.opacity = rp > 0 && rp < 1 ? ((1 - rp)*.9).toFixed(3) : '0'; r.style.transform = `scale(${EO(rp).toFixed(3)})`; });
    const fadeIn = (node, at, dur=900) => { const p = clamp((t - at)/dur, 0, 1); node.style.opacity = ease(p).toFixed(3); node.style.transform = `translateY(${((1 - ease(p))*8).toFixed(1)}px)`; };

  /* ── 时钟 ── */

    P.renderAt = now;

  document.addEventListener('visibilitychange', () => { if(document.hidden && P.showing) setPlaying(false); });

  function topBar(m){
    const top = $('pl-top'); top.innerHTML = '';
    if(SB.store.canEdit) top.appendChild(SB.ui.button('编辑', 'small', () => { setPlaying(false); SB.editor.open({cityId:m.cityId, memory:m}); }));
    top.appendChild(SB.ui.button('退出放映', 'small', () => SB.scenes.back()));
  }
  document.addEventListener('sb:data', () => {
    if(SB.scenes.current !== 'player' || !P.m) return;
    const m = SB.store.memory(P.m.id);
    if(m && m.updatedAt !== P.m.updatedAt){ stopShow(); topBar(m); lobby(m); }
  });

  SB.scenes.register('player', {
    world:'night', hash:false,
    title:p => SB.store.memory(p.id)?.title || '回忆',
    // v1.8.1：从「时光长卷」进入的放映，返回时回到时光长卷
    parent:p => { if(p.from === 'overview') return {id:'overview', params:{}}; const m = SB.store.memory(p.id); return m ? {id:'city', params:{id:m.cityId}} : {id:'globe', params:{}}; },
    prepare(p){ const m = SB.store.memory(p.id); return m ? prime(m) : Promise.resolve(); },
    async enter(p){
      SB.fx.palette('warm'); SB.fx.calm();
      const m = SB.store.memory(p.id);
      if(!m){ SB.toast('这段回忆找不到了'); setTimeout(() => SB.scenes.back(), 50); return; }
      topBar(m); $('pl-music').classList.toggle('off', !SB.audio.on);
      await lobby(m);
      if(p.autoplay && SB.scenes.current === 'player' && P.m === m) play(false);
    },
    leave(){ stopShow(); clearTimeout(P.idleT); SB.audio.clear(); P.m = null; P.TL = null; }
  });

  /* 调试 / 自动化验收：在暂停状态下定位到时间线上的某一刻 */
  function seek(T){ if(!P.showing) return; setPlaying(false); P.T = Math.max(0, T); prefetch(P.T); render(); }
  SB.player = {
    play:() => play(false), seek, jump, prime,
    setStyle(id){ if(SB.cinema.styles.some(s => s.id === id)){ P.style = id; if(P.showing) rebuild(false); else if(P.m){ refreshStyleUI(); updateStat(); } } },
    setSeason(id){ P.seasonPref = id; setSeason(SB.cinema.resolveSeason(id, P.m?.date), true); },
    stepSeason(ms){ for(let k = 0; k < ms/50; k++) stepSeason(50); render(); },
    estimate:(m, style) => estimate(buildTL(m, style || SB.cinema.styleOf(m))),
    get state(){ const TL = P.TL; return {T:P.T, playing:P.playing, showing:P.showing, style:P.style, season:P.season, C0:TL?.C0, endT:TL?.endT,
      marks:TL?.marks.map(m => ({t:Math.round(m.t), i:m.i})) || [], items:TL ? TL.items.filter(x => x.kind === 'photo').map(x => ({i:x.i, t0:Math.round(x.t0), t1:Math.round(x.t1), enter:x.enter.type, exit:x.exit.type, frame:x.frame})) : []}; }
  };
})(window.SB);
</script>
