<style>
/* ── 块 11 · v1.6.0 「冥想盆放映厅」电影式回忆放映 + 背景音乐 ──
   四幕：放映厅（海报 + 放映按钮）→ 开场（熄灯、银幕框、墨滴入水、扉页）→ 镜头（推拉摇移 + 溶解/光漏/墨滴转场 + 电影字幕）→ 终章。
   一个时钟驱动所有画面：暂停 = 停止时钟。 */
.sb-scene[data-scene="player"]{background:#04030a;--bar:0px;}
.pl-ambient{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(38px) brightness(.38) saturate(1.15);
  transform:scale(1.08);animation:plBreath 14s ease-in-out infinite alternate;transition:opacity 1.2s var(--ease-soft);}
@keyframes plBreath{from{transform:scale(1.08)}to{transform:scale(1.16)}}
.sb-scene[data-scene="player"].showing .pl-ambient{opacity:0;}

/* ── 第一幕 · 放映厅 ── */
.pl-lobby{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:clamp(14px,2.6vh,26px);
  padding:calc(64px + var(--safe-t)) max(18px,var(--safe-r)) calc(28px + var(--safe-b)) max(18px,var(--safe-l));text-align:center;
  transition:opacity .8s var(--ease-soft), transform 1s var(--ease-soft), filter .8s var(--ease-soft);}
.sb-scene[data-scene="player"].showing .pl-lobby{opacity:0;transform:scale(.96);filter:blur(6px);pointer-events:none;}
.pl-poster{position:relative;width:min(280px,62vw,27vh);aspect-ratio:4/5;flex:none;border-radius:6px;overflow:hidden;background:#151230;
  box-shadow:0 0 0 1px rgba(255,226,168,.7),0 0 0 7px rgba(16,10,6,.75),0 0 0 8px rgba(244,184,96,.45),0 30px 70px rgba(0,0,0,.65),0 0 60px rgba(244,184,96,.2);
  animation:plPosterIn 1.2s var(--ease-soft) backwards;}
.pl-poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s;}
.pl-poster img.ok{opacity:1;}
.pl-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,240,210,.16) 50%,transparent 60%);
  transform:translateX(-70%);animation:plSheen 7s ease-in-out 1.2s infinite;}
@keyframes plSheen{0%,55%{transform:translateX(-70%)}85%,100%{transform:translateX(70%)}}
@keyframes plPosterIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px)}}
.pl-meta{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(760px,100%);animation:plPosterIn 1.2s var(--ease-soft) .15s backwards;}
.pl-meta small:empty{display:none;}
.pl-meta small{font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.24em;padding-left:.24em;color:var(--gold);}
.pl-meta h1{margin:0;font-size:clamp(22px,3.4vw,36px);letter-spacing:.12em;padding-left:.12em;line-height:1.35;}
.pl-meta .place{margin:0;font-size:13px;letter-spacing:.2em;padding-left:.2em;color:var(--text-dim);}
.pl-meta .stat{margin:0;font-size:13px;letter-spacing:.08em;color:#c9c0e6;display:flex;gap:10px;align-items:center;}
.pl-meta .stat i{width:3px;height:3px;border-radius:50%;background:var(--gold-dim);}
.pl-start{position:relative;width:118px;height:118px;flex:none;border:0;border-radius:50%;cursor:pointer;background:none;color:#2a1608;
  display:grid;place-items:center;animation:plPosterIn 1.2s var(--ease-soft) .3s backwards;-webkit-tap-highlight-color:transparent;}
.pl-start .ring{position:absolute;inset:0;width:100%;height:100%;animation:sbSpin 40s linear infinite;color:var(--gold);filter:drop-shadow(0 0 6px rgba(244,184,96,.6));}
.pl-start .core{position:relative;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 35% 30%,#fff3d1,#f4b860 55%,#b8762c);box-shadow:0 0 30px rgba(244,184,96,.55),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .35s var(--ease-soft), box-shadow .35s;}
.pl-start .core svg{width:22px;height:22px;margin-left:3px;}
.pl-start .core span{font-family:var(--f-display);font-weight:var(--fw-display);font-size:13px;letter-spacing:.3em;padding-left:.3em;line-height:1;}
.pl-start::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(244,184,96,.28),transparent 68%);
  animation:plPulse 3.2s ease-in-out infinite;}
@keyframes plPulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.pl-start:hover .core,.pl-start:focus-visible .core{transform:scale(1.06);box-shadow:0 0 46px rgba(244,184,96,.85),inset 0 1px 0 rgba(255,255,255,.7);}
.pl-start[disabled]{opacity:.45;pointer-events:none;}
.pl-lobby-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:plPosterIn 1.2s var(--ease-soft) .45s backwards;}
.pl-lobby-acts .sb-btn{background:rgba(10,10,28,.55);}
.pl-wait{font-size:13px;letter-spacing:.14em;color:var(--text-dim);min-height:1.4em;}

/* ── 银幕 ── */
.pl-screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .9s var(--ease-soft);}
.sb-scene[data-scene="player"].showing .pl-screen{opacity:1;pointer-events:auto;}
.pl-shots{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--bar);overflow:hidden;}
.pl-shot{position:absolute;inset:0;overflow:hidden;will-change:opacity,filter;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;}
.pl-shot .fill{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(30px) brightness(.42) saturate(1.2);}
.pl-shot.lite .fill{filter:brightness(.3);}
.pl-shot .cam{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;}
.pl-shot .cam img{display:block;width:100%;height:100%;object-fit:cover;}
.pl-shot .cam.print{border-radius:3px;box-shadow:0 0 0 1px rgba(255,226,168,.75),0 0 0 8px rgba(18,12,8,.7),0 0 0 9px rgba(244,184,96,.42),0 34px 80px rgba(0,0,0,.7),0 0 70px rgba(244,184,96,.16);}
.pl-leak{position:absolute;left:-60%;top:var(--bar);bottom:var(--bar);width:220%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(40% 70% at 30% 50%,rgba(255,170,80,.75),transparent 70%),radial-gradient(28% 60% at 52% 40%,rgba(255,226,160,.55),transparent 70%),
    radial-gradient(30% 80% at 70% 60%,rgba(255,120,60,.35),transparent 70%);}
.pl-dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.pl-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fffaf0,#ffe6b8 45%,#f4c27a);}

/* 扉页 + 墨滴涟漪 */
.pl-title{position:absolute;left:0;right:0;top:var(--bar);bottom:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:0 max(22px,var(--safe-l));text-align:center;pointer-events:none;}
.pl-ripples{position:absolute;left:50%;top:50%;width:0;height:0;}
.pl-ripples i{position:absolute;left:0;top:0;width:60vmin;height:60vmin;margin:-30vmin 0 0 -30vmin;border-radius:50%;opacity:0;
  border:1px solid rgba(255,226,168,.7);box-shadow:0 0 18px rgba(244,184,96,.45), inset 0 0 18px rgba(244,184,96,.25);}
.pl-ripples b{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff3d6;opacity:0;
  box-shadow:0 0 14px 6px rgba(255,214,150,.9), 0 0 40px 14px rgba(244,184,96,.5);}
.pl-title small:empty{display:none;}
.pl-title small{font-family:var(--f-num);font-weight:600;font-size:16px;letter-spacing:.3em;padding-left:.3em;color:var(--gold);}
.pl-title h2{margin:0;font-size:clamp(28px,5.2vw,58px);letter-spacing:.14em;padding-left:.14em;line-height:1.35;max-width:16em;}
.pl-title h2 .pl-nb{white-space:nowrap;font-weight:inherit;}
.pl-title h2 span{display:inline-block;white-space:pre;color:var(--gold-hi);text-shadow:0 0 24px rgba(244,184,96,.55),0 1px 0 rgba(60,30,8,.6);}
.pl-title .rule{width:min(340px,62vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);}
.pl-title p{margin:0;max-width:26em;font-size:clamp(14.5px,1.6vw,17px);line-height:1.95;letter-spacing:.06em;color:#eadfc8;}

/* 字幕 */
.pl-sub{position:absolute;left:50%;bottom:calc(var(--bar) + clamp(18px,5vh,54px));transform:translateX(-50%);width:min(900px,calc(100vw - 32px));
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;pointer-events:none;}
.pl-sub::before{content:"";position:absolute;left:50%;top:50%;width:150%;height:260%;transform:translate(-50%,-50%);z-index:-1;
  background:radial-gradient(50% 50% at 50% 50%,rgba(4,3,10,.62),transparent 75%);}
.pl-sub div{font-family:var(--f-body);font-weight:400;font-size:clamp(17px,2.2vw,24px);letter-spacing:.08em;line-height:1.6;color:#fff7e8;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.6),0 0 22px rgba(244,184,96,.22);}
.pl-sub span{display:inline-block;white-space:pre;}
.pl-shade{position:absolute;left:0;right:0;bottom:var(--bar);height:34%;pointer-events:none;background:linear-gradient(transparent,rgba(4,3,10,.55));}

/* 终章 */
.pl-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;padding:0 20px;}
.pl-end .st{width:22px;height:22px;color:var(--gold-hi);filter:drop-shadow(0 0 10px rgba(255,214,150,.9));}
.pl-end .fin{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,8vw,84px);letter-spacing:.3em;padding-left:.3em;line-height:1.2;}
.pl-end .finis{font-family:var(--f-rune);font-weight:500;font-size:13px;letter-spacing:.6em;padding-left:.6em;color:var(--gold);}
.pl-end .meta{font-size:13.5px;letter-spacing:.16em;padding-left:.16em;color:var(--text-dim);}
.pl-end .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.pl-end .acts.on{pointer-events:auto;}

/* 胶片质感 */
.pl-grain{position:absolute;inset:-50px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:160px 160px;animation:plGrain .9s steps(6) infinite;}
.pl-grain.off{display:none;}
@keyframes plGrain{0%{transform:translate(0,0)}20%{transform:translate(-30px,18px)}40%{transform:translate(22px,-26px)}60%{transform:translate(-14px,-34px)}80%{transform:translate(34px,12px)}100%{transform:translate(0,0)}}
.pl-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 48%,transparent 58%,rgba(0,0,0,.62));}
.pl-flicker{animation:plFlicker .32s steps(4) 1;}
@keyframes plFlicker{0%{opacity:.75}25%{opacity:1}50%{opacity:.85}100%{opacity:1}}

/* 银幕黑边 */
.pl-bar{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:2;pointer-events:none;transition:transform 1s var(--ease-soft);}
.pl-bar.t{top:0;transform:translateY(-101%);} .pl-bar.b{bottom:0;transform:translateY(101%);}
.sb-scene[data-scene="player"].showing .pl-bar{transform:none;}

/* 控制 */
.pl-ui{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;gap:12px;
  padding:16px max(16px,var(--safe-r)) calc(14px + var(--safe-b)) max(16px,var(--safe-l));
  background:linear-gradient(transparent,rgba(0,0,0,.66));opacity:0;pointer-events:none;transition:opacity .5s;}
.pl-top{position:absolute;top:calc(14px + var(--safe-t));right:max(14px,var(--safe-r));z-index:4;display:flex;gap:8px;transition:opacity .5s;}
.pl-top .sb-btn{background:rgba(10,10,28,.6);}
.pl-count{position:absolute;top:calc(24px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:4;font-family:var(--f-num);font-weight:600;font-size:15px;
  letter-spacing:.24em;color:var(--gold);opacity:0;transition:opacity .5s;pointer-events:none;}
.sb-scene[data-scene="player"].showing.awake .pl-ui{opacity:1;pointer-events:auto;}
.sb-scene[data-scene="player"].showing.awake .pl-count{opacity:1;}
.sb-scene[data-scene="player"]:not(.showing) .pl-top{display:none;}
.sb-scene[data-scene="player"].showing:not(.awake) .pl-top{opacity:0;pointer-events:none;}
.sb-scene[data-scene="player"].showing:not(.awake){cursor:none;}
.pl-bars{display:flex;gap:4px;}
.pl-bars b{position:relative;flex:1;height:14px;cursor:pointer;}
.pl-bars b::before{content:"";position:absolute;left:0;right:0;top:5.5px;height:3px;border-radius:2px;background:rgba(255,226,168,.22);}
.pl-bars b i{position:absolute;left:0;top:5.5px;height:3px;width:0;border-radius:2px;background:linear-gradient(90deg,#f4b860,#fff1cc);box-shadow:0 0 8px #f4b860;}
.pl-bars b.t{flex:.6;}
.pl-ctl{display:flex;justify-content:center;align-items:center;gap:10px;}
.pl-ctl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(10,10,28,.6);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;font-size:20px;}
.pl-ctl button:hover{box-shadow:0 0 16px rgba(244,184,96,.45);}
.pl-ctl button.big{width:58px;height:58px;font-size:22px;}
.pl-ctl button.off{opacity:.45;}
.pl-buffer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;opacity:0;transition:opacity .4s;pointer-events:none;}
.pl-buffer.on{opacity:1;}
@media (max-width:600px){ .pl-start{width:104px;height:104px;} .pl-start .core{width:68px;height:68px;} }
</style>

<section class="sb-scene" data-scene="player" aria-label="回忆放映">
  <div class="pl-ambient" id="pl-ambient"></div>
  <div class="pl-lobby" id="pl-lobby">
    <div class="pl-poster"><img id="pl-poster-img" alt=""></div>
    <div class="pl-meta">
      <small id="pl-l-date"></small>
      <h1 class="sb-foil" id="pl-l-title"></h1>
      <p class="place" id="pl-l-place"></p>
      <p class="stat" id="pl-l-stat"></p>
    </div>
    <button type="button" class="pl-start" id="pl-start" aria-label="开始放映">
      <svg class="ring" viewBox="-60 -60 120 120" aria-hidden="true"><g fill="none" stroke="currentColor"><circle r="57" stroke-width=".8"/><circle r="52" stroke-width=".5" stroke-dasharray="1 4"/></g></svg>
      <span class="core"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19.5 12Z" fill="currentColor"/></svg><span>放映</span></span>
    </button>
    <div class="pl-wait" id="pl-wait" aria-live="polite"></div>
    <div class="pl-lobby-acts" id="pl-lobby-acts"></div>
  </div>
  <div class="pl-screen" id="pl-screen">
    <div class="pl-shots" id="pl-shots"></div>
    <div class="pl-shade"></div>
    <div class="pl-leak" id="pl-leak"></div>
    <canvas class="pl-dust" id="pl-dust"></canvas>
    <div class="pl-title" id="pl-title">
      <div class="pl-ripples" id="pl-ripples"><i></i><i></i><i></i><b></b></div>
      <small id="pl-t-date"></small><h2 id="pl-t-title"></h2><div class="rule" id="pl-t-rule"></div><p id="pl-t-note"></p>
    </div>
    <div class="pl-sub" id="pl-sub" aria-live="polite"></div>
    <div class="pl-end" id="pl-end">
      <span class="st" id="pl-e-star"></span><div class="fin sb-foil" id="pl-e-fin">终</div><div class="finis" id="pl-e-finis">FINIS</div>
      <div class="meta" id="pl-e-meta"></div><div class="acts" id="pl-e-acts"></div>
    </div>

      <button type="button" id="pl-next" aria-label="下一个镜头"></button>
      <button type="button" id="pl-music" aria-label="背景音乐开关"></button>
    </div>
  </div>
</section>

<script>
/* ── 背景音乐 SB.audio：全站一个播放器，切换时淡入淡出；v1.6.0 新增 duck() ── */
(function(SB){
  const el = new Audio(); el.loop = true; el.preload = 'auto';
  const BASE = .8;
  let want = true, unlocked = false, cur = null, override = null, fadeT = 0, gain = 1;
  try{ want = localStorage.getItem('sb-music') !== 'off'; }catch(e){}
  function fade(to, ms){
    cancelAnimationFrame(fadeT);
    return new Promise(res => { const from = el.volume, t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0)/ms); el.volume = SB.clamp(from + (to - from)*k, 0, 1); k < 1 ? fadeT = requestAnimationFrame(step) : res(); };
      fadeT = requestAnimationFrame(step); });
  }
  async function sync(){
    const track = override === undefined ? null : (override || SB.store.settings?.bgm || null);
    const id = track?.id || null;
    if(!want || !unlocked || !id){ if(!el.paused){ await fade(0, 900); el.pause(); } cur = id ? track : cur; SB.menu?.refresh(); return; }
    if(cur?.id !== id || el.paused){
      if(!el.paused) await fade(0, 900);
      if(cur?.id !== id || !el.src){ el.src = SB.store.url(id); }
      cur = track; el.volume = 0;
      try{ await el.play(); await fade(BASE*gain, 1400); }catch(e){}
    }
    SB.menu?.refresh();
  }
  SB.audio = {
    unlock(){ if(unlocked) return; unlocked = true; sync(); },
    set(track){ override = track; gain = 1; sync(); },          // 放映时：专属曲目 / null 表示用全站曲目 / undefined 表示静音
    clear(){ override = null; gain = 1; sync(); },
    duck(level = 1, ms = 1200){ gain = SB.clamp(level, 0, 1); if(!el.paused) fade(BASE*gain, ms); },   // 终章时把音量平滑压低，duck(1) 恢复
    toggle(){ want = !want; try{ localStorage.setItem('sb-music', want ? 'on' : 'off'); }catch(e){} unlocked = true; sync(); return want; },
    get on(){ return want; }, get playing(){ return !el.paused; }, get track(){ return cur; },
    preview(id){ const a = new Audio(SB.store.url(id)); a.volume = .8; return a; }
  };
  document.addEventListener('pointerdown', () => SB.audio.unlock(), {once:true});
  document.addEventListener('sb:data', () => { if(override === null) sync(); });

  SB.menu.add({id:'music', order:60, icon:'note', keepOpen:true,
    label:() => SB.audio.playing ? '背景音乐 · 播放中' : '背景音乐',
    desc:() => SB.audio.track?.name ? '♪ ' + SB.audio.track.name : (SB.store.settings?.bgm ? '♪ ' + SB.store.settings.bgm.name : '在「回忆总览」里上传全站音乐'),
    tag:() => `<span class="sb-seg"><span class="${SB.audio.on?'':'on'}">关</span><span class="${SB.audio.on?'on':''}">开</span></span>`,
    action(){ const on = SB.audio.toggle(); SB.toast(on ? '背景音乐已开启' : '背景音乐已关闭'); }});
})(window.SB);

/* ── 「冥想盆放映厅」 ── */
(function(SB){
  const $ = id => document.getElementById(id);
  const scene = document.querySelector('.sb-scene[data-scene="player"]');
  const ease = x => .5 - .5*Math.cos(Math.PI*SB.clamp(x, 0, 1));      // 正弦缓动：镜头运动不用线性
  const easeOut = x => 1 - Math.pow(1 - SB.clamp(x, 0, 1), 3);
  const lerp = SB.lerp, clamp = SB.clamp;
  const ICON_PAUSE = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const ICON_PLAY = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg>';
  const CPS = 7, SUB_MIN = 1800, CHAR_STEP = 45;                       // 字幕：7 字/秒，单条最短 1.8 秒
  const TR = 1600, TR_INK = 2200, TR_MANUAL = 800, END_EST = 4000;

  $('pl-prev').innerHTML = SB.icon('chevron', 'flip'); $('pl-prev').querySelector('svg').style.transform = 'scaleX(-1)';
  $('pl-next').innerHTML = SB.icon('chevron'); $('pl-music').innerHTML = SB.icon('note');
  $('pl-e-star').innerHTML = SB.icon('spark');
  $('pl-buffer').appendChild(SB.ui.spinner('正在冲洗胶片…'));

  const P = { m:null, segs:[], T:0, playing:false, showing:false, raf:0, last:0, layers:new Map(), forcedPrev:null,
              W:0, H:0, bar:0, fw:0, fh:0, idleT:0, subKey:'', endShown:false, wakeAt:0 };

  /* ── 质感资源：胶片颗粒、墨渍遮罩（一次生成） ── */
  (function makeGrain(){

    else { L.cam.classList.remove('print');

    $('pl-l-date').textContent = dateLine(m);

    const place = placeOf(m); $('pl-l-place').textContent = place; $('pl-l-place').hidden = !place;
    const n = (m.slides || []).length;
    $('pl-l-stat').innerHTML = `<span>${n} 张照片</span><i></i><span>${fmtDur(estimate(P.segs))}</span>${m.bgmMode !== 'none' && (m.bgm || SB.store.settings?.bgm) ? `<i></i><span>${SB.icon('note')} 配乐</span>` : ''}`;
    $('pl-start').disabled = !n;
    $('pl-wait').textContent = n ? '' : '这段回忆还没有照片';
    const acts = $('pl-lobby-acts'); acts.innerHTML = '';
    if(SB.store.canEdit) acts.appendChild(SB.ui.button('编辑', 'small', () => SB.editor.open({cityId:m.cityId, memory:m}), 'quill'));
    acts.appendChild(SB.ui.button('返回', 'small', () => SB.scenes.back()));
    // 海报与氛围背景
    const cover = m.cover?.id || m.slides?.[0]?.id; const pimg = $('pl-poster-img'); pimg.classList.remove('ok');
    if(cover){ const rec = await load(cover); if(P.m !== m) return;
      if(rec?.url){ pimg.onload = () => pimg.classList.add('ok'); pimg.src = rec.url; $('pl-ambient').style.backgroundImage = `url("${rec.url}")`; } }
    prefetch(1);
  }

  /* ── 第二幕起：放映 ── */
  function prepareScreen(){
    const m = P.m;
    $('pl-shots').innerHTML = ''; P.layers.clear(); P.subKey = '#'; P.endShown = false; P.forcedPrev = null; P.manualTr = 0;
    $('pl-t-date').textContent = dateLine(m);
    const h = $('pl-t-title'); h.innerHTML = '';
    // 逐字 span；「X · 」三者包进不换行组，避免分隔点落在行首
    const chars = [...SB.fmtTitle(m.title)];
    for(let k = 0; k < chars.length; k++){
      const mk = c => { const s = SB.el('span'); s.textContent = c; return s; };
      const j = chars[k+1] === '\u00a0' && chars[k+2] === '·' ? 3 : chars[k+1] === '·' ? 2 : 0;
      if(j){ const g = SB.el('b', 'pl-nb'); chars.slice(k, k + j).forEach(c => g.appendChild(mk(c))); h.appendChild(g); k += j - 1; }
      else h.appendChild(mk(chars[k]));
    }
    $('pl-t-note').textContent = m.note || ''; $('pl-t-note').hidden = !m.note;
    $('pl-e-meta').textContent = [SB.fmtDate(m.date), placeOf(m)].filter(Boolean).join(' · ');
    const acts = $('pl-e-acts'); acts.innerHTML = '';
    acts.append(SB.ui.button('再放一遍', 'primary', () => play(true), 'reset'), SB.ui.button('返回相册', '', () => SB.scenes.back()));
    const bars = $('pl-bars'); bars.innerHTML = '';
    P.segs.filter(s => s.type !== 'end').forEach((s, k) => { const b = SB.el('b', s.type === 'title' ? 't' : '', '<i></i>');
      b.addEventListener('click', e => { e.stopPropagation(); jump(k); wake(); }); bars.appendChild(b); });
    $('pl-grain').classList.toggle('off', lite());
    $('pl-flash').style.opacity = '0'; $('pl-end').style.display = 'none';
  }
  function play(again){
    if(!P.m || !(P.m.slides || []).length) return;
    SB.audio.unlock();
    prepareScreen(); layout();
    P.T = 0; P.cur = 0; P.showing = true;
    scene.classList.add('showing');
    const scr = $('pl-screen'); scr.classList.remove('pl-flicker'); void scr.offsetWidth; scr.classList.add('pl-flicker');
    if(!again) SB.audio.set(P.m.bgmMode === 'none' ? undefined : (P.m.bgm || null)); else SB.audio.duck(1, 1200);
    prefetch(1);
    render();
    setTimeout(() => { if(P.showing){ setPlaying(true); } }, again ? 300 : 1000);   // 熄灯与银幕框落下后开始
    cancelAnimationFrame(P.raf); P.last = 0; P.raf = requestAnimationFrame(loop);
    wake();
  }
  function stopShow(){
    P.showing = false; setPlaying(false); cancelAnimationFrame(P.raf);
    $('pl-shots').innerHTML = ''; P.layers.clear(); $('pl-sub').innerHTML = ''; P.subKey = '';
    scene.classList.remove('showing', 'awake');
  }

  /* ── 交互 ── */
  $('pl-start').addEventListener('click', () => play(false));
  $('pl-prev').addEventListener('click', e => { e.stopPropagation(); jump(P.cur - 1); wake(); });
  $('pl-next').addEventListener('click', e => { e.stopPropagation(); jump(P.cur + 1); wake(); });
  $('pl-play').addEventListener('click', e => { e.stopPropagation(); setPlaying(!P.playing); wake(); });
  $('pl-music').addEventListener('click', e => { e.stopPropagation(); SB.audio.toggle(); $('pl-music').classList.toggle('off', !SB.audio.on); wake(); });
  scene.addEventListener('pointermove', e => { if(P.showing && e.pointerType === 'mouse') wake(); });
  let sx = 0, sy = 0, st = 0;
  $('pl-screen').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  $('pl-screen').addEventListener('pointerup', e => {
    if(!P.showing || e.target.closest('button')) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ jump(P.cur + (dx < 0 ? 1 : -1)); wake(); }
    else if(performance.now() - st < 300){
      if(e.pointerType === 'mouse') { setPlaying(!P.playing); wake(); }
      else scene.classList.contains('awake') ? scene.classList.remove('awake') : wake();
    }
  });
  document.addEventListener('keydown', e => {
    if(SB.scenes.current !== 'player' || document.querySelector('.sb-modal')) return;
    if(!P.showing){ if((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body){ e.preventDefault(); play(false); } return; }
    if(e.key === 'ArrowRight'){ jump(P.cur + 1); wake(); } else if(e.key === 'ArrowLeft'){ jump(P.cur - 1); wake(); }
    else if(e.key === ' '){ e.preventDefault(); setPlaying(!P.playing); wake(); }
    else if(e.key === 'Escape' && !document.getElementById('sb-nav').classList.contains('open')) SB.scenes.back();
  });
  document.addEventListener('visibilitychange', () => { if(document.hidden && P.showing) setPlaying(false); });

  function topBar(m){
    const top = $('pl-top'); top.innerHTML = '';
    if(SB.store.canEdit) top.appendChild(SB.ui.button('编辑', 'small', () => { setPlaying(false); SB.editor.open({cityId:m.cityId, memory:m}); }));
    top.appendChild(SB.ui.button('退出放映', 'small', () => SB.scenes.back()));
  }
  document.addEventListener('sb:data', () => {
    if(SB.scenes.current !== 'player' || !P.m) return;
    const m = SB.store.memory(P.m.id);
    if(m && m.updatedAt !== P.m.updatedAt){ stopShow(); topBar(m); lobby(m); }
  });

  SB.scenes.register('player', {
    world:'night', hash:false,
    title:p => SB.store.memory(p.id)?.title || '回忆',
    parent:p => { const m = SB.store.memory(p.id); return m ? {id:'city', params:{id:m.cityId}} : {id:'globe', params:{}}; },
    async enter(p){
      SB.fx.palette('warm'); SB.fx.calm();
      const m = SB.store.memory(p.id);
      if(!m){ SB.toast('这段回忆找不到了'); setTimeout(() => SB.scenes.back(), 50); return; }
      layout(); topBar(m); $('pl-music').classList.toggle('off', !SB.audio.on);
      await lobby(m);
      if(p.autoplay && SB.scenes.current === 'player' && P.m === m) play(false);
    },
    leave(){ stopShow(); clearTimeout(P.idleT); SB.audio.clear(); P.m = null; }
  });
  /* 调试 / 自动化验收：定位到时间线上的某一刻（暂停状态下） */
  function seek(T){ if(!P.showing) return; setPlaying(false); P.forcedPrev = null; P.manualTr = 0; P.T = Math.max(0, T); P.subKey = '#'; prefetch(segAt(P.T)); render(); }
  SB.player = { play:() => play(false), seek, jump,
    get state(){ return {T:P.T, cur:P.cur, playing:P.playing, showing:P.showing, segs:P.segs.map(s => ({type:s.type, start:s.start, dur:s.dur, tr:s.tr, trType:s.trType, subs:(s.subs || []).map(c => c.text)}))}; } };
})(window.SB);
</script>
