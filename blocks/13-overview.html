<style>
/* ── 块 13 ·「时光长卷」v1.10.0「时光之环」：三维环形时光轴（场景 id 仍为 overview，保持深链与历史兼容）──
   依据 prompts/13-overview.md v1.10.0 节：自做透视投影（不使用共享 preserve-3d 场景），环线画在前 / 后两层 canvas，
   记录是悬挂在环上的 3D 卡片（每张卡片独立透视、缓慢自转），周年节点悬挂「时光剪影」铭牌。 */
.sb-scene[data-scene="overview"]{overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.tl-head{position:absolute;left:0;right:0;top:calc(66px + var(--safe-t));z-index:2100;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 16px;}

.tl-head p{margin:0;font-size:13px;letter-spacing:.12em;color:var(--text-dim);}

.ring-cv.back{z-index:1;} .ring-cv.front{z-index:1000;}

.ring-year{position:absolute;left:50%;top:46%;z-index:0;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-num);font-weight:600;font-size:min(40vh,34vw);line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(236,206,140,.12);white-space:nowrap;transition:opacity .7s var(--ease-soft);}
.ring-year.swap{opacity:0;}
/* 站点：悬挂物（线 + 卡片 / 铭牌），锚点在环上 */
.ring-st{position:absolute;left:0;top:0;width:var(--cw);transform-origin:50% 0;will-change:transform,opacity;pointer-events:none;}
.ring-st .in{display:flex;flex-direction:column;align-items:center;}
.ring-st .thr{display:block;width:1px;height:var(--thr);background:linear-gradient(rgba(255,232,188,.9),rgba(232,200,140,.45));box-shadow:0 0 4px rgba(244,184,96,.5);}

/* 3D 卡片：每张卡片自己的透视；正反两面平行贴合 */
.rc{position:relative;display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;color:var(--text);perspective:900px;-webkit-tap-highlight-color:transparent;}

.rc-f.front{background:#12142f;box-shadow:inset 0 0 0 1px rgba(255,232,190,.7),0 0 0 3px rgba(14,15,40,.9),0 0 0 4px rgba(240,214,160,.35),0 18px 36px rgba(0,0,0,.55);}

.rc-f.front .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(232,200,140,.22);background:radial-gradient(circle at 50% 40%,rgba(80,90,170,.25),transparent 70%),#12142f;}

.rc-f.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,240,210,.0) 35%,rgba(255,240,210,.16) 50%,rgba(255,240,210,0) 65%);opacity:var(--sheen,0);}
.rc-f.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,rgba(120,84,40,.45),transparent 60%),repeating-linear-gradient(45deg,rgba(244,184,96,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#1b1530,#0d0b1c);
  box-shadow:inset 0 0 0 1px rgba(255,232,190,.7),inset 0 0 0 6px rgba(14,11,26,.9),inset 0 0 0 7px rgba(240,214,160,.35),0 18px 36px rgba(0,0,0,.55);}

/* 年轮刻度条 */

.tl-scrub .ln{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(232,200,140,.32);}
.tl-scrub .dot{position:absolute;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgba(240,214,160,.75);}
.tl-scrub .an{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);border:1px solid var(--gold-hi);background:rgba(20,16,40,.9);box-shadow:0 0 8px rgba(244,184,96,.6);}
.tl-scrub .yr{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--gold-dim);}
.tl-scrub .yr::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:8px;background:rgba(232,200,140,.45);}
.tl-scrub .win{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1px solid rgba(255,226,168,.9);background:rgba(244,184,96,.22);box-shadow:0 0 12px rgba(244,184,96,.5);transition:left .25s var(--ease-soft);}
.tl-hint{position:absolute;right:calc(22px + var(--safe-r));bottom:calc(30px + var(--safe-b));z-index:2100;font-size:12px;letter-spacing:.14em;color:var(--text-dim);opacity:.7;pointer-events:none;}
.tl-empty{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2100;width:min(440px,calc(100% - 40px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:26px 22px;border-radius:16px;border:1px solid rgba(240,214,160,.3);background:rgba(12,13,36,.78);}
.tl-empty p{margin:0;font-family:var(--f-display);font-weight:var(--fw-display);font-size:17px;line-height:1.9;letter-spacing:.1em;color:var(--gold-hi);}
@media (max-width:760px){
  .tl-head{top:calc(62px + var(--safe-t));} .tl-head h1{font-size:30px;} .tl-head p{font-size:12px;}
  .tl-hint{display:none;}
  .tl-scrub{height:44px;}
  .rc-f b{font-size:13.5px;} .rn-plq .t{font-size:15px;}
  .ring-tbc{font-size:10px;letter-spacing:.26em;} .ring-tbc span{font-size:11.5px;letter-spacing:.24em;}
}

<section class="sb-scene" data-scene="overview" aria-label="时光长卷">
  <div class="ring-year" id="tl-year" aria-hidden="true"></div>
  <header class="tl-head"><small>ANNULUS TEMPORIS</small><h1>时光长卷</h1><p id="tl-sub"></p></header>
  <div class="tl-view" id="tl-view" tabindex="0" role="list" aria-label="按时间排列在时光之环上的全部回忆，可左右拖动转动">
    <canvas class="ring-cv back" id="tl-cv-b" aria-hidden="true"></canvas>
    <div id="tl-track"></div>
    <canvas class="ring-cv front" id="tl-cv-f" aria-hidden="true"></canvas>
    <div class="ring-tbc" id="tl-tbc" aria-hidden="true">TO BE CONTINUED<span>未完待续</span></div>
  </div>
  <div class="tl-scrub" id="tl-scrub" aria-hidden="true"></div>
  <div class="tl-hint" id="tl-hint">拖动 · 滚轮 · ← → 转动时光之环</div>
</section>

<script>
/* 依据 prompts/13-overview.md（v1.10.0「时光之环」）。只读现有 memory 字段，无数据变化。 */
(function(SB){
  const $ = id => document.getElementById(id);
  const scene = document.querySelector('.sb-scene[data-scene="overview"]');
  const view = $('tl-view'), track = $('tl-track'), scrub = $('tl-scrub'), cvB = $('tl-cv-b'), cvF = $('tl-cv-f'), tbc = $('tl-tbc'), yearEl = $('tl-year');
  const S = { list:[], st:[], W:0, H:0, L:null, x:0, target:0, v:0, raf:0, drag:null, moved:0, near:-1, step:1, min:0, max:0, t0:0, t1:1, last:0, clock:0, active:false, hover:-1, intro0:0, year:'' };
  const reduced = () => SB.perf.level === 'reduced', lite = () => SB.perf.level !== 'high';
  const PH = '<svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle r="40"/><circle r="32" stroke-dasharray="2 4"/><path d="M0 -30 L9 -6 L32 0 L9 6 L0 30 L-9 6 L-32 0 L-9 -6Z"/></g></svg>';
  const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  const REEL = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 8.6v6.8l5.6-3.4Z" fill="currentColor"/></svg>';
  const ROMAN = n => { const R = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let o = ''; for(const [v, r] of R) while(n >= v){ o += r; n -= v; } return o || String(n); };
  const CN = n => ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][n] || String(n);

  const sorted = () => [...SB.store.memories].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.createdAt || '').localeCompare(b.createdAt || ''));
  const coverOf = m => m.cover?.id || (m.slides || []).find(s => s.id)?.id || null;
  const ym = d => { const [y, m] = String(d || '').split('-'); return {y:+y || null, m:+m || null}; };
  const tval = d => { const {y, m} = ym(d); return y ? y + ((m || 6) - .5)/12 : null; };
  const mIdx = d => { const {y, m} = ym(d); return y ? y*12 + ((m || 1) - 1) : null; };            // 月序号（用于周年计算）
  const mStr = k => `${Math.floor(k/12)}-${String(k % 12 + 1).padStart(2, '0')}`;
  const dotDate = k => `${Math.floor(k/12)} · ${String(k % 12 + 1).padStart(2, '0')}`;

  /* ── 站点：起点节点 → 记录 …（每满 12 个月插入一个周年节点）… → 「此刻」节点（若最后一个周年之后还有记录） ── */
  function stations(list){
    const out = [], dated = list.filter(m => mIdx(m.date) != null), now = new Date(), nowK = now.getFullYear()*12 + now.getMonth();
    if(!dated.length){ list.forEach(m => out.push({type:'mem', m})); return out; }
    const k0 = mIdx(dated[0].date), annivs = [];
    for(let k = k0 + 12; k <= nowK; k += 12) annivs.push(k);
    out.push({type:'node', kind:'start', k:k0, year:0});
    let ai = 0;
    const seg = (a, b) => list.filter(m => { const v = mIdx(m.date); return v != null && v >= a && (b == null || v < b); });
    for(const m of list){
      const v = mIdx(m.date);
      while(v != null && ai < annivs.length && v >= annivs[ai]){ out.push({type:'node', kind:'anniv', k:annivs[ai], year:ai + 1, from:annivs[ai] - 12, list:seg(annivs[ai] - 12, annivs[ai])}); ai++; }
      out.push({type:'mem', m});
    }
    // 记录之后、不晚于本月的周年节点也要出现（那一年可能没有新记录）
    while(ai < annivs.length){ out.push({type:'node', kind:'anniv', k:annivs[ai], year:ai + 1, from:annivs[ai] - 12, list:seg(annivs[ai] - 12, annivs[ai])}); ai++; }
    const lastK = annivs.length ? annivs[annivs.length - 1] : k0, rest = seg(lastK, null);
    if(rest.length && (annivs.length ? rest.length : true)) out.push({type:'node', kind:'now', k:nowK, year:annivs.length + 1, from:lastK, list:rest});
    return out;
  }

  /* ── 透视投影（世界：X 右、Y 上、Z 朝向观众；相机俯视 α） ── */
  function layout(){
    const W = S.W = view.clientWidth || innerWidth, H = S.H = view.clientHeight || innerHeight, narrow = W <= 760, N = S.st.length;
    const R = 1000, D = R*3.1, thF = narrow ? .14 : .32, gap = .66;     // 焦点在前方略偏右；缺口约 38°
    const dth = N > 1 ? (Math.PI*2 - gap)/(N - 1) : 0;
    const head = narrow ? 132 : 146, bottom = narrow ? 92 : 86, cx = narrow ? W*.5 : W*.47;
    let hw = narrow ? W*.44 : Math.min(W*.41, 640), a = narrow ? .4 : .3;
    let cw = narrow ? Math.min(W*.42, 210) : SB.clamp(W*.17, 150, 236);
    cw = Math.min(cw, (H - head - bottom)*.58/1.62);
    // 求解：先让焦点卡片底边贴近可用区域底部；若环的后缘顶到标题，先压平俯角，再整体缩小
    let L;
    for(let it = 0; it < 24; it++){
      const ca = Math.cos(a), sa = Math.sin(a), f = hw*D/R, zF = R*Math.cos(thF)*ca, sF = f/(D - zF);
      let c = cw; if(N > 1){ const room = R*dth*sF*Math.cos(thF); if(room < c*.92) c = Math.max(cw*.6, room/.92); }
      const thrPx = Math.round(c*.32), cardH = thrPx + 7 + c*1.25 + 4;
      const cy = H - bottom - cardH - R*Math.cos(thF)*sa*sF, yBack = cy - R*sa*f/(D + R*ca);
      L = {W, H, R, D, a, ca, sa, thF, gap, dth, f, cx, cy, sF, cw:Math.round(c), thrPx, narrow};
      if(yBack >= head + 14) break;
      if(a > .17) a -= .025; else { hw *= .95; cw *= .96; }
    }
    S.L = L;
    S.step = N > 1 ? Math.max(40, R*dth*L.sF*.92) : 1;
    scene.style.setProperty('--cw', L.cw + 'px'); scene.style.setProperty('--thr', L.thrPx + 'px');
    const dpr = Math.min(devicePixelRatio || 1, lite() ? 1 : 1.5);
    for(const cv of [cvB, cvF]){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv._dpr = dpr; }
  }
  function proj(X, Y, Z){
    const L = S.L, Yp = Y*L.ca - Z*L.sa, Zp = Y*L.sa + Z*L.ca, s = L.f/(L.D - Zp);
    return {x:L.cx + X*s, y:L.cy - Yp*s, s, z:Zp};
  }
  const uNow = () => S.step ? S.x/S.step : 0;
  const worldAng = (k, u) => S.L.thF + (k - u)*S.L.dth;      // 第 k 个站点此刻的世界角（0 = 正前方）

  /* ── 构建 DOM ── */
  function build(intro){
    S.list = sorted(); S.st = stations(S.list);
    track.innerHTML = ''; scene.querySelector('.tl-empty')?.remove();
    layout();
    const N = S.st.length;
    S.st.forEach((o, i) => {
      o.i = i; o.spin = (i*97) % 360; o.ph = i*1.7;
      const el = SB.el('div', 'ring-st ' + o.type + (o.kind ? ' ' + o.kind : '')); el.setAttribute('role', 'listitem');
      const inner = SB.el('div', 'in'); el.appendChild(inner); inner.style.setProperty('--dl', (300 + Math.min(14, Math.abs(N - 1 - i))*70) + 'ms');
      inner.appendChild(SB.el('i', 'thr')); inner.appendChild(SB.el('i', 'knot'));
      if(o.type === 'mem') inner.appendChild(memCard(o));
      else inner.appendChild(nodePlaque(o));
      o.el = el; track.appendChild(el);
    });
    S.min = 0; S.max = Math.max(0, (N - 1)*S.step);
    S.x = S.target = S.max; S.v = 0;               // 默认停在最新的站点：两端都在页面右侧
    const n = S.list.length, cities = new Set(S.list.map(m => m.cityId)).size, first = S.list.find(m => m.date), last = [...S.list].reverse().find(m => m.date);
    const years = S.st.filter(o => o.kind === 'anniv').length;
    $('tl-sub').textContent = n ? `${n} 段回忆 · ${cities} 座城市${first && last ? ' · 从 ' + SB.fmtDate(first.date) + ' 到 ' + SB.fmtDate(last.date) : ''}${years ? ' · ' + years + ' 个周年' : ''}` : '';
    buildScrub();
    $('tl-hint').hidden = !n;
    if(!n){
      const e = SB.el('div', 'tl-empty', '<p>时光长卷还是空白<br>从世界星图点亮第一座城市，写下第一段回忆吧</p>');
      e.appendChild(SB.ui.button('前往世界星图', 'primary', () => SB.scenes.go('globe', {}, {transition:'flash'}))); scene.appendChild(e);
    }
    S.intro0 = intro && !reduced() ? performance.now() : 0;
    if(S.intro0){ scene.classList.remove('intro'); void scene.offsetWidth; scene.classList.add('intro'); clearTimeout(S.introT); S.introT = setTimeout(() => scene.classList.remove('intro'), 2600); }
    S.year = ''; render(performance.now());
  }
  function memCard(o){
    const m = o.m, c = SB.store.city(m.cityId), cov = coverOf(m), url = cov ? SB.store.url(cov) : '', n = (m.slides || []).filter(s => s.id).length;
    const card = SB.el('button', 'rc'); card.type = 'button';
    card.setAttribute('aria-label', `${m.title || '回忆'}，${SB.fmtDate(m.date)}${c ? '，' + c.name : ''}，打开放映`);
    card.innerHTML = `<span class="rc-flip"><span class="rc-f front">${url ? `<img alt="" loading="lazy" decoding="async" draggable="false" src="${SB.esc(url)}">` : `<span class="ph">${PH}</span>`}
      ${c ? `<span class="rc-city" role="link" tabindex="-1">${PIN}<span></span></span>` : ''}<span class="cap"><span class="dt"></span><b></b></span></span>
      <span class="rc-f back"><span class="rn">MEMORIA</span>${SB.icon('star')}<b></b><span class="dt"></span><span class="meta"></span></span></span>`;
    card.querySelectorAll('.dt').forEach(x => x.textContent = SB.fmtDate(m.date) || '未标日期');
    card.querySelectorAll('b').forEach(x => x.textContent = m.title || '未命名的回忆');
    card.querySelector('.meta').textContent = [c?.name, n ? n + ' 张照片' : ''].filter(Boolean).join(' · ');
    if(c){ const ce = card.querySelector('.rc-city'); ce.querySelector('span').textContent = c.name;
      ce.addEventListener('click', e => { e.stopPropagation(); if(S.moved > 6) return; SB.scenes.go('city', {id:c.id}, {transition:'quill', x:e.clientX, y:e.clientY}); }); }
    card.addEventListener('click', e => { if(S.moved > 6) return;
      if(o.i !== S.near && Math.abs(o.i - uNow()) > .6){ center(o.i); return; }      // 不在焦点：先转过来
      SB.scenes.go('player', {id:m.id, from:'overview'}, {transition:'pensieve', x:e.clientX, y:e.clientY}); });
    card.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') S.hover = o.i; });
    card.addEventListener('pointerleave', () => { if(S.hover === o.i) S.hover = -1; });
    card.addEventListener('focus', () => center(o.i));
    return card;
  }
  function nodePlaque(o){
    const p = SB.el('div', 'rn-plq');
    if(o.kind === 'start'){
      p.innerHTML = `<span class="k">INITIUM</span><span class="t">故事的起点</span><span class="d">${dotDate(o.k)}</span>`;
      return p;
    }
    const n = o.list.length;
    p.innerHTML = o.kind === 'now'
      ? `<span class="k">ANNUS ${ROMAN(o.year)} · NUNC</span><span class="t">第${CN(o.year)}年 · 至今</span><span class="d">${dotDate(o.from)} — 此刻</span><span class="n">${n} 段回忆</span>`
      : `<span class="k">ANNIVERSARIUM · ${ROMAN(o.year)}</span><span class="t">${o.year === 1 ? '一周年' : CN(o.year) + '周年'}</span><span class="d">${dotDate(o.k)}</span><span class="n">这一年 · ${n} 段回忆</span>`;
    if(n){
      const b = SB.el('button', 'rn-go', `${REEL}<span><small>ANNIVERSARY</small> 时光剪影</span>`); b.type = 'button';
      b.setAttribute('aria-label', `时光剪影：放映第${CN(o.year)}年的 ${n} 段回忆`);
      b.addEventListener('click', e => { e.stopPropagation(); if(S.moved > 6) return;
        SB.yearReel?.open({year:o.year, from:mStr(o.from), to:o.kind === 'now' ? null : mStr(o.k), list:o.list, now:o.kind === 'now'}); });
      p.appendChild(b);
    }
    return p;
  }
  function buildScrub(){
    scrub.innerHTML = '<i class="ln"></i>';
    const ts = S.list.map(m => tval(m.date)).filter(v => v != null);
    if(!ts.length){ scrub.hidden = true; S.win = null; return; }
    scrub.hidden = false;
    S.t0 = Math.min(...ts); S.t1 = Math.max(...ts); if(S.t1 - S.t0 < .5){ S.t0 -= .5; S.t1 += .5; }
    const f = t => SB.clamp((t - S.t0)/(S.t1 - S.t0)*100, 0, 100);
    for(let y = Math.ceil(S.t0); y <= Math.floor(S.t1); y++){ const d = SB.el('span', 'yr'); d.textContent = y; d.style.left = f(y) + '%'; scrub.appendChild(d); }
    S.list.forEach(m => { const t = tval(m.date); if(t == null) return; const d = SB.el('i', 'dot'); d.style.left = f(t) + '%'; scrub.appendChild(d); });
    S.st.filter(o => o.kind === 'anniv').forEach(o => { const d = SB.el('i', 'an'); d.style.left = f(o.k/12 + 1/24) + '%'; scrub.appendChild(d); });
    S.win = SB.el('i', 'win'); scrub.appendChild(S.win);
  }
  const stTime = o => o.type === 'mem' ? tval(o.m.date) : o.k/12 + 1/24;

  /* ── 渲染：站点位置 / 卡片自转与摆动 / 两层环线 ── */
  function render(now){
    const L = S.L; if(!L) return;
    const u = uNow(), t = S.clock/1000, N = S.st.length;
    let best = -1, bd = 1e9;
    for(const o of S.st){
      const w = worldAng(o.i, u), X = L.R*Math.sin(w), Z = L.R*Math.cos(w), p = proj(X, 0, Z);
      const dn = SB.clamp((p.z/(L.R*L.ca) + 1)/2, 0, 1);          // 0 最远 … 1 最近
      o.p = p; o.dn = dn;
      const k = p.s/L.sF, sway = reduced() ? 0 : Math.sin(t*.9 + o.ph)*1.6;
      o.el.style.transform = `translate3d(${(p.x - L.cw/2).toFixed(1)}px,${p.y.toFixed(1)}px,0) scale(${k.toFixed(4)}) rotate(${sway.toFixed(2)}deg)`;
      // 只在数值变化时写入（层级变化会触发重新分层）
      const op = (.3 + .7*Math.pow(dn, 1.3)).toFixed(2), zi = String(Math.round((1000 + p.z/L.R*900)/8)*8 + (o.i === S.near ? 600 : 0)), front = p.z > -L.R*.1;
      if(o._op !== op){ o._op = op; o.el.style.opacity = op; }
      if(o._zi !== zi){ o._zi = zi; o.el.style.zIndex = zi; }
      if(o._fr !== front){ o._fr = front; o.el.classList.toggle('live', front); }
      if(Math.abs(o.i - u) < bd){ bd = Math.abs(o.i - u); best = o.i; }
    }
    if(best !== S.near){ S.st[S.near]?.el.classList.remove('focus'); S.st[best]?.el.classList.add('focus'); S.near = best; }
    // 卡片缓慢自转（约 24 秒一圈）；焦点 / 悬停时平滑转回正面
    const dt = S.dtLast || 0;
    for(const o of S.st){
      if(o.type !== 'mem') continue;
      const flip = o.flip || (o.flip = o.el.querySelector('.rc-flip')), face = o.i === S.near || o.i === S.hover;
      if(reduced()) o.spin = 0;
      else if(face){ const tgt = Math.round(o.spin/360)*360; o.spin += (tgt - o.spin)*Math.min(1, dt*4); }
      else o.spin += dt*15;
      if(o._spin !== o.spin.toFixed(1)){ o._spin = o.spin.toFixed(1); flip.style.transform = `rotateY(${o._spin}deg)`;
        const c = Math.cos(o.spin*Math.PI/180); flip.style.setProperty('--sheen', Math.max(0, Math.sin(o.spin*Math.PI/180)*.9).toFixed(2)); }
    }
    drawRing(u, t);
    // 背景年份
    const fo = S.st[best], yv = fo ? (fo.type === 'mem' ? ym(fo.m.date).y : Math.floor(fo.k/12)) : null, ys = yv ? String(yv) : '';
    if(ys !== S.year){ S.year = ys; yearEl.classList.add('swap'); clearTimeout(S.yT); S.yT = setTimeout(() => { yearEl.textContent = S.year; yearEl.classList.remove('swap'); }, 320); }
    if(S.win && fo){ const tv = stTime(fo); if(tv != null) S.win.style.left = SB.clamp((tv - S.t0)/(S.t1 - S.t0)*100, 0, 100).toFixed(2) + '%'; }
  }
  function drawRing(u, t){
    const L = S.L, N = Math.max(1, S.st.length);
    const intro = S.intro0 ? SB.clamp((performance.now() - S.intro0)/1500, 0, 1) : 1, ei = 1 - Math.pow(1 - intro, 3);
    for(const cv of [cvB, cvF]){ const g = cv.getContext('2d'); g.setTransform(cv._dpr, 0, 0, cv._dpr, 0, 0); g.clearRect(0, 0, L.W, L.H); }
    const gB = cvB.getContext('2d'), gF = cvF.getContext('2d');
    // 环：从起点画到终点（开场时由终点向起点逐渐画出）；按纵深分桶合并路径，每帧只描边十几次
    const steps = lite() ? 110 : 170, B = 8, paths = [[], []];
    let prev = null;
    for(let j = 0; j <= steps; j++){
      const kk = (N - 1) - (N - 1)*ei + (N - 1)*ei*(j/steps);
      const w = worldAng(kk, u), p = proj(L.R*Math.sin(w), 0, L.R*Math.cos(w));
      if(prev){ const zf = (p.z + prev.z)/2, dn = SB.clamp((zf/(L.R*L.ca) + 1)/2, 0, 1), b = Math.round(dn*B), side = zf >= 0 ? 1 : 0;
        (paths[side][b] || (paths[side][b] = [])).push(prev.x, prev.y, p.x, p.y); }
      prev = p;
    }
    paths.forEach((arr, side) => { const g = side ? gF : gB; g.lineCap = 'round';
      arr.forEach((seg, b) => { if(!seg) return; const dn = b/B; g.strokeStyle = `rgba(240,212,156,${(.16 + .62*dn).toFixed(3)})`; g.lineWidth = .6 + 1.8*dn;
        g.beginPath(); for(let i = 0; i < seg.length; i += 4){ g.moveTo(seg[i], seg[i + 1]); g.lineTo(seg[i + 2], seg[i + 3]); } g.stroke(); }); });
    // 延伸线：从终点继续，半径逐渐增大、略微下沉，从起点外侧伸出画面
    const endK = N - 1, tailSpan = L.gap + .9, pts = [];
    for(let j = 0; j <= 60; j++){
      const q = j/60, w = worldAng(endK, u) + q*tailSpan, r = L.R*(1 + 1.3*Math.pow(q, 1.5)), Y = L.R*.75*Math.pow(q, 1.4);   // 向外、向上飞出（避开下方悬挂的卡片）
      pts.push({...proj(r*Math.sin(w), Y, r*Math.cos(w)), q});
    }
    if(intro > .6){
      const ta = SB.clamp((intro - .6)/.4, 0, 1);
      for(let j = 1; j < pts.length; j++){ const a = pts[j - 1], b = pts[j], g = b.z >= 0 ? gF : gB, fade = Math.pow(1 - b.q, .9)*ta;
        g.strokeStyle = `rgba(255,226,170,${(.7*fade).toFixed(3)})`; g.lineWidth = 1 + 1.6*(1 - b.q); g.setLineDash(b.q > .45 ? [6, 8] : []);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
      gF.setLineDash([]); gB.setLineDash([]);
      // 「未完待续」文字放在延伸线中段
      // 标签贴在延伸线即将离开画面的地方（线的上方），并保持在画面内
      let lab = null; for(let j = 59; j >= 8; j--){ const q = pts[j]; if(q.x > 24 && q.x < L.W - 24 && q.y > 70 && q.y < L.H - 70){ lab = L.narrow ? {x:L.W - 168, y:SB.clamp(q.y - 70, 150, L.H*.4)} : {x:Math.min(q.x - 20, L.W - 210), y:Math.max(q.y + 16, 160)}; break; } }
      // 只有终点转到前方附近时才显示（避免压在卡片上）
      const eo = S.st[endK]?.dn ?? 0, vis = SB.clamp((eo - .62)/.2, 0, 1);
      if(lab){ tbc.style.transform = `translate3d(${lab.x.toFixed(1)}px,${lab.y.toFixed(1)}px,0)`; tbc.style.opacity = (ta*.95*vis).toFixed(2); } else tbc.style.opacity = '0';
      // 向外流动的光点
      if(!reduced()) for(let i = 0; i < (lite() ? 3 : 5); i++){ const q = ((t*.11 + i/5) % 1), idx = Math.min(59, Math.floor(q*60)), p = pts[idx], g = p.z >= 0 ? gF : gB;
        glow(g, p.x, p.y, 2.2 + 2*(1 - q), (1 - q)*.9*ta); }
    } else tbc.style.opacity = '0';
    // 环上流动的金色光点（从起点流向终点）
    if(!reduced() && N > 1) for(let i = 0; i < (lite() ? 4 : 7); i++){ const kk = ((t*.025 + i/7) % 1)*(N - 1)*ei + (N - 1)*(1 - ei), w = worldAng(kk, u), p = proj(L.R*Math.sin(w), 0, L.R*Math.cos(w)), dn = SB.clamp((p.z/(L.R*L.ca) + 1)/2, 0, 1);
      glow(p.z >= 0 ? gF : gB, p.x, p.y, 1.6 + 2.2*dn, .35 + .55*dn); }
    // 周年节点：环上的发光星环
    for(const o of S.st){ if(o.type !== 'node' || !o.p) continue; const g = o.p.z >= 0 ? gF : gB, r = (o.kind === 'start' ? 6 : 8)*o.p.s/L.sF;
      glow(g, o.p.x, o.p.y, r*2.4, .9*o.dn + .1); g.strokeStyle = `rgba(255,232,190,${(.4 + .55*o.dn).toFixed(3)})`; g.lineWidth = 1.2; g.beginPath(); g.arc(o.p.x, o.p.y, r, 0, Math.PI*2); g.stroke(); }
  }
  function glow(g, x, y, r, a){
    if(a <= .01) return;
    const gr = g.createRadialGradient(x, y, 0, x, y, r*3); gr.addColorStop(0, `rgba(255,244,214,${a.toFixed(3)})`); gr.addColorStop(.35, `rgba(255,206,130,${(a*.45).toFixed(3)})`); gr.addColorStop(1, 'rgba(255,190,100,0)');
    g.fillStyle = gr; g.fillRect(x - r*3, y - r*3, r*6, r*6);
  }

  /* ── 运动：拖动 / 惯性 / 缓动跳转；场景激活时持续运行（自转、摆动、光点） ── */
  function loop(now){
    S.raf = 0;
    if(!S.active) return;
    if(lite() && S.last && now - S.last < 1000/30 - 4){ S.raf = requestAnimationFrame(loop); return; }
    const dt = Math.min(.05, (now - (S.last || now))/1000) || 1/60; S.last = now; S.dtLast = dt; S.clock += dt*1000;
    if(!S.drag){
      if(Math.abs(S.v) > .05){ S.target += S.v*dt*60; S.v *= Math.pow(.92, dt*60); } else S.v = 0;
      if(S.target < S.min){ S.target = SB.lerp(S.target, S.min, Math.min(1, dt*10)); S.v *= .5; }
      if(S.target > S.max){ S.target = SB.lerp(S.target, S.max, Math.min(1, dt*10)); S.v *= .5; }
    }
    S.x = reduced() || S.drag ? S.target : SB.lerp(S.x, S.target, Math.min(1, dt*7));
    if(!S.drag && Math.abs(S.v) <= .05 && Math.abs(S.x - S.target) < .3) S.x = S.target = SB.clamp(S.target, S.min, S.max);
    render(now);
    const moving = S.drag || Math.abs(S.v) > .05 || Math.abs(S.x - S.target) > .3 || (S.intro0 && now - S.intro0 < 1700);
    if(!reduced() || moving) S.raf = requestAnimationFrame(loop); else S.last = 0;
  }
  const kick = () => { if(!S.raf && S.active){ S.last = 0; S.raf = requestAnimationFrame(loop); } };
  function center(i){ if(i < 0 || i >= S.st.length) return; S.v = 0; S.target = i*S.step; if(reduced()) S.x = S.target; kick(); }
  const rubber = t => t < S.min ? S.min - Math.min(80, (S.min - t)*.35) : t > S.max ? S.max + Math.min(80, (t - S.max)*.35) : t;

  view.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    S.drag = {id:e.pointerId, px:e.clientX, x0:S.target, lastX:e.clientX, lastT:performance.now(), v:0}; S.moved = 0; S.v = 0;
    kick();
  });
  view.addEventListener('pointermove', e => {
    const d = S.drag; if(!d || d.id !== e.pointerId) return;
    const dx = e.clientX - d.px; S.moved = Math.max(S.moved, Math.abs(dx));
    if(S.moved > 6 && !view.classList.contains('drag')){ view.classList.add('drag'); try{ view.setPointerCapture(e.pointerId); }catch(_){} }
    const now = performance.now(), ddt = Math.max(1, now - d.lastT);
    d.v = SB.lerp(d.v, -(e.clientX - d.lastX)/ddt*16.7, .5); d.lastX = e.clientX; d.lastT = now;
    S.target = rubber(d.x0 - dx);
  });
  const up = e => {
    const d = S.drag; if(!d || d.id !== e.pointerId) return;
    S.drag = null; view.classList.remove('drag');
    if(performance.now() - d.lastT < 90) S.v = SB.clamp(d.v, -60, 60);
    // 惯性结束后吸附到最近的站点
    const land = SB.clamp(Math.round((S.target + S.v*12)/S.step), 0, Math.max(0, S.st.length - 1));
    S.v = 0; S.target = land*S.step;
    kick(); setTimeout(() => { S.moved = 0; }, 0);
  };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
  let wheelT = 0;
  view.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!d) return; e.preventDefault();
    S.v = 0; S.target = SB.clamp(S.target + d*(e.deltaMode === 1 ? 30 : 1)*.8, S.min - 40, S.max + 40); kick();
    clearTimeout(wheelT); wheelT = setTimeout(() => { S.target = SB.clamp(Math.round(S.target/S.step), 0, Math.max(0, S.st.length - 1))*S.step; kick(); }, 180);
  }, {passive:false});
  view.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); center(SB.clamp((S.near < 0 ? 0 : S.near) + (e.key === 'ArrowRight' ? 1 : -1), 0, S.st.length - 1)); }
    else if(e.key === 'Home'){ e.preventDefault(); center(0); } else if(e.key === 'End'){ e.preventDefault(); center(S.st.length - 1); }
  });
  function scrubTo(clientX){
    const r = scrub.getBoundingClientRect(), t = S.t0 + SB.clamp((clientX - r.left)/r.width, 0, 1)*(S.t1 - S.t0);
    let bi = 0, bd = 1e9; S.st.forEach((o, i) => { const v = stTime(o); if(v != null && Math.abs(v - t) < bd){ bd = Math.abs(v - t); bi = i; } });
    center(bi);
  }
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); scrub._d = true; scrubTo(e.clientX); });
  scrub.addEventListener('pointermove', e => { if(scrub._d) scrubTo(e.clientX); });
  scrub.addEventListener('pointerup', () => { scrub._d = false; }); scrub.addEventListener('pointercancel', () => { scrub._d = false; });
  let rsT = 0;
  addEventListener('resize', () => { if(SB.scenes.current !== 'overview') return; clearTimeout(rsT); rsT = setTimeout(() => { const keep = S.near; build(false); if(keep >= 0){ S.x = S.target = SB.clamp(keep, 0, S.st.length - 1)*S.step; render(); } kick(); }, 150); });
  document.addEventListener('sb:data', () => { if(SB.scenes.current !== 'overview') return; const keep = S.near; build(false); if(keep >= 0){ S.x = S.target = SB.clamp(keep, 0, S.st.length - 1)*S.step; } kick(); });
  document.addEventListener('visibilitychange', () => { if(document.hidden){ cancelAnimationFrame(S.raf); S.raf = 0; } else kick(); });

  SB.scenes.register('overview', {
    world:'night', deepLink:true,
    title:() => '时光长卷',
    parent:() => ({id:'globe', params:{}}),
    async prepare(){
      // 先签名离「最新」最近的若干封面，进入时首屏不出现空白相框
      const ids = sorted().slice(-16).map(coverOf).filter(Boolean);
      if(ids.length) await SB.store.prefetchUrls?.(ids);
    },
    enter(p, opts){ SB.fx.palette('night'); S.active = true; S.clock = 0; build(!opts?.back); kick(); },
    leave(){ S.active = false; cancelAnimationFrame(S.raf); S.raf = 0; S.drag = null; SB.yearReel?.close?.(true); }
  });
  SB.overview = { get state(){ return {n:S.st.length, near:S.near, u:uNow(), nodes:S.st.filter(o => o.type === 'node').map(o => ({kind:o.kind, year:o.year, k:o.k, count:o.list?.length ?? 0, i:o.i}))}; }, center };
  SB.menu.add({id:'overview', order:40, icon:'scroll', label:'时光长卷',
    desc:() => { const l = sorted().filter(m => m.date); const n = SB.store.memories.length;
      return n ? `${n} 段回忆${l.length ? ' · 从 ' + ym(l[0].date).y + ' 到 ' + ym(l[l.length - 1].date).y : ''}` : '我们的故事从这里开始'; },
    scene:'overview', sceneOpts:{transition:'quill'}});
})(window.SB);
</script>
