<style>
/* ── 块 13 ·「时光长卷」「时光之环」（场景 id 仍为 overview，保持深链与历史兼容）──
   v1.10.0：自做透视投影（不使用共享 preserve-3d 场景），环线画在前 / 后两层 canvas，记录悬挂在环上。
   v1.10.1（prompts/13-overview.md v1.10.1 节）：
   · 远近分级：只有焦点附近几段是完整卡片，其余收成环上的「光珠」（canvas 绘制）；鱼眼间距保证卡片之间不重叠；
   · 图片主动预取 + 解码后淡入（不再使用 loading=lazy），数据刷新时不重建整环（之前签名回调会反复重建 → 闪烁）；
   · 卡片不再整圈自转（不切换正反面），只保留缓慢的偏转与摆动；层级带滞回，不再来回抢层；
   · 延伸线顺着环继续向前、渐细渐虚、淡入星空，线头一点光像仍在书写的笔，「未完待续」沿线排字；
   · 点击任意光珠 / 卡片 / 节点 / 刻度：沿最短路径一次转到（远距离途中卡片收起、到达后展开）；
   · 日期精确到日；周年按「我们的纪念日」（settings.anniversary，可选）每年同一天计算。 */
.sb-scene[data-scene="overview"]{overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.tl-head{position:absolute;left:0;right:0;top:calc(66px + var(--safe-t));z-index:2100;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 16px;}

  color:var(--gold);font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.1em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .3s,background .3s;}
.tl-anni:hover{border-color:rgba(255,226,168,.7);background:rgba(244,184,96,.14);}

.tl-anni .ed{width:12px;height:12px;opacity:.7;}

.tl-anni[hidden]{display:none;}
.tl-view{position:absolute;inset:0;cursor:grab;outline:none;}

.ring-cv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}

  color:transparent;-webkit-text-stroke:1px rgba(236,206,140,.12);white-space:nowrap;transition:opacity .7s var(--ease-soft);}
.ring-year.swap{opacity:0;}
/* 站点：悬挂物（线 + 卡片 / 铭牌），锚点在环上；不在窗口内的站点 display:none（由光珠代替） */
.ring-st{position:absolute;left:0;top:0;width:var(--cw);transform-origin:50% 0;will-change:transform,opacity;pointer-events:none;}
.ring-st.off{display:none;}
.ring-st .in{display:flex;flex-direction:column;align-items:center;}
.ring-st .thr{display:block;width:1px;height:var(--thr);background:linear-gradient(rgba(255,232,188,.9),rgba(232,200,140,.45));box-shadow:0 0 4px rgba(244,184,96,.5);}

/* 3D 卡片：单面（不再切换正反面，避免闪烁）；偏转由每张卡片自己的透视完成 */
.rc{position:relative;display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;color:var(--text);perspective:900px;-webkit-tap-highlight-color:transparent;}

.rc-city{position:absolute;top:7px;left:7px;z-index:3;display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:999px;border:1px solid rgba(240,214,160,.45);
  background:rgba(8,9,26,.7);font-family:var(--f-display);font-weight:var(--fw-display);font-size:11.5px;letter-spacing:.08em;color:var(--gold-hi);cursor:pointer;}

.ring-st.focus .rc-f.front{box-shadow:inset 0 0 0 1px rgba(255,240,206,.95),0 0 0 3px rgba(14,15,40,.9),0 0 0 4px rgba(244,184,96,.65),0 20px 44px rgba(0,0,0,.55),0 0 34px rgba(244,184,96,.3);}
/* 周年节点铭牌 */
.ring-st.node .thr{height:calc(var(--thr) * .6);}
.rn-plq{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:calc(var(--cw) * .9);padding:12px 12px 13px;border-radius:10px;text-align:center;cursor:pointer;
  border:1px solid rgba(255,226,168,.55);background:linear-gradient(180deg,rgba(40,30,60,.94),rgba(16,12,30,.95));box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 22px rgba(244,184,96,.16);}

  background:linear-gradient(180deg,#ffe7b5,#f4b860 60%,#d0913e);box-shadow:0 0 18px rgba(244,184,96,.45),inset 0 1px 0 rgba(255,255,255,.6);font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.08em;
  -webkit-tap-highlight-color:transparent;transition:transform .3s var(--ease-soft), box-shadow .3s;}

/* 光珠悬停提示（仅鼠标） */
.ring-tip{position:absolute;left:0;top:0;z-index:2050;pointer-events:none;white-space:nowrap;padding:6px 11px;border-radius:8px;border:1px solid rgba(240,214,160,.4);background:rgba(10,10,30,.86);
  font-size:12px;letter-spacing:.06em;color:var(--text);opacity:0;transition:opacity .2s;transform:translate(-50%,calc(-100% - 12px));}

/* 年轮刻度条 */
.tl-scrub{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--safe-b));width:min(720px, calc(100% - 40px));height:38px;z-index:2100;cursor:pointer;touch-action:none;}
.tl-scrub .ln{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(232,200,140,.32);}
.tl-scrub .dot{position:absolute;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgba(240,214,160,.75);}
.tl-scrub .an{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);border:1px solid var(--gold-hi);background:rgba(20,16,40,.9);box-shadow:0 0 8px rgba(244,184,96,.6);}
.tl-scrub .yr{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--gold-dim);}
.tl-scrub .yr::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:8px;background:rgba(232,200,140,.45);}
.tl-scrub .win{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1px solid rgba(255,226,168,.9);background:rgba(244,184,96,.22);box-shadow:0 0 12px rgba(244,184,96,.5);}
.tl-hint{position:absolute;right:calc(22px + var(--safe-r));bottom:calc(68px + var(--safe-b));z-index:2100;font-size:12px;letter-spacing:.14em;color:var(--text-dim);opacity:.7;pointer-events:none;}
.tl-empty{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2100;width:min(440px,calc(100% - 40px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:26px 22px;border-radius:16px;border:1px solid rgba(240,214,160,.3);background:rgba(12,13,36,.78);}
.tl-empty p{margin:0;font-family:var(--f-display);font-weight:var(--fw-display);font-size:17px;line-height:1.9;letter-spacing:.1em;color:var(--gold-hi);}
/* 纪念日弹窗 */
.tl-anni-dlg .sb-input{font-family:var(--f-num);font-size:17px;letter-spacing:.08em;color-scheme:dark;}
.tl-anni-dlg p{margin:10px 0 0;font-size:12.5px;line-height:1.8;letter-spacing:.04em;color:var(--text-dim);}
@media (max-width:760px){
  .tl-head{top:calc(62px + var(--safe-t));} .tl-head h1{font-size:30px;} .tl-head p{font-size:12px;}
  .tl-anni{font-size:11.5px;padding:4px 11px 4px 9px;} .tl-anni em{display:none;}
  .tl-hint{display:none;}
  .tl-scrub{height:44px;}
  .rc-f b{font-size:13.5px;} .rn-plq .t{font-size:15px;}
  .rn-plq{padding:10px 8px 11px;} .rn-plq .k{font-size:9px;letter-spacing:.24em;padding-left:.24em;white-space:nowrap;} .rn-plq .d{font-size:11.5px;letter-spacing:.06em;white-space:nowrap;}
}

<section class="sb-scene" data-scene="overview" aria-label="时光长卷">
  <div class="ring-year" id="tl-year" aria-hidden="true"></div>
  <header class="tl-head"><small>ANNULUS TEMPORIS</small><h1>时光长卷</h1><p id="tl-sub"></p><button type="button" class="tl-anni" id="tl-anni" hidden></button></header>
  <div class="tl-view" id="tl-view" tabindex="0" role="list" aria-label="按时间排列在时光之环上的全部回忆，可左右拖动转动，点击任意光点直接转到">

<script>
/* 依据 prompts/13-overview.md（v1.10.0「时光之环」+ v1.10.1 优化）。只读 memory 字段；纪念日写入 settings.anniversary（可选，book_data.payload 内，无 schema 变化）。 */
(function(SB){
  const $ = id => document.getElementById(id);
  const D = SB.date;
  const scene = document.querySelector('.sb-scene[data-scene="overview"]');
  const view = $('tl-view'), track = $('tl-track'), scrub = $('tl-scrub'), cvB = $('tl-cv-b'), cvF = $('tl-cv-f'), yearEl = $('tl-year'), tip = $('tl-tip'), anniBtn = $('tl-anni');
  const S = { list:[], st:[], W:0, H:0, L:null, x:0, target:0, v:0, raf:0, drag:null, moved:0, near:-1, step:1, min:0, max:0, t0:0, t1:1, last:0, clock:0, active:false,
    hover:-1, hb:-1, intro0:0, year:'', tw:null, cg:1, arc:null, sig:'', anchor:null, imgT:0 };
  const reduced = () => SB.perf.level === 'reduced', lite = () => SB.perf.level !== 'high';
  const PH = '<svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle r="40"/><circle r="32" stroke-dasharray="2 4"/><path d="M0 -30 L9 -6 L32 0 L9 6 L0 30 L-9 6 L-32 0 L-9 -6Z"/></g></svg>';
  const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  const REEL = '<svg class="sb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 8.6v6.8l5.6-3.4Z" fill="currentColor"/></svg>';
  const PEN = '<svg class="ed" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const ROMAN = n => { const R = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let o = ''; for(const [v, r] of R) while(n >= v){ o += r; n -= v; } return o || String(n); };
  const CN = n => ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][n] || String(n);
  const smooth = (a, b, x) => { const t = SB.clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
  const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;

  const dayOf = m => D.day(m.date);
  // 按日排序（只有年月的旧回忆视为当月 1 日），同一天按创建先后；未标日期的放最后
  const sorted = () => [...SB.store.memories].sort((a, b) => ((dayOf(a) ?? 1e9) - (dayOf(b) ?? 1e9)) || (a.createdAt || '').localeCompare(b.createdAt || ''));
  const coverOf = m => m.cover?.id || (m.slides || []).find(s => s.id)?.id || null;
  const dotK = k => D.dot(D.str(k));
  const yearOfK = k => +D.str(k).slice(0, 4);

  /* ── 故事起点：settings.anniversary（我们的纪念日，YYYY-MM-DD）优先；未设置时取最早一段回忆的日期 ── */
  function anchorOf(list){
    const a = SB.store.settings?.anniversary;
    if(a && D.valid(a) && D.hasDay(a)) return {d:a, set:true};
    const f = list.find(m => dayOf(m) != null);
    return f ? {d:D.str(dayOf(f)), set:false} : null;
  }
  /* ── 站点：起点节点 → 记录 …（每年纪念日插入一个周年节点，精确到日）… → 「至今」节点（最后一个周年之后还有记录时） ── */
  function stations(list){
    const out = [], A = S.anchor = anchorOf(list);
    if(!A){ list.forEach(m => out.push({type:'mem', m})); return out; }
    const a0 = D.day(A.d), today = D.today(), annivs = [];
    for(let n = 1; n < 80; n++){ const k = D.addYears(A.d, n); if(k > today) break; annivs.push(k); }
    // 第一年也包含纪念日之前的回忆（例如相识早于纪念日）
    const seg = (a, b) => list.filter(m => { const v = dayOf(m); return v != null && (a == null || v >= a) && (b == null || v < b); });
    const nodes = [{type:'node', kind:'start', k:a0, year:0, set:A.set}];
    annivs.forEach((k, i) => nodes.push({type:'node', kind:'anniv', k, year:i + 1, from:i ? annivs[i - 1] : a0, list:seg(i ? annivs[i - 1] : null, k)}));
    const dated = list.filter(m => dayOf(m) != null), und = list.filter(m => dayOf(m) == null);
    const ev = [...nodes.map(o => ({k:o.k, r:0, j:0, o})), ...dated.map((m, j) => ({k:dayOf(m), r:1, j, o:{type:'mem', m}}))];
    ev.sort((x, y) => x.k - y.k || x.r - y.r || x.j - y.j);      // 同一天：节点在前（当天的回忆属于新的一年）
    ev.forEach(e => out.push(e.o));
    const lastK = annivs.length ? annivs[annivs.length - 1] : a0, rest = seg(annivs.length ? lastK : null, null);
    if(rest.length) out.push({type:'node', kind:'now', k:today, year:annivs.length + 1, from:lastK, list:rest});
    und.forEach(m => out.push({type:'mem', m}));
    return out;
  }

  /* ── 透视投影（世界：X 右、Y 上、Z 朝向观众；相机俯视 α） ── */
  function layout(){
    const W = S.W = view.clientWidth || innerWidth, H = S.H = view.clientHeight || innerHeight, narrow = W <= 760, N = S.st.length;
    const R = 1000, Dd = R*3.1, thF = narrow ? .14 : .32, gap = .66, total = Math.PI*2 - gap;     // 焦点在前方略偏右；缺口约 38°
    const head = narrow ? 150 : 170, bottom = narrow ? 92 : 86, cx = narrow ? W*.5 : W*.47;
    // 手机竖屏高度充裕：俯角从更大开始（环更「立」、占满标题下方的空白），放不下再逐步压平
    let hw = narrow ? W*.44 : Math.min(W*.41, 640), a = narrow ? (H/W > 1.6 ? .74 : .5) : .3;
    let cw = narrow ? Math.min(W*.4, 200) : SB.clamp(W*.16, 150, 226);
    cw = Math.min(cw, (H - head - bottom)*.58/1.62);
    let L;
    for(let it = 0; it < 24; it++){
      const ca = Math.cos(a), sa = Math.sin(a), f = hw*Dd/R, zF = R*Math.cos(thF)*ca, sF = f/(Dd - zF);
      const thrPx = Math.round(cw*.32), cardH = thrPx + 7 + cw*1.25 + 4;
      const cy = H - bottom - cardH - R*Math.cos(thF)*sa*sF, yBack = cy - R*sa*f/(Dd + R*ca);
      L = {W, H, R, D:Dd, a, ca, sa, thF, gap, total, f, cx, cy, sF, cw:Math.round(cw), thrPx, narrow};
      if(yBack >= head + 14) break;
      if(a > .17) a -= .025; else { hw *= .95; cw *= .96; }
    }

  }
  function drawStatic(gB, gF, wEnd, span, ei, intro){
    const L = S.L;
    // 环：从起点画到终点（开场时由终点向起点逐渐画出）；按纵深分桶合并路径
    const steps = lite() ? 120 : 180, B = 8, paths = [[], []];
    let prev = null;
    for(let j = 0; j <= steps; j++){
      const w = wEnd - span*ei + span*ei*(j/steps), p = proj(L.R*Math.sin(w), 0, L.R*Math.cos(w));
      if(prev){ const zf = (p.z + prev.z)/2, dn = SB.clamp((zf/(L.R*L.ca) + 1)/2, 0, 1), b = Math.round(dn*B), side = zf >= 0 ? 1 : 0;
        (paths[side][b] || (paths[side][b] = [])).push(prev.x, prev.y, p.x, p.y); }
      prev = p;
    }
    paths.forEach((arr, side) => { const g = side ? gF : gB; g.lineCap = 'round';
      arr.forEach((seg, b) => { if(!seg) return; const dn = b/B; g.strokeStyle = `rgba(240,212,156,${(.16 + .6*dn).toFixed(3)})`; g.lineWidth = .6 + 1.7*dn;
        g.beginPath(); for(let i = 0; i < seg.length; i += 4){ g.moveTo(seg[i], seg[i + 1]); g.lineTo(seg[i + 2], seg[i + 3]); } g.stroke(); }); });
    drawTail(gF, gB, wEnd, intro);
    if(ei < 1) return;
    // 光珠：不是卡片的回忆（含正在收起 / 展开的），一颗小小的垂珠
    for(const o of S.st){
      if(!o.p) continue;
      const g = o.p.z >= 0 ? gF : gB, sc = o.p.s/L.sF, dn = o.dn;
      if(o.type === 'node'){            // 周年节点：环上的星环（始终可见，可点击）
        const r = (o.kind === 'start' ? 6 : 8)*sc*(o.i === S.hb ? 1.35 : 1);
        glow(g, o.p.x, o.p.y, r*2.2, .85*dn + .12); g.strokeStyle = `rgba(255,232,190,${(.4 + .55*dn).toFixed(3)})`; g.lineWidth = 1.2;
        g.beginPath(); if(o.kind === 'anniv'){ g.moveTo(o.p.x, o.p.y - r*1.25); g.lineTo(o.p.x + r, o.p.y); g.lineTo(o.p.x, o.p.y + r*1.25); g.lineTo(o.p.x - r, o.p.y); g.closePath(); } else g.arc(o.p.x, o.p.y, r, 0, Math.PI*2); g.stroke();
        continue;
      }
      const a = (1 - o.cd)*(.28 + .72*Math.pow(dn, 1.1)); if(a < .03) continue;
      const hot = o.i === S.hb, h = (L.narrow ? 7 : 9)*sc, r = (hot ? 4.2 : 2.6)*sc + .6;
      g.strokeStyle = `rgba(240,212,156,${(a*.55).toFixed(3)})`; g.lineWidth = .8; g.beginPath(); g.moveTo(o.p.x, o.p.y); g.lineTo(o.p.x, o.p.y + h); g.stroke();
      g.fillStyle = `rgba(255,214,140,${(a*.22).toFixed(3)})`; g.beginPath(); g.arc(o.p.x, o.p.y + h + r, r*2.3, 0, Math.PI*2); g.fill();
      g.fillStyle = `rgba(255,240,206,${a.toFixed(3)})`; g.beginPath(); g.arc(o.p.x, o.p.y + h + r, r, 0, Math.PI*2); g.fill();
      o.bead = {x:o.p.x, y:o.p.y + h + r};
    }
  }
  /* 延伸线：顺着环的方向从终点继续向前、略微向外盘出（从起点外侧掠过），越来越细、渐虚，淡入星空；
     线头一点光像仍在书写的笔；「TO BE CONTINUED · 未完待续」沿线排在线的上方 */
  function drawTail(gF, gB, wEnd, intro){
    const L = S.L;
    S.tail = null;
    if(intro < .55){ return; }
    const ta = SB.clamp((intro - .55)/.45, 0, 1), span = L.gap + .75, M = 72, pts = [];
    for(let j = 0; j <= M; j++){ const q = j/M, w = wEnd + q*span, r = L.R*(1 + .3*Math.pow(q, 1.35));
      pts.push({...proj(r*Math.sin(w), -L.R*.02*q, r*Math.cos(w)), q}); }
    // 线：分段渐隐；前 40% 实线，之后虚线越来越稀
    // 只有焦点在终点附近时才显示文字与笔尖（焦点在起点时终点也在前方，但那时文字会压在起点铭牌上）
    const end = S.st[S.st.length - 1], vis = SB.clamp(((end?.dn ?? 0) - .6)/.22, 0, 1)*(1 - smooth(1.2, 2.6, S.st.length - 1 - uNow()))*ta, la = .3 + .7*vis;   // 终点转到背面时延伸线也淡下去
    for(let j = 1; j < pts.length; j++){ const a = pts[j - 1], b = pts[j], g = b.z >= 0 ? gF : gB, fade = Math.pow(1 - b.q, 1.25)*ta*la;
      if(fade < .02) continue;
      if(b.q > .42 && (j % (b.q > .7 ? 4 : 3)) === 0) continue;               // 虚线：跳过部分小段
      g.strokeStyle = `rgba(255,226,170,${(.75*fade).toFixed(3)})`; g.lineWidth = .5 + 1.5*(1 - b.q);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
    S.tail = {pts, a:ta*la};
    if(vis < .02) return;
    // 沿线排字（画在线的上方）
    const txt = L.narrow ? '未完待续' : 'TO BE CONTINUED · 未完待续', fs = L.narrow ? 9.5 : 10.5;
    const g = gF; g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const j = Math.round(M*.1), seg = [];
    for(let i = 1; i < pts.length; i++) seg.push(Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    let pos = 0; for(let i = 0; i < j; i++) pos += seg[i];
    const at = d => { let a = 0; for(let i = 0; i < seg.length; i++){ if(a + seg[i] >= d){ const f = (d - a)/seg[i], p0 = pts[i], p1 = pts[i + 1]; return {x:p0.x + (p1.x - p0.x)*f, y:p0.y + (p1.y - p0.y)*f, ang:Math.atan2(p1.y - p0.y, p1.x - p0.x), q:p0.q}; } a += seg[i]; } return null; };
    for(const ch of txt){
      const cjk = /[一-鿿]/.test(ch); g.font = cjk ? `600 ${fs + 1.5}px ${L.fDisp}` : `500 ${fs}px ${L.fRune}`;
      const wch = g.measureText(ch).width + (cjk ? fs*.35 : fs*.42);
      const p = at(pos + wch/2); if(!p || p.x < 8 || p.x > L.W - 8) break;      // 出了画面就不再排（手机上中文在前，先排完）
      let an = p.ang; if(an > Math.PI/2) an -= Math.PI; else if(an < -Math.PI/2) an += Math.PI;   // 字始终正着
      const nx = Math.sin(an), ny = -Math.cos(an), off = 9 + fs*.3;               // 法线：画面上方一侧
      const sgn = ny < 0 ? 1 : -1;
      g.globalAlpha = vis*Math.pow(1 - p.q, .8)*(cjk ? .82 : .68);
      g.fillStyle = cjk ? 'rgba(246,236,214,1)' : 'rgba(255,226,168,1)';
      g.setTransform(cvB._dpr, 0, 0, cvB._dpr, 0, 0); g.translate(p.x + nx*off*sgn, p.y + ny*off*sgn); g.rotate(an); g.fillText(ch, 0, 0);
      pos += wch;
    }
    g.restore(); g.setTransform(cvB._dpr, 0, 0, cvB._dpr, 0, 0); g.globalAlpha = 1;
  }
  // 光晕用预渲染的贴图（每帧不再新建径向渐变）
  const GLOW = (() => { const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'), gr = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, 'rgba(255,244,214,1)'); gr.addColorStop(.35, 'rgba(255,206,130,.45)'); gr.addColorStop(1, 'rgba(255,190,100,0)'); g.fillStyle = gr; g.fillRect(0, 0, 96, 96); return c; })();
  function glow(g, x, y, r, a){
    if(a <= .01) return;
    g.globalAlpha = Math.min(1, a); g.drawImage(GLOW, x - r*3, y - r*3, r*6, r*6); g.globalAlpha = 1;
  }

  /* ── 运动：拖动 / 惯性 / 点击直达（定时缓动）；场景激活时持续运行（偏转、摆动、光点） ── */
  function loop(now){
    S.raf = 0;
    if(!S.active) return;
    if(lite() && S.last && now - S.last < 1000/30 - 4 && !S.tw){ S.raf = requestAnimationFrame(loop); return; }
    const dt = Math.min(.05, (now - (S.last || now))/1000) || 1/60; S.last = now; S.dtLast = dt; S.clock += dt*1000;
    if(S.tw){
      const tw = S.tw, p = SB.clamp((now - tw.t0)/tw.dur, 0, 1);
      S.x = tw.a + (tw.b - tw.a)*ease(p);
      S.cg = tw.far ? 1 - smooth(0, .2, p)*(1 - smooth(.74, .98, p)) : SB.lerp(S.cg, 1, Math.min(1, dt*6));
      if(p >= 1){ S.x = S.target = tw.b; S.tw = null; S.cg = 1; }
    } else {
      S.cg = SB.lerp(S.cg, 1, Math.min(1, dt*6)); if(S.cg > .999) S.cg = 1;
      if(!S.drag){
        if(Math.abs(S.v) > .05){ S.target += S.v*dt*60; S.v *= Math.pow(.92, dt*60); } else S.v = 0;
        if(S.target < S.min){ S.target = SB.lerp(S.target, S.min, Math.min(1, dt*10)); S.v *= .5; }
        if(S.target > S.max){ S.target = SB.lerp(S.target, S.max, Math.min(1, dt*10)); S.v *= .5; }
      }
      S.x = reduced() || S.drag ? S.target : SB.lerp(S.x, S.target, Math.min(1, dt*7));
      if(!S.drag && Math.abs(S.v) <= .05 && Math.abs(S.x - S.target) < .3) S.x = S.target = SB.clamp(S.target, S.min, S.max);
    }
    render(now);
    const moving = S.drag || S.tw || Math.abs(S.v) > .05 || Math.abs(S.x - S.target) > .3 || (S.intro0 && now - S.intro0 < 1700);
    if(!reduced() || moving) S.raf = requestAnimationFrame(loop); else S.last = 0;
  }
  const kick = () => { if(!S.raf && S.active){ S.last = 0; S.raf = requestAnimationFrame(loop); } };
  /* 直达：沿最短路径一次转到第 i 站；距离越远时间越长（≤ 1.25 秒）；远距离时途中卡片收成光珠，到达后展开 */
  function center(i, anim = true){
    if(i < 0 || i >= S.st.length) return;
    S.v = 0; const to = i*S.step;
    if(reduced() || !anim){ S.tw = null; S.x = S.target = to; kick(); return; }
    const from = S.x, dist = Math.abs(to - from)/S.step;
    if(dist < .02){ S.target = to; kick(); return; }
    if(S.tw && S.tw.b === to) return;
    S.tw = {a:from, b:to, t0:performance.now(), dur:SB.clamp(360 + 250*Math.sqrt(dist), 420, 1250), far:dist > S.L.KL + S.L.KR + 1.5};
    S.target = to; setHb(-1); kick();
  }
  const rubber = t => t < S.min ? S.min - Math.min(80, (S.min - t)*.35) : t > S.max ? S.max + Math.min(80, (t - S.max)*.35) : t;
  /* 命中：光珠 / 节点星环（卡片与铭牌是 DOM，自己处理点击） */
  function hit(cx, cy){
    const r = view.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, R0 = SB.perf.touch ? 30 : 18;
    let bi = -1, bd = R0;
    for(const o of S.st){
      if(!o.p || (o.type === 'mem' && o.cd > .6)) continue;
      const q = o.type === 'mem' ? (o.bead || o.p) : o.p, d = Math.hypot(q.x - x, q.y - y) - (o.type === 'node' ? 6 : 0) + (1 - o.dn)*6;
      if(d < bd){ bd = d; bi = o.i; }
    }
    return bi;
  }

  view.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    if(S.tw){ S.target = S.x; S.tw = null; }
    S.drag = {id:e.pointerId, px:e.clientX, x0:S.target, lastX:e.clientX, lastT:performance.now(), v:0}; S.moved = 0; S.v = 0;
    kick();
  });
  view.addEventListener('pointermove', e => {
    const d = S.drag;
    if(!d){ if(e.pointerType === 'mouse') hoverAt(e); return; }
    if(d.id !== e.pointerId) return;
    const dx = e.clientX - d.px; S.moved = Math.max(S.moved, Math.abs(dx));
    if(S.moved > 6 && !view.classList.contains('drag')){ view.classList.add('drag'); setHb(-1); try{ view.setPointerCapture(e.pointerId); }catch(_){} }
    const now = performance.now(), ddt = Math.max(1, now - d.lastT);
    d.v = SB.lerp(d.v, -(e.clientX - d.lastX)/ddt*16.7, .5); d.lastX = e.clientX; d.lastT = now;
    S.target = rubber(d.x0 - dx);
  });
  const up = e => {
    const d = S.drag; if(!d || d.id !== e.pointerId) return;
    S.drag = null; view.classList.remove('drag');
    if(S.moved <= 6){ S.target = d.x0; setTimeout(() => { S.moved = 0; }, 0); kick(); return; }   // 轻点：交给 click
    if(performance.now() - d.lastT < 90) S.v = SB.clamp(d.v, -60, 60);
    const land = SB.clamp(Math.round((S.target + S.v*12)/S.step), 0, Math.max(0, S.st.length - 1));   // 惯性结束后吸附到最近的站点
    S.v = 0; S.target = land*S.step;
    kick(); setTimeout(() => { S.moved = 0; }, 0);
  };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
  view.addEventListener('click', e => {
    if(S.moved > 6 || e.target.closest('.rc,.rn-plq')) return;
    const i = hit(e.clientX, e.clientY); if(i >= 0) center(i);
  });
  function setHb(i){ if(S.hb === i) return; S.hb = i; view.classList.toggle('hot', i >= 0); if(i < 0){ tip.classList.remove('on'); return; } }
  function hoverAt(e){
    if(e.target.closest('.rc,.rn-plq')){ setHb(-1); return; }
    const i = hit(e.clientX, e.clientY); setHb(i);
    if(i < 0) return;
    const o = S.st[i], q = o.type === 'mem' ? (o.bead || o.p) : o.p;
    tip.innerHTML = o.type === 'mem' ? `<b>${SB.esc(D.dot(o.m.date) || '未标日期')}</b>${SB.esc(o.m.title || '未命名的回忆')}`
      : `<b>${SB.esc(dotK(o.k))}</b>${o.kind === 'start' ? '故事的起点' : o.kind === 'now' ? '第' + CN(o.year) + '年 · 至今' : (o.year === 1 ? '一周年' : CN(o.year) + '周年')}`;
    tip.style.transform = `translate3d(${q.x.toFixed(0)}px,${q.y.toFixed(0)}px,0) translate(-50%,calc(-100% - 12px))`; tip.classList.add('on');
  }
  view.addEventListener('pointerleave', () => setHb(-1));
  let wheelT = 0;
  view.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!d) return; e.preventDefault();
    if(S.tw){ S.target = S.x; S.tw = null; }
    S.v = 0; S.target = SB.clamp(S.target + d*(e.deltaMode === 1 ? 30 : 1)*.8, S.min - 40, S.max + 40); kick();
    clearTimeout(wheelT); wheelT = setTimeout(() => { S.target = SB.clamp(Math.round(S.target/S.step), 0, Math.max(0, S.st.length - 1))*S.step; kick(); }, 180);
  }, {passive:false});
  view.addEventListener('keydown', e => {
    const cur = S.tw ? Math.round(S.tw.b/S.step) : (S.near < 0 ? 0 : S.near);
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); center(SB.clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, S.st.length - 1)); }
    else if(e.key === 'Home'){ e.preventDefault(); center(0); } else if(e.key === 'End'){ e.preventDefault(); center(S.st.length - 1); }
  });
  function scrubTo(clientX){
    const r = scrub.getBoundingClientRect(), t = S.t0 + SB.clamp((clientX - r.left)/r.width, 0, 1)*(S.t1 - S.t0);
    let bi = 0, bd = 1e9; S.st.forEach((o, i) => { const v = stTime(o); if(v != null && Math.abs(v - t) < bd){ bd = Math.abs(v - t); bi = i; } });
    center(bi);
  }
  scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); scrub._d = true; scrubTo(e.clientX); });
  scrub.addEventListener('pointermove', e => { if(scrub._d) scrubTo(e.clientX); });
  scrub.addEventListener('pointerup', () => { scrub._d = false; }); scrub.addEventListener('pointercancel', () => { scrub._d = false; });
  let rsT = 0;
  const rebuild = () => { const tgt = S.tw ? S.st[Math.round(S.tw.b/S.step)] : S.st[S.near]; build(false, keyOf(tgt)); kick(); };
  addEventListener('resize', () => { if(SB.scenes.current !== 'overview') return; clearTimeout(rsT); rsT = setTimeout(rebuild, 150); });
  // 数据刷新：只有回忆 / 城市 / 纪念日真的变化才重建；签名地址到位之类的刷新只补图（之前每次签名回调都重建 → 闪烁）
  document.addEventListener('sb:data', () => {
    if(SB.scenes.current !== 'overview') return;
    if(sigOf() !== S.sig){ rebuild(); return; }
    S.st.forEach(o => { if(o.img === 'err') o.img = null; }); wantImgs(uNow());
  });
  document.addEventListener('visibilitychange', () => { if(document.hidden){ cancelAnimationFrame(S.raf); S.raf = 0; } else kick(); });

  SB.scenes.register('overview', {
    world:'night', deepLink:true,
    title:() => '时光长卷',
    parent:() => ({id:'globe', params:{}}),
    async prepare(){
      // 先签名离「最新」最近的几张封面，进入时首屏不出现空白相框（其余随转动按需预取）
      const ids = sorted().slice(-8).map(coverOf).filter(Boolean);
      if(ids.length) await SB.store.prefetchUrls?.(ids);
    },
    // 从放映返回时回到离开前的那一段（而不是总跳回最新）
    enter(p, opts){ SB.fx.palette('night'); S.active = true; S.clock = 0; build(!opts?.back, opts?.back ? S.lastKey : null); kick(); },
    leave(){ S.lastKey = keyOf(S.st[S.near]); S.active = false; cancelAnimationFrame(S.raf); S.raf = 0; S.drag = null; S.tw = null; setHb(-1); SB.yearReel?.close?.(true); }
  });
  SB.overview = { get state(){ return {n:S.st.length, near:S.near, u:uNow(), anchor:S.anchor, cards:S.st.filter(o => !o.off).length,
      nodes:S.st.filter(o => o.type === 'node').map(o => ({kind:o.kind, year:o.year, k:o.k, date:D.str(o.k), count:o.list?.length ?? 0, i:o.i}))}; },
    center, hitPoint:i => { const o = S.st[i]; if(!o?.p) return null; const r = view.getBoundingClientRect(), q = o.type === 'mem' ? (o.bead || o.p) : o.p; return {x:r.left + q.x, y:r.top + q.y}; } };
  SB.menu.add({id:'overview', order:40, icon:'scroll', label:'时光长卷',
    desc:() => { const l = sorted().filter(m => dayOf(m) != null); const n = SB.store.memories.length;
      return n ? `${n} 段回忆${l.length ? ' · 从 ' + D.parse(l[0].date).y + ' 到 ' + D.parse(l[l.length - 1].date).y : ''}` : '我们的故事从这里开始'; },
    scene:'overview', sceneOpts:{transition:'quill'}});
})(window.SB);
</script>
