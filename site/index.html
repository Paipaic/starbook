        g.s.forEach((sl, k) => { marks.push({t:tt, i:sl.i}); const e = placeCap(sl, tt + (k ? 200 : 900)); tt += focusOf(k ? c.B*.8 : c.B, e, tt); });
        its.forEach((p, k) => { p.t1 = tt + 1100 + k*180; p.exit = {type:'slide', dir:k % 2 ? 't' : 'b', dur:1100}; });
        doors.push(...its); prev = null;
      } else {   // stack：竖屏上两张横图上下叠放
        const slot = k => ({x:.5, y:k ? .75 + gap/2 : .25 - gap/2, w:1, h:.5 - gap});
        const [a, b] = g.s;
        its.push(photo({slide:a.s, i:a.i, t0:tt, z:z++, keys:[{t:tt, ...slot(0)}], enter:{type:'wipe', dir:'l', dur:1100}, kb:{s0:1.02, s1:1.03, x0:0, x1:100, y0:50, y1:50}}));
        its.push(photo({slide:b.s, i:b.i, t0:tt + 450, z:z++, keys:[{t:tt, ...slot(1)}], enter:{type:'wipe', dir:'r', dur:1100}, kb:{s0:1.03, s1:1.02, x0:100, x1:0, y0:50, y1:50}}));
        marks.push({t:tt, i:a.i}); let e = placeCap(a, tt + 700); tt += focusOf(c.B, e, tt);
        marks.push({t:tt, i:b.i}); e = placeCap(b, tt + 200); tt += focusOf(c.B*.85, e, tt);
        its.forEach((p, k) => { p.t1 = tt + 1200; p.exit = {type:'slide', dir:k ? 'b' : 't', dur:1200}; });
        doors.push(...its); prev = null;
      }
      items.push(...its);
      // 多图组里「正在讲述」的那张提亮，其余稍暗，引导视线
      const gm = marks.slice(-its.length - 1).filter(mm => its.some(p => p.i === mm.i));
      gm.forEach((mm, k) => { const nx = gm[k + 1]; its.filter(p => p.i === mm.i).forEach(p => { p.foc = [mm.t, nx ? nx.t : tt + 2000]; }); });
      if(gm.length > 1) its.forEach(p => { p.grp = its; });
      // 「开门」露出的下一组要在门的下面
      if(doors.length) items._under = (items._under || 0) + 1, doors.forEach(p => p.z += 400);
      t = tt;
    });
    if(prev) prev.forEach(p => { if(p.t1 == null){ p.t1 = t + 1100; p.exit = {type:'fade', dur:1100}; } });
    items.filter(x => x.kind === 'photo').forEach(p => { if(p.t1 == null) p.t1 = t + 1100; });
    return {items, marks, end:t + 300};
  }

  /* 风格二 · 星图 */
  const TPL_LAND = [
    {slots:[{x:.30, y:.47, sw:.42, sh:.68, r:-1.5, d:1}, {x:.74, y:.31, sw:.30, sh:.40, r:2.2, d:.55}], order:[0, 1, 0], text:{x:.56, y:.58, w:.38, ax:'l', ay:'t'}},
    {slots:[{x:.68, y:.52, sw:.42, sh:.68, r:1.5, d:1}, {x:.24, y:.68, sw:.30, sh:.38, r:-2.4, d:.55}], order:[0, 1, 0], text:{x:.07, y:.13, w:.38, ax:'l', ay:'t'}},
    {slots:[{x:.20, y:.40, sw:.25, sh:.46, r:-3, d:.6}, {x:.50, y:.50, sw:.27, sh:.52, r:1.8, d:1}, {x:.80, y:.40, sw:.25, sh:.46, r:-1.6, d:.6}], order:[0, 1, 2], text:{x:.5, y:.9, w:.8, ax:'c', ay:'b'}, center:true}
  ];
  const TPL_PORT = [
    {slots:[{x:.42, y:.24, sw:.70, sh:.30, r:-2, d:1}, {x:.62, y:.50, sw:.62, sh:.25, r:2, d:.6}], order:[0, 1, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true},
    {slots:[{x:.60, y:.23, sw:.66, sh:.29, r:2, d:.6}, {x:.38, y:.50, sw:.66, sh:.27, r:-2, d:1}], order:[0, 1, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true},
    {slots:[{x:.5, y:.35, sw:.84, sh:.48, r:0, d:1}], order:[0, 0], text:{x:.5, y:.68, w:.84, ax:'c', ay:'t'}, center:true}
  ];
  function dConstellation(S, c){
    const {fw, fh, land} = c, items = [], marks = [];
    let tpls = land ? TPL_LAND : TPL_PORT; if(c.lite && land) tpls = tpls.slice(0, 2);
    const fs = land ? clamp(fw*.026, 21, 36) : clamp(fw*.058, 20, 25);
    let ti = 0, tpl = tpls[0], occ = [], filled = 0, t = c.C0 + 100, prevIt = null, z = 100;
    const retire = (it, at, k = 0) => { it.t1 = at + k*220; it.exit = {type:'stardust', dur:1200}; };
    S.forEach((sl, n) => {
      if(filled >= tpl.order.length){
        occ.forEach((it, k) => it && retire(it, t + 300, k)); t += 900;
        ti = (ti + 1) % tpls.length; tpl = tpls[ti]; occ = []; filled = 0; prevIt = null;
      }
      const si = tpl.order[filled], slot = tpl.slots[si], old = occ[si];
      if(old) retire(old, t + 500);
      const bx = fitBox(sl.a, slot.sw, slot.sh, fw, fh);
      const t0 = t - 200 + (old ? 300 : 0);
      const it = photo({slide:sl.s, i:sl.i, t0, frame:'gilt', depth:slot.d, z:z++ + Math.round(slot.d*50), keys:[{t:t0, x:slot.x, y:slot.y, w:bx.w, h:bx.h, r:slot.r}],
        enter:{type:'bloom', dur:1400}, kb:{s0:1, s1:1.06, x0:50, x1:50, y0:50, y1:47}, tilt:true});
      items.push(it); marks.push({t, i:sl.i});
      if(prevIt) items.push({kind:'line', a:prevIt, b:it, t0:t + 300});
      const tb = tpl.text, per = Math.max(7, Math.min(16, Math.floor(tb.w*fw/(fs*1.06))));
      const cu = cueItems(sl.s.caption, t + 700, per, (lines, a, b) => ({kind:'text', look:'editorial', lines, t0:a, t1:b, fs, idx:String(sl.i + 1).padStart(2, '0'), center:!!tpl.center, box:{...tb}}));
      if(!cu.items.length) items.push({kind:'text', look:'editorial', lines:[], t0:t + 700, t1:t + 2600, fs, idx:String(sl.i + 1).padStart(2, '0'), center:!!tpl.center, box:{...tb}});
      items.push(...cu.items);
      occ[si] = it; filled++; prevIt = it;
      t += focusOf(c.B, cu.end, t);
    });
    occ.forEach((it, k) => it && retire(it, t + 300, k));
    items.filter(x => x.kind === 'line').forEach(l => { l.t1 = Math.min(l.a.t1, l.b.t1); });
    return {items, marks, end:t + 900};
  }

  /* 风格三 · 手札 */
  function dJournal(S, c){
    const {fw, fh, land} = c, items = [], marks = [], cam = [];
    const fs = land ? clamp(fw*.026, 22, 38) : clamp(fw*.06, 21, 26);
    const per = land ? Math.max(8, Math.floor(fw*.36/(fs*1.06))) : Math.max(8, Math.min(15, Math.floor(fw*.84/(fs*1.06))));
    let t = c.C0 + 250, px = 0, py = 0, pw = 0, ph = 0, z = 100;
    const prints = [];
    S.forEach((sl, n) => {
      const bx = fitBox(sl.a, land ? .34 : .72, land ? .52 : .38, fw, fh);
      const bpx = Math.max(7, Math.min(bx.w*fw, bx.h*fh)*.045);
      const w = bx.w + bpx*2/fw, h = bx.h + bpx*3.4/fh;
      let x, y;
      if(land){ x = n ? px + (pw + w)/2*.8 + .025 : .5; y = .40 + (hash(n, 3) - .5)*.06; }
      else { y = n ? py + (ph + h)/2*.74 + .02 : .38; x = (n % 2 ? .57 : .43) + (hash(n, 3) - .5)*.04; }
      const r = (n % 2 ? 1 : -1)*(2.5 + hash(n, 5)*4.5);
      const it = photo({slide:sl.s, i:sl.i, t0:t - 250, frame:'print', space:'desk', z:z++, border:bpx, seal:n % 3 === 2,
        keys:[{t, x, y, w, h, r}], enter:{type:'drop', dur:950, dir:n % 2 ? 1 : -1}, kb:{s0:1, s1:1.04, x0:50, x1:50, y0:50, y1:50}});
      items.push(it); prints.push(it); marks.push({t, i:sl.i});
      // 镜头沿桌面跟随最新的相片
      const cx = land ? x - .06 : .5, cy = land ? .5 : y + .1;
      cam.push({t:n ? t - 700 : t - 1000, x:cam.length ? cam[cam.length - 1].x : cx, y:cam.length ? cam[cam.length - 1].y : cy}, {t:t + 800, x:cx, y:cy});
      let tx;
      const text = String(sl.s.caption || '').trim();
      if(text){
        const lines = wrap(text, per).slice(0, 6), n2 = len(text), writeEnd = 500 + n2*110 + 900;
        if(land) tx = {kind:'text', look:'ink', space:'desk', lines, t0:t + 450, t1:null, fs:n2 > 40 ? fs*.85 : fs, rot:r*.35,
          box:{x:x - w/2 + .012, y:y + h/2 + .035, w:.4, ax:'l', ay:'t'}};
        else tx = {kind:'text', look:'ink', center:true, lines, t0:t + 450, t1:null, fs, box:{x:.5, y:.80, w:.86, ax:'c', ay:'t'}};
        items.push(tx); it.caption = tx;
        t += Math.max(c.B, writeEnd + Math.max(0, n2/CPS*1000 - n2*110));
      } else t += c.B*.85;
      px = x; py = y; pw = w; ph = h;
    });
    // 旧相片在镜头移开后退场；文字跟随相片
    prints.forEach((p, k) => {
      const later = prints[k + (land ? 3 : 2)];
      p.t1 = later ? later.t0 + 1800 : t + 1200; p.exit = {type:'fade', dur:700};
      // 上一段墨迹在下一段开始书写时淡去，避免相邻文字重叠
      if(p.caption){ const nx = prints.slice(k + 1).find(q => q.caption); p.caption.t1 = nx ? nx.caption.t0 + 700 : (land ? p.t1 : t + 1000); }
    });
    return {items, marks, end:t + 500, cam};
  }
  const DIRECT = {cinema:dCinema, constellation:dConstellation, journal:dJournal};

  function buildTL(m, style){
    const dim = measure(style);
    const S = (m.slides || []).filter(s => s.id).map((s, i) => ({s, i, a:aspect(s)}));
    const C0 = Math.min(9000, Math.max(4200, 3600 + (len(m.title) + len(m.note))/CPS*1000));
    const ctx = {...dim, C0, B:BASE[style], lite:lite()};
    const r = S.length ? DIRECT[style](S, ctx) : {items:[], marks:[], end:C0};
    r.items.forEach((it, k) => { it.id = 'e' + k; });
    r.items.sort((a, b) => a.t0 - b.t0);
    return {...r, ...dim, style, C0, endT:Math.max(r.end, C0 + 600), n:S.length};
  }
  const estimate = TL => TL.endT + END_EST;

  /* ── 照片：等待签名地址、预加载并解码 ── */
  const cache = new Map();
  async function urlOf(id){
    let u = SB.store.url(id); if(u) return u;
    await SB.store.prefetchUrls?.([id]);
    u = SB.store.url(id); if(u) return u;
    return new Promise(res => { let n = 0; const tryOnce = () => { const x = SB.store.url(id); if(x || n++ > 20) return res(x || ''); setTimeout(tryOnce, 120); }; tryOnce(); });
  }
  function load(id, priority='auto'){
    if(!id) return Promise.resolve(null);
    if(cache.has(id)) return cache.get(id).p;
    const rec = {ready:false, url:'', ok:false};
    rec.p = urlOf(id).then(url => new Promise(res => {
      rec.url = url; if(!url){ rec.ready = true; return res(rec); }
      const img = new Image(); img.decoding = 'async';
      if('fetchPriority' in img) img.fetchPriority = priority;
      img.onload = () => { (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => { rec.ready = rec.ok = true; res(rec); }); };
      img.onerror = () => { rec.ready = true; res(rec); };
      img.src = url;
    }));
    cache.set(id, rec); return rec.p;
  }
  const isReady = id => !id || cache.get(id)?.ready;
  function prime(m){
    const ids = [...new Set([m?.cover?.id, ...(m?.slides || []).map(s => s.id)].filter(Boolean))];
    const n = SB.perf.touch || lite() ? 6 : 10, first = ids.slice(0, n);
    SB.store.prefetchUrls?.(first);
    first.slice(0, SB.perf.touch || lite() ? 4 : 6).forEach((id, i) => load(id, i < 2 ? 'high' : 'auto'));
  }
  function prefetch(T){
    if(!P.TL) return;
    const ahead = SB.perf.touch || lite() ? 16000 : 12000;
    const ids = [];
    for(const it of P.TL.items) if(it.kind === 'photo' && it.t0 < T + ahead && (it.t1 ?? 1e12) > T - 800) ids.push(it.slide.id);
    const unique = [...new Set(ids)];
    SB.store.prefetchUrls?.(unique);
    unique.forEach((id, i) => load(id, i < 2 ? 'high' : 'auto'));
  }

  /* ── 布局 ── */
  function applyLayout(){
    const TL = P.TL; if(!TL) return;
    P.W = TL.W; P.H = TL.H; P.bar = TL.bar; P.fw = TL.fw; P.fh = TL.fh;
    scene.style.setProperty('--bar', P.bar + 'px');
    const st = $('pl-stage'); st.dataset.style = TL.style;
    $('pl-desk').style.display = TL.style === 'journal' ? '' : 'none';
    $('pl-sky').style.display = TL.style === 'constellation' ? '' : 'none';
    $('pl-grain').classList.toggle('off', lite() || TL.style === 'constellation');
    $('pl-grain').style.opacity = TL.style === 'journal' ? '.05' : '';
    for(const cv of [$('pl-sky'), $('pl-season'), $('pl-dust')]){
      const cap = SB.perf.touch || lite() ? 1 : 1.5, dpr = Math.min(devicePixelRatio || 1, cap);
      cv.width = Math.round(P.fw*dpr); cv.height = Math.round(P.fh*dpr); cv._dpr = dpr;
    }
  }
  function rebuild(keepT){
    if(!P.m) return;
    const old = P.TL, T = P.T;
    clearNodes();
    P.TL = buildTL(P.m, P.style); applyLayout();
    if(keepT && old && T > old.C0) P.T = T >= old.endT ? P.TL.endT + (T - old.endT) : P.TL.C0 + (T - old.C0)/(old.endT - old.C0)*(P.TL.endT - P.TL.C0);
    buildBars();
  }
  let rsT = 0;
  addEventListener('resize', () => { if(SB.scenes.current !== 'player') return; clearTimeout(rsT); rsT = setTimeout(() => { if(P.showing) rebuild(true); else if(P.m) updateStat(); render(); }, 180); });

  /* ── DOM 节点 ── */
  function clearNodes(){ for(const [, n] of P.nodes) n.el.remove(); P.nodes.clear(); $('pl-lines').querySelectorAll('line').forEach(l => l.remove()); }
  function nodeFor(it){
    let n = P.nodes.get(it.id); if(n) return n;
    if(it.kind === 'photo'){
      const el = SB.el('div', 'pl-ph ' + it.frame + (lite() ? ' lite' : ''));
      const im = SB.el('div', 'im'); const img = SB.el('img'); img.alt = it.slide.caption || P.m?.title || ''; img.decoding = 'async';
      im.appendChild(img); el.appendChild(im);
      if(it.frame === 'print'){ const b = it.border; im.style.inset = `${b}px ${b}px ${b*2.4}px ${b}px`; }
      if(it.seal){ const s = SB.el('span', 'seal', SB.icon('star')); el.appendChild(s); }
      el.style.opacity = '0'; el.style.zIndex = it.z;
      (it.space === 'desk' ? $('pl-cam') : $('pl-flat')).appendChild(el);
      n = {el, im, img, cache:{}};
    } else if(it.kind === 'text'){
      const el = buildText(it); el.style.opacity = '0';
      (it.space === 'desk' ? $('pl-cam') : $('pl-texts')).appendChild(el);
      n = {el, cache:{}};
    } else if(it.kind === 'line'){
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line'); $('pl-lines').appendChild(el); n = {el, cache:{}};
    } else return null;
    P.nodes.set(it.id, n); return n;
  }
  function buildText(it){
    const el = SB.el('div', 'pl-tx ' + it.look + (it.vertical ? ' v' : '') + (it.center ? ' c' : ''));
    el.style.fontSize = it.fs.toFixed(1) + 'px';
    if(it.box.w) el.style.width = (it.box.w*P.fw).toFixed(0) + 'px';
    const chars = s => [...s].map(ch => `<span>${SB.esc(ch)}</span>`).join('');
    if(it.look === 'cinema'){
      el.innerHTML = it.lines.map(l => `<span class="ln">${chars(l)}</span>`).join('') + '<i class="rule"></i>';
    } else if(it.look === 'editorial'){
      el.innerHTML = `<span class="idx">${it.idx}</span><i class="rule"></i>` + it.lines.map(l => `<span class="ln"><b>${SB.esc(l)}</b></span>`).join('');
    } else {
      let j = 0;
      el.innerHTML = it.lines.map(l => `<span class="ln">${[...l].map(ch => { j++; const r = (hash(j, 7) - .5)*3, y = (hash(j, 9) - .5)*.08;
        return `<span style="transform:translateY(${y.toFixed(3)}em) rotate(${r.toFixed(2)}deg)">${SB.esc(ch)}</span>`; }).join('')}</span>`).join('');
    }
    return el;
  }
  const setS = (n, k, v) => { if(n.cache[k] !== v){ n.cache[k] = v; n.el.style[k] = v; } };

  /* ── 关键帧插值 ── */
  function keyAt(keys, T){
    if(keys.length === 1 || T <= keys[0].t) return keys[0];
    for(let k = 1; k < keys.length; k++){ const b = keys[k]; if(T < b.t){ const a = keys[k-1], e = ease((T - a.t)/(b.t - a.t));
      return {x:lerp(a.x, b.x, e), y:lerp(a.y, b.y, e), w:lerp(a.w, b.w, e), h:lerp(a.h, b.h, e), r:lerp(a.r || 0, b.r || 0, e)}; } }
    return keys[keys.length - 1];
  }
  const drift = T => ({x:Math.sin(T/9000)*.012, y:Math.cos(T/11000)*.009});
  function camAt(T){
    const k = P.TL.cam; if(!k?.length) return {x:.5, y:.5};
    if(T <= k[0].t) return k[0];
    for(let i = 1; i < k.length; i++){ if(T < k[i].t){ const a = k[i-1], b = k[i], e = ease((T - a.t)/Math.max(1, b.t - a.t)); return {x:lerp(a.x, b.x, e), y:lerp(a.y, b.y, e)}; } }
    return k[k.length - 1];
  }

  /* ── 转场库：返回 {o, tx, ty, sc, rot, blur, bri, clip, mask, maskSize} 的修改 ── */
  function fx(st, type, p, enter, dir, it, w, h){
    if(type === 'hold' || type === 'none' || p <= 0 && enter === false) return;
    if(reduced() && type !== 'hold') type = 'fade';
    const v = enter ? EO(p) : 1 - EIC(p);            // 可见度：1 完全可见，0 消失
    const fw = P.fw, fh = P.fh;
    switch(type){
      case 'fade': st.o *= enter ? ease(p) : 1 - ease(p); break;
      case 'bloom': st.o *= v; st.blur += (1 - v)*10; st.bri *= 1 + .5*(1 - v); st.sc *= 1 + .05*(1 - v); break;
      case 'stardust': st.o *= v; st.blur += (1 - v)*8; st.bri *= 1 + .7*(1 - v); st.ty -= (1 - v)*.035*fh; st.sc *= .93 + .07*v; break;
      case 'wipe': { const q = ((1 - EIC(enter ? p : 1 - p))*100).toFixed(2);
        st.clip = dir === 'l' ? `inset(0 ${q}% 0 0)` : dir === 'r' ? `inset(0 0 0 ${q}%)` : dir === 't' ? `inset(0 0 ${q}% 0)` : `inset(${q}% 0 0 0)`;
        if(enter) st.bri *= 1 + .25*(1 - v); break; }
      case 'slit': { const q = ((1 - EIC(enter ? p : 1 - p))*50).toFixed(2); st.clip = `inset(${q}% 0 ${q}% 0)`; st.bri *= 1 + .35*(1 - v); break; }
      case 'iris': { const q = (EIC(enter ? p : 1 - p)*76).toFixed(2); st.clip = `circle(${q}% at 50% 46%)`; break; }
      case 'blinds': { const q = EIC(enter ? p : 1 - p)*125 - 20; st.mask = `linear-gradient(90deg,#000 ${q.toFixed(1)}%,transparent ${(q + 20).toFixed(1)}%)`; st.maskSize = '8.333% 100%'; st.maskRepeat = 'repeat-x'; break; }
      case 'ink': { const d = Math.hypot(fw, fh)*2.6*Math.pow(clamp(p, 0, 1), 1.6) + 1; if(p < 1){ st.mask = INK; st.maskSize = `${d}px ${d}px`; st.maskPos = '50% 46%'; } break; }
      case 'slide': { const d = enter ? 1 - EO4(p) : EIC(p);
        if(dir === 'l') st.tx -= d*(w + .02*fw); else if(dir === 'r') st.tx += d*(w + .02*fw); else if(dir === 't') st.ty -= d*(h + .02*fh); else st.ty += d*(h + .02*fh);
        break; }
      case 'drop': { const vb = enter ? backOut(p) : v; st.o *= clamp((enter ? p : 1 - p)*3, 0, 1); st.sc *= 1 + .28*(1 - vb); st.rot += 9*(1 - vb)*(dir || 1);
        st.ty -= .05*fh*(1 - (enter ? EO(p) : v)); st.lift = Math.max(st.lift, 1 - (enter ? EO(p) : v)); break; }
      case 'drift': st.o *= v; st.ty -= (1 - v)*.03*fh; break;
    }
  }

  /* ── 渲染 ── */
  function rPhoto(it, T, n){
    const rec = cache.get(it.slide.id);
    if(!n.img.src && rec?.url) n.img.src = rec.url;
    const k = keyAt(it.keys, T), fw = P.fw, fh = P.fh;
    let w = k.w*fw, h = k.h*fh, x = k.x*fw - w/2, y = k.y*fh - h/2;
    if(it.depth && !reduced()){ const d = drift(T); x += d.x*fw*it.depth; y += d.y*fh*it.depth; }
    it._c = [x + w/2, y + h/2];
    setS(n, 'width', w.toFixed(1) + 'px'); setS(n, 'height', h.toFixed(1) + 'px');
    const st = {o:1, tx:0, ty:0, sc:1, rot:k.r || 0, blur:0, bri:1, clip:'', mask:'', maskSize:'', maskRepeat:'no-repeat', maskPos:'50% 50%', lift:0};

    if(TL.style === 'journal'){
      const c = camOffset(T);
      $('pl-cam').style.transform = `translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0)`;
      $('pl-desk').style.transform = `translate3d(${(c.x*.25 % (P.fw*.04)).toFixed(1)}px,${(c.y*.25 % (P.fh*.04)).toFixed(1)}px,0)`;
    } else $('pl-cam').style.transform = '';
    $('pl-scrim').style.opacity = P._scrim.toFixed(3);
    if(P._live !== P.liveKey){ P.liveKey = P._live; $('pl-live').textContent = P._live; }
    rSky(T); rDust(T); rLeak(T); rSeason(T);
    renderTitle(T); renderEnd(T); renderProgress(T);
  }

  /* ── 时钟 ── */
  function waitingAt(T, dt){
    for(const it of P.active || []) if(it.kind === 'photo' && it.t0 <= T + dt + 300 && (it.t1 ?? 1e12) > T && !isReady(it.slide.id)){ load(it.slide.id); return true; }
    return false;
  }
  let pfAt = -1e9;
  function loop(now){
    if(!P.showing || SB.scenes.current !== 'player') return;
    const minFrame = lite() ? 1000/30 : 1000/60;
    if(P.renderAt && now - P.renderAt < minFrame){ P.raf = requestAnimationFrame(loop); return; }
    P.renderAt = now;
    const dt = Math.min(80, now - (P.last || now)); P.last = now;
    if(P.playing){
      const waiting = waitingAt(P.T, dt);
      $('pl-buffer').classList.toggle('on', waiting);
      if(!waiting){ P.T += dt; stepSeason(dt); if(P.T - pfAt > 1000){ pfAt = P.T; prefetch(P.T); } }
    }
    render();
    P.raf = requestAnimationFrame(loop);
  }
  function setPlaying(v){
    P.playing = v; P.last = 0;
    $('pl-play').innerHTML = v ? ICON_PAUSE : ICON_PLAY; $('pl-play').setAttribute('aria-label', v ? '暂停' : '继续放映');
    $('pl-grain').style.animationPlayState = v ? 'running' : 'paused';
    $('pl-desk').style.animationPlayState = v ? 'running' : 'paused';
  }
  function cut(){ const c = $('pl-cut'); c.classList.remove('go'); void c.offsetWidth; c.classList.add('go'); }
  function jumpTo(T){ P.T = Math.max(0, T); if(T < P.TL.endT){ P.endShown = false; SB.audio.duck(1, 800); } prefetch(P.T); cut(); render(); }
  function jump(k){                           // k = 进度条段：0 扉页，1..n 照片
    const mk = P.TL.marks;
    if(k <= 0) return jumpTo(0);
    if(k > mk.length){ if(P.T < P.TL.endT) jumpTo(P.TL.endT); return; }
    jumpTo(mk[k - 1].t - 150);
  }
  const step = d => { const c = markIndex(P.T); jump(P.T >= P.TL.endT ? (d < 0 ? P.TL.marks.length : P.TL.marks.length + 1) : c + 1 + d); };
  function wake(){ scene.classList.add('awake'); clearTimeout(P.idleT); P.idleT = setTimeout(() => { if(P.playing && !$('pl-seasons').classList.contains('open')) scene.classList.remove('awake'); }, 2600); }

  /* ── 风格 / 季节选项 ── */
  function chip(id, name, icon, on, onClick){
    const b = SB.el('button', 'pl-chip' + (on ? ' on' : ''), `${SB.cinema.icon(icon)}<span>${SB.esc(name)}</span>`);
    b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', on ? 'true' : 'false'); b.dataset.id = id;
    b.addEventListener('click', e => { e.stopPropagation(); onClick(id); }); return b;
  }
  const seasonLabel = id => { const s = SB.cinema.seasons.find(x => x.id === id); return s?.name || '无'; };
  function refreshSeasonUI(){
    const pref = P.seasonPref, eff = P.season;
    const row = $('pl-o-season'); row.innerHTML = '<span>SEASON</span>';
    SB.cinema.seasons.forEach(s => row.appendChild(chip(s.id, s.id === 'auto' ? `按月份${pref === 'auto' && eff !== 'none' ? '·' + seasonLabel(eff) : ''}` : s.name, s.id, pref === s.id, id => { P.seasonPref = id; setSeason(SB.cinema.resolveSeason(id, P.m?.date), !P.showing); })));
    const pop = $('pl-seasons'); pop.innerHTML = '';
    SB.cinema.seasons.filter(s => s.id !== 'auto').forEach(s => pop.appendChild(chip(s.id, s.name, s.id, eff === s.id, id => { P.seasonPref = id; setSeason(id, false); wake(); })));
    $('pl-season-btn').innerHTML = SB.cinema.icon(eff === 'none' ? 'none' : eff); $('pl-season-btn').setAttribute('aria-label', '季节主题：' + seasonLabel(eff));
  }
  function refreshStyleUI(){
    const row = $('pl-o-style'); row.innerHTML = '<span>STYLE</span>';
    SB.cinema.styles.forEach(s => row.appendChild(chip(s.id, s.name, s.id, P.style === s.id, id => { P.style = id; refreshStyleUI(); updateStat(); })));
  }
  function updateStat(){
    const m = P.m; if(!m) return;
    const n = (m.slides || []).length, TL = buildTL(m, P.style);
    $('pl-l-stat').innerHTML = `<span>${n} 张照片</span><i></i><span>${fmtDur(estimate(TL))}</span>${m.bgmMode !== 'none' && (m.bgm || SB.store.settings?.bgm) ? `<i></i><span>${SB.icon('note')} 配乐</span>` : ''}`;
  }

  /* ── 放映厅 ── */
  async function lobby(m, keepOpts){
    P.m = m; P.showing = false; setPlaying(false); P.TL = null;
    if(!keepOpts){ P.style = SB.cinema.styleOf(m); P.seasonPref = SB.cinema.seasonPref(m); }
    scene.classList.remove('showing', 'awake');
    $('pl-l-date').textContent = dateLine(m);
    $('pl-l-title').textContent = SB.fmtTitle(m.title);
    const place = placeOf(m); $('pl-l-place').textContent = place; $('pl-l-place').hidden = !place;
    const n = (m.slides || []).length;
    updateStat(); refreshStyleUI();
    P.season = SB.cinema.resolveSeason(P.seasonPref, m.date); refreshSeasonUI();
    $('pl-start').disabled = !n;
    $('pl-wait').textContent = n ? '' : '这段回忆还没有照片';
    const acts = $('pl-lobby-acts'); acts.innerHTML = '';
    if(SB.store.canEdit) acts.appendChild(SB.ui.button('编辑', 'small', () => SB.editor.open({cityId:m.cityId, memory:m}), 'quill'));
    acts.appendChild(SB.ui.button('返回', 'small', () => SB.scenes.back()));
    prime(m);
    const cover = m.cover?.id || m.slides?.[0]?.id; const pimg = $('pl-poster-img'); pimg.classList.remove('ok');
    if(cover){ const rec = await load(cover, 'high'); if(P.m !== m) return;
      if(rec?.url){ pimg.onload = () => pimg.classList.add('ok'); pimg.src = rec.url; $('pl-ambient').style.backgroundImage = `url("${rec.url}")`; } }
  }

  /* ── 放映 ── */
  function prepareScreen(){
    const m = P.m;
    clearNodes(); P.endShown = false; P.liveKey = '';
    $('pl-t-date').textContent = dateLine(m);
    const h = $('pl-t-title'); h.innerHTML = '';
    const chars = [...SB.fmtTitle(m.title)];
    for(let k = 0; k < chars.length; k++){
      const mk = c => { const s = SB.el('span'); s.textContent = c; return s; };
      const j = chars[k+1] === ' ' && chars[k+2] === '·' ? 3 : chars[k+1] === '·' ? 2 : 0;
      if(j){ const g = SB.el('b', 'pl-nb'); chars.slice(k, k + j).forEach(c => g.appendChild(mk(c))); h.appendChild(g); k += j - 1; }
      else h.appendChild(mk(chars[k]));
    }
    $('pl-t-note').textContent = m.note || ''; $('pl-t-note').hidden = !m.note;
    $('pl-e-meta').textContent = [SB.fmtDate(m.date), placeOf(m)].filter(Boolean).join(' · ');
    const acts = $('pl-e-acts'); acts.innerHTML = '';
    acts.append(SB.ui.button('再放一遍', 'primary', () => play(true), 'reset'), SB.ui.button('返回相册', '', () => SB.scenes.back()));
    $('pl-flash').style.opacity = '0'; $('pl-end').style.display = 'none';
  }
  function buildBars(){
    const bars = $('pl-bars'); bars.innerHTML = '';
    const mk = P.TL.marks;
    for(let k = 0; k <= mk.length; k++){ const b = SB.el('b', k ? '' : 't', '<i></i>'); b.setAttribute('aria-label', k ? `第 ${mk[k-1].i + 1} 张` : '扉页');
      b.addEventListener('click', e => { e.stopPropagation(); jump(k); wake(); }); bars.appendChild(b); }
  }
  function play(again){
    if(!P.m || !(P.m.slides || []).length) return;
    SB.audio.unlock();
    prepareScreen();
    P.TL = buildTL(P.m, P.style); applyLayout(); buildBars();
    P.T = 0; P.cur = -1; P.showing = true; P.renderAt = 0;
    scene.classList.add('showing'); SB.fx?.playback?.(true);
    setSeason(P.season, true);
    const scr = $('pl-screen'); scr.classList.remove('pl-flicker'); void scr.offsetWidth; scr.classList.add('pl-flicker');
    if(!again) SB.audio.set(P.m.bgmMode === 'none' ? undefined : (P.m.bgm || null)); else SB.audio.duck(1, 1200);
    prefetch(0); render();
    setTimeout(() => { if(P.showing) setPlaying(true); }, again ? 300 : 1000);
    cancelAnimationFrame(P.raf); P.last = 0; P.raf = requestAnimationFrame(loop);
    wake();
  }
  function stopShow(){
    P.showing = false; setPlaying(false); cancelAnimationFrame(P.raf); SB.fx?.playback?.(false);
    clearNodes(); PS.list = [];
    $('pl-seasons').classList.remove('open');
    scene.classList.remove('showing', 'awake');
  }

  /* ── 交互 ── */
  $('pl-start').addEventListener('click', () => play(false));
  $('pl-prev').addEventListener('click', e => { e.stopPropagation(); step(-1); wake(); });
  $('pl-next').addEventListener('click', e => { e.stopPropagation(); step(1); wake(); });
  $('pl-play').addEventListener('click', e => { e.stopPropagation(); setPlaying(!P.playing); wake(); });
  $('pl-music').addEventListener('click', e => { e.stopPropagation(); SB.audio.toggle(); $('pl-music').classList.toggle('off', !SB.audio.on); wake(); });
  $('pl-season-btn').addEventListener('click', e => { e.stopPropagation(); const o = $('pl-seasons').classList.toggle('open'); $('pl-season-btn').setAttribute('aria-expanded', o ? 'true' : 'false'); wake(); });
  scene.addEventListener('pointermove', e => { if(P.showing && e.pointerType === 'mouse') wake(); });
  let sx = 0, sy = 0, st = 0;
  $('pl-screen').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  $('pl-screen').addEventListener('pointerup', e => {
    if(!P.showing || e.target.closest('button')) return;

  });
  document.addEventListener('keydown', e => {
    if(SB.scenes.current !== 'player' || document.querySelector('.sb-modal')) return;

  function topBar(m){

    top.appendChild(SB.ui.button('退出放映', 'small', () => SB.scenes.back()));
  }
  document.addEventListener('sb:data', () => {
    if(SB.scenes.current !== 'player' || !P.m) return;
    const m = SB.store.memory(P.m.id);

  });

  SB.scenes.register('player', {
    world:'night', hash:false,
    title:p => SB.store.memory(p.id)?.title || '回忆',
    parent:p => { const m = SB.store.memory(p.id); return m ? {id:'city', params:{id:m.cityId}} : {id:'globe', params:{}}; },

  /* 调试 / 自动化验收：在暂停状态下定位到时间线上的某一刻 */

  SB.player = {

    setStyle(id){ if(SB.cinema.styles.some(s => s.id === id)){ P.style = id; if(P.showing) rebuild(false); else if(P.m){ refreshStyleUI(); updateStat(); } } },

    get state(){ const TL = P.TL; return {T:P.T, playing:P.playing, showing:P.showing, style:P.style, season:P.season, C0:TL?.C0, endT:TL?.endT,
      marks:TL?.marks.map(m => ({t:Math.round(m.t), i:m.i})) || [], items:TL ? TL.items.filter(x => x.kind === 'photo').map(x => ({i:x.i, t0:Math.round(x.t0), t1:Math.round(x.t1), enter:x.enter.type, exit:x.exit.type, frame:x.frame})) : []}; }
  };
})(window.SB);

<script>
(function(SB){
  const IMG_TYPES = /^image\//;
  const PV = {
    cinema:'<div class="pv pv-cinema"><i></i><i></i><i></i><em></em></div>',
    constellation:'<div class="pv pv-constellation"><svg viewBox="0 0 100 62" preserveAspectRatio="none"><line x1="27" y1="28" x2="71" y2="18"/><line x1="71" y1="18" x2="65" y2="44"/></svg><i></i><i></i><i></i></div>',
    journal:'<div class="pv pv-journal"><i></i><i></i><i></i><em></em></div>'
  };
  // 预览海报上的季节飘落元素（纯 CSS，轻量）
  const FALL = {
    spring:{n:10, html:'<svg viewBox="0 0 10 12" width="9" height="11"><path d="M5 0C9 2 9 8 5 12 1 8 1 2 4 1l1 2Z" fill="#ffc8d8"/></svg>'},
    summer:{n:9, html:'<svg viewBox="0 0 10 10" width="8" height="8"><circle cx="5" cy="5" r="4" fill="rgba(255,226,150,.9)"/></svg>', up:true},
    autumn:{n:8, html:'<svg viewBox="-10 -10 20 20" width="13" height="13"><path d="M0-9l1.3 3.4 2.6-1.3-.6 3 3.1.4-2.3 2.3 1.7 1.8-3.1.5.3 2.6-2.4-1.5L0 9l-.6-4.4-2.4 1.5.3-2.6-3.1-.5 1.7-1.8-2.3-2.3 3.1-.4-.6-3 2.6 1.3Z" fill="#e0782f"/></svg>'},
    winter:{n:16, html:'<svg viewBox="0 0 6 6" width="5" height="5"><circle cx="3" cy="3" r="2.6" fill="#fff"/></svg>'}
  };
  const GRADE = {none:'transparent', spring:'rgba(255,170,195,.6)', summer:'rgba(255,205,120,.6)', autumn:'rgba(235,120,40,.65)', winter:'rgba(150,190,255,.65)'};

  SB.editor = {
    open({cityId, memory}){
      const city = SB.store.city(cityId);
      if(!SB.store.canEdit){ SB.toast('你目前只有查看权限'); return; }
      const orig = memory ? JSON.parse(JSON.stringify(memory)) : null;
      const now = new Date();
      const st = {
        title: orig?.title || '', note: orig?.note || '',
        year: (orig?.date || '').split('-')[0] || String(now.getFullYear()),
        month: (orig?.date || '').split('-')[1] || String(now.getMonth() + 1).padStart(2, '0'),
        slides: (orig?.slides || []).map(s => ({...s})),
        cover: orig?.cover?.id || orig?.slides?.[0]?.id || null,
        bgmMode: orig?.bgmMode || (orig?.bgm ? 'own' : 'global'),
        bgm: orig?.bgm || null,
        style: SB.cinema.styleOf(orig), season: SB.cinema.seasonPref(orig),
        uploading: 0, sessionFiles: []
      };
      let grid, saveBtn, preview, done = false, ui = {}, fallKey = '';
      const place = city ? [city.countryName, city.regionName, city.name].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ') : '';
      const dlg = SB.ui.dialog({
        title: memory ? '编辑回忆' : '新的回忆', sub: [city?.name, city?.regionName].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ').toUpperCase(), wide:true,
        build(body){
          const wrap = SB.el('div', 'ed-wrap'); body.appendChild(wrap);
          /* ── 左：实时海报 ── */
          const side = SB.el('aside', 'ed-side'); side.setAttribute('aria-label', '放映海报预览');
          side.innerHTML = `<div class="ed-poster"><img alt=""><div class="empty">${SB.icon('star')}<span>COVER</span></div><div class="grade"></div><div class="fall"></div><div class="shade"></div>
            <div class="badges"><span class="badge b-style"></span><span class="badge b-season"></span></div>
            <div class="cap"><small></small><b></b><span>${SB.esc(place)}</span></div></div>
            <div class="ed-mini"><b></b><div class="ed-sum"></div></div><div class="ed-sum main"></div>`;
          wrap.appendChild(side);
          ui.pimg = side.querySelector('.ed-poster > img'); ui.pempty = side.querySelector('.empty'); ui.grade = side.querySelector('.grade'); ui.fall = side.querySelector('.fall');
          ui.pdate = side.querySelector('.cap small'); ui.ptitle = side.querySelector('.cap b'); ui.mtitle = side.querySelector('.ed-mini b');
          ui.bStyle = side.querySelector('.b-style'); ui.bSeason = side.querySelector('.b-season'); ui.sums = side.querySelectorAll('.ed-sum');
          ui.pimg.onload = () => ui.pimg.classList.add('ok');

          const main = SB.el('div', 'ed-main'); wrap.appendChild(main);
          const section = (num, zh, en) => { const s = SB.el('section', 'ed-sec'); s.innerHTML = `<div class="ed-h"><span class="num">${num}</span><span class="tt"><b>${zh}</b><span>${en}</span></span></div>`; main.appendChild(s); return s; };

          /* Ⅰ 故事 */
          const s1 = section('I', '故事', 'THE TALE');
          const tale = SB.el('div', 'ed-tale'); s1.appendChild(tale);
          const title = SB.ui.input({type:'text', maxlength:'40', placeholder:'例如：2026 年 5 月 · 宽窄巷子的雨', value:st.title}); title.classList.add('ed-title-in');
          title.addEventListener('input', () => { st.title = title.value; refreshPoster(); });
          const yr = SB.el('select'); yr.setAttribute('aria-label','年份');
          for(let y = now.getFullYear() + 1; y >= 2000; y--){ const o = SB.el('option'); o.value = String(y); o.textContent = y + ' 年'; yr.appendChild(o); }
          const mo = SB.el('select'); mo.setAttribute('aria-label','月份');
          for(let m = 1; m <= 12; m++){ const o = SB.el('option'); o.value = String(m).padStart(2,'0'); o.textContent = m + ' 月'; mo.appendChild(o); }
          yr.value = st.year; mo.value = st.month;
          yr.addEventListener('change', () => { st.year = yr.value; refreshPoster(); renderSeasons(); });
          mo.addEventListener('change', () => { st.month = mo.value; refreshPoster(); renderSeasons(); });
          const date = SB.el('div','ed-date'); date.append(yr, mo);
          tale.append(SB.ui.field('标题', title), SB.ui.field('时间', date));
          const note = SB.ui.input({multiline:true, maxlength:'300', placeholder:'写一段话，会出现在放映的扉页（可不填）'}); note.value = st.note;
          const cnt = SB.el('span', 'ed-count'); const upCnt = () => cnt.textContent = `${[...note.value].length} / 300`; upCnt();
          note.addEventListener('input', () => { st.note = note.value; upCnt(); refreshSum(); });
          const nf = SB.ui.field('一段话', note); nf.classList.add('full'); nf.appendChild(cnt); tale.appendChild(nf);

          /* Ⅱ 影像 */
          const s2 = section('II', '影像', 'THE IMAGES');
          grid = SB.el('div', 'ed-grid'); s2.appendChild(grid);
          const tip = SB.el('p', 'ed-note'); tip.textContent = '每张照片下面写一句它的故事，放映时会逐字出现。★ 设为封面，‹ › 调整顺序。'; s2.appendChild(tip);
          if(!SB.store.canUpload){ const n = SB.el('p','ed-note'); n.textContent = '上传照片需要「编辑者」权限，请让网页的主人在分享设置里把你设为编辑者。'; s2.appendChild(n); }
          s2.addEventListener('dragover', e => { if(!SB.store.canUpload) return; e.preventDefault(); grid.querySelector('.ed-add')?.classList.add('over'); });
          s2.addEventListener('dragleave', e => { if(!s2.contains(e.relatedTarget)) grid.querySelector('.ed-add')?.classList.remove('over'); });
          s2.addEventListener('drop', e => { if(!SB.store.canUpload) return; e.preventDefault(); grid.querySelector('.ed-add')?.classList.remove('over'); addFiles([...e.dataTransfer.files]); });

          /* Ⅲ 放映 */
          const s3 = section('III', '放映', 'THE SCREENING');
          const styles = SB.el('div', 'ed-styles'); styles.setAttribute('role', 'radiogroup'); styles.setAttribute('aria-label', '放映风格'); s3.appendChild(styles);
          const renderStyles = () => {
            styles.innerHTML = '';
            SB.cinema.styles.forEach(s => {
              const b = SB.el('button', 'ed-style' + (st.style === s.id ? ' on' : ''), `${PV[s.id]}<div><div class="nm"><b>${s.name}</b><small>${s.en}</small></div><p>${SB.esc(s.desc)}</p></div>`);
              b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', st.style === s.id ? 'true' : 'false');
              b.addEventListener('click', () => { st.style = s.id; renderStyles(); refreshPoster(); });
              styles.appendChild(b);
            });
          };
          const sl = SB.el('div', 'sb-field'); sl.innerHTML = '<span>季节主题</span>';
          const seasons = SB.el('div', 'ed-seasons'); seasons.setAttribute('role', 'radiogroup'); seasons.setAttribute('aria-label', '季节主题'); sl.appendChild(seasons);

          const renderSeasons = () => {
            seasons.innerHTML = '';
            const auto = SB.cinema.resolveSeason('auto', `${st.year}-${st.month}`);
            SB.cinema.seasons.forEach(s => {
              const label = s.id === 'auto' ? `按月份 · ${SB.cinema.seasons.find(x => x.id === auto)?.name || '无'}` : s.name;
              const b = SB.el('button', 'ed-season' + (st.season === s.id ? ' on' : ''), `${SB.cinema.icon(s.id)}<span>${label}</span>`);
              b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', st.season === s.id ? 'true' : 'false');

              seasons.appendChild(b);
            });

          };
          ui.renderSeasons = renderSeasons;

          /* Ⅳ 乐章 */
          const s4 = section('IV', '乐章', 'THE SCORE');
          const mus = SB.el('div','ed-music'); s4.appendChild(mus);
          const radios = SB.el('div','ed-radios');
          [['global','使用全站音乐'],['own','这段回忆专属'],['none','不放音乐']].forEach(([v,t]) => {
            const l = SB.el('label'); const r = SB.el('input'); r.type = 'radio'; r.name = 'ed-bgm'; r.value = v; r.checked = st.bgmMode === v;
            r.addEventListener('change', () => { st.bgmMode = v; renderTrack(); }); l.append(r, document.createTextNode(t)); radios.appendChild(l);
          });
          const track = SB.el('div','ed-track');
          mus.append(radios, track);
          const renderTrack = () => {
            track.innerHTML = '';
            if(st.bgmMode !== 'own'){ if(st.bgmMode === 'global'){ const s = SB.el('span'); s.style.color = 'var(--text-dim)'; s.textContent = SB.store.settings?.bgm ? '♪ ' + SB.store.settings.bgm.name : '还没有设置全站音乐（可在「回忆总览」上传）'; track.appendChild(s); } return; }
            if(st.bgm){
              const s = SB.el('span'); s.textContent = '♪ ' + st.bgm.name; track.appendChild(s);
              track.appendChild(SB.ui.button('试听', 'small', (e) => { if(preview && !preview.paused){ preview.pause(); e.currentTarget.textContent = '试听'; return; } preview = SB.audio.preview(st.bgm.id); preview.play(); e.currentTarget.textContent = '停止'; }));
            }
            if(SB.store.canUpload){
              const up = SB.el('label','sb-btn small'); up.style.position = 'relative'; up.textContent = st.bgm ? '换一首' : '上传音乐';
              const ai = SB.el('input'); ai.type = 'file'; ai.accept = 'audio/*,.mp3,.m4a,.aac,.wav,.mp4'; ai.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer';
              ai.addEventListener('change', async () => {
                const f = ai.files[0]; if(!f) return; ai.value = '';
                st.uploading++; refresh();
                const s = SB.el('span'); s.style.color = 'var(--gold)'; track.appendChild(s);
                try{ const r = await SB.store.uploadAudio(f, t => s.textContent = t); st.sessionFiles.push(r.id); st.bgm = r; }
                catch(e){ SB.toast(e.msg || SB.store.errText(e), 4200); }
                st.uploading--; refresh(); renderTrack();
              });
              up.appendChild(ai); track.appendChild(up);
            }
            const n = SB.el('p','ed-note'); n.style.width = '100%'; n.textContent = '建议使用 mp3 或 m4a，单首不超过 20MB；上传后私密保存在星屿存储里。'; track.appendChild(n);
          };
          renderTrack(); renderStyles(); renderSeasons(); renderGrid(); refreshPoster();
        },
        actions:[
          ...(memory ? [{text:'删除这段回忆', kind:'danger', async onClick(close){
            if(!await SB.ui.confirm(`确定删除「${memory.title}」吗？它的照片也会一起删除，无法恢复。`, '删除')) return false;
            try{ await SB.store.removeMemory(memory.id); SB.toast('已删除'); if(SB.scenes.current === 'player') SB.scenes.back(); }
            catch(e){ SB.toast(SB.store.errText(e)); return false; } }}, 'spacer'] : []),
          {text:'取消', onClick(){ cleanup(false); }},
          {text:'保存', kind:'primary', id:'save', async onClick(close, btn){
            if(st.uploading){ SB.toast('照片还在上传，请稍等'); return false; }
            if(!st.title.trim()){ SB.toast('请写一个标题'); return false; }
            if(!st.slides.length){ SB.toast('至少添加一张照片'); return false; }
            btn.disabled = true;
            const data = { id: memory?.id, cityId, title: st.title.trim(), date: `${st.year}-${st.month}`, note: st.note.trim(),
              slides: st.slides.map(s => ({id:s.id, w:s.w, h:s.h, caption:(s.caption || '').trim()})),
              cover: {id: st.slides.some(s => s.id === st.cover) ? st.cover : st.slides[0].id},

            try{ await SB.store.saveMemory(data); }
            catch(e){ SB.toast(SB.store.errText(e)); btn.disabled = false; return false; }

          }}
        ],
        onClose(){ preview?.pause(); if(!done) cleanup(false); }
      });
      dlg.el.querySelector('.sb-scroll').classList.add('ed-book');
      saveBtn = dlg.footer.querySelector('[data-act="save"]');

      function refresh(){ if(saveBtn){ saveBtn.disabled = st.uploading > 0; saveBtn.textContent = st.uploading ? `上传中（${st.uploading}）` : '保存'; } }
      function refreshSum(){
        const n = st.slides.filter(s => s.id).length;
        let dur = '';
        try{ if(n && SB.player?.estimate){ const s = Math.round(SB.player.estimate({title:st.title, note:st.note, date:`${st.year}-${st.month}`, slides:st.slides.filter(s => s.id)}, st.style)/1000);
          dur = s < 60 ? `约 ${s} 秒` : `约 ${Math.floor(s/60)} 分${s % 60 ? ' ' + s % 60 + ' 秒' : ''}`; } }catch(e){}
        const html = `<span>${n} 张照片</span>${dur ? `<i></i><span>${dur}</span>` : ''}`;
        ui.sums?.forEach(x => x.innerHTML = html);
      }
      function refreshPoster(){
        if(!ui.pimg) return;
        const cov = st.slides.find(s => s.id && s.id === st.cover) || st.slides.find(s => s.id);
        const u = cov ? SB.store.url(cov.id) : '';
        if(u){ if(ui.pimg.getAttribute('src') !== u){ ui.pimg.classList.remove('ok'); ui.pimg.src = u; } ui.pempty.style.display = 'none'; }
        else { ui.pimg.removeAttribute('src'); ui.pimg.classList.remove('ok'); ui.pempty.style.display = ''; }
        const d = SB.fmtDate(`${st.year}-${st.month}`) || '';
        ui.pdate.textContent = d; ui.ptitle.textContent = SB.fmtTitle(st.title.trim()); ui.mtitle.textContent = st.title.trim();
        const sty = SB.cinema.styles.find(x => x.id === st.style);
        ui.bStyle.innerHTML = `${SB.cinema.icon(st.style)}<span>${sty.en}</span>`;
        const eff = SB.cinema.resolveSeason(st.season, `${st.year}-${st.month}`), sea = SB.cinema.seasons.find(x => x.id === eff);
        ui.bSeason.innerHTML = eff === 'none' ? '' : `${SB.cinema.icon(eff)}<span>${sea.en}</span>`; ui.bSeason.style.visibility = eff === 'none' ? 'hidden' : '';
        ui.grade.style.backgroundColor = GRADE[eff] || 'transparent';
        if(fallKey !== eff){
          fallKey = eff; ui.fall.innerHTML = '';
          const F = FALL[eff];
          if(F && SB.perf.level !== 'reduced'){
            const fallCount = SB.perf.level === 'low' ? Math.max(4, Math.ceil(F.n*.55)) : F.n;
            for(let k = 0; k < fallCount; k++){
            const i = SB.el('i', '', F.html), dur = 5 + ((k*37) % 50)/10;
            i.style.left = ((k*61) % 100) + '%'; i.style.animationDuration = dur + 's'; i.style.animationDelay = (-(k*1.7) % dur) + 's';
            i.style.setProperty('--dx', (((k*13) % 40) - 10) + 'px'); i.style.setProperty('--rot', (eff === 'winter' || eff === 'summer' ? 0 : 200 + (k*47) % 300) + 'deg');
            if(F.up){ i.style.top = 'auto'; i.style.bottom = '-10%'; i.style.animationName = 'none'; i.style.animation = `edRise ${dur}s ease-in-out ${-(k*1.3) % dur}s infinite`; }
            ui.fall.appendChild(i);
            }
          }
        }
        refreshSum();
      }
      function cleanup(saved, data){
        if(done) return; done = true;
        // 删除这次上传但没有用上的文件，以及编辑时被移除的旧文件
        const keep = new Set(saved ? [...data.slides.map(s => s.id), data.cover.id, data.bgm?.id].filter(Boolean) : []);
        const used = new Set();
        for(const o of SB.store.memories) if(o.id !== memory?.id){ (o.slides||[]).forEach(s => used.add(s.id)); o.cover?.id && used.add(o.cover.id); o.bgm?.id && used.add(o.bgm.id); }
        SB.store.settings?.bgm?.id && used.add(SB.store.settings.bgm.id);
        const candidates = [...st.sessionFiles, ...(saved && orig ? [...(orig.slides||[]).map(s => s.id), orig.bgm?.id] : [])].filter(Boolean);
        for(const id of new Set(candidates)) if(!keep.has(id) && !used.has(id)) SB.store.deleteFile(id);
      }
      async function addFiles(files){
        files = files.filter(f => IMG_TYPES.test(f.type) || /\.(heic|heif)$/i.test(f.name));
        if(!files.length) return;
        for(const f of files){ const ph = { pending:true, name:f.name, step:'等待中' }; st.slides.push(ph); st.uploading++; }
        refresh(); renderGrid();
        for(const f of files){
          const ph = st.slides.find(s => s.pending && s.name === f.name && !s.started); if(!ph) continue; ph.started = true;
          try{
            // 只更新这一张卡片的进度文字，不打断正在输入的描述
            const r = await SB.store.uploadImage(f, t => { ph.step = t; if(ph._st) ph._st.textContent = t; });
            Object.assign(ph, r, {pending:false, caption:''}); delete ph.step; st.sessionFiles.push(r.id);
            if(!st.cover){ st.cover = r.id; renderGrid(); } else replaceCard(ph);
            refreshPoster();
          }catch(e){ st.slides.splice(st.slides.indexOf(ph), 1); ph._card?.remove(); renumber(); SB.toast(e.msg || SB.store.errText(e), 4200); }
          st.uploading--; refresh();
        }
      }
      function buildCard(s){
        const i = st.slides.indexOf(s), card = SB.el('div', 'ed-card' + (s.id && s.id === st.cover ? ' cover' : ''));
        const ph = SB.el('div', 'ph');
        if(s.pending){ const t = SB.el('span', 'st'); t.textContent = s.step || '上传中'; ph.appendChild(t); Object.defineProperty(s, '_st', {value:t, configurable:true, writable:true}); }
        else ph.innerHTML = `<img alt="" loading="lazy" decoding="async" fetchpriority="low" src="${SB.esc(SB.store.url(s.id))}">`;
        const no = SB.el('span', 'no'); no.textContent = String(i + 1).padStart(2, '0'); ph.appendChild(no);
        if(s.id && s.id === st.cover){ ph.insertAdjacentHTML('beforeend', `<span class="cv">${SB.icon('star')}封面</span>`); }
        const ops = SB.el('div', 'ops');
        const mk = (icon, label, fn, on, flip) => { const b = SB.el('button', on ? 'on' : ''); b.type = 'button'; b.innerHTML = SB.icon(icon); if(flip) b.querySelector('svg').style.transform = 'scaleX(-1)';
          b.title = label; b.setAttribute('aria-label', label); b.disabled = !!s.pending; b.addEventListener('click', e => { e.stopPropagation(); fn(); }); ops.appendChild(b); return b; };
        const at = () => st.slides.indexOf(s);
        mk('chevron', '前移', () => { const k = at(); if(k > 0){ [st.slides[k-1], st.slides[k]] = [st.slides[k], st.slides[k-1]]; renderGrid(); } }, false, true).disabled ||= i === 0;
        mk('star', '设为封面', () => { st.cover = s.id; renderGrid(); refreshPoster(); }, s.id === st.cover);
        mk('close', '移除', () => { st.slides.splice(at(), 1); if(st.cover === s.id) st.cover = st.slides.find(x => x.id)?.id || null; renderGrid(); refreshPoster(); });
        mk('chevron', '后移', () => { const k = at(); if(k < st.slides.length - 1){ [st.slides[k+1], st.slides[k]] = [st.slides[k], st.slides[k+1]]; renderGrid(); } }).disabled ||= i === st.slides.length - 1;
        ph.appendChild(ops);
        const cap = SB.el('textarea'); cap.maxLength = 120; cap.placeholder = '这张照片的故事…'; cap.setAttribute('aria-label', `第 ${i + 1} 张照片的描述`);
        cap.value = s.caption || ''; cap.disabled = !!s.pending; cap.addEventListener('input', () => { s.caption = cap.value; refreshSum(); });
        card.append(ph, cap);
        Object.defineProperty(s, '_card', {value:card, configurable:true, writable:true});
        return card;
      }
      function addTile(){
        const tile = SB.el('label', 'ed-add', `<span class="ring">${SB.icon('plus')}</span><b>添加照片</b><span>点击选择或拖进来<br>可一次选多张，自动压缩上传</span>`);
        const fin = SB.el('input'); fin.type = 'file'; fin.accept = 'image/*'; fin.multiple = true; fin.setAttribute('aria-label','选择照片');
        fin.addEventListener('change', () => { addFiles([...fin.files]); fin.value = ''; }); tile.appendChild(fin);

      }
      function replaceCard(s){ const old = s._card; const c = buildCard(s); old ? old.replaceWith(c) : grid.insertBefore(c, grid.querySelector('.ed-add')); }
      function renumber(){ grid.querySelectorAll('.ed-card .no').forEach((n, k) => n.textContent = String(k + 1).padStart(2, '0')); }
      function renderGrid(){
        if(!grid) return;
        grid.innerHTML = '';
        st.slides.forEach(s => grid.appendChild(buildCard(s)));
        if(SB.store.canUpload) grid.appendChild(addTile());
        refreshSum();
      }
    }
  };
})(window.SB);
</script>

<script>
(function(SB){
  const wrap = document.getElementById('ov-wrap');
  let previewA = null;
  function countUp(el, n){
    const t0 = performance.now(), D = 1200;
    const step = now => { const k = Math.min(1, (now - t0)/D); el.textContent = Math.round(n*(1 - Math.pow(1-k, 3))); if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function render(animate){
    const s = SB.store.stats();
    wrap.innerHTML = '';
    const head = SB.el('header','ov-head','<small>SUMMA MEMORIAE</small><h1>回忆总览</h1>'); wrap.appendChild(head);
    const stats = SB.el('div','ov-stats');
    [['countries','国家'],['regions','省份'],['cities','城市'],['memories','回忆']].forEach(([k,l]) => {
      const d = SB.el('div','ov-stat', `<b>0</b><span>${l}</span>`); stats.appendChild(d);
      const b = d.querySelector('b'); animate ? countUp(b, s[k]) : (b.textContent = s[k]);
    });
    wrap.appendChild(stats);

    if(!s.cities){
      const e = SB.el('div','sb-empty'); e.innerHTML = '<p style="margin:0">星屿还是一片寂静<br>从世界星图开始点亮第一颗星吧</p>';
      e.appendChild(SB.ui.button('前往世界星图', 'primary', () => SB.scenes.go('globe', {}, {transition:'flash'})));
      wrap.appendChild(e);
    }

    // 最近的回忆
    const recent = [...SB.store.memories].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 8);
    if(recent.length){
      const sec = SB.el('section','ov-sec','<h2>最近的回忆</h2>'); const row = SB.el('div','ov-recent');
      recent.forEach(m => {
        const c = SB.store.city(m.cityId); const b = SB.el('button','ov-mem'); b.type = 'button';
        const cov = m.cover?.id || m.slides?.[0]?.id;
        b.innerHTML = `<div class="im">${cov ? `<img alt="" loading="lazy" src="${SB.esc(SB.store.url(cov))}">` : ''}</div><b></b><span></span>`;
        b.querySelector('b').textContent = m.title; b.querySelector('span').textContent = `${c?.name || ''} · ${SB.fmtDate(m.date)}`;
        b.addEventListener('click', e => SB.scenes.go('player', {id:m.id}, {transition:'portal', x:e.clientX, y:e.clientY}));
        row.appendChild(b);
      });
      sec.appendChild(row); wrap.appendChild(sec);
    }

    // 足迹：国家 → 省份 → 城市
    if(s.cities){
      const sec = SB.el('section','ov-sec','<h2>我们的足迹</h2>'); const tree = SB.el('div','ov-tree');
      const byC = {}; SB.store.cities.forEach(c => { (byC[c.country] ||= {name:c.countryName, regions:{}}); (byC[c.country].regions[c.region] ||= {name:c.regionName, cities:[]}).cities.push(c); });
      Object.entries(byC).sort((a,b) => Object.keys(b[1].regions).length - Object.keys(a[1].regions).length).forEach(([k, v]) => {
        const box = SB.el('div','ov-country'); const h = SB.el('h3'); h.textContent = v.name; h.addEventListener('click', () => SB.scenes.go('country', {k}));
        box.appendChild(h);
        Object.values(v.regions).forEach(r => {
          const row = SB.el('div','ov-region'); const n = SB.el('span'); n.textContent = r.name; row.appendChild(n);
          r.cities.forEach(c => { const b = SB.el('button'); b.type = 'button'; b.textContent = c.name; b.addEventListener('click', () => SB.scenes.go('city', {id:c.id})); row.appendChild(b); });
          box.appendChild(row);
        });
        tree.appendChild(box);
      });
      sec.appendChild(tree); wrap.appendChild(sec);
    }

    // 全站背景音乐
    const sec = SB.el('section','ov-sec','<h2>全站背景音乐</h2>'); const box = SB.el('div','ov-music');
    const t = SB.el('div','t'); const bgm = SB.store.settings?.bgm;
    t.textContent = bgm ? '♪ ' + bgm.name : '还没有设置，上传一首属于你们的歌吧';
    box.appendChild(t);
    if(bgm) box.appendChild(SB.ui.button('试听', 'small', e => {
      if(previewA && !previewA.paused){ previewA.pause(); e.target.textContent = '试听'; return; }
      previewA = SB.audio.preview(bgm.id); previewA.play().catch(()=>{}); e.target.textContent = '停止'; }));
    if(SB.store.canEdit && SB.store.canUpload){
      const up = SB.el('label','sb-btn small primary'); up.style.position = 'relative'; up.textContent = bgm ? '换一首' : '上传音乐';
      const inp = SB.el('input'); inp.type = 'file'; inp.accept = 'audio/*,.mp3,.m4a,.aac,.wav,.mp4'; inp.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer';
      inp.setAttribute('aria-label','选择音乐文件');
      inp.addEventListener('change', async () => {
        const f = inp.files[0]; if(!f) return; inp.value = '';
        try{ const r = await SB.store.uploadAudio(f, step => t.textContent = step);
          const old = SB.store.settings?.bgm?.id;
          await SB.store.saveSettings({bgm:r});
          if(old && !SB.store.memories.some(m => m.bgm?.id === old)) SB.store.deleteFile(old);
          SB.toast('全站背景音乐已更新'); SB.audio.unlock();
        }catch(e){ SB.toast(e.msg || SB.store.errText(e), 4200); render(); }
      });
      up.appendChild(inp); box.appendChild(up);
      if(bgm) box.appendChild(SB.ui.button('移除', 'small danger', async () => {
        if(!await SB.ui.confirm('移除全站背景音乐？', '移除')) return;
        try{ await SB.store.saveSettings({bgm:null}); if(!SB.store.memories.some(m => m.bgm?.id === bgm.id)) SB.store.deleteFile(bgm.id); }catch(e){ SB.toast(SB.store.errText(e)); }
      }));
    }
    sec.appendChild(box); wrap.appendChild(sec);
  }
  document.addEventListener('sb:data', () => { if(SB.scenes.current === 'overview') render(false); });

  SB.scenes.register('overview', {
    world:'night', deepLink:true,
    title:() => '回忆总览',
    parent:() => ({id:'globe', params:{}}),
    enter(){ SB.fx.palette('night'); render(true); document.querySelector('.sb-scene[data-scene="overview"]').scrollTop = 0; },
    leave(){ previewA?.pause(); }
  });
  SB.menu.add({id:'overview', order:40, icon:'scroll', label:'回忆总览', desc:() => { const s = SB.store.stats(); return s.cities ? `${s.countries} 国 · ${s.cities} 城 · ${s.memories} 段回忆` : '我们走过的国家、城市与时光'; }, scene:'overview'});
})(window.SB);
</script>

<script>
/* ── 块 99 · v1.5 启动：氛围可以先出现；认证、Book 与 Store 就绪后才真正开启书 ── */
(function(SB){
  SB.fx.start();
  (async()=>{
    try{
      await SB.store.ready;
      SB.scenes.boot('book');
      document.dispatchEvent(new CustomEvent('sb:data'));
    }catch(e){
      console.error('[Starbook start]',e);
      SB.runtime?.showFatal?.('暂时没能翻开这本书。','请检查 Supabase 初始化与网络连接后重新尝试。');
    }
  })();
})(window.SB);
</script>
